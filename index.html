room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":4,"pageNumber":1,"firstAction":"Save the untouched photo as `01_original_room.jpg`.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"perspective-and-depth-locking","title":"Perspective and Depth Locking","mission":"Create the single reference page that prevents an attractive but inaccurate staged room.","steps":["Create a folder named `property_001`.","Add `source/`, `staging/`, `video/`, and `exports/` folders.","Copy the original photo into `source/` and never overwrite it.","Record the image dimensions and orientation.","Paste the room brief into a new source-truth sheet.","Add a “must remain” list for architecture and permanent fixtures.","Add a “may change” list for furniture, decor, colour accents, and removable clutter.","Add a “do not claim” note for hidden views, measurements, condition, and renovations not supported by evidence.","Add the intended audience and use: listing visualisation, concept board, or marketing video.","Use the sheet as the reference attached to every future prompt."],"prompt":"Convert my notes into a source-truth sheet for one real room.\nDo not add facts. Keep unknowns as unknown.\n\nPROPERTY/ROOM: [name]\nSOURCE FILE: [filename]\nUSE: [listing visualisation / concept board / video]\n\nMUST REMAIN EXACTLY AS SHOWN:\n[fixed architecture, openings, floor, built-ins, permanent fixtures]\n\nMAY CHANGE:\n[movable furniture, decor, removable clutter, styling colours]\n\nNOT VISIBLE OR NOT VERIFIED:\n[unknowns]\n\nSTAGING BOUNDARIES:\n[what the visualisation must not imply]\n\nOUTPUT VERSIONS TO SAVE:\n1. untouched source\n2. staged visualisation\n3. disclosed marketing version, if applicable","deliverable":"`source-truth-sheet.md` and an organised `property_001` folder.","outcome":"A source-truth sheet that a second person could use without reopening the whole project.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Lesson 1 room brief.","Original room photo.","A folder for source files and versions."],"failure_fixes":["If the list is too broad, move anything attached to the building into “must remain.”","If a proposed renovation appears, change the use label to “concept visualisation.”","If versions are mixed together, restore the untouched source and create numbered copies."],"checklist":["[ ] Folder structure exists.","[ ] Source is read-only in practice.","[ ] Must-remain and may-change lists are explicit.","[ ] Unknowns and boundaries are visible.","[ ] Intended use is stated."],"sources":"[OpenAI Images in ChatGPT](https://help.openai.com/en/articles/11084440-images-in-chatgpt)\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":4,"pageNumber":2,"firstAction":"Create a folder named `property_001`.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"style-packs-and-buyer-context","title":"Style Packs and Buyer Context","mission":"Clean a room photograph while keeping its openings, perspective, floor, fixed lighting, and architecture intact.","steps":["Duplicate the source as `staging/room_01_declutter_v01.jpg`.","Upload the duplicate to ChatGPT Images.","Ask for removal of only named movable objects.","Explicitly state that architecture and camera viewpoint must remain unchanged.","Generate one edit.","Compare windows, doors, floor lines, wall edges, and built-ins with the original.","If an edit changes a fixed feature, start again from the original rather than editing the edited copy.","Make one targeted selection edit for a stubborn object if available.","Save the best version with a numbered filename and a short change note."],"prompt":"Edit this real room photograph as a conservative image cleanup.\nRemove only these movable items: [list exact items].\nKeep the camera viewpoint, room boundaries, wall and ceiling geometry, windows, doors, floor pattern, built-in elements, permanent fixtures, perspective lines, and light direction unchanged.\nDo not add furniture. Do not renovate. Do not widen, straighten, repaint, or invent any area outside the source image.\nThe result should look like the same room after those movable items were removed.","deliverable":"One before/after pair and `declutter-notes.md`.","outcome":"A cleaner version of the same room, with architecture and perspective preserved.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Lesson 2 source-truth sheet.","Original room photo.","ChatGPT Images editing access."],"failure_fixes":["If the floor pattern bends, revert to the original and request “preserve every floor line.”","If a window changes shape, use a smaller selection and remove only the object that overlaps it.","If the image becomes too empty or artificial, restore a few clearly visible source objects."],"checklist":["[ ] Only named movable items changed.","[ ] Openings and fixed features match the source.","[ ] No renovation was implied.","[ ] Version and change note are saved."],"sources":"[OpenAI: editing images with ChatGPT](https://help.openai.com/en/articles/9055440-editing-your-images-with-chatgpt-images)\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":4,"pageNumber":3,"firstAction":"Duplicate the source as `staging/room_01_declutter_v01.jpg`.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"full-property-consistency","title":"Full Property Consistency","mission":"Add a small, believable furniture set that respects room scale, walking space, perspective, and contact with the floor.","steps":["Choose one room function: living room, bedroom, dining room, or office.","Choose no more than five main furniture pieces for the first pass.","Describe each piece using approximate size and material.","State where each piece sits relative to visible walls, windows, and doors.","Ask ChatGPT to stage the room, not to redesign it.","Generate the first version.","Check whether furniture feet meet the floor and shadows point with the room light.","Check whether doors, windows, and walking routes remain usable.","Change one piece or placement at a time and save versions.","Keep the source beside the final image for comparison."],"prompt":"Use this exact room photograph as the base. Virtually stage it as a [room function] in a [style] style for [audience].\nAdd only:\n1. [piece, approximate size, material, placement]\n2. [piece, approximate size, material, placement]\n3. [piece, approximate size, material, placement]\n4. [piece, approximate size, material, placement]\n\nKeep the original camera viewpoint, room proportions, windows, doors, floor, walls, ceiling, built-ins, and permanent fixtures unchanged. Match the existing perspective and light direction. Furniture must be correctly scaled, rest on the floor, and cast soft shadows consistent with the room. Leave practical walking space. This is a visual staging, not a renovation.","deliverable":"One staged room image, one source image, and the final staging prompt.","outcome":"A furnished room that reads as the same real room, with furniture that fits rather than floats or blocks architecture.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["A clean image from Lesson 3.","Source-truth sheet.","A clear design brief: audience, style, palette, and furniture list."],"failure_fixes":["If furniture floats, request “feet fully contact the existing floor with contact shadows.”","If the room feels crowded, remove the smallest decorative pieces first.","If perspective is wrong, reduce the furniture list and refer to its placement beside a visible wall or window."],"checklist":["[ ] Room function is clear.","[ ] Furniture list is short and specific.","[ ] Scale and placement are described.","[ ] Floor contact and shadows look plausible.","[ ] Architecture remains unchanged."],"sources":"[OpenAI Images in ChatGPT](https://help.openai.com/en/articles/11084440-images-in-chatgpt)\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":4,"pageNumber":4,"firstAction":"Choose one room function: living room, bedroom, dining room, or office.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"staging-presentation","title":"Staging Presentation","mission":"Stage two rooms so they feel like one property, one design direction, and one visual package.","steps":["Choose a shared palette of three colours and two material families.","Choose one furniture language, such as soft contemporary or warm Scandinavian.","Write a short visual bible with palette, materials, lighting, and recurring accents.","Stage the second room from its untouched source image.","Reuse the same visual bible, not the first room’s geometry.","Keep each room’s fixed features and viewpoint unchanged.","Compare the pair at the same display size.","Remove any repeated object that feels copied rather than coordinated.","Save both prompts and the visual bible.","Add a disclosure label or caption when the images are used publicly."],"prompt":"Use the attached source photo of [ROOM 2] as the geometry authority.\nApply this shared property visual bible:\n- Style: [style]\n- Palette: [colour 1], [colour 2], [colour 3]\n- Materials: [material 1], [material 2]\n- Lighting mood: [description]\n- Recurring accent: [one restrained accent]\n\nVirtually stage only movable elements appropriate to this room: [list].\nPreserve this room’s exact windows, doors, floor, walls, ceiling, built-ins, permanent fixtures, camera viewpoint, and proportions. Do not copy the layout from another room. Match scale, floor contact, shadows, and practical circulation. Produce a coordinated room, not a remodel.","deliverable":"`visual-bible.md`, two staged room images, and two saved prompts.","outcome":"Two separate, believable room images with a shared design language and preserved room geometry.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Two source photos from the same property.","Source-truth sheet for each room.","The staged image and prompt from Lesson 4."],"failure_fixes":["If the rooms look unrelated, simplify the visual bible to palette, materials, and one accent.","If objects are duplicated too literally, keep the material family but change the object shape.","If either room’s architecture shifts, restart that room from its original source."],"checklist":["[ ] Each room began from its own original.","[ ] Shared style is written down.","[ ] Layouts remain room-specific.","[ ] Materials, palette, and lighting feel coordinated.","[ ] Public use includes an appropriate disclosure."],"sources":"[OpenAI Images in ChatGPT](https://help.openai.com/en/articles/11084440-images-in-chatgpt)\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":4,"pageNumber":5,"firstAction":"Choose a shared palette of three colours and two material families.","nextAction":"Open the next lesson when the deliverable is saved."}]},{"id":"image-to-video","title":"Image to Video","description":"Direct controlled movement from approved frames.","pages":[{"id":"choosing-the-right-source-frame","title":"Choosing The Right Source Frame","mission":"Make a still staged room feel filmed, using one simple camera movement rather than a busy animation.","steps":["Resize or crop the source only if the chosen video tool requires it; keep a copy of the original.","Upload the staged image as the first frame.","Choose a 5-second draft where available.","Start with one camera move: slow push-in, gentle pan, or short lateral slide.","Mention only small environmental motion, such as soft daylight movement.","Generate one clip.","Watch for bending walls, changing windows, sliding furniture, or sudden cuts.","Simplify the prompt before changing tools.","Save the best clip and the exact prompt.","Mute generated sound for this lesson unless the assignment explicitly asks for audio."],"prompt":"The camera makes a slow, smooth push-in through the staged room. The furniture remains still and firmly grounded. Daylight remains consistent, with only a very subtle movement in the sheer curtain. Preserve the room’s architecture, perspective, proportions, windows, doors, floor, and furniture placement throughout the shot. Calm real-estate cinematography, stable exposure, no cuts.","deliverable":"One 5-second room clip and a text file containing the prompt, tool, model, duration, and date.","outcome":"A short, restrained room clip in which the camera moves while the room remains stable.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["A clean staged image from Lesson 4 or 5.","A Runway, Luma, Veo, or enabled Kling account; access is plan-dependent.","A folder for generated clips."],"failure_fixes":["If walls warp, reduce the move to a slower push-in and use a sharper source image.","If furniture moves, say “furniture remains still and firmly grounded” and remove extra environmental motion.","If the tool creates a cut, lower the number of requested events or increase duration where available."],"checklist":["[ ] Input image is clean and source-preserving.","[ ] Only one primary camera move is requested.","[ ] Furniture remains grounded.","[ ] No unwanted cut occurs.","[ ] Prompt and clip are saved together."],"sources":"[Runway Image-to-Video Prompting Guide](https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide) · [Luma Video Generation](https://docs.lumalabs.ai/docs/video-generation) · [Google DeepMind Veo](https://deepmind.google/models/veo)\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":5,"pageNumber":1,"firstAction":"Resize or crop the source only if the chosen video tool requires it; keep a copy of the original.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"camera-movement-for-property-images","title":"Camera Movement For Property Images","mission":"Create a controlled visual transition between an empty/source room and its staged version.","steps":["Make the source and staged images the same pixel dimensions.","Align their visible room edges as closely as possible.","Save them as `frame_00_source.jpg` and `frame_01_staged.jpg`.","If the tool supports first/last frames, load both in the correct frame slots.","Ask for a slow, elegant transition with no camera travel.","If only one image is supported, animate the source and staged images as separate clips.","Place the clips back-to-back in an editor.","Remove a duplicated or awkward shared frame if the transition pauses.","Add a small “virtually staged” caption for public-facing use where required.","Export a short preview and compare it with both still frames."],"prompt":"Transition smoothly from the empty source room in the first frame to the furnished staged room in the last frame. Keep the camera locked in the same position. Walls, windows, doors, floor, ceiling, built-ins, and room proportions remain fixed. Furniture appears gradually and settles naturally onto the floor with soft matching shadows. Use a calm 4-second real-estate visualisation transition with stable exposure and no cuts.","deliverable":"One 4-second transition clip plus aligned first and last frames.","outcome":"A before-to-after transition that communicates “visualisation” without pretending that a renovation happened on camera.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Original room photo.","Staged room image with matching crop and viewpoint.","A tool that supports start/end frames or a practical two-clip workaround."],"failure_fixes":["If the room jumps, align the two stills more carefully or use a locked-camera crossfade in an editor.","If furniture melts into place, use the two-clip workaround and crossfade instead.","If architecture changes, do not use the generated transition; return to the original stills."],"checklist":["[ ] First and last frames show the same viewpoint.","[ ] Fixed architecture remains stable.","[ ] The transition is clearly a visualisation.","[ ] Caption/disclosure is planned for public use.","[ ] A fallback edit exists."],"sources":"[Luma Video Generation](https://docs.lumalabs.ai/docs/video-generation) · [Runway Image-to-Video Prompting Guide](https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide) · [Google DeepMind Veo](https://deepmind.google/models/veo)\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":5,"pageNumber":2,"firstAction":"Make the source and staged images the same pixel dimensions.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"start-frame-and-end-frame-transitions","title":"Start Frame and End Frame Transitions","mission":"Extend a short generation into a simple two-shot sequence while preserving the room’s identity.","steps":["Choose Shot A: a slow push-in or lateral slide.","Choose Shot B: a gentle continuation toward a feature such as a window or fireplace.","Generate Shot A with a restrained motion prompt.","Extract the final frame if the tool provides “use current frame” or equivalent.","Use that frame as Shot B’s input image.","Prompt Shot B as a continuation, not a new room description.","Generate Shot B at the same aspect ratio and a similar duration.","Put both clips on a timeline in order.","Trim the repeated join frame if necessary.","Watch the join once with sound off and once with the intended soundtrack or room tone."],"prompt":"Continue the same calm real-estate camera movement from the supplied final frame. The camera gently slides [direction] toward [fixed feature]. The room architecture, furniture, materials, lighting direction, exposure, and perspective remain consistent with the input frame. Furniture stays still and grounded. The motion is smooth and continuous, with no cut and no new objects.","deliverable":"A two-shot room sequence and a one-line shot plan.","outcome":"A 8–12-second two-shot sequence that feels like one visit through one room, not two unrelated generations.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["A successful clip from Lesson 6 or 7.","A tool with last-frame reuse, or an editor and frame-export capability.","A shot plan with two distinct but compatible moves."],"failure_fixes":["If Shot B changes the furniture, use the exact last frame and shorten the prompt.","If the join jumps, export a clean last frame and remove the duplicated frame in the editor.","If the second move is too ambitious, choose a smaller slide or push-in."],"checklist":["[ ] Shot A and Shot B share aspect ratio.","[ ] Shot B starts from Shot A’s final frame.","[ ] Camera direction is compatible.","[ ] Room identity survives the join.","[ ] Repeated frames are trimmed."],"sources":"[Runway Image-to-Video Prompting Guide](https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide) · [Runway Creating with Gen-4 Video](https://help.runwayml.com/hc/en-us/articles/37327109429011-Creating-with-Gen-4-Video) · [Luma Video Generation](https://docs.lumalabs.ai/docs/video-generation)\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":5,"pageNumber":3,"firstAction":"Choose Shot A: a slow push-in or lateral slide.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"room-by-room-video-sequence","title":"Room By Room Video Sequence","mission":"Arrange room clips into a short, understandable property film with an opening, middle, and ending.","steps":["Create a new project in a landscape format for a listing page or a vertical format for social, depending on the brief.","Put the strongest establishing room first.","Add the second room after a clean visual beat.","Use simple cuts or short dissolves; avoid effects that obscure the architecture.","Add a restrained title such as the property name or “Living room visualisation.”","Add a disclosure caption for virtually staged imagery where appropriate.","Keep text away from windows, doors, and important property details.","Add quiet room tone or licensed music only if desired; generated audio is optional and access-dependent.","End on the clearest room or a neutral property card.","Watch the complete film once and export a draft."],"prompt":"Create a simple shot plan for a 20-second real-estate visualisation film using these clips:\n[Clip A: room and duration]\n[Clip B: room and duration]\n[Clip C: room and duration]\n\nStructure:\n- Opening: establish the property and its strongest room.\n- Middle: show two useful room details with calm camera movement.\n- Ending: finish on the most memorable view or a clean property card.\n\nFor every clip, specify the order, approximate duration, transition, on-screen caption, and whether a “virtually staged” disclosure is needed. Use no invented property facts.","deliverable":"A 15–30-second mini property film draft and its shot plan.","outcome":"A short film with a clear visual order, readable captions, and honest distinction between source views and staged visualisations.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Two or more room clips from earlier lessons.","At least one original still and one staged still.","Any editor with a timeline."],"failure_fixes":["If the film feels repetitive, remove the weakest clip rather than adding more effects.","If captions compete with the room, shorten them and place them in negative space.","If the sequence implies a room connection that was never photographed, add a neutral cut or label rather than inventing a walkthrough."],"checklist":["[ ] Opening, middle, and ending are clear.","[ ] Clips are in a logical order.","[ ] Captions are readable and factual.","[ ] Virtual staging is disclosed where needed.","[ ] Music/audio is licensed or omitted."],"sources":"[Google DeepMind Veo](https://deepmind.google/models/veo) · [Runway Generative Video](https://help.runwayml.com/hc/en-us/articles/37425232841875-Getting-Started-with-Generative-Video)\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":5,"pageNumber":4,"firstAction":"Create a new project in a landscape format for a listing page or a vertical format for social, depending on the brief.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"image-to-video-qc","title":"Image to Video Qc","mission":"Deliver the visualisation package with clear filenames, source preservation, disclosure, and platform-ready exports.","steps":["Create an `exports/` folder inside the property folder.","Name the master film with property, format, and version, for example `property_001_virtual-staging-film_landscape_v01.mp4`.","Export a high-quality landscape master when requested.","Export a vertical or square version only by reframing from the source, not by distorting it.","Check that the first and last seconds are not clipped.","Check that captions are readable on a phone-sized preview.","Include the original photos and staged images in a clearly labelled delivery folder.","Add a `readme.md` listing tools, dates, prompts, and which views are virtualisations.","Open each exported file and play it from beginning to end.","Deliver the package without replacing the source files."],"prompt":"Create a delivery manifest from this project information.\n\nPROPERTY: [name]\nSOURCE PHOTOS: [filenames]\nSTAGED IMAGES: [filenames]\nVIDEO EXPORTS: [filenames]\nTOOLS USED: [tools and enabled model names, if known]\nGENERATION DATES: [dates]\nDISCLOSURE TEXT USED: [exact text]\nINTENDED DESTINATIONS: [listing page / website / social / internal concept]\n\nReturn a concise manifest with:\n1. file name\n2. format and aspect ratio\n3. whether it is original, edited, staged, or generated video\n4. disclosure note\n5. any access-dependent tool or licence note\nDo not claim measurements, renovations, views, or property facts not present in the source record.","deliverable":"A complete `property_001_delivery/` folder containing source images, staged images, film exports, and `readme.md`.","outcome":"A tidy, reproducible package that a client can understand and a learner can reopen later.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Completed mini property film.","Original and staged stills.","The client or assignment’s destination formats and disclosure requirements."],"failure_fixes":["If an export is cropped badly, return to the editor and reframe with safe margins.","If a caption is missing, add it in the editor and export a new numbered version.","If tool or licence status is unclear, label it “verify before commercial delivery” instead of guessing.","If the master was overwritten, recover the source from the preserved `source/` folder and rebuild the export."],"checklist":["[ ] Original files are preserved.","[ ] Exports have descriptive names and versions.","[ ] Aspect ratios match their destinations.","[ ] Captions and disclosures are readable.","[ ] Manifest lists tools, dates, and visualisation status.","[ ] Every delivered file opens and plays."],"sources":"[OpenAI Images in ChatGPT](https://help.openai.com/en/articles/11084440-images-in-chatgpt) · [Runway Creating with Gen-4 Video](https://help.runwayml.com/hc/en-us/articles/37327109429011-Creating-with-Gen-4-Video) · [Luma API](https://docs.lumalabs.ai/docs/api) · [Google DeepMind Veo](https://deepmind.google/models/veo)","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":5,"pageNumber":5,"firstAction":"Create an `exports/` folder inside the property folder.","nextAction":"Open the next lesson when the deliverable is saved."}]},{"id":"cinematic-property-films","title":"Cinematic Property Films","description":"Turn shots into a film with rhythm and intent.","pages":[{"id":"property-film-story-structure","title":"Build the property film brief","mission":"Convert a listing or client brief into a one-page film brief that tells you what the film must communicate, what is factual, and what is out of bounds.","steps":["Create a project folder named `PROPERTYNAME_FILM_YYYY-MM-DD`.","Copy the source media into `01_SOURCE`, without renaming or editing the originals.","Write the property facts exactly as supplied; put uncertain claims in a separate “confirm” list.","Choose the audience: buyer, renter, investor, guest, or local lifestyle audience.","Choose one feeling the film should leave: calm, sunlit, private, connected, practical, or dramatic.","Pick the primary film length: 30–45 seconds for a social teaser, 60–90 seconds for a listing film, or a longer cut only when the brief needs it.","Decide the factual promise in one sentence, such as “A bright two-bedroom apartment with a calm terrace close to the city centre.”","List three visual anchors that are actually visible in the source media.","Write three exclusions: facts not supplied, areas not photographed, and any imagined renovation or staging that must not be presented as current.","Save the brief as `02_PRE_PRODUCTION/film-brief.md`."],"prompt":"You are a property-film producer, not a salesperson.\nUsing only the facts below, draft a concise film brief.\n\nPROPERTY FACTS:\n- Property type:\n- Location wording exactly as approved:\n- Rooms / spaces shown:\n- Confirmed features:\n- Approved CTA:\n- Audience:\n- Intended feeling:\n- Target duration:\n- Source media available:\n\nReturn exactly these headings:\n1. Film promise (one factual sentence)\n2. Viewer and intended feeling\n3. Story arc: arrival / discovery / close\n4. Visual anchors (only visible or confirmed items)\n5. Voiceover or on-screen copy (maximum 45 words)\n6. Do-not-invent list\n7. Missing information to confirm\nDo not add prices, measurements, views, transport times, neighbourhood claims, or amenities unless supplied above.","deliverable":"`02_PRE_PRODUCTION/film-brief.md`, one page maximum.","outcome":"A short brief that separates confirmed facts from creative direction. It should be possible for another person to understand the film without opening the source images.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["One property with permission to use its photos or video.","Five to fifteen source photographs, preferably including exterior, living area, kitchen, primary bedroom, bathroom, and a detail.","Basic facts supplied by the owner or listing agent: property type, location wording, rooms, notable features, contact/CTA.","A plain document or notes app."],"failure_fixes":["**The draft sounds like an advert:** remove adjectives that cannot be seen or supported; keep one factual promise.","**The model invents facts:** repeat “use only supplied facts,” paste the exact fact list, and delete unsupported sentences.","**The brief is too broad:** limit it to three visual anchors and one audience.","**There is not enough source media:** mark the missing rooms honestly and plan a shorter film rather than fabricating coverage."],"checklist":["[ ] Originals are in `01_SOURCE`.","[ ] Property facts are copied exactly.","[ ] Audience and feeling are chosen.","[ ] Film length and CTA are defined.","[ ] Three visible anchors are named.","[ ] Unsupported facts are excluded.","[ ] The brief is saved."],"sources":"ChatGPT or another approved text assistant for the brief; any document editor for storage. No image or video generator is needed yet.\n\n### Source URLs\n- OpenAI image/video help hub: https://help.openai.com/en/\n- Adobe Firefly overview: https://helpx.adobe.com/firefly.html\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":6,"pageNumber":1,"firstAction":"Create a project folder named `PROPERTYNAME_FILM_YYYY-MM-DD`.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"property-film-shot-matrix","title":"Make a shot matrix","mission":"Plan a complete property film as a sequence of purposeful shots instead of a random slideshow.","steps":["Open a spreadsheet and create columns: `ID`, `story beat`, `space`, `source file`, `shot size`, `camera move`, `duration`, `sound`, `copy`, `status`.","Create three beats: arrival, discovery, and close.","Put the exterior or strongest establishing frame in arrival.","Add a movement through the main living space or best room.","Add two or three detail shots that prove material, light, or use without inventing features.","Place the bedroom, kitchen, or terrace according to the film promise rather than room order.","Give every shot a single camera move: push-in, lateral slide, tilt, pan, orbit, or locked-off hold.","Start with 2–4 seconds per shot; reserve a longer hold for the hero frame.","Add a sound intention for every beat: room tone, exterior ambience, footsteps, music, or a deliberate silence.","Read the matrix aloud and delete any shot that repeats the previous shot’s job."],"prompt":"Turn this property brief into a beginner-friendly shot matrix.\nUse only the confirmed spaces and features. Do not invent rooms, views, measurements, prices, or amenities.\n\nFILM BRIEF:\n[paste film brief]\nSOURCE MEDIA:\n[list filenames with a short description]\nTARGET DURATION: [30 / 45 / 60 / 90 seconds]\n\nReturn a table with exactly these columns:\nID | Time range | Story beat | Space | Source file | Shot size | One camera move | Purpose | Sound bed | On-screen copy | Transition\n\nRules:\n- 8–12 shots total.\n- Three beats: arrival, discovery, close.\n- One visual job per shot.\n- Use “locked off” when movement would risk changing architecture.\n- Use “none” for copy when no text is needed.\n- The final shot must have a factual CTA placeholder, not a made-up claim.","deliverable":"`02_PRE_PRODUCTION/shot-matrix.xlsx` or `.csv`.","outcome":"A shot-by-shot plan with a clear beginning, middle, and end. Each shot has a reason to exist and a realistic movement instruction.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Lesson 1 film brief.","Source-media folder.","Spreadsheet or table editor.","Six to twelve candidate images or clips."],"failure_fixes":["**Every shot says “cinematic drone shot”:** replace repeated moves with a mix of locked-off, push-in, lateral, and detail shots.","**The matrix runs too long:** add the durations and remove repeated spaces before shortening every shot.","**The story feels flat:** move the strongest image to the opening or close and make the middle reveal a sequence of details.","**AI changes the room during movement:** use a locked-off or very slow push-in shot from a clean, geometrically accurate still."],"checklist":["[ ] Matrix has 8–12 shots.","[ ] Every shot has a story purpose.","[ ] Arrival, discovery, and close are present.","[ ] Camera moves are singular and simple.","[ ] Durations fit the target length.","[ ] Sound and copy are planned.","[ ] No unsupported property claim appears."],"sources":"Google Sheets, Excel, Notion, or a plain markdown table for planning; ChatGPT for converting the brief into a first matrix.\n\n### Source URLs\n- Runway image-to-video prompting guide: https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide\n- Adobe Firefly video prompting: https://helpx.adobe.com/firefly/web/work-with-audio-and-video/work-with-video/generate-videos-using-text-prompts.html\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":6,"pageNumber":2,"firstAction":"Open a spreadsheet and create columns: `ID`, `story beat`, `space`, `source file`, `shot size`, `camera move`, `duration`, `sound`, `copy`, `status`.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"music-voice-and-sound-design","title":"Prepare accurate hero stills","mission":"Select and prepare the still images that will carry the film and campaign.","steps":["Select one exterior, one primary room, one secondary room, and one detail as hero candidates.","Duplicate each source into `03_STILLS/WORKING`; keep the original untouched.","Correct obvious exposure, horizon, white balance, and crop issues before using generative tools.","Write the fixed-feature list for each image: window count, doors, flooring, cabinets, beams, fireplace, and view.","Remove private information such as house numbers, faces, documents, and screens only when authorized.","If decluttering, describe only removable loose objects; do not remove fixed architecture.","Generate one conservative version first, close to the source geometry.","Compare the result with the source at full size and reject versions that alter doors, windows, room proportions, or permanent fixtures.","Export approved stills as high-quality JPG or PNG with clear filenames such as `HERO_01_LIVING_SOURCEPRESERVED.jpg`.","Record whether each image is source-preserved, enhanced, staged, or conceptual."],"prompt":"Edit this property photograph conservatively.\nPreserve the exact room geometry, camera viewpoint, window and door positions, flooring, ceiling height, built-in cabinets, fireplace, and exterior view.\n\nAllowed changes:\n- [exposure / white balance / mild perspective correction / remove these loose objects: ...]\n- Keep all fixed architectural features unchanged.\n- Keep furniture scale and floor contact believable.\n- Preserve natural light direction and realistic shadows.\n\nDo not:\n- add or remove rooms, windows, doors, or architectural features;\n- change the property style;\n- invent a view, landscape, measurement, amenity, or brand;\n- render readable logos, contact details, or listing text;\n- make a conceptual renovation look like a current photograph.\n\nOutput: one realistic, source-preserved property image suitable for a cinematic film hero frame.\nIf a requested change conflicts with the source photograph, leave the source feature unchanged.","deliverable":"`03_STILLS/approved-hero-stills/` containing 3–4 approved images plus `still-notes.csv`.","outcome":"Four reliable hero stills with consistent geometry and a clear provenance note for each.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Shot matrix.","Source photographs with usage permission.","Image editor or ChatGPT Images / Adobe Firefly.","A list of fixed features that must remain unchanged."],"failure_fixes":["**Windows or doors move:** return to the untouched source, shorten the prompt, and request only exposure or loose-object cleanup.","**The image looks over-staged:** reduce furniture changes and ask for natural material variation and ordinary lived-in scale.","**Perspective bends:** use the original file, correct lens/perspective before generation, and choose a locked-off shot.","**A conceptual image is mistaken for documentation:** add `CONCEPTUAL` to the filename and place it in a separate folder."],"checklist":["[ ] Four hero candidates are selected.","[ ] Originals remain untouched.","[ ] Fixed features are listed.","[ ] Requested edits are limited and authorized.","[ ] Geometry and light match the source.","[ ] Provenance/status is recorded.","[ ] Approved images have clear filenames."],"sources":"ChatGPT Images / OpenAI image generation; Adobe Firefly Generate Image; a conventional editor for exposure, crop, and perspective. Use generative editing only for authorized, source-preserving changes.\n\n### Source URLs\n- OpenAI image generation help: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- Adobe Firefly image generation: https://helpx.adobe.com/firefly/using/text-to-image.html\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":6,"pageNumber":3,"firstAction":"Select one exterior, one primary room, one secondary room, and one detail as hero candidates.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"editing-the-main-property-film","title":"Animate stills into controlled shots","mission":"Turn selected stills into short, believable moving shots without asking the model to redesign the property.","steps":["Choose two stills for the first test: one wide room and one detail.","Choose the aspect ratio from the final destination, not from the generator’s default.","Upload the still as the image input or first frame.","Prompt only the motion, camera behaviour, timing, and restraint.","Generate a short draft rather than a full film.","Review the first and last frames for geometry, object continuity, and unwanted people or text.","Keep the best take and record the model, prompt, settings, and date in `generation-log.csv`.","Repeat with one changed variable at a time: slower motion, less parallax, or a different shot size.","Reject clips with liquid-looking walls, drifting furniture, bending lines, or impossible camera movement.","Export approved clips to `04_GENERATED_SHOTS/approved` and keep rejected drafts in `rejected` only if they help explain a fix."],"prompt":"Image-to-video motion prompt:\nA restrained [duration]-second [shot size] of the supplied property image.\nCamera performs one slow [push-in / lateral slide / pan / tilt] at a constant pace.\nThe room remains architecturally fixed: walls, windows, doors, flooring, cabinetry, furniture positions, and light direction stay unchanged.\nNatural micro-motion only: subtle exposure breathing and gentle movement in [curtain / foliage], if present in the source.\nNo people, no new objects, no text, no logo, no redesign, no morphing, no handheld shake, no sudden zoom, no change of viewpoint beyond the stated move.\nEnd on a stable frame.","deliverable":"At least four approved generated shots plus `04_GENERATED_SHOTS/generation-log.csv`.","outcome":"Two to four clean 5–10 second clips with gentle motion and no visible architectural drift.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Approved hero stills.","Shot matrix.","Runway, Firefly, Veo, or Sora access.","A naming convention for generations."],"failure_fixes":["**The room morphs:** reduce movement, use a locked-off or very slow push-in, and start from a sharper source still.","**Furniture floats:** remove parallax language, shorten the clip, and keep the camera nearly frontal.","**The camera flies through walls:** replace “orbit” with “slow lateral slide” and specify a stable endpoint.","**The clip contains unwanted text or people:** add explicit exclusions and use a clean source without screens or reflections."],"checklist":["[ ] Each clip has one camera move.","[ ] Motion prompt does not redescribe the whole image.","[ ] Architecture stays fixed.","[ ] Start and end frames are stable.","[ ] No unapproved people, text, or objects appear.","[ ] Prompt and settings are logged.","[ ] Approved clips are named and stored."],"sources":"- Runway Gen-4.5 Image to Video: https://help.runwayml.com/hc/en-us/articles/46974685288467-Creating-with-Gen-4-5\n- Runway image-to-video prompting: https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide\n- Adobe Firefly Generate Video using images: https://helpx.adobe.com/firefly/web/work-with-audio-and-video/work-with-video/generate-videos-using-images.html\n- Google Veo 3.1 API: https://ai.google.dev/gemini-api/docs/veo\n- OpenAI Sora video creation: https://help.openai.com/en/articles/12460853-creating-videos-with-sora\n\n### Source URLs\n- Runway Gen-4.5: https://help.runwayml.com/hc/en-us/articles/46974685288467-Creating-with-Gen-4-5\n- Runway image-to-video prompting: https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide\n- Adobe Firefly image-to-video: https://helpx.adobe.com/firefly/web/work-with-audio-and-video/work-with-video/generate-videos-using-images.html\n- Google Veo documentation: https://ai.google.dev/gemini-api/docs/veo\n- OpenAI Sora video creation: https://help.openai.com/en/articles/12460853-creating-videos-with-sora\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":6,"pageNumber":4,"firstAction":"Choose two stills for the first test: one wide room and one detail.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"platform-versions","title":"Design sound and voiceover","mission":"Give the film a believable sonic world: room tone, purposeful effects, music, and optional concise narration.","steps":["Decide whether the film needs voiceover; a quiet visual film may work better without it.","Choose one music mood and one energy level, not a new track for every room.","Collect three sound layers: music, natural ambience, and optional spot effects.","Use room tone under transitions so cuts do not feel silent or abrupt.","Place a sound accent only when it supports an action or reveal, such as a door opening or exterior ambience.","Write narration from confirmed facts and keep sentences short enough to breathe.","Record one clean take close to the microphone, in a quiet room, with a little space before and after.","Lower music under narration and key sound effects; avoid covering words with a loud music hit.","Listen once with the screen turned away and note whether the audio feels calm, rushed, noisy, or confusing.","Save the mix notes and the separate voice, music, and effects files."],"prompt":"Write a restrained property-film voiceover.\nUse only the confirmed facts below. Do not add measurements, prices, views, distances, amenities, superlatives, or claims about lifestyle unless supplied.\n\nCONFIRMED FACTS:\n[paste facts]\nAUDIENCE: [audience]\nTARGET LENGTH: [seconds]\nTONE: calm, observational, precise\n\nReturn:\n1. Voiceover, maximum [45 / 75] words.\n2. A shot-by-shot placement table with approximate seconds.\n3. Three short on-screen text alternatives, each factual.\n4. Pronunciations or names needing confirmation.\n\nWrite for spoken delivery: short sentences, natural pauses, no exclamation marks, no hype.","deliverable":"`05_AUDIO/` containing music, ambience, effects, voiceover, and `audio-notes.md`.","outcome":"A coherent sound bed in which the music supports the images, ambience gives the property a sense of place, and narration—if used—adds facts without sounding like a sales script.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Shot matrix and rough clips.","A legal music or sound-effects source, or a generated sound route with usage rights understood.","A quiet voice recording option if using narration.","Approved property facts."],"failure_fixes":["**Voiceover is too dense:** cut adjectives first, then combine sentences; aim for one idea per shot.","**Music overwhelms speech:** lower the music during words, use a quieter section, or remove narration.","**The film feels synthetic:** add subtle source-appropriate ambience and avoid excessive whooshes.","**Usage rights are unclear:** replace the track with music and effects whose license is documented; do not publish an unverified track."],"checklist":["[ ] Music source and usage terms are recorded.","[ ] Ambience is present but subtle.","[ ] Voiceover uses confirmed facts only.","[ ] Narration has room to breathe.","[ ] Music ducks under speech.","[ ] Audio assets are stored separately.","[ ] The mix works without visual context."],"sources":"Premiere Pro Audio Track Mixer and Essential Sound; Firefly Generate Sound Effects where available; an approved licensed music library; a normal microphone/voice recorder. Use current account/licensing terms.\n\n### Source URLs\n- Adobe Firefly video/audio tools: https://helpx.adobe.com/firefly/web/work-with-audio-and-video.html\n- Adobe Premiere audio overview: https://helpx.adobe.com/premiere-pro/using/audio.html\n- Adobe Firefly sound effects: https://helpx.adobe.com/firefly/web/work-with-audio-and-video/work-with-audio/generate-sound-effects.html\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":6,"pageNumber":5,"firstAction":"Decide whether the film needs voiceover; a quiet visual film may work better without it.","nextAction":"Open the next lesson when the deliverable is saved."}]},{"id":"property-campaigns","title":"Property Campaigns","description":"Turn one property into a complete visual package.","pages":[{"id":"one-property-many-deliverables","title":"Cut the master cinematic film","mission":"Assemble the shots, sound, copy, and CTA into one clear master film.","steps":["Create a project and import media into labelled bins: `VIDEO`, `STILLS`, `AUDIO`, `GRAPHICS`, `EXPORTS`.","Set the sequence to the intended master aspect ratio and frame rate.","Place the best establishing shot first; do not begin with a logo card unless the brief demands it.","Arrange the shots in arrival, discovery, and close order.","Trim each shot to its visual job and remove repeated coverage.","Use cuts or restrained dissolves; do not add a transition to every edit.","Add music and ambience before fine-tuning shot durations.","Add factual on-screen copy only where it helps the viewer understand the property.","Add the approved CTA as a final, readable card or lower third.","Watch the complete film twice: once for story and once for technical issues; export a review file and then the master."],"prompt":"Create an edit decision list from this shot matrix.\nDo not invent shots or facts.\n\nSHOT MATRIX:\n[paste table]\nAUDIO PLAN:\n[paste audio notes]\nTARGET: [duration], [aspect ratio], [frame rate]\n\nReturn:\n- sequence order;\n- in/out duration for each shot;\n- suggested cut or dissolve only where motivated;\n- audio entry and exit points;\n- exact on-screen copy;\n- final CTA card text;\n- one sentence describing the intended pace.\nKeep all copy factual and use [CONFIRM] for any unresolved item.","deliverable":"`06_EDIT/PROPERTY_MASTER_v01.mp4` plus the editable project file and `edit-notes.md`.","outcome":"A finished master film with a clear visual arc, intelligible sound, controlled transitions, and a final CTA that does not obscure the property.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Approved shots from Lesson 4.","Audio package from Lesson 5.","Shot matrix.","Premiere Pro, Firefly video editor, or CapCut."],"failure_fixes":["**The film feels like a slideshow:** add gentle movement to selected stills, vary shot duration, and cut on a visual or sound change.","**The opening is weak:** move the strongest truthful establishing frame to the first two seconds.","**The middle drags:** remove duplicate room shots and keep one detail only if it advances the story.","**The CTA is unreadable:** increase contrast and duration; keep contact details as deterministic text, not generated text.","**The export is cropped:** return to sequence settings and use a platform-specific sequence rather than forcing one crop everywhere."],"checklist":["[ ] Media is organised in bins.","[ ] Sequence settings match the master.","[ ] Story order is arrival, discovery, close.","[ ] Cuts are purposeful.","[ ] Music and ambience are balanced.","[ ] Copy and CTA are factual and readable.","[ ] A review export and master export are saved."],"sources":"Adobe Premiere Pro desktop; Adobe Firefly video editor beta; CapCut desktop/web for a simple edit. Keep an editable project and separate assets.\n\n### Source URLs\n- Premiere export settings: https://helpx.adobe.com/in/premiere-pro/using/export-settings-reference-premiere-pro.html\n- Firefly video editor: https://helpx.adobe.com/firefly/web/work-with-audio-and-video/firefly-video-editor.html\n- CapCut editing resources: https://www.capcut.com/tools/online-video-editor\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":7,"pageNumber":1,"firstAction":"Create a project and import media into labelled bins: `VIDEO`, `STILLS`, `AUDIO`, `GRAPHICS`, `EXPORTS`.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"hero-still-and-carousel","title":"Create versions for each destination","mission":"Turn one master into useful landscape, square, and vertical versions without losing the property or the message.","steps":["List the destinations and their actual requirements before creating sequences.","Duplicate the master sequence instead of editing the only master.","Create a landscape sequence for website/listing use, a vertical sequence for Reels/Shorts, and a square sequence only when needed.","Reframe each shot manually so doors, windows, and key details remain visible.","Move captions and CTA text into the central safe area for vertical viewing.","Shorten the opening if the platform needs a faster hook, but keep the factual promise.","Check that music and speech still land correctly after trims.","Export H.264 MP4 review files with readable names and version numbers.","Keep an export sheet with destination, dimensions, duration, frame rate, file name, and date.","Open each exported file on a phone or narrow window and watch it from start to finish."],"prompt":"Build a platform-version plan from this master edit.\n\nMASTER:\n- Duration:\n- Aspect ratio:\n- Frame rate:\n- Main message:\n- CTA:\nDESTINATIONS:\n[list destinations]\n\nReturn a table:\nDestination | Aspect ratio | Target duration | Opening shot | Shots to remove or shorten | Reframing notes | Caption-safe area | CTA treatment | Export filename\n\nRules:\n- Preserve the property’s geometry and factual message.\n- Never crop out the only evidence of a feature just to fill the frame.\n- Never place important text near the top, bottom, or side interface areas.\n- If a destination requirement is uncertain, write CHECK CURRENT PLATFORM SETTINGS.","deliverable":"`07_VERSIONS/` containing at least one landscape and one vertical export, plus `export-sheet.csv`.","outcome":"A small version set in which each destination feels intentionally framed rather than accidentally cropped.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Approved master film and editable project.","Platform destinations supplied by the client or brief.","Safe-area guide or a simple margin guide.","CTA and brand assets."],"failure_fixes":["**Vertical crop loses the room:** use a closer detail or a new source-preserved vertical composition; do not stretch the landscape frame.","**Text is hidden by interface controls:** move it toward the centre and preview on the target device.","**The vertical version feels rushed:** retain the strongest two or three shots and simplify the copy rather than speeding every clip.","**Different versions contradict one another:** use one approved fact sheet and one CTA across all versions."],"checklist":["[ ] Every destination has its own sequence.","[ ] Reframing preserves important architecture.","[ ] Text is inside safe areas.","[ ] Audio timing is checked after changes.","[ ] Files use destination and version names.","[ ] Exports were viewed on a phone or narrow screen.","[ ] Export details are logged."],"sources":"Premiere Pro Auto Reframe and manual reframing; CapCut Auto Reframe where available; platform upload screens for final pre-publish checks. Platform rules change, so use current native upload settings.\n\n### Source URLs\n- YouTube Shorts official help: https://support.google.com/youtube/answer/10059070\n- Three-minute Shorts: https://support.google.com/youtube/answer/15424877\n- Instagram Reels size/aspect guidance: https://help.instagram.com/1038071743007909\n- Premiere export settings: https://helpx.adobe.com/in/premiere-pro/using/export-settings-reference-premiere-pro.html\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":7,"pageNumber":2,"firstAction":"List the destinations and their actual requirements before creating sequences.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"reels-teasers-and-thumbnails","title":"Build the property campaign asset system","mission":"Use the same approved property story to make a coordinated hero still, thumbnail, carousel, and short teaser rather than unrelated posts.","steps":["Write the campaign’s one-line message from the film brief.","Choose one hero still and one supporting still for each asset type.","Create a square or landscape hero image with deterministic headline and CTA text.","Create a carousel of 5–7 cards: arrival, main space, detail, secondary space, close/CTA.","Keep the same colour, type, margin, and logo placement across cards.","Use short factual copy; put the full property details in the caption or destination page.","Create a thumbnail from the hero still with enough contrast at small size.","Create a 6–10 second teaser using one or two approved clips and the same campaign message.","Add a campaign code and version number to filenames, not to the visible artwork unless required.","Export editable files and web-ready JPG/PNG/MP4 files into one campaign folder."],"prompt":"Design a property campaign system from the approved brief.\nUse only the supplied facts. Do not create claims, prices, measurements, amenities, or neighbourhood promises.\n\nCAMPAIGN FACTS:\n[paste approved facts]\nCAMPAIGN MESSAGE:\n[paste one-line message]\nAPPROVED ASSETS:\n[list filenames and descriptions]\nBRAND:\n[colours, type, logo placement, CTA]\n\nReturn:\n1. Hero still headline (maximum 8 words)\n2. Carousel plan with 7 cards: card number, image role, factual copy (maximum 12 words), CTA if needed\n3. Film thumbnail headline (maximum 6 words)\n4. Six-to-ten-second teaser text and shot order\n5. Caption opening line and factual CTA\n6. Filename map\nKeep branding and contact details as editable layout text, not generated image text.","deliverable":"`08_CAMPAIGN/` containing one hero still, 5–7 carousel cards, one thumbnail, one teaser, and `campaign-map.md`.","outcome":"A recognisable campaign family in which the film, stills, carousel, and thumbnail share one story and visual language.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Approved film master and versions.","Four to eight approved stills.","Brand colours, logo, type choices, and CTA.","Confirmed property facts.","Adobe Express, Canva, or another layout tool."],"failure_fixes":["**Every asset says too much:** move detail into the caption and retain one idea per card.","**The carousel feels repetitive:** assign each card a different job—arrival, space, material, use, detail, close, CTA.","**The generator misspells the headline:** create the image without text and add all words in Express, Canva, or the editor.","**Campaign assets look unrelated:** reuse the same hero, palette, type scale, margins, and CTA treatment."],"checklist":["[ ] One campaign message drives every asset.","[ ] Hero, carousel, thumbnail, and teaser are planned.","[ ] Facts match the approved brief.","[ ] Text is added deterministically.","[ ] Visual system is consistent.","[ ] Editable and exported files are both saved.","[ ] Filenames include property, asset type, destination, and version."],"sources":"Adobe Express, Canva, Premiere Pro, CapCut, ChatGPT for copy structure, and Adobe Firefly / ChatGPT Images for source-preserving still preparation. Use a conventional layout tool for exact text and logos.\n\n### Source URLs\n- Adobe Express: https://www.adobe.com/express/create/social-media-post\n- Canva design school: https://www.canva.com/designschool/\n- Adobe Firefly text-to-image: https://helpx.adobe.com/firefly/using/text-to-image.html\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":7,"pageNumber":3,"firstAction":"Write the campaign’s one-line message from the film brief.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"campaign-caption-package","title":"Write captions and publish-ready copy","mission":"Create captions that accurately introduce the property film and campaign assets, with platform-ready short and long versions.","steps":["Make a fact bank containing only approved names, features, location wording, and CTA.","Choose one audience action: watch, save, enquire, book a viewing, or visit the listing.","Write a first line that identifies the property or its strongest visible feature without hype.","Add two or three factual supporting lines.","Add a clear CTA and the approved contact route.","Add accessibility text for the hero image or carousel.","Write a short version for a Reel/Short and a longer version for a feed or listing page.","Add only relevant hashtags or keywords; do not substitute tags for facts.","Check spelling of names, addresses, links, and contact details against the source brief.","Save copy in a text file with asset and platform names."],"prompt":"Write publish-ready property captions using only the fact bank.\nDo not invent or imply price, size, availability, views, distance, amenities, renovation status, or neighbourhood benefits.\n\nFACT BANK:\n[paste approved facts]\nASSET: [hero / carousel / Reel / Short]\nPLATFORM: [platform]\nAUDIENCE: [audience]\nCTA: [approved CTA]\nDISCLOSURE, IF REQUIRED: [text]\n\nReturn exactly:\n- Short caption: maximum 300 characters\n- Standard caption: 60–100 words\n- Accessibility description: 1–2 sentences describing only visible content\n- CTA line\n- 5 optional relevant keywords/hashtags\n- Final fact check list: claims used, each mapped to a supplied fact\nUse plain production language. No emojis unless requested. Do not claim the image is a current photograph when it is labelled conceptual or AI-assisted.","deliverable":"`09_COPY/captions.md` containing short, standard, accessibility, CTA, and disclosure copy for every campaign asset.","outcome":"A set of captions that are concise, factual, accessible, and matched to each asset’s purpose.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Approved campaign assets.","Property facts and CTA.","Destination platforms.","Any required disclosure or conceptual-image wording from the client."],"failure_fixes":["**Caption becomes generic marketing copy:** replace abstractions with visible, supplied details.","**The accessibility description contains claims:** describe what is visible, not what the property supposedly offers.","**The CTA is vague:** use the exact approved contact action and route.","**The caption is too long for the platform:** keep the first sentence and CTA, then move secondary facts to the listing destination."],"checklist":["[ ] Fact bank is the only source for claims.","[ ] First line identifies the asset/property clearly.","[ ] CTA is approved and usable.","[ ] Accessibility description is included.","[ ] Conceptual or AI-assisted status is disclosed when required.","[ ] Names and links were checked.","[ ] Copy is saved by platform and asset."],"sources":"ChatGPT or another approved writing assistant for first drafts; platform-native caption fields for publishing; a plain text file or spreadsheet for approval and handoff. Do not let an image generator render the copy.\n\n### Source URLs\n- Instagram accessibility guidance: https://help.instagram.com/503708446705527\n- YouTube upload and Shorts help: https://support.google.com/youtube/answer/10059070\n- Adobe caption overview: https://helpx.adobe.com/premiere/desktop/add-text-images/insert-captions/about-captions.html\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":7,"pageNumber":4,"firstAction":"Make a fact bank containing only approved names, features, location wording, and CTA.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"client-delivery-folder","title":"Package and deliver the campaign","mission":"Create a clean delivery folder that a client, listing agent, or publisher can use without asking which file is final.","steps":["Create the final folder tree: `00_README`, `01_MASTER`, `02_SOCIAL_VIDEO`, `03_STILLS`, `04_CAROUSEL`, `05_COPY`, `06_SOURCE_AND_LICENSES`.","Copy only approved final files into delivery folders; keep work-in-progress files elsewhere.","Rename files with `PROPERTY_ASSET_DESTINATION_VERSION_DATE`.","Create a README listing each file, its purpose, dimensions, duration, and any disclosure.","Include the editable project only when the handoff agreement allows it.","Include source and license notes for music, stock, generated media, and client-supplied images.","Confirm that every campaign asset uses the same approved facts and CTA.","Open every final video and image from the delivery folder, not from the editing application.","Make a compressed delivery copy and record its checksum or archive name if the client needs an auditable handoff.","Send the delivery link with a short message that states what is included and what remains to be confirmed before publishing."],"prompt":"Create a client delivery manifest from this asset list.\nDo not rename files or invent missing metadata.\n\nPROPERTY: [name]\nDELIVERY DATE: [date]\nASSET LIST:\n[paste filename, type, dimensions, duration, status, disclosure, license note]\n\nReturn markdown with:\n1. Delivery summary\n2. Folder tree\n3. File table: filename | purpose | dimensions | duration | editable? | disclosure/license note\n4. Publishing notes\n5. Items requiring client confirmation\n6. Suggested handoff message\n\nUse “not supplied” when information is missing. Do not call an item final unless its status is APPROVED.","deliverable":"`10_DELIVERY/PROPERTY_CAMPAIGN_DELIVERY.zip` or a shared delivery folder containing the manifest, approved assets, copy, and documented source/license notes.","outcome":"A delivery folder with predictable names, a manifest, usable exports, source/licensing notes, and no ambiguity about which files are ready to publish.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Master film and platform versions.","Campaign stills, carousel, thumbnail, captions, and source media.","Approved CTA, logo, and disclosure wording.","Cloud or local delivery location."],"failure_fixes":["**The client cannot find the final Reel:** put only approved files in the delivery folder and prefix destination names such as `REEL_9x16`.","**A video has no sound or captions:** open the exported file independently and re-export with the correct audio/caption settings.","**The wrong version was sent:** use version numbers and archive old exports outside the delivery folder.","**Licensing is unclear:** hold the affected asset back, document the source, and replace it with a cleared asset if necessary.","**A generated concept is mistaken for a current image:** keep it in a labelled conceptual folder and include the disclosure in the manifest."],"checklist":["[ ] Delivery tree is present.","[ ] Only approved exports are in delivery folders.","[ ] Names include property, asset, destination, version, and date.","[ ] README/manifest is included.","[ ] Captions and accessibility copy are included.","[ ] Source and license notes are included.","[ ] Every file was opened independently.","[ ] Unconfirmed items are clearly listed."],"sources":"Local filesystem and cloud storage for handoff; Premiere Pro or CapCut for final exports; Adobe Express/Canva for editable still layouts; platform-native upload screens for the last settings check. For captions, export a burned-in version and/or an SRT sidecar when the destination supports it.\n\n### Source URLs\n- Premiere caption export: https://helpx.adobe.com/premiere/desktop/render-and-export/export-files/export-captions.html\n- Premiere caption tracks: https://helpx.adobe.com/premiere/desktop/render-and-export/export-files/export-caption-tracks.html\n- Premiere supported caption formats: https://helpx.adobe.com/premiere/desktop/add-text-images/insert-captions/supported-file-formats-for-captions.html\n- YouTube Shorts upload help: https://support.google.com/youtube/answer/10059070\n- Instagram Reels size/aspect guidance: https://help.instagram.com/1038071743007909\n\n---\n\n## Capstone package\n\nAfter Lesson 10, Alex has one complete property package:\n\n- one factual film brief;\n- one shot matrix;\n- three or four source-preserved hero stills;\n- four or more controlled image-to-video shots;\n- one master cinematic film;\n- landscape and vertical versions;\n- one hero still, thumbnail, carousel, and teaser;\n- platform captions and accessibility descriptions;\n- one documented delivery folder.\n\nThe package is reusable: replace the property facts and source media, keep the structure, and rebuild the next campaign without starting from a blank page.","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":7,"pageNumber":5,"firstAction":"Create the final folder tree: `00_README`, `01_MASTER`, `02_SOCIAL_VIDEO`, `03_STILLS`, `04_CAROUSEL`, `05_COPY`, `06_SOURCE_AND_LICENSES`.","nextAction":"Open the next lesson when the deliverable is saved."}]},{"id":"websites-and-artifacts","title":"Websites and Artifacts","description":"Give the visual campaign a digital home.","pages":[{"id":"property-landing-page","title":"Build a property landing page","mission":"Create a one-page property presentation that answers three questions quickly: What is it? Why might I want it? What should I do next? You will finish with a responsive landing page containing a hero image, property facts, a short description, a location section, and a viewing button.","steps":["**Make the project folder.** Create `property-site`, then create `index.html` inside it. If you are using an AI workspace, ask it to create a single HTML file, not a multi-file framework project.","**Paste the reusable prompt.** Replace the bracketed values with your property facts. Ask for a complete file and keep the first result as `draft-01.html` before changing it.","**Replace placeholders with your images.** Put image files in `property-site/images/` and change each source, for example `src=\"images/front.jpg\"`. Use meaningful alt text such as `Front elevation of The Willow House with garden trees`.","**Replace the page copy with this exact starter copy.** Edit only facts you can verify:","South-facing garden","Open-plan kitchen and dining room","Dedicated study","Three bathrooms","**Add the following minimal HTML if the AI omitted the main structure.** Place it inside `<body>`:","**Ask the AI tool for one focused improvement at a time.** Use this exact request: `Keep the wording and images. Improve spacing, text contrast, and phone layout. Do not add gradients, fake reviews, invented claims, forms, analytics, or extra sections.` Save each useful version with a number.","**Open the file in a browser.** Resize to a narrow phone width and a wide desktop width. Click every navigation link, the viewing button, and the theme switch. Confirm images keep their proportions.","**Publish or share the result.** Use the route in “Current tool routes” below. Copy the live URL into a note beside the project folder."],"prompt":"Create a single self-contained index.html for a premium real-estate property website.\nAudience: a buyer viewing on a phone first.\nProperty: [property name], [city/neighbourhood], [price], [bedrooms] bedrooms,\n[bathrooms] bathrooms, [area] m².\nGoal: help a visitor understand the property and request a private viewing.\nUse semantic HTML, responsive CSS, keyboard-accessible buttons, descriptive alt text,\nand no external libraries. Use a white day theme and black night theme with a real\nsun/moon switch. Keep the copy factual and use [IMAGE-1], [IMAGE-2] as image\nplaceholders until I provide licensed images. Put all CSS in <style> and all JavaScript\nin <script>. Return the complete file, not a plan.","deliverable":"`property-site/index.html`, an `images/` folder, and one shareable URL or local file path.\n\n---","outcome":"A calm, readable one-page property site with one clear action, real image captions, visible facts, working internal links, and a theme switch that works with mouse and keyboard.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["A browser and either ChatGPT Canvas, Claude Artifacts, Google AI Studio Build mode, CodePen, or a plain text editor.","One licensed exterior image and two to four licensed interior images, or clearly labelled temporary placeholders.","The property facts and address you are allowed to publish.","The shared starting kit above."],"failure_fixes":["**The page is blank:** confirm the file is named `index.html`, then open it by double-clicking it. If the browser shows code, the file was saved as `.txt`; rename it.","**Image
