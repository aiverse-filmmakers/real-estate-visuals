erties** or **Essential Graphics** controls only if they appear in the learner’s release.\n\nFor delivery, select the timeline or source clip, choose **File > Export > Media**, select the available **Format** and **Preset** that match the client-approved specification, confirm the settings and output location, then choose **Export** or **Send to Adobe Media Encoder**. No codec or preset is universal in this lesson.\n\n## 6. Do this\n\n1. Open the Lesson 15 project. Duplicate the 15-second sequence inside the project and rename the duplicate `WillowHouse_15s_vertical_client_v01` before you change it. Keep the horizontal review sequence untouched.\n2. Confirm the client need. If there’s no written destination brief, use the course default: one 15-second vertical 9:16 client version. Record this assumed default in the export note.\n3. Reframe each shot for the vertical version without stretching it. Keep the key architectural feature, factual title, and any required representation label fully visible. If a shot can’t show the relevant room, facade, label, or context truthfully in vertical, replace it with another approved shot or leave it out.\n4. Adjust the edit only as needed for the new frame. Keep the same short, purposeful story. Don’t add transitions or crop tricks to hide geometry drift or a missing feature.\n5. Use the conditional Type-tool/Program-Monitor route to reposition or recreate approved title and disclosure graphics for the vertical frame. If available, use Properties or Essential Graphics to keep the size and contrast readable. Extend each required label graphic on the timeline so it covers its labelled shot.\n6. Play the vertical version with sound, then play it muted. Check for cropped doors, windows, roofline, garden boundaries, cabinetry, or labels. Also check that no shot now suggests a factual walkthrough or current-condition claim that it didn’t make in the horizontal master.\n7. **Optional 30-second extension: only if the client requested it:** duplicate the appropriate approved sequence, add two to four additional approved clips from the Project panel, and trim them in the timeline to their stable, useful beats. Extend the story with useful context, a room sequence, or a differentiator. Don’t slow weak clips or repeat shots just to reach 30 seconds. Recheck every added clip and its labels.\n8. Save the client-version project in `03-premiere-project/` as `WillowHouse_client_versions_v01.prproj`.\n9. Select the requested timeline and choose **File > Export > Media**. Choose only the available **Format** and **Preset** that the client or destination has approved. Confirm the output location `04-client-version/`, then choose **Export** or **Send to Adobe Media Encoder**. Record the actual choices.\n\n## 7. Copy this version brief\n\n```\nCLIENT VERSION BRIEF\nDestination: [CLIENT-APPROVED DESTINATION / COURSE DEFAULT]\nPrimary version: 15-second vertical 9:16\nKeep visible: [MATERIAL PROPERTY FEATURES]\nText that must remain visible: [TITLE / FACTUAL LINE / REQUIRED LABEL]\n30-second extension: [NOT REQUESTED / REQUESTED FOR DESTINATION]\nAdded shots, if requested: [APPROVED CLIP FILENAMES ONLY]\nExport: use the client-approved Format/Preset available in the current Premiere release; record the actual choices and output location.\n```\n\n**Variables:** everything in brackets must come from the client brief, approved facts, or already reviewed media. `Added shots` can’t be newly generated to fill the duration.\n\n## 8. Example: Willow House\n\n```\nCLIENT VERSION BRIEF\nDestination: course default social-first client review\nPrimary version: 15-second vertical 9:16\nKeep visible: front door and roofline; garden-facing windows and fireplace; kitchen island and pendant lights\nText that must remain visible: Willow House / Garden-facing living room / Conceptual virtual-staging reveal: furniture and decor shown are illustrative. [if applicable]\n30-second extension: not requested\nAdded shots, if requested: WillowHouse_ExteriorApproach_v02, WillowHouse_KitchenSlide_v01\nExport: use the client-approved Format/Preset available in the current Premiere release; record the actual choices and output location.\n```\n\n## 9. What good looks like\n\n- Exactly one client-needed derivative is delivered. If there’s no brief, it’s the 15-second 9:16 vertical default.\n- The vertical frame keeps the important property context and all required text visible, without distortion or a misleading omission.\n- The original horizontal review sequence stays preserved.\n- A 30-second version exists only when requested, and only adds approved, stable, useful shots.\n- The export note records the actual client-approved Format/Preset and destination. It doesn’t claim that one codec or preset works everywhere.\n\n## 10. If it goes wrong\n\n- **A vertical crop hides the key room feature, facade context, or disclosure.** Replace the shot with an approved vertical-safe shot, shorten the sequence, or deliver the horizontal master. Don’t stretch, crop away, or cover an important fact.\n- **The title or label does not fit the vertical composition.** Reposition or recreate it with the conditional Type-tool route and available Properties/Essential Graphics controls. Inspect it at playback speed and during muted playback.\n- **The film feels padded at 30 seconds.** Remove repeated or weak material. Keep the 15-second vertical version as the client deliverable unless the longer version adds approved context or storytelling value.\n- **An added clip introduces drift or an unlabelled conceptual/staged claim.** Remove it. Don’t lengthen a client version with unreviewed media.\n- **Premiere does not offer the requested export selection.** Confirm the destination requirement with the client. Use an available, approved Format/Preset and record the actual setting. Never claim a universal fallback codec or preset.\n\n## 11. Export\n\nExport the default vertical client version to `04-client-version/` as `WillowHouse_15s_vertical_client_v01.[approved-extension]`.\n\nExport the optional extension only when requested, for example: `WillowHouse_30s_[orientation]_client_v01.[approved-extension]`.\n\nFor every export, retain this note beside the file:\n\n```\nFILE: [export filename]\nUSE: [client destination]\nORIENTATION: [9:16 vertical / client-approved orientation]\nDURATION: [00:15 / 00:30]\nFORMAT/PRESET: [actual Premiere choices]\nREPRESENTATION: [current-condition clips; list any labelled exceptions]\nLABEL/DISCLOSURE: [none / exact approved copy]\n```\n\n## 12. Your turn\n\nCreate the one version your client needs. If there’s no client brief, create the 15-second vertical 9:16 default. Make a 30-second version only when the client asks for it and you have enough additional approved shots to make it useful.\n\n## 13. Pass when\n\n- [ ] One requested client version exists. Without a brief, it’s a 15-second vertical 9:16 version.\n- [ ] The client version preserves important property context and required text without distortion, a misleading crop, or hidden labels.\n- [ ] The Lesson 15 horizontal sequence remains unchanged and retained.\n- [ ] Any 30-second extension was requested and uses only added approved, stable clips.\n- [ ] The actual available Premiere Format/Preset, output location, orientation, duration, and representation labels are recorded beside each export.", "visual": {"before": "assets/willow/re-08-exterior-source.png", "after": "assets/willow/re-01-living-staged-tested.png", "label": "Create only the version the client needs from approved material.", "status": "RESEARCH-VERIFIED"}}, {"id": "lesson-17", "number": 17, "title": "Turn Approved Work into a Campaign Asset Set", "body": "## Outcome\n\nTurn one approved property set into a small, useful campaign: one hero or cover, one five-frame carousel, one correctly labelled before/after asset, and an optional factual caption. Don’t generate a new property image just because the destination changes.\n\n## Use this after\n\nThe relevant stills and film are approved. Start with approved exports or approved source files, not unapproved drafts, working PSDs, or a screenshot of an editor.\n\n## What you need\n\n1. An approved hero candidate and four other approved property images, or approved film material for a cover.\n2. One approved matched before/after pair if that asset is requested.\n3. Client-approved property facts, CTA, brand files, destination requirements, and required disclosure wording.\n4. The single project structure used for both this lesson and Lesson 18:\n\n```\n[PropertyName]_Campaign_[YYYY-MM-DD]/\n  Originals_READ-ONLY/        # received/approved source files; never edit\n  Working/                    # Photoshop/Premiere project files and drafts\n  Review/                     # only versions sent for approval\n  Final/                      # only written-approved delivery files\n  Notes/                      # fact sheet, approval record, DELIVERY-INDEX.txt\n```\n\nKeep the originals protected. Don’t create lesson-specific folder trees or a second delivery-folder system.\n\n## Primary tools and status\n\n**Adobe Photoshop desktop** is the main route for still crops, carousel frames, before/after layouts, supplied logos, and deterministic text. **Adobe Premiere** is the main route for approved film edits, cover frames already available through the documented workflow, and any requested motion version.\n\n**Status: RESEARCH-VERIFIED (2026-09-01).** This is the course’s documented Photoshop/Premiere production route, not an in-house test claim. Use the save/export controls available in the installed version, and inspect every output.\n\n## Make the asset set\n\n1. Copy the approved assets into `Working/`. Leave `Originals_READ-ONLY/` unchanged.\n2. Choose one clear, recognisable approved view for the hero or cover. Preserve fixed features and don’t force an unreadable crop. If the cover comes from film, use an approved frame through the documented Premiere workflow. Don’t screenshot the Program Monitor.\n3. In Photoshop, make the requested destination crops from that approved source. Add only client-approved text and supplied brand files with deterministic Photoshop text/placement. Don’t ask an image model to render logos, addresses, disclosures, or required wording.\n4. Build a five-frame carousel from approved images in this order: cover/hero, main room, second room, differentiator, closing frame with the approved CTA only if one is supplied. Keep the crop logic, text style, and clear area for required labels consistent.\n5. If requested, make a matched before/after pair or two consecutive carousel frames from the same camera view. Add the label that truthfully describes the change: `CURRENT-CONDITION CLEANUP`, `VIRTUALLY STAGED`, `PROPOSED CONCEPT`, or `ATMOSPHERIC DERIVATIVE`. Add client-supplied disclosure wording exactly as supplied.\n6. If a motion asset is requested, assemble or export it in Premiere from approved material. Use deterministic titles and labels, then check the finished export outside Premiere.\n7. Export review copies to `Review/`, with `REVIEW_v01` and then an incremented version in each filename. Don’t put assets in `Final/` until written approval arrives.\n\n## Optional caption prompt: client facts only\n\nThis optional drafting step is **not labelled research-verified**. Use it only when the client has supplied or approved every populated fact below. It isn’t a research step, and you must never use it to discover, infer, or validate property facts.\n\n```\nWrite one short social caption using only the supplied client facts below.\nDo not add, infer, research, or embellish measurements, location details,\namenities, condition claims, availability, legal language, or a CTA. If a\nfield is blank, omit it. Keep every disclosure exactly as supplied.\n\nProperty name: [CLIENT-APPROVED NAME OR BLANK]\nApproved location wording: [CLIENT-APPROVED WORDING OR BLANK]\nApproved facts: [CLIENT-APPROVED FACTS OR BLANK]\nAsset type: [HERO / CAROUSEL / BEFORE-AFTER / VIDEO]\nRepresentation label: [CURRENT-CONDITION CLEANUP / VIRTUALLY STAGED / PROPOSED CONCEPT / ATMOSPHERIC DERIVATIVE / NONE]\nRequired disclosure: [CLIENT-SUPPLIED TEXT OR NONE]\nApproved CTA: [CLIENT-SUPPLIED TEXT OR NONE]\nTone: clear, short, factual\n\nReturn:\n1. Caption, maximum 70 words\n2. Optional first line, maximum 12 words\n3. The exact representation label and disclosure on separate lines\n```\n\nIf there’s no completed client fact sheet, leave out the caption instead of using this prompt.\n\n## Filled Willow House asset plan\n\n```\nHero: WillowHouse_hero_16x9_REVIEW_v01.jpg\nCover: WillowHouse_cover_9x16_REVIEW_v01.jpg\nCarousel:\n  01 WillowHouse_carousel_01_hero_REVIEW_v01.jpg\n  02 WillowHouse_carousel_02_living_REVIEW_v01.jpg\n  03 WillowHouse_carousel_03_kitchen_REVIEW_v01.jpg\n  04 WillowHouse_carousel_04_garden_REVIEW_v01.jpg\n  05 WillowHouse_carousel_05_cta_REVIEW_v01.jpg\nBefore/after: WillowHouse_living_virtual-staging_4x5_REVIEW_v01.jpg\nVisible label: VIRTUALLY STAGED\nCTA: View the full property gallery\n```\n\nUse only the approved facts that actually exist in Willow’s client fact sheet. Don’t turn “light-filled,” “rear garden,” or any other example wording into a claimed fact unless the client supplied or approved it.\n\n## Conditional export record\n\nFor each review or final asset, use the image/video format, colour profile, pixel dimensions, aspect ratio, codec/preset, and output location required by the client or destination **only if those choices are available in the installed Photoshop/Premiere version**. Record the actual specification in `Notes/DELIVERY-INDEX.txt`. Don’t present JPEG, sRGB, H.264, 16:9, 4:5, or 9:16 as universal defaults.\n\n## Pass when\n\n1. Every campaign asset comes from approved property work.\n2. Text, logos, labels, and disclosures are deterministic and client-approved.\n3. A before/after uses matched views and has a truthful visible label.\n4. The caption, if included, contains only supplied client facts.\n5. Review files are separated from originals and finals.\n\n---", "visual": {"before": "assets/willow/re-01-living-staged-tested.png", "after": "assets/willow/re-08-garden-concept-tested.png", "label": "Campaign assets reuse reviewed imagery and carry truthful labels.", "status": "RESEARCH-VERIFIED"}}, {"id": "lesson-18", "number": 18, "title": "Approve and Hand Off the Campaign", "body": "## Outcome\n\nGet one written approval, then hand over a clean `Final/` package and a delivery index. The index must tell the client exactly what each file is for, its actual technical specification, and any representation label or disclosure.\n\n## What you need\n\n1. The Lesson 17 review assets in `Review/`.\n2. A completed client fact sheet and required disclosure copy, if relevant.\n3. Written approval for the exact review version(s).\n4. The same `Originals_READ-ONLY/`, `Working/`, `Review/`, `Final/`, and `Notes/` structure from Lesson 17.\n\n## Primary route and status\n\nUse a normal file manager or client-approved cloud folder for the handoff. Use Photoshop for final still exports and Premiere for final motion exports where needed.\n\n**Status: Photoshop/Premiere route RESEARCH-VERIFIED (2026-09-01).** Confirm the available export settings in the installed release, and verify the files from the handoff location. This workflow isn’t legal advice. Follow the client’s and destination’s disclosure requirements.\n\n## Lean approval and handoff\n\n1. Put only the current review versions in `Review/`. Keep the source archive and working project out of the review folder.\n2. Send this approval message with the exact filenames:\n\n```\nProject: [PROPERTY NAME]\nReview files: [EXACT REVIEW FILENAMES]\nApproved facts/text shown: [LIST OR NONE]\nRepresentation labels/disclosures: [LIST OR NONE]\n\nPlease reply with either:\nAPPROVED\nor one consolidated list of changes for these named review versions.\n```\n\n3. Save the written reply in `Notes/`. If changes are requested, revise only `Working/`, create the next `REVIEW_v##` export, and repeat this same review step. Don’t move assets to `Final/` yet.\n4. After written approval, export or copy only those approved versions to `Final/`. Don’t include drafts, alternates, PSDs, Premiere projects, or unapproved outputs unless the client requested them.\n5. Use client- or destination-approved export settings only where the installed app exposes them. Record the actual format, profile/codec, dimensions, aspect ratio, duration, and file location in the index. Don’t rely on a universal preset.\n6. Create `Notes/DELIVERY-INDEX.txt` from the template below. Open every final still and play every final video from `Final/`. Check the filename, readable label/disclosure, orientation/aspect ratio, and successful playback before sending the delivery link or archive.\n7. Send the handoff message:\n\n```\nProject: [PROPERTY NAME]\n\nApproved campaign files are in: [DELIVERY LINK OR ARCHIVE NAME]\nThe delivery index is included and lists each file’s intended use, actual export specification, and any representation label or disclosure.\n\nIncluded: [SHORT LIST]\n```\n\n## Copy template: `DELIVERY-INDEX.txt`\n\n```\nPROJECT: [PROPERTY NAME]\nAPPROVAL: [DATE OR WRITTEN-APPROVAL REFERENCE]\nDELIVERY LOCATION: [LINK OR ARCHIVE NAME]\n\nFILE: [EXACT FILENAME]\nUSE: [LISTING HERO / VIDEO COVER / CAROUSEL FRAME / BEFORE-AFTER / FILM / OTHER]\nFORMAT: [ACTUAL FORMAT, PROFILE OR CODEC IF APPLICABLE, PIXELS, ASPECT RATIO, DURATION IF VIDEO]\nREPRESENTATION: [CURRENT-CONDITION / CURRENT-CONDITION CLEANUP / VIRTUALLY STAGED / PROPOSED CONCEPT / ATMOSPHERIC DERIVATIVE]\nLABEL/DISCLOSURE: [VISIBLE TEXT OR NONE]\nNOTES: [CLIENT-APPROVED USE LIMIT OR NONE]\n\n[REPEAT THE SIX-LINE FILE BLOCK FOR EVERY DELIVERED FILE]\n```\n\n## Filled Willow House delivery index example\n\n```\nPROJECT: Willow House\nAPPROVAL: Client email approving WillowHouse campaign REVIEW_v02\nDELIVERY LOCATION: WillowHouse_Approved-Campaign_2026-09-01.zip\n\nFILE: WillowHouse_hero_16x9_APPROVED.jpg\nUSE: Listing hero\nFORMAT: JPEG, sRGB, 2400 × 1350 px, 16:9\nREPRESENTATION: CURRENT-CONDITION CLEANUP\nLABEL/DISCLOSURE: NONE\nNOTES: Approved for listing use\n\nFILE: WillowHouse_cover_9x16_APPROVED.jpg\nUSE: Vertical video cover\nFORMAT: JPEG, sRGB, 1080 × 1920 px, 9:16\nREPRESENTATION: CURRENT-CONDITION\nLABEL/DISCLOSURE: NONE\nNOTES: Title text supplied by client\n\nFILE: WillowHouse_carousel_01-05_4x5_APPROVED.zip\nUSE: Five-frame social carousel\nFORMAT: Five JPEG files, sRGB, 1080 × 1350 px each, 4:5\nREPRESENTATION: CURRENT-CONDITION\nLABEL/DISCLOSURE: NONE\nNOTES: Frame 05 CTA supplied by client\n\nFILE: WillowHouse_living_virtual-staging_4x5_APPROVED.jpg\nUSE: Social before/after\nFORMAT: JPEG, sRGB, 1080 × 1350 px, 4:5\nREPRESENTATION: VIRTUALLY STAGED\nLABEL/DISCLOSURE: VIRTUALLY STAGED\nNOTES: Matched living-room source view\n\nFILE: WillowHouse_film_15s_16x9_APPROVED.mp4\nUSE: Horizontal property-film cut\nFORMAT: H.264 MP4, 1920 × 1080 px, 16:9, 00:15\nREPRESENTATION: CURRENT-CONDITION CLIPS; SEE LABELLED EXCEPTIONS\nLABEL/DISCLOSURE: VIRTUALLY STAGED on living-room reveal\nNOTES: Played from Final/ before handoff\n```\n\nThe Willow values are an example of a **recorded, client-approved specification**, not a universal export recipe. Replace them with the actual settings and disclosures for each project.\n\n## Pass when\n\n1. The exact approved versions are identified in a saved written reply.\n2. `Final/` contains only approved delivery files.\n3. Originals remain protected, and working files remain outside the handoff package.\n4. `Notes/DELIVERY-INDEX.txt` lists every delivered file with its use, actual specification, representation, and disclosure.\n5. Every final file has been opened or played from `Final/` before handoff.", "visual": {"before": "assets/willow/re-03-cleanup-tested.png", "after": "assets/willow/re-01-living-staged-tested.png", "label": "A final package can contain different representation types only when clearly indexed and labelled.", "status": "COURSE-CONTROLLED WORKFLOW"}}]}</script>
<script>
const DATA=JSON.parse(document.querySelector('#course-data').textContent);const lessons=DATA.lessons;const byId=Object.fromEntries(lessons.map(x=>[x.id,x]));const byNum=Object.fromEntries(lessons.map(x=>[x.number,x]));const app=document.querySelector('#app');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');}
function md(src){let out=[], lines=src.replace(/\r/g,'').split('\n'), i=0, list=null; const close=()=>{if(list){out.push(`</${list}>`);list=null}};while(i<lines.length){let l=lines[i];if(l.startsWith('```')){close();let a=[];i++;while(i<lines.length&&!lines[i].startsWith('```'))a.push(lines[i++]);let code=esc(a.join('\n'));out.push(`<div class="promptbox"><button class="copy" data-copy="${encodeURIComponent(a.join('\n'))}">Copy prompt</button><pre>${code}</pre></div>`);i++;continue}if(/^\|/.test(l)&&i+1<lines.length&&/^\|?\s*---/.test(lines[i+1])){close();let rows=[];let head=l.split('|').slice(1,-1).map(x=>x.trim());i+=2;while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i].split('|').slice(1,-1).map(x=>x.trim()));i++}out.push('<table><thead><tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue}if(/^###\s+/.test(l)){close();out.push('<h3>'+inline(l.replace(/^###\s+/,''))+'</h3>')}else if(/^##\s+/.test(l)){close();out.push('<h2>'+inline(l.replace(/^##\s+/,''))+'</h2>')}else if(/^---\s*$/.test(l)){close();out.push('<hr>')}else if(/^[-*]\s+/.test(l)){if(list!=='ul'){close();list='ul';out.push('<ul>')}out.push('<li>'+inline(l.replace(/^[-*]\s+/,'').replace(/^\[ \]\s*/,''))+'</li>')}else if(/^\d+\.\s+/.test(l)){if(list!=='ol'){close();list='ol';out.push('<ol>')}out.push('<li>'+inline(l.replace(/^\d+\.\s+/,''))+'</li>')}else if(l.trim()===''){close()}else{close();out.push('<p>'+inline(l)+'</p>')}i++}close();return out.join('');}
function nav(){document.querySelector('#nav').innerHTML=DATA.modules.map(m=>`<a href="#module/${m.id}" data-module="${m.id}"><b>${m.number} · ${esc(m.title)}</b><span>${m.lessons.length} lesson${m.lessons.length>1?'s':''}</span></a>`).join('')}
function progress(){let done=JSON.parse(localStorage.getItem('ai-re-visuals-done')||'[]');return Math.round(done.length/18*100)}
function home(){app.innerHTML=`<div class="wrap hero"><div class="eyebrow">A practical AI-Verse course</div><h1>Make property visuals that look better. Without losing what’s real.</h1><p>You’ll start with normal property photos. By the end, you’ll have corrected images, staged rooms, honest concepts, calm motion, a property film and campaign assets a client can use.</p><div class="actions"><a class="button primary" href="#lesson/lesson-01">Start Lesson 1</a><a class="button" href="#curriculum">See the 18-lesson path</a></div><div class="proof"><figure><img src="assets/willow/re-01-living-staged-tested.png" alt="Synthetic virtually staged living-room demonstration"><figcaption>Synthetic Willow House example. This is a course demo, not a real listing.</figcaption></figure><div class="stat"><strong>18</strong><b>practical production lessons</b><p>One rule runs through the whole course: keep the real property facts. Stage loose furniture honestly. Label concepts and lighting changes. Check every result.</p></div></div><section class="start-card"><div class="eyebrow">The Willow House practice project</div><h2>One property. One connected portfolio outcome.</h2><p>Use the supplied synthetic examples as you practise. You’ll fix photos, stage rooms, make a concept, build clips, cut a film and prepare a campaign. The site marks which examples were <strong>tested in-house</strong> and which tool routes are <strong>research-verified</strong>.</p><div class="progress"><i style="width:${progress()}%"></i></div><div class="actions"><a class="button" href="#module/start">Open the first module</a><a class="button" href="assets/willow/re-03-cluttered-living-source.png" download>Download a practice photo</a></div><p style="font-size:13px;color:var(--muted);margin-bottom:0">The practice downloads are synthetic, permission-cleared demos. Their long edge is 1536px. Use them for practice, not as final listing media.</p></section></div>`}
function curriculum(){app.innerHTML=`<div class="wrap"><div class="module-head"><div class="eyebrow">Your path through the course</div><h1>From raw image to delivered campaign.</h1><p>Work through the modules in order. Each lesson starts with a real file and ends with a named result.</p></div>${DATA.modules.map(m=>`<section class="start-card"><div class="eyebrow">${m.number} · ${esc(m.title)}</div><h2>${esc(m.promise)}</h2><div class="lesson-grid">${m.lessons.map(n=>card(byNum[n])).join('')}</div></section>`).join('')}</div>`}
function card(l){return `<a class="lesson-card" href="#lesson/${l.id}"><span class="lesson-no">LESSON ${String(l.number).padStart(2,'0')}</span><h2>${esc(l.title)}</h2><p>${esc(l.body.split('\n').find(x=>x.startsWith('### Visible result')||x.startsWith('## Outcome')||x.startsWith('### What you’re making')||x.startsWith('## 2. What you’re making'))?.replace(/^#+\s*/,'')||'Open the practical workflow.')}</p><span class="button">Open lesson →</span></a>`}
function modulePage(id){const m=DATA.modules.find(x=>x.id===id);if(!m)return home();app.innerHTML=`<div class="wrap"><div class="module-head"><a class="crumb" href="#curriculum">← Full curriculum</a><div class="eyebrow">Module ${m.number}</div><h1>${esc(m.title)}</h1><p>${esc(m.promise)}</p></div><div class="lesson-grid">${m.lessons.map(n=>card(byNum[n])).join('')}</div></div>`}
function lesson(id){const l=byId[id];if(!l)return home();const idx=lessons.indexOf(l), prev=lessons[idx-1],next=lessons[idx+1];const done=new Set(JSON.parse(localStorage.getItem('ai-re-visuals-done')||'[]'));const v=l.visual;app.innerHTML=`<div class="wrap"><a class="crumb" href="#module/${DATA.modules.find(m=>m.lessons.includes(l.number)).id}">← Back to module</a><div class="lesson-top"><span class="lesson-number">${String(l.number).padStart(2,'0')}</span><h1>${esc(l.title)}</h1></div><div class="lesson-meta"><span class="badge ${v.status.includes('TESTED')?'tested':''}">${esc(v.status)}</span><span class="badge">Willow House practice project</span></div><div class="lesson-layout"><article class="reader"><div class="visual-pair"><figure class="visual"><img src="${v.before}" alt="Source demonstration for lesson ${l.number}"><figcaption>Source / starting point</figcaption></figure><figure class="visual"><img src="${v.after}" alt="Result demonstration for lesson ${l.number}"><figcaption>Result / teaching reference</figcaption></figure></div><p class="visual-caption">${esc(v.label)} Source and result are synthetic, permission-cleared course demonstrations.</p><div class="md">${md(l.body)}</div><div class="next">${prev?`<a href="#lesson/${prev.id}">← ${esc(prev.title)}</a>`:'<span></span>'}${next?`<a href="#lesson/${next.id}">${esc(next.title)} →</a>`:'<a href="#home">Finish the course →</a>'}</div></article><aside class="side"><div class="side-card"><b>Where you are</b>Lesson ${l.number} of 18<br><div class="progress"><i style="width:${progress()}%"></i></div>${progress()}% marked complete</div><div class="side-card"><b>Course rule</b>Keep the original. Do not quietly change architecture, openings, permanent fixtures, dimensions, views or property context. Label staging, concepts and atmospheric work honestly.</div><button class="button ${done.has(l.id)?'primary':''}" id="complete">${done.has(l.id)?'Completed':'Mark complete and open next'}</button></aside></div></div>`;document.querySelector('#complete').onclick=()=>{done.add(l.id);localStorage.setItem('ai-re-visuals-done',JSON.stringify([...done]));if(next)location.hash='#lesson/'+next.id;else home()}}
function route(){const h=location.hash.slice(1)||'home';document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',h===a.getAttribute('href').slice(1)));if(h==='home')home();else if(h==='curriculum')curriculum();else if(h.startsWith('module/'))modulePage(h.split('/')[1]);else if(h.startsWith('lesson/'))lesson(h.split('/')[1]);else home();window.scrollTo(0,0)}
function copyText(text){if(navigator.clipboard?.writeText){return navigator.clipboard.writeText(text).catch(()=>legacyCopy(text))}return Promise.resolve(legacyCopy(text))}function legacyCopy(text){const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.cssText='position:fixed;opacity:0;pointer-events:none';document.body.append(t);t.select();document.execCommand('copy');t.remove()}document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){copyText(decodeURIComponent(b.dataset.copy));b.textContent='Copied';setTimeout(()=>b.textContent='Copy prompt',1400)}});const theme=document.querySelector('#theme');function setTheme(v){document.documentElement.dataset.theme=v;theme.setAttribute('aria-checked',v==='dark');theme.textContent=v==='dark'?'☾':'☀';theme.setAttribute('aria-label',v==='dark'?'Switch to light mode':'Switch to dark mode');document.querySelector('meta[name="theme-color"]').content=v==='dark'?'#000000':'#ffffff';localStorage.setItem('ai-re-visuals-theme',v)}theme.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(localStorage.getItem('ai-re-visuals-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));nav();addEventListener('hashchange',route);route();
</script></body></html>
