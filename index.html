acing:-.07em;max-width:960px;margin:0}.hero p{font-size:clamp(18px,2vw,23px);color:var(--muted);max-width:680px;margin:0}.hero .actions{display:flex;flex-wrap:wrap;gap:11px}.proof{margin-top:40px;display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.proof figure,.visual{margin:0;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}.proof img,.visual img{display:block;width:100%;height:100%;object-fit:cover}.proof figcaption{padding:13px 15px;font-size:13px;color:var(--muted)}.stat{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:grid;align-content:center;gap:7px}.stat strong{font-size:44px;letter-spacing:-.06em}.stat p{font-size:14px}.start-card{margin-top:70px;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px}.start-card h2{margin:8px 0;font-size:28px;letter-spacing:-.04em}.module-head{display:grid;gap:13px;margin-bottom:34px}.module-head h1{font-size:clamp(38px,5vw,64px);line-height:1;letter-spacing:-.06em;margin:0}.module-head p{font-size:19px;color:var(--muted);max-width:680px;margin:0}.lesson-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.lesson-card{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;color:var(--ink);background:var(--bg);min-height:190px}.lesson-card:hover{background:var(--surface);border-color:var(--accent)}.lesson-no{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent)}.lesson-card h2{margin:0;font-size:22px;line-height:1.12;letter-spacing:-.045em}.lesson-card p{margin:0;color:var(--muted);font-size:14px}.lesson-top{display:flex;gap:16px;align-items:flex-start}.lesson-top h1{margin:3px 0 0;font-size:clamp(32px,4.2vw,55px);line-height:1;letter-spacing:-.06em}.lesson-number{font-size:14px;font-weight:800;color:var(--accent);padding-top:8px}.crumb{font-size:13px;color:var(--muted);text-decoration:none}.crumb:hover{color:var(--accent)}.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.badge{font-size:11px;letter-spacing:.08em;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted)}.badge.tested{background:var(--accent-soft);border-color:transparent;color:var(--accent)}.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px}.reader{min-width:0}.side{display:grid;align-content:start;gap:12px}.side-card{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-size:13px}.side-card b{display:block;margin-bottom:5px}.visual-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:26px 0 8px}.visual img{aspect-ratio:3/2}.visual figcaption{padding:10px 12px;font-size:12px;color:var(--muted)}.visual-caption{font-size:13px;color:var(--muted);margin:0 0 30px}.md h2{margin:40px 0 12px;font-size:25px;line-height:1.1;letter-spacing:-.04em}.md h3{margin:26px 0 9px;font-size:17px;line-height:1.2;letter-spacing:-.02em}.md p{margin:10px 0}.md ul,.md ol{padding-left:23px;margin:10px 0}.md li{margin:5px 0}.md code{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 5px;border-radius:5px;background:var(--surface2);overflow-wrap:anywhere}.promptbox{position:relative;margin:16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}.promptbox pre{margin:0;padding:48px 17px 18px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}.copy{position:absolute;right:10px;top:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700}.md table{width:100%;border-collapse:collapse;margin:15px 0;font-size:14px}.md th,.md td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.md th{background:var(--surface)}.next{display:flex;justify-content:space-between;gap:1 <script id="course-data" type="application/json">{"modules": [{"id": "start", "number": "01", "title": "Start here", "promise": "Make one useful fix before you learn the bigger picture.", "lessons": [1]}, {"id": "fix", "number": "02", "title": "Fix real property photos", "promise": "Fix what’s in the photo while keeping the room the same.", "lessons": [2, 3, 4]}, {"id": "stage", "number": "03", "title": "Stage rooms that work", "promise": "Add believable furniture with the right size, space and light.", "lessons": [5, 6, 7]}, {"id": "concept", "number": "04", "title": "Make labelled concepts", "promise": "Show renovation and lighting ideas clearly beside the real photo.", "lessons": [8, 9, 10]}, {"id": "consistency", "number": "05", "title": "Keep one property coherent", "promise": "Make three rooms feel like they belong to the same house.", "lessons": [11]}, {"id": "motion", "number": "06", "title": "Turn images into motion", "promise": "Make calm marketing shots and spot changes that should be rejected.", "lessons": [12, 13, 14]}, {"id": "film", "number": "07", "title": "Build the property film", "promise": "Cut approved shots into a finished film for the client.", "lessons": [15, 16]}, {"id": "campaign", "number": "08", "title": "Make campaign assets", "promise": "Turn the approved work into the formats the client needs.", "lessons": [17]}, {"id": "handoff", "number": "09", "title": "Approve and hand off", "promise": "Protect the originals, get approval and send the right files.", "lessons": [18]}], "lessons": [{"id": "lesson-01", "number": 1, "title": "Remove one distraction, safely", "body": "### Visible result\nA current-condition correction with one temporary, non-structural distraction removed: `willow-living-current-condition-cleanup.jpg`.\n\n### Inputs\n- One permission-cleared property photograph and its untouched original.\n- One precisely named temporary item that does not cover a fixed feature.\n- A one-line boundary before editing: `Current-condition correction: remove [object] only; preserve [fixed features/view].`\n\n### Primary tool and safe named route\n**Adobe Photoshop desktop: Camera Raw Remove tool** (research-verified 2026-09-01).\n\nOpen a camera raw file in Camera Raw. If the image is already open in Photoshop, choose **Filter > Camera Raw Filter**. In Camera Raw, choose **Remove**. Its documented modes are **Remove**, **Heal**, and **Clone**. Set **Size** and **Opacity** before you brush. Use **Visualize Spots** only to check small flaws, then turn it off so you can judge the real image.\n\n### Steps\n1. Open a copy of the source and save an editable working file. Keep the original untouched.\n2. Write the image type in the working-file note or filename: `Current-condition correction`. Name the one change you allow and the fixed facts that must stay visible.\n3. If the file is already open in Photoshop, open **Filter > Camera Raw Filter**. Choose **Remove**.\n4. Set **Size** just a little wider than the object. Brush over the object and its contact shadow. Stop before floorboard seams, skirting, shelf edges, tiles, furniture legs, window frames, or other fixed boundaries.\n5. Check the repair at 100%, then check the full frame. The room must still look like the same photograph.\n6. If the repair passes, save the working file. Stop after this one defensible removal.\n\n### Production prompt/action\n**Action:** use the Remove tool first. Escalate only when a small, contained repair fails: make a tight selection around that object and choose **Generative Fill**. In the available prompt field, use:\n\n```\nRemove only [OBJECT] at [LOCATION]. Reconstruct only [SURFACE] directly behind it. Preserve all fixed property features, loose furniture not named here, camera position, crop, room proportions, daylight, shadows, window view, walls, floor, and colour. Do not change anything outside the selection. Current-condition correction only.\n```\n\n### Variables\n- `[OBJECT]`: one object, not a category.\n- `[LOCATION]`: its exact visible location.\n- `[SURFACE]`: the material behind it, such as oak floorboards or painted shelf backing.\n\n### Filled Willow example\n```\nRemove only the black charging cable and plug at the right end of the sofa on the oak floor. Reconstruct only the oak floorboards directly behind it. Preserve all fixed property features, loose furniture not named here, camera position, crop, room proportions, daylight, shadows, window view, walls, floor, and colour. Do not change anything outside the selection. Current-condition correction only.\n```\n\n### Checks\n- The named cable and plug are gone. No other item disappeared.\n- Floorboard grain, seams, edges, and contact shadow look believable at 100%.\n- Windows, exterior view, furniture, walls, and room proportions match the original.\n- You can honestly label the file `Current-condition correction: cable and plug removed.`\n\n### Corrections\n| Problem | Correction |\n|---|---|\n| A seam, skirting line, or shelf edge breaks. | Undo. Use a smaller brush and separate strokes that stop at the boundary. |\n| The object remains. | Use a tighter selection and name the object and location exactly. Accept only a result limited to that selection. |\n| Nearby furniture, lighting, or the window view changes. | Reject the result. Retry with a smaller area. If drift continues, leave the item and flag it for manual retouching. |\n| The object hides a fixed feature. | Stop. Ask for a different source image. Do not reconstruct it as a current-condition correction. |\n\n### Conditional export route and real output\nSave the editable working file. For quick delivery, choose **File > Export > Quick Export as (image format)** only if its saved preference uses the agreed delivery format. Choose a destination if prompted, then save. Otherwise, use **File > Save As** and choose an available agreed format. Do not assume a universal export surface or format.\n\n**Output:** `willow-living-current-condition-cleanup.jpg`: reviewed current-condition cleanup, with the untouched source retained beside it.\n\n---", "visual": {"before": "assets/willow/re-03-cluttered-living-source.png", "after": "assets/willow/re-03-cleanup-tested.png", "label": "Synthetic declutter demonstration", "status": "TESTED IN-HOUSE"}}, {"id": "lesson-02", "number": 2, "title": "Correct exposure and white balance", "body": "### Visible result\nA natural current-condition interior with readable room detail and neutral colour: `willow-living-current-condition-exposure-wb.jpg`.\n\n### Inputs\n- One permission-cleared interior that is dark, mixed-lit, or colour-cast.\n- The untouched original and an editable working copy.\n- One real bright hold point and one real dark hold point to protect.\n\n### Primary tool and safe named route\n**Adobe Photoshop desktop: Camera Raw adjustments** (research-verified 2026-09-01).\n\nFor an open JPEG, TIFF, or PSD, choose **Filter > Camera Raw Filter**. A raw file can open directly in Camera Raw. Use Camera Raw slider adjustments instead of broad generative image editing. A separate in-house test of broad generative exposure changed the exterior view, so it isn't the truthful default.\n\n### Steps\n1. Open the working copy through the safe route above. Do not edit the only original.\n2. Correct white balance first. Sample a plausible neutral surface. Avoid coloured fabric, wood, and blown window highlights. If the result is too warm or cool, make small **Temperature** changes. Use **Tint** only to correct an obvious green or magenta cast.\n3. Raise or lower **Exposure** in small increments until the room is readable. Stop before the protected bright area becomes flat white or usable shadows become grey.\n4. Reduce **Highlights** only enough to keep real source detail. Lift **Shadows** only enough to show real materials. Use **Whites** and **Blacks** sparingly so the contrast stays natural.\n5. Compare before and after at full-frame view. Then inspect window edges, curtains, wall corners, floor texture, and furniture at 100%.\n6. Accept only a correction that looks like the same room under better-balanced capture conditions. Save the working file.\n\n### Production prompt/action\n**Action brief for Camera Raw:**\n\n```\nCorrect only exposure and white balance. Protect real detail in [BRIGHT AREA], reveal real material in [DARK AREA], and neutralise [COLOUR CAST] while retaining natural contrast. Preserve camera position, crop, geometry, windows, exterior view, fixed fittings, furniture, floor, walls, proportions, and existing objects. Do not add, remove, move, restyle, or invent detail.\n```\n\n### Variables\n- `[BRIGHT AREA]`: factual highlight to preserve.\n- `[DARK AREA]`: factual shadow area to open modestly.\n- `[COLOUR CAST]`: observed cast before correction.\n\n### Filled Willow example\n```\nCorrect only exposure and white balance. Protect real detail in the two rear windows, reveal real oak floor and the left corner beneath the built-in shelving, and neutralise the warm ceiling-light cast against cool daylight while retaining natural contrast. Preserve camera position, crop, geometry, windows, exterior view, fireplace, built-in shelving, sofa, coffee table, floor, walls, proportions, and existing objects. Do not add, remove, move, restyle, or invent detail.\n```\n\n### Checks\n- White walls and neutral surfaces look believable, not strongly blue, yellow, green, or magenta.\n- The main room is readable without flattening every shadow.\n- The window keeps only detail that existed in the source. The exterior hasn't become another scene.\n- Furniture, built-ins, textures, and proportions match the original.\n\n### Corrections\n| Problem | Correction |\n|---|---|\n| The room is too orange or blue. | Reset Temperature/Tint, sample a different neutral, and make smaller adjustments. |\n| The window becomes featureless white. | Lower Exposure slightly, then reduce Highlights. Compare with the original. |\n| Dark corners become grey and muddy. | Reduce Shadows and restore Blacks slightly. Keep the intentional shadow. |\n| The image looks HDR or illustrated. | Reduce the tonal changes and restore contrast. Do not substitute a broad generative pass. |\n\n### Conditional export route and real output\nSave the working file. Use **File > Export > Quick Export as (image format)** only when the saved Quick Export preference matches the agreed delivery format. Otherwise, use **File > Save As** and choose an available agreed format. Keep the original pixel dimensions unless the approved destination specification says otherwise.\n\n**Output:** `willow-living-current-condition-exposure-wb.jpg`: a natural, reviewed current-condition correction.\n\n---", "visual": {"before": "assets/willow/re-04-exposure-source.png", "after": "assets/willow/re-04-exposure-source.png", "label": "Exposure workflow source. The generative exposure test was rejected as a truthful default.", "status": "TESTED IN-HOUSE: REJECTED AS DEFAULT"}}, {"id": "lesson-03", "number": 3, "title": "Declutter one real room", "body": "### Visible result\nA before/after pair showing the same room with 3–6 named temporary items removed: `willow-living-current-condition-declutter.jpg`.\n\n### Inputs\n- One permission-cleared cluttered-room photograph and untouched original.\n- A short target list of 3–6 removable items, each with a location.\n- An editable working copy.\n\n### Primary tool and safe named route\n**Adobe Photoshop desktop: Camera Raw Remove tool; tight-selection Generative Fill only if needed** (research-verified 2026-09-01).\n\nWith the working image open, choose **Filter > Camera Raw Filter**, then **Remove**. Adjust **Size** and **Opacity** before each repair. If a small, contained repair fails, return to Photoshop. Use a selection tool to define only that object and a narrow margin of its background. Then choose **Generative Fill**, enter a prompt if needed, choose **Generate**, and select a variation in **Properties**.\n\n### Steps\n1. Write the targets in removal order. Start with the item furthest from fixed edges. Example: box left of coffee table; bag in front of sofa; bin by right wall; cable below sofa; framed photo on middle-right shelf.\n2. Open the editable working copy through **Filter > Camera Raw Filter** and choose **Remove**.\n3. Remove one target at a time. Use a brush only slightly wider than the item and its contact shadow. Treat shelves, tile lines, floorboards, skirting, grilles, curtains, and fixed furniture edges as stop lines.\n4. After every removal, inspect the immediate repair at 100% and the whole room at fit view. Undo a failure before you start the next item.\n5. If the Remove tool fails on a contained background patch, undo that attempt. In Photoshop, select only the failed object and a narrow background edge, then use **Generative Fill**. Accept only a variation that changes the selected zone and keeps its boundaries.\n6. Compare the finished working copy to the original. Only listed targets may have changed. Save it when the room still looks like the same real room.\n\n### Production prompt/action\nUse this only inside a tight Generative Fill selection:\n\n```\nRemove only [OBJECT LIST WITH LOCATIONS]. Reconstruct only the surfaces directly behind those objects with matching texture, straight lines, and natural contact shadows. Preserve [FIXED HOLD POINTS], camera position, perspective, room proportions, daylight, and exterior view. Do not add furniture, redecorate, brighten broadly, make the room artificially empty, or change anything outside the selection. Current-condition correction only.\n```\n\n### Variables\n- `[OBJECT LIST WITH LOCATIONS]`: each object plus a location.\n- `[FIXED HOLD POINTS]`: visible fixed facts for this room: for example shelving, windows, door, floor, walls, and appliances.\n- `selection`: must stay local. If it must span a whole wall or room, stop and use another route.\n\n### Filled Willow example\n```\nRemove only the cardboard box on the floor left of the coffee table, the black folded bag in front of the sofa, the blue recycling bin beside the right wall, the loose cable and charging plug below the sofa, and the small framed photograph on the middle shelf at the right. Reconstruct only the surfaces directly behind those objects with matching texture, straight lines, and natural contact shadows. Preserve the sofa, coffee table, shelving structure, plant, curtains, windows, door, oak floor, walls, fixed fittings, camera position, perspective, room proportions, daylight, and exterior view. Do not add furniture, redecorate, brighten broadly, make the room artificially empty, or change anything outside the selection. Current-condition correction only.\n```\n\n### Checks\n- Every removed item was on the target list. No unlisted item has disappeared.\n- Repaired floorboards, shelves, wall paint, tiles, and shadows look believable at 100%.\n- Fixed features, retained furniture, camera perspective, and the exterior view match the original.\n- The before/after pair shows a tidier version of the same room, not an empty or redesigned room.\n\n### Corrections\n| Problem | Correction |\n|---|---|\n| A small shelf frame remains. | Process it as its own exact target with a tight selection. Do not expand to the whole shelf. |\n| A floorboard, tile, or shelf edge breaks. | Undo. Repair in smaller sections that stop at the line. |\n| An unlisted cushion, plant, or furniture item disappears. | Reject the result and revert to the last clean state. Process only the written list. |\n| The room becomes smoother, brighter, or restyled. | Reject it. Return to local Remove strokes or a tighter selection. Do not make a broad generative correction. |\n| An item covers a radiator, appliance, built-in, or structure. | Stop and request another source image, or handle any reconstruction as separately approved concept work. |\n\n### Conditional export route and real output\nSave the working file. For delivery, use **File > Export > Quick Export as (image format)** only if its saved preference matches the agreed format. Otherwise, use **File > Save As** and choose an available agreed format. Save the original and delivered image as a review pair. Do not merge them into a misleading composite.\n\n**Output:** `willow-living-current-condition-declutter.jpg`: reviewed decluttered room plus its retained source.\n\n---", "visual": {"before": "assets/willow/re-03-cluttered-living-source.png", "after": "assets/willow/re-03-cleanup-tested.png", "label": "Synthetic declutter demonstration", "status": "TESTED IN-HOUSE"}}, {"id": "lesson-04", "number": 4, "title": "Finish a listing-ready hero still", "body": "### Visible result\nOne client-review hero still: a restrained current-condition finish with an honest crop and natural tones. If it's available and useful, it may also include a modest vertical correction: `willow-living-current-condition-hero.jpg`.\n\n### Inputs\n- One approved image from Lessons 2–3, its untouched original, and the editable working file.\n- The intended delivery use, such as `client-review hero still; current-condition correction`.\n- A named reason for the crop and, if needed, two visible vertical references.\n\n### Primary tool and safe named route\n**Adobe Photoshop desktop: Camera Raw Filter for restrained finishing** (research-verified 2026-09-01).\n\nWith the image open in Photoshop, choose **Filter > Camera Raw Filter** for the final check of white balance and exposure. If the current Camera Raw release has a geometry or vertical-correction control and the image has visibly leaning verticals, use that control carefully. Don't rely on a fixed UI path. Crop only when the approved destination needs it or when a real edge distraction needs removing.\n\n### Steps\n1. Open the approved working image and compare it with the untouched original. Write down the only finish you intend to make: restrained tone, optional natural vertical correction, and/or an honest crop.\n2. Choose **Filter > Camera Raw Filter**. Make only small adjustments to white balance, Exposure, Highlights, Shadows, Whites, or Blacks when the current result needs them. Leave the controls unchanged if the image already looks natural.\n3. If the current release offers a geometry/vertical correction control and door or window lines visibly lean, correct them against one or two true verticals. Reduce or reset the correction if it stretches the room, distorts a doorway, or changes the window view.\n4. Apply an approved crop only to remove an edge distraction or meet a confirmed destination requirement. Don't crop out a doorway, window, or meaningful context in a way that makes the room look larger, more open, or differently configured.\n5. Inspect cleanup zones and factual details at 100%. Inspect framing and natural perspective at full frame.\n6. Compare the result with the original. If you can't describe a change as restrained current-condition finishing, undo it. Save the working file.\n\n### Production prompt/action\n**Final approval brief:**\n\n```\nFinish this exact property photograph as a current-condition hero still for [DELIVERY USE]. Correct only restrained exposure, white balance, [VERTICAL ACTION], and [CROP ACTION]; retain only [APPROVED CLEANUP]. Preserve room geometry, walls, floor, windows, exterior view, doors, fixed fittings, retained furniture, camera viewpoint, perspective, proportions, and real material detail. Do not add, remove, move, restyle, renovate, replace, or invent any property feature.\n```\n\n### Variables\n- `[DELIVERY USE]`: a specific review or listing use.\n- `[VERTICAL ACTION]`: `no vertical correction` or named reference lines plus a modest correction.\n- `[CROP ACTION]`: `no crop` or the exact edge distraction removed.\n- `[APPROVED CLEANUP]`: the already approved temporary removals only.\n\n### Filled Willow example\n```\nFinish this exact Willow House living-room photograph as a current-condition hero still for client review. Correct only restrained exposure, white balance, modest natural vertical alignment against the left window frame and right door jamb, and a crop that removes the partial blue bin at the far-right edge; retain only the approved cable-and-plug cleanup. Preserve room geometry, walls, oak floor, windows, exterior view, fireplace, built-in shelving, doors, sofa, coffee table, camera viewpoint, perspective, proportions, and real material detail. Do not add, remove, move, restyle, renovate, replace, or invent any property feature.\n```\n\n### Checks\n- Exposure and white balance stay natural. Bright windows and dark corners keep believable contrast.\n- Any vertical correction feels natural and doesn't stretch or squeeze the room.\n- The crop removes only a real distraction or meets the confirmed delivery requirement.\n- At 100%, cleanup areas and fixed details are clean. At full frame, it's clearly the same real photograph.\n- The review note identifies it as `Current-condition correction`, not universally listing-platform compliant.\n\n### Corrections\n| Problem | Correction |\n|---|---|\n| Vertical correction stretches the room. | Reduce or reset it; accept slight natural lens perspective rather than force a perfect line. |\n| Crop hides a door, window, or useful context. | Reset the crop and remove only the outer-edge distraction, or keep the original frame. |\n| Window detail is lost. | Lower Exposure or Whites slightly and reduce Highlights; retain only real source detail. |\n| The final image looks overly bright, smooth, or stylised. | Reduce tonal adjustments and compare against the original; do not use a broad generative pass. |\n| A request changes a fixed feature. | Stop. Create a separately labelled concept route rather than alter this current-condition hero. |\n\n### Conditional export route and real output\nSave the editable working file. Use **File > Export > Quick Export as (image format)** only when its saved preference matches the agreed delivery format. Otherwise, use **File > Save As** and choose an available agreed format. Confirm that the saved file opens correctly. Record the actual approved delivery specification instead of assuming a universal format, profile, or listing rule.\n\n**Output:** `willow-living-current-condition-hero.jpg`: reviewed hero still for client approval, with the original retained.", "visual": {"before": "assets/willow/re-03-cluttered-living-source.png", "after": "assets/willow/re-03-cleanup-tested.png", "label": "Current-condition hero workflow uses the approved cleanup as its starting point.", "status": "RESEARCH-VERIFIED TOOL ROUTE"}}, {"id": "lesson-05", "number": 5, "title": "Stage an Empty Living Room", "body": "## Outcome\n\nProduce one labelled, virtually staged living-room image from an approved empty living-room photograph. Keep the original and every fixed property feature unchanged.\n\n## Start with\n\n- One permission-cleared empty living-room photo with visible floor and fixed features.\n- A short brief: one style, one seating group, a furniture-scale limit, a clear route, and a decor cap.\n- The destination’s disclosure requirement.\n\n## Tool and evidence\n\n**ReimagineHome: AI Virtual Staging**. **RESEARCH-VERIFIED**. Use the documented flow in the module header. The living-room correction pattern in this lesson is supported by local tests T-03 (provisional) and T-10 (accepted). Those tests used a local image route, not ReimagineHome.\n\n## Workflow\n\n1. Keep the approved source unchanged, then upload that source to ReimagineHome.\n2. Choose an AI-suggested style **or** type the staging direction below in your own words. Name the fixed features, furniture limit, route, and decor cap. Don't leave any of these implied.\n3. Generate the result and inspect it against the source using the shared strip.\n4. If the scale, route, or decor fails but the fixed geometry still holds, upload the **original source again** and use a narrowly corrected direction.\n5. Download or save only the reviewed high-resolution derivative. Keep it paired with the original and label it as virtually staged where required.\n\n## Master direction\n\n```\nUse this exact empty living-room photograph as the source. Virtually stage it as a [STYLE] living room for a property listing. Preserve exactly the camera position, crop, perspective, room proportions, walls, ceiling, windows, exterior view, doors, fireplace, built-in shelving, floor, vents and all other fixed architecture.\n\nAdd only loose, realistically scaled furnishings: [SOFA], [COFFEE TABLE], [RUG], [CHAIR], [LAMP], and [MINIMAL DECOR]. Place every item on the visible floor with believable contact and soft shadows consistent with the existing [LIGHT DIRECTION]. Keep [CLEAR ROUTE] visibly open. Keep [BUILT-IN LIMIT].\n\nDo not renovate, add or remove windows, alter the exterior view, move or redesign fixed features, change the camera framing, add architectural finishes, crowd the room, create floating furniture, or make this look like CGI or an editorial interior.\n```\n\n### Willow House example\n\n```\nUse this exact empty living-room photograph as the source. Virtually stage it as a calm contemporary, warm-neutral living room for a property listing. Preserve exactly the camera position, crop, perspective, room proportions, walls, ceiling, windows, exterior view, doors, fireplace, built-in shelving, floor, vents and all other fixed architecture.\n\nAdd only a compact warm-grey three-seat sofa facing the fireplace and set back from camera, one low oval oak coffee table, one textured neutral rug under the front legs of the seating, one compact reading chair near the right shelving, one slim floor lamp and two small plants. Keep the window-side-to-fireplace route visibly open. Keep built-in shelves almost empty: one small plant and two books.\n\nDo not alter any fixed feature or add other decor.\n```\n\n### Correction direction: rerun from the original\n\n```\nUse the original empty living-room photograph again. Keep the architecture and camera unchanged. Position the sofa farther from camera and no more than 35% of frame width. Leave the window-side-to-fireplace route visibly open. Keep the built-in shelves almost empty: only one small plant and two books. Do not add any other decor or alter any fixed property feature.\n```\n\n## Deliverable and pass check\n\nSubmit the untouched original, one labelled staged derivative, and the final direction. It passes when the living room is still the same room, the sofa doesn't dominate the frame, floor contact and shadows look plausible, and the stated route is clearly usable.\n\n---", "visual": {"before": "assets/willow/re-01-empty-living-source.png", "after": "assets/willow/re-01-living-staged-tested.png", "label": "Synthetic staging test. The corrected result retained an open route and restrained sofa scale.", "status": "TESTED IN-HOUSE LOCAL ROUTE"}}, {"id": "lesson-06", "number": 6, "title": "Stage a Bedroom or Home Office That Still Works", "body": "## Outcome\n\nProduce one labelled staged bedroom **or** home-office image that still works as a usable room. The bed or desk must be in proportion, doors and storage must plausibly operate, and the specified route must stay open.\n\n## Start with\n\n- One permission-cleared empty bedroom or home-office photograph with a visible door, wardrobe, drawers, or another functional constraint.\n- A short brief naming the room function, the essential loose furniture, the door/wardrobe/drawer clearance to protect, and a clear route.\n- The destination’s disclosure requirement.\n\n## Tool and evidence\n\n**ReimagineHome: AI Virtual Staging**. **RESEARCH-VERIFIED**. Follow the documented upload-then-style-or-typed-direction flow in the module header. Local T-04 showed that an attractive staged bedroom can still fail when the wardrobe approach is too narrow. T-09 was rerun from the original with a smaller bed and a 70 cm route, and it was accepted. These are local-test lessons, not evidence of ReimagineHome performance.\n\n## Workflow\n\n1. Upload the original bedroom or office photo.\n2. Choose an AI-suggested style **or** type one direction. State the fixed features, the functional furniture, the opening/clearance constraint, and the route.\n3. Generate the result and inspect it using the shared strip. Test the image as a room: could the door swing, wardrobe door, or drawer plausibly operate without hitting the new furniture?\n4. If the geometry holds but the function fails, return to the original upload and make one specific correction: reduce the bed or desk size, move an item, or state the required clearance.\n5. Download or save only the reviewed derivative. Keep it with the original and label it for the intended destination.\n\n## Master direction\n\n```\nUse this exact [BEDROOM OR HOME-OFFICE] photograph as the source. Virtually stage it as a restrained [STYLE] [BEDROOM OR HOME OFFICE] for a property listing. Preserve exactly the camera position, crop, perspective, room proportions, walls, ceiling, windows, exterior view, doors, wardrobe or built-in storage, drawers, floor, sockets and all other fixed architecture.\n\nAdd only [LOOSE FURNITURE LIST]. Keep every item realistically scaled, on the visible floor with believable contact and soft shadows consistent with the existing [LIGHT DIRECTION]. Leave [CLEARANCE] clear so [DOOR / WARDROBE / DRAWER] can plausibly open. Keep [ROUTE] visibly open.\n\nDo not change fixed features, block an opening, add architectural finishes, crowd the room, create floating furniture, or make the image look like CGI or an editorial interior.\n```\n\n### Bedroom example\n\n```\nUse this exact empty-bedroom photograph as the source. Virtually stage it as a restrained contemporary double bedroom for a property listing. Preserve exactly the camera position, crop, window, exterior view, wardrobe doors and interior, floor, walls, ceiling light point, plug socket, dimensions and all architecture.\n\nAdd only a smaller double bed centred on the back wall, two narrow bedside tables, two small bedside lamps, and one neutral rug beneath the lower half of the bed. Keep every item realistically scaled with believable floor contact and daylight-consistent shadows. Leave a clear 70 cm walkway in front of the wardrobe doors so they can plausibly open. Keep the route from the room door to the wardrobe visibly open.\n\nDo not place furniture in front of the window, change the wardrobe, add a false headboard wall, alter the exterior view, or change any fixed feature.\n```\n\n### Home-office example\n\n```\nUse this exact empty home-office photograph as the source. Virtually stage it as a restrained, listing-appropriate home office. Preserve exactly the camera position, crop, room proportions, walls, ceiling, windows, exterior view, door, built-in storage, drawers, floor, sockets and all other fixed architecture.\n\nAdd only one compact desk, one task chair, one low movable storage unit and one small plant. Keep every item realistically scaled with believable floor contact and daylight-consistent shadows. Leave the door swing clear, keep the storage drawers able to plausibly open, and keep a clear route from the door to the desk.\n\nDo not change fixed features, add cabinetry, block the window, or introduce unbriefed furniture or decor.\n```\n\n## Deliverable and pass check\n\nSubmit the untouched original, one labelled staged bedroom or office derivative, and the final direction. It passes only if the fixed geometry holds **and** the stated door, wardrobe, or drawer clearance and route visibly work. A prettier image that can't function is a reject.\n\n---", "visual": {"before": "assets/willow/re-05-empty-bedroom-source.png", "after": "assets/willow/re-05-bedroom-staged-tested.png", "label": "Synthetic staging test. The accepted correction improves wardrobe clearance.", "status": "TESTED IN-HOUSE LOCAL ROUTE"}}, {"id": "lesson-07", "number": 7, "title": "Restyle Only Loose Furniture", "body": "## Outcome\n\nMake one labelled furnished-room restyle. Change only the loose furniture and decor you name. Keep the fixed architecture, current layout, camera view, rug footprint and daylight direction the same.\n\n## Start with\n\n- One permission-cleared furnished room.\n- A **change-only list** of loose furniture/decor to replace (no more than seven items or compact item groups).\n- A **do-not-change list** covering every fixed feature and every loose item that must remain.\n- A restrained style, palette and material direction.\n\n## Tool and evidence\n\n**Adobe Photoshop desktop: selection-first Generative Fill with tight selections**: **RESEARCH-VERIFIED**. The documented route is: open the image, make a selection, choose **Generative Fill**, optionally select an available model, enter an object-specific prompt, choose **Generate**, then select a variation in **Properties**. Local T-05 provisionally accepted a restrained restyle on synthetic furnished room RE-02. It supports the lists, tight-selection approach and inspection standard, but it doesn't prove anything about Photoshop performance.\n\n## Workflow\n\n1. Open the source in Photoshop and save an editable working copy. Keep the original unchanged.\n2. Write the change-only and do-not-change lists before you make a selection.\n3. Select one loose object or compact furniture group. Keep the selection inside its edge. Leave out the floor, walls, windows, fireplace, built-ins and other fixed features.\n4. Choose **Generative Fill**, enter the object-specific direction, choose **Generate**, then select a variation in **Properties** only if it keeps the nearby edges, perspective, floor contact and shadows correct.\n5. Repeat from larger furniture to smaller decor. Never make a whole-room generative selection.\n6. Compare the result with the original. Reject it if anything outside the change-only list has changed. Save the editable working copy and export the reviewed derivative using an available, client-approved format.\n\n## Object direction\n\nUse inside a tight selection only:\n\n```\nReplace only the selected [OBJECT OR OBJECT GROUP] with [STYLE] [OBJECT DESCRIPTION] in [PALETTE/MATERIALS]. Match the existing camera perspective, scale, floor contact, daylight direction and realistic property-photography shadows. Do not alter anything outside the selection.\n```\n\n### Willow House examples\n\n**Change-only list:** sofa, armchairs, coffee table, lamp, cushions, throw, loose shelf decor.  \n**Do-not-change list:** camera view, windows, exterior view, fireplace, built-in shelving structure, walls, floor, rug footprint, room proportions and daylight direction.\n\n```\nReplace only the selected sofa with a calm contemporary Scandinavian, realistically scaled warm-grey sofa in soft woven fabric. Match the existing camera perspective, scale, floor contact, daylight direction and realistic property-photography shadows. Do not alter anything outside the selection.\n```\n\n```\nReplace only the selected coffee table with one compact pale-oak oval coffee table. Match the existing camera perspective, scale, floor contact, daylight direction and realistic property-photography shadows. Do not alter anything outside the selection.\n```\n\n## Deliverable and pass check\n\nSubmit the untouched original, editable working file, one labelled restyle derivative, and the two short lists. It passes when every visible change is named on the change-only list; the fixed room, rug footprint, camera view and daylight still match; replacement furniture has a believable scale and floor contact; and no broad whole-room redesign took place.", "visual": {"before": "assets/willow/re-02-furnished-living-source.png", "after": "assets/willow/re-02-restyle-tested.png", "label": "Synthetic loose-furniture restyle demonstration.", "status": "TESTED IN-HOUSE LOCAL ROUTE"}}, {"id": "lesson-08", "number": 8, "title": "Make a Kitchen or Bathroom Concept", "body": "## Outcome\n\nCreate one clearly labelled proposed-renovation pair: the untouched kitchen or bathroom source on the left and one Firefly concept on the right.\n\n**Deliverable:** `property-room-before-proposed-concept-review.[approved-format]` plus the untouched source, selected derivative, and editable PSD.\n\n## Prepare\n\n1. Choose one permitted kitchen or bathroom source. Before generating, write two lists:\n   - **Hold:** camera frame, walls, ceiling, openings, windows, exterior view, fixed appliances/plumbing, island or vanity footprint, major cabinet layout, floor plan.\n   - **Propose:** no more than six observable material/finish changes.\n2. Keep the source unchanged. Don't use a social crop as the composition reference.\n3. Use this required label on the derivative: `Concept visual. Proposed renovation.`\n\n## Generate in Firefly\n\n1. From the Firefly homepage, choose **Generate** in the left panel, then **Generate image**.\n2. Under **General settings**, select a model. Continue with Composition Reference only if that model exposes the control.\n3. Enter a completed prompt. Expand **Composition**; in **Reference**, choose **Upload image**, select the source from the device, set **Strength** as needed, then choose **Generate**.\n4. Check every candidate against the source before you judge the finishes. Reject changed windows, doors, view, appliance/plumbing locations, island/vanity footprint, cabinet layout, room geometry, or camera position. Rerun from the untouched source, never from a drifted derivative.\n\n### Copyable prompt\n\n```\nCreate a clearly proposed [kitchen/bathroom] renovation concept from this exact composition-reference property photograph. Preserve the existing [camera view], crop, room proportions, walls, ceiling, [windows and exterior view], [door openings], [fixed appliances or plumbing], [island or vanity footprint], [major cabinet layout], and [floor layout]. Do not add, remove, move, enlarge, or reshape those fixed features.\n\nShow only these proposed changes: [finish/material list]. Use restrained realistic property-photography styling, believable material scale, ordinary reflections, and light consistent with the source. This is a proposed renovation concept, not a current-condition photograph, not a different room, and not a CGI render.\n```\n\n## Build the required Photoshop pair after Firefly\n\n1. Open Photoshop and choose **File > New**. Make a two-column review document: set the canvas to **twice the source image width** and the **same height** (or preserve that 2:1 two-column relationship if a different review size is required).\n2. Place or insert the **untouched source** into the left half at its native aspect ratio. Place the accepted **derivative** into the right half at the same displayed height and aspect ratio. Don't stretch, crop, or retouch either image to hide a mismatch.\n3. Select the **Type tool**. Add `Current condition` above or below the left image. Add `Concept visual. Proposed renovation.` above or below the right image. These must be Photoshop text layers, not Firefly-generated image text.\n4. Inspect at 100% and at full-pair view. Confirm that the source is readable, the labels are legible and unambiguous, and every hold point matches. Save the editable PSD, then use the shared safe delivery route.\n\n## Pass when\n\n- The concept is materially specific but clearly proposed.\n- The source is left; the derivative is right; both retain their aspect ratio.\n- The two required Type-tool labels are present.\n- No fixed room feature drifted; otherwise the candidate was rejected.\n\n---", "visual": {"before": "assets/willow/re-06-kitchen-source.png", "after": "assets/willow/re-06-kitchen-concept-tested.png", "label": "Synthetic proposed-renovation demonstration. Never current condition.", "status": "TESTED IN-HOUSE LOCAL ROUTE"}}, {"id": "lesson-09", "number": 9, "title": "Make an Exterior/Garden Concept", "body": "## Outcome\n\nCreate one clearly labelled curb-appeal proposal pair: an honest daylight exterior on the left and one proposed exterior/garden concept on the right.\n\n**Deliverable:** `property-exterior-before-proposed-garden-concept-review.[approved-format]` plus the source, derivative, and editable PSD.\n\n## Prepare\n\n1. Use one permitted daylight exterior source. Write hold points for the building footprint, roofline, chimney, windows/doors, driveway and path footprint, boundaries, neighbouring context, distant view, and camera framing.\n2. Limit the proposal to specific changes such as contained planting beds, lawn recovery, hedge maintenance, entrance pots, or an agreed surface treatment. Clearly exclude new buildings, gates, pools, extensions, larger plot claims, outdoor lighting, and altered context.\n3. Use this required derivative label: `Concept visual. Proposed renovation.`\n\n## Generate in Firefly\n\n1. Use the documented **Generate > Generate image** route. Select a model, then continue only if its image workflow exposes **Composition**.\n2. Enter a completed prompt. In **Composition**, choose **Reference > Upload image**; upload the daylight source, adjust **Strength** if needed, and choose **Generate**.\n3. Compare candidates with the source before you judge the landscaping. Reject a changed roofline, chimney, opening, driveway/path, lot edge, boundary, neighbour, street, background, or camera frame. Don't crop away the evidence. Rerun from the original source.\n\n### Copyable prompt\n\n```\nCreate a clearly proposed exterior and garden-improvement concept from this exact composition-reference daylight property photograph. Preserve exactly the [camera view], crop, [building footprint], [roofline and chimney], [windows and doors], [driveway and path], [boundaries], [neighbouring context], and [distant view]. Do not add, remove, relocate, widen, or redesign any building element, opening, lot edge, street feature, neighbouring property, or view.\n\nShow only these proposed improvements: [planting plan], [lawn treatment], [hedge/bed treatment], [entrance treatment], and [approved surface treatment]. Use realistic local scale, plausible spacing, restrained natural daylight, and property-photography styling. Do not add lights, new fixtures, buildings, gates, pools, extensions, or a different street/view. This is a proposed concept visual, not a current-condition photograph.\n```\n\n## Build the required Photoshop pair after Firefly\n\n1. In Photoshop choose **File > New** and create a two-column document: twice the daylight-source width and the same height, unless the client-approved review canvas requires a proportionate equivalent.\n2. Place or insert the **untouched daylight source** on the left and the accepted **garden concept** on the right. Keep both at equal displayed height and their original aspect ratios. Don't alter the source or crop away boundaries/context.\n3. With the **Type tool**, add `Current condition` to the left and `Concept visual. Proposed renovation.` to the right. Keep these as editable Photoshop text layers.\n4. Inspect the building massing, roofline, windows, driveway/path, boundaries, neighbour/context, and labels. Save the PSD, then use the shared safe delivery route.\n\n## Pass when\n\n- Only the agreed garden/surface proposal changes.\n- Architecture, lot, context, and framing hold against the source.\n- The source-left/concept-right Photoshop pair has both deterministic labels.\n- The result is framed as a proposal, not evidence of completed work.\n\n---\n", "visual": {"before": "assets/willow/re-08-exterior-source.png", "after": "assets/willow/re-08-garden-concept-tested.png", "label": "Synthetic proposed garden concept. Never current condition.", "status": "TESTED IN-HOUSE LOCAL ROUTE"}}, {"id": "lesson-10", "number": 10, "title": "Make One Golden-Hour or Twilight Derivative", "body": "## Outcome\n\nCreate **one** atmospheric campaign derivative, either golden hour **or** twilight, from an approved daylight exterior. Then make the required labelled comparison pair.\n\n**Deliverable:** `property-exterior-daylight-vs-atmospheric-derivative-review.[approved-format]` plus the unchanged daylight source, one derivative, and editable PSD.\n\n## Prepare\n\n1. Start only from an approved daylight exterior, not from an earlier generation that has drifted. Choose one treatment: `golden hour` **or** `civil twilight / blue hour`; don't request both at once.\n2. Hold these details: house massing, roofline, chimney, windows/doors, driveway/path, garden layout, boundaries, neighbouring context, distant view, camera frame, glazing, and surface dryness unless wetness already exists in the source.\n3. Use this required derivative label: `Atmospheric derivative. Time-of-day treatment.`\n\n## Generate in Firefly\n\n1. Use **Generate > Generate image**. Select a model. Continue with Composition Reference only if the selected model shows it.\n2. Enter a completed prompt. Expand **Composition**, choose **Reference > Upload image**, upload the approved daylight source, adjust **Strength** if needed, and choose **Generate**.\n3. Check the property facts first, then check for atmosphere problems. Reject any changed building feature, garden, boundary, reflection, view, or camera frame. Also reject invented fixture glow, window/interior glow that conflicts with the source, wet-looking surfaces, puddles, rain, or reflections from a different scene. The local synthetic twilight test found implied entrance light and wet-looking reflections. Treat these as clear reasons to reject the result, not as acceptable polish.\n\n### Copyable prompt\n\n```\nCreate a restrained [golden hour / civil twilight / blue hour] atmospheric derivative from this exact composition-reference daylight property photograph. Preserve exactly the [camera view], crop, [house massing], [roofline and chimney], [windows and doors], [driveway and path], [garden layout], [boundaries], [neighbouring context], and [distant view]. Do not add, remove, move, resize, redesign, or conceal any property feature or context.\n\nChange only the atmosphere to [natural time-of-day description]. Keep existing surfaces dry-looking unless the source is visibly wet. Preserve source glazing and reflections without introducing a different scene. Keep the source light state: [existing visible light state]. Do not add exterior fixtures, path lights, lanterns, window glow, interior glow, cars, people, water, rain, wet pavement, new planting, or decorative effects. This is an atmospheric derivative, not a current-condition photograph.\n```\n\n## Build the required Photoshop pair after Firefly\n\n1. In Photoshop choose **File > New**. Create a two-column document twice the source width and the same height, or a proportionate equivalent for the approved review canvas.\n2. Place or insert the **current daylight source** on the left and the selected **atmospheric derivative** on the right. Give both the same displayed height and don't change either aspect ratio. Don't crop out the driveway, boundaries, windows, or context.\n3. Select the **Type tool**. Add `Current daylight source` to the left and `Atmospheric derivative. Time-of-day treatment.` to the right as editable text layers.\n4. Inspect the pair at 100% and in full view. Check the labels, house facts, dry surfaces, light state, and glazing/reflections. Save the PSD, then use the shared safe delivery route.\n\n## Pass when\n\n- Exactly one derivative is delivered: golden-hour or twilight.\n- The source-left/derivative-right pair contains the required deterministic Type-tool labels.\n- Architecture, context, surfaces, and reflections match the daylight source.\n- There are no invented lights, glows, wet surfaces, landscaping changes, or altered view.\n- The file is positioned only as a permitted atmospheric campaign option, never as a factual capture.", "visual": {"before": "assets/willow/re-08-exterior-source.png", "after": "assets/willow/re-08-twilight-provisional.png", "label": "Synthetic provisional atmospheric derivative. Inspect for invented lights and changed reflections.", "status": "TESTED IN-HOUSE: PROVISIONAL"}}, {"id": "lesson-11", "number": 11, "title": "Build a Coherent Three-Room Property Set", "body": "**Tool status:** Adobe Photoshop desktop, selected Generative Fill: **RESEARCH-VERIFIED** on 1 September 2026. This route wasn't executed in-house. Adobe documents selection-bounded, non-destructive Generative Fill and choosing a generated variation.\n\n### What you’re making\n\nThree client-review room images from one property in a useful viewing order: living room, kitchen/dining, then bedroom. The first image is the anchor. The other two only need enough local work to feel like they belong in the same home.\n\n### What you need\n\n1. `willow-living-approved.jpg`, `willow-kitchen-source.jpg`, and `willow-bedroom-source.jpg`, all from one property.\n2. Permission to edit them.\n3. An untouched copy of each source.\n4. A final use that requires virtual-staging disclosure, if either changed room is staged.\n\n### The direction strip\n\nBuild this at the top of the contact sheet. It takes the place of a separate mood board or direction card.\n\n```\nPALETTE: warm off-white / oatmeal / muted olive\nTIMBER + METAL: pale oak / aged brass\nTEXTILE: matte linen and cotton, no gloss\nLIGHT: soft natural daylight\n```\n\nUse only choices that you can see in the anchor room or that are already approved for this property. The strip is a constraint, not a new deliverable.\n\n### Do this\n\n1. Put the living room, kitchen, and bedroom side by side at the same visual size in one simple contact sheet. Keep this order: shared room → kitchen/dining → private room.\n2. Read the direction strip. Then name one loose item in the kitchen and one in the bedroom that would help those rooms feel like they belong. Examples: dining chairs, a pendant shade, bedding, cushions, a bedside lamp, or a rug.\n3. In Photoshop, choose **File > Open** and open the kitchen source. Use a selection tool around only the loose item you chose. Keep cabinet lines, counter edges, doors, windows, floors, and other fixed features out of the selection.\n4. Choose **Generative Fill**. Enter the kitchen prompt, choose **Generate**, then choose a variation in **Properties**. Reject a variation if it changes a fixed feature, camera viewpoint, usable route, or the visible property beyond glazing.\n5. Repeat the same route for one loose bedroom item. Keep the bed, wardrobe clearance, door swing, windows, flooring, and room proportions intact.\n6. Replace the kitchen and bedroom images on the contact sheet with the accepted versions. Look at all three together. If one room conflicts with the strip, correct or undo one local item. Don't restyle the whole room.\n7. Add deterministic text on the contact sheet with the application’s text tool: the property name, the four-line direction strip, and `VIRTUALLY STAGED` beneath any staged room. Don't ask an image model to generate this text.\n\n### Copy this\n\n**Kitchen local edit**\n\n```\nReplace only the selected [ITEM] with [MATERIAL, COLOUR, AND SCALE] matching the approved property direction.\n```\n\n**Bedroom local edit**\n\n```\nReplace only the selected [ITEM] with [MATERIAL, COLOUR, AND SCALE] matching the approved property direction.\n```\n\nThe image already provides the room, composition, lighting, and fixed features. Keep the prompt local.\n\n**Willow House example**\n\n```\nReplace only the selected dining chairs with compact pale-oak chairs with oatmeal linen seats matching the approved property direction.\n```\n\n```\nReplace only the selected bedding and cushions with warm white cotton, one oatmeal linen throw, and two muted olive linen cushions matching the approved property direction.\n```\n\n### Reject or keep\n\nKeep the set when it feels like one property without making every room identical. Reject a variation if furniture blocks a door, wardrobe, island, or route; a cabinet/window/floor line moves; the room turns into a different style; or the garden/view changes.\n\n### Deliver\n\nSave the three final room images and one contact sheet named `willow-three-room-set.jpg`. Use **File > Save As** for editable working files. For the contact sheet, use **File > Export > Quick Export as [available image format]**, then choose the destination and filename if prompted. Use the client-approved format and settings available in your release.\n\n**Your homework:** Make the three-room set. Start with one anchor room, and make no more than one local coherence edit in each of the other rooms. If neither edit improves the set, keep the sources and move on.\n\nIn Lesson 12, the living-room anchor becomes one calm camera move.\n\n---", "visual": {"before": "assets/willow/re-01-living-staged-tested.png", "after": "assets/willow/re-02-restyle-tested.png", "label": "Use an approved room as an anchor, then make only local coherence edits.", "status": "RESEARCH-VERIFIED TOOL ROUTE"}}, {"id": "lesson-12", "number": 12, "title": "Animate One Still With a Calm Push-In", "body": "**Tool status:** Runway Gen-4.5 Image-to-Video: **RESEARCH-VERIFIED** on 1 September 2026. Official Runway documentation confirms image-plus-text generation and prompts that describe motion. This route wasn't executed in-house. Your account, plan, and current interface decide which settings are shown.\n\n### What you’re making\n\nOne short, approved push-in from the living-room anchor. It's an atmospheric property shot, not a walkthrough.\n\n### What you need\n\n1. `willow-living-approved.jpg` from Lesson 11.\n2. The untouched original beside it.\n3. A clear focal point already visible in the image, such as the fireplace or window seat.\n\n### Do this\n\n1. Open Runway **Apps View** and search for **Gen-4.5**, or use the **Tool Mode** model selector with **Video** selected.\n2. Drag the approved image into the prompt window.\n3. Review the settings your account shows. If duration or aspect ratio controls are available, choose a short test and the intended delivery shape. Don't assume a default, a plan entitlement, a resolution, or a fixed duration control.\n4. Paste one motion-only prompt. Choose **Generate**. After it finishes, use the available download control to save the candidate.\n5. Compare the clip with the still. Reject it if windows, walls, floor/wall joins, furniture count, reflections, or the view beyond glass visibly drift. If it fails, make the move shorter or go back to the still.\n\n### Copy this motion prompt\n\n```\nThe camera makes a very slow, subtle push-in toward [FOCAL POINT].\n```\n\n**Willow House example**\n\n```\nThe camera makes a very slow, subtle push-in toward the fireplace.\n```\n\nDon't describe the room again. Runway’s image-to-video guidance says the input image provides composition, subject matter, lighting, and style. The prompt supplies motion.\n\n### The one useful correction\n\nIf the push-in bends lines or creates unstable detail, regenerate with less travel:\n\n```\nThe camera makes an almost imperceptible slow push-in toward [FOCAL POINT].\n```\n\nIf that still fails, use the approved still in the edit. A still is better than a moving room that gives a false impression.\n\n### Deliver\n\nSave the accepted clip as `willow-living-pushin-v01.mp4` with its source still. Keep only the accepted candidate and any result you need to compare before choosing.\n\n**Your homework:** Generate two short push-in candidates from the same approved still. Keep one only when the move is calm and the property details stay believable.\n\nIn Lesson 13, you’ll add one different move instead of repeating the push-in.\n\n---", "visual": {"before": "assets/willow/re-01-living-staged-tested.png", "after": "assets/willow/re-01-living-staged-tested.png", "label": "Use an approved still as the first frame. Video is research-verified, not tested in-house.", "status": "RESEARCH-VERIFIED"}}, {"id": "lesson-13", "number": 13, "title": "Make a Second Useful Move", "body": "**Tool status:** Runway Gen-4.5 Image-to-Video: **RESEARCH-VERIFIED** on 1 September 2026. This route wasn't tested in-house. Runway documents image input, clear direct prompts, settings review, generation, and download. Available settings vary by account and release.\n\n### What you’re making\n\nOne second shot that earns its place beside the push-in: either a lateral kitchen slide or a restrained exterior approach. Pick one. Don't combine moves.\n\n### What you need\n\n1. `willow-kitchen-approved.jpg` or `willow-exterior-approved.jpg` from the same property.\n2. The accepted Lesson 12 push-in as the first shot in your eventual sequence.\n3. One movement choice: lateral slide or straight approach.\n\n### Do this\n\n1. Open Gen-4.5 as in Lesson 12. Drag the approved second still into the prompt window.\n2. Review only the settings your current account shows. If a short duration or delivery aspect ratio is available, set it on purpose. Otherwise, use the settings that are available instead of claiming you have a control you can't see.\n3. Use one motion-only prompt and choose **Generate**. Download the candidate with the available output control.\n4. For a kitchen, compare cabinet edges, island corners, stools, pendant lights, and the window view with the source. For an exterior, compare the roofline, windows, driveway, boundary, planting, and neighbouring context.\n5. Reject the clip if it changes property facts, adds travel that the still can't support, or becomes a different move. Reduce the move once. If the retry fails, use a clean cut to the push-in instead.\n\n### Copy one motion prompt\n\n**Interior**\n\n```\nThe camera makes a slow lateral slide [LEFT OR RIGHT] across the kitchen.\n```\n\n**Exterior**\n\n```\nThe camera makes a gentle straight approach toward the front elevation.\n```\n\n**Willow House example**\n\n```\nThe camera makes a slow lateral slide right across the kitchen.\n```\n\n### Deliver\n\nSave the accepted clip as `willow-kitchen-slide-v01.mp4` or `willow-exterior-approach-v01.mp4`, alongside the still used to make it.\n\n**Your homework:** Create one second move only. The two clips should give the edit two different jobs: the push-in holds attention; the slide or approach changes perspective.\n\nIn Lesson 14, you’ll make a clearly labelled staged reveal. A continuation is optional, and it only earns its place if the comparison passes.\n\n---", "visual": {"before": "assets/willow/re-06-kitchen-source.png", "after": "assets/willow/re-06-kitchen-source.png", "label": "Second motion move uses an approved still. Video is research-verified, not tested in-house.", "status": "RESEARCH-VERIFIED"}}, {"id": "lesson-14", "number": 14, "title": "Make a Staged Reveal, Then Optionally Continue a Shot", "body": "**Tool status:** Adobe Firefly Generate Video first/last frames: **RESEARCH-VERIFIED** on 1 September 2026. Adobe documents first and last images as guiding keyframes, not exact-fidelity guarantees. Runway last-frame chaining is also **RESEARCH-VERIFIED** as a documented workflow, not an in-house-tested continuity feature.\n\n### What you’re making\n\nA short conceptual empty-to-staged reveal from a matching pair. You can also make one continuation from a stable final frame, but only when its first generated frame passes a direct comparison.\n\n### What you need\n\n1. `willow-bedroom-empty.jpg` and `willow-bedroom-virtually-staged.jpg`, matched in viewpoint, crop, room boundaries, doors, windows, and flooring.\n2. The disclosure copy: `CONCEPTUAL VIRTUAL-STAGING REVEAL: FURNITURE AND DECOR ARE ILLUSTRATIVE.`\n3. For optional chaining, one accepted clip from Lessons 12 or 13.\n\n### Make the reveal in Firefly\n\n1. Open Firefly’s image-guided video workflow. Under **Frame**, choose **First** and upload the empty-room image. Choose **Last** and upload the approved staged image.\n2. Use the frame pair as the planned start and end. With a first frame, **Shot size**, **Camera angle**, **Style**, **Composition reference**, and **Transparent background** are unavailable. Adding an end frame also turns **Motion** off. Don't look for or promise those controls in this workflow.\n3. Enter the motion prompt and choose **Generate**. The frame images guide the start and end, but they don't guarantee exact matching or accurate intermediate frames.\n4. Compare the generated opening with the empty source and its ending with the staged approval. Inspect the in-between frames. Reject it if walls, windows, flooring, doors, or fixed fixtures drift, or if the transition suggests construction instead of illustrative furnishing.\n\n### Copy this motion prompt\n\n```\nLocked-camera reveal: furniture and decor emerge gradually, then settle into the final arrangement.\n```\n\n**Willow House example**\n\n```\nLocked-camera reveal: bedroom furniture and decor emerge gradually, then settle into the final arrangement.\n```\n\n### Add the disclosure in Premiere\n\n1. Import the accepted reveal into Premiere. Drag the clip from the **Project** panel to the **New Item** icon to create a sequence, or drag it into an existing sequence.\n2. Select the **Type** tool, click the **Program Monitor**, and type: `CONCEPTUAL VIRTUAL-STAGING REVEAL: FURNITURE AND DECOR ARE ILLUSTRATIVE.`\n3. Right-click the title in the Program Monitor and choose **Edit Properties**. Set readable type, contrast, and position so the label doesn't cover important room detail. Extend the graphic in the timeline for the whole reveal.\n4. Review the clip and label together at normal playback. Export from **File > Export > Media**. Choose the available **Format** and **Preset**, confirm the output location, then choose **Export** or **Send to Adobe Media Encoder**. Use only the client/destination-approved options available in your version.\n\n### Optional: continue a stable shot\n\nUse this only when an accepted shot needs one extra beat. It isn't a way to force a longer tour.\n\n1. In Premiere, import the approved first clip and put it on a sequence. Park the playhead on its last stable frame.\n2. For a PNG still, use **File > Export > Media**, select an available still-image format, and make sure **Export As Sequence** isn't selected. Export one frame. Adobe documents this route for high-quality still formats. Save it as `willow-shot-one-last-stable-frame.png`.\n3. In Runway, use the saved frame as the image input. Review the settings shown by the current account, then generate with one motion-only continuation prompt.\n4. Compare the first generated frame side by side with `willow-shot-one-last-stable-frame.png`. Reject the continuation if there's a visible mismatch in geometry, exposure, object count, reflections, or framing. Don't call the input frame an exact start-frame lock.\n5. If it passes, put both clips on the Premiere timeline. Zoom in at the seam, trim the first clip to the extracted stable frame, then remove one copy of the shared frame. Play through the seam at normal speed and frame by frame. If there's a visible jump, reject the chain and use a clean cut.\n\n**Copy this optional continuation motion prompt**\n\n```\nThe camera continues with an almost imperceptible slow slide right.\n```\n\n**Willow House example**\n\n```\nThe camera continues with an almost imperceptible slow slide right.\n```\n\n### Deliver\n\nRequired: `willow-bedroom-conceptual-staging-reveal-v01.mp4`, with its source/staged pair and visible deterministic disclosure.\n\nOptional: `willow-two-shot-continuation-v01.mp4` only when the side-by-side first-frame comparison and seam review pass. If they don't pass, keep the reveal and use a clean cut in the later film edit.\n\n**Your homework:** Make one labelled reveal. Try the continuation only from a stable last frame, compare it instead of trusting it, and reject it when the comparison or seam is visibly wrong.", "visual": {"before": "assets/willow/re-05-empty-bedroom-source.png", "after": "assets/willow/re-05-bedroom-staged-tested.png", "label": "A source-to-staged reveal is illustrative, not a factual renovation record.", "status": "RESEARCH-VERIFIED VIDEO ROUTE"}}, {"id": "lesson-15", "number": 15, "title": "Cut a 15-second property film", "body": "## 1. Status / tool panel\n\n**Primary tool:** Adobe Premiere. **Status:** RESEARCH-VERIFIED on 1 September 2026. This lesson uses the documented Project-panel import, timeline-sequence, and `File > Export > Media` routes. It doesn't claim an authenticated in-house Premiere edit or export test.\n\n## 2. What you’re making\n\nOne **15-second horizontal review film** from four or five approved property clips. The usable selects live in the timeline edit itself: each shot is trimmed to its reviewed, stable part and appears in the final order. There is no separate selection-note lesson or required selection document.\n\n## 3. When you’d use this\n\nUse this as the short master edit a client can review before asking for a destination-specific version. It's a short marketing film, not a factual walkthrough, survey, or proof of room dimensions. Use only clips that have already passed fixed-feature review. Go back to an approved still or live footage when a shot changes a material property fact.\n\n## 4. What you need\n\n- Four or five approved clips from Lessons 12–14, each with its original still/source retained in the project folder.\n- Verified title copy: `Willow House` and one factual, approved differentiator, such as `Garden-facing living room`.\n- Any required representation copy for included material, for example: `Conceptual virtual-staging reveal: furniture and decor shown are illustrative.`\n- A client-approved destination brief, or the course default: a horizontal review film.\n- `Willow-House/07-film/lesson-15/` with `01-source-approved/`, `02-premiere-project/`, `03-review-export/`, and `04-rejected/`.\n\nDon't import a clip just because it looks attractive. It must be an approved clip with no unresolved geometry, fixture, furnishing, reflection, or view error.\n\n## 5. Use this tool\n\nUse **Adobe Premiere**. If the **Project** panel or **Timeline** isn't visible, choose **Window > Project** or **Window > Timeline**. Import media before making the sequence. To create a sequence from a clip, drag that clip from the Project panel to the **New Item** icon. To add each remaining clip, drag it from the Project panel into the existing sequence on the timeline.\n\nFor text, use this documented route only when the controls are present in the learner’s release: select the **Type tool**, click in the **Program Monitor**, and type the approved title or label. If the release shows **Properties** or **Essential Graphics** controls for the selected graphic, use the available controls to make the text readable and place it away from important property detail. Don't put required text inside a generative prompt or a generated image.\n\n## 6. Do this\n\n1. Open Premiere. If needed, choose **Window > Project** and **Window > Timeline** so both panels are available.\n2. Import the four or five approved clips into the Project panel. Keep their original source files in `01-source-approved/`; importing normally links to media unless ingest was deliberately enabled.\n3. Choose the strongest approved exterior, entry, or main-room clip as the opening clip. Drag it from the Project panel to the **New Item** icon to create the sequence.\n4. Drag the remaining approved clips from the Project panel to the timeline in this order: opening/context, entry or transition, main room, differentiator, then closing. If one category is unavailable, use the next most useful approved shot instead of generating a filler shot.\n5. Build the selects **in the timeline**: trim the beginning and end of every timeline clip until only its stable, useful beat remains. Keep a shot only when it has a clear purpose in the 15-second order. Don't make a separate selects list; the trimmed timeline is the record of the chosen material.\n6. Play the complete sequence. Tighten or remove clips until it runs for 15 seconds and the order reads as one property, not a random montage. Don't use a transition to conceal a bent line, changed fixture, flicker, or jump.\n7. Add the approved title and factual differentiator using the conditional Type-tool/Program-Monitor route above. If a virtually staged, conceptual, or atmospheric shot appears, add its approved representation label as deterministic text for the full shot or required portion. Extend the graphic on the timeline so the label stays visible for the required duration.\n8. Review at normal playback, then review muted. Confirm that the title and labels stay readable, don't cover critical property detail, and don't disappear at an edit. Check each selected clip again for walls, windows, cabinetry, floor/wall joins, furniture, reflections, and exterior context.\n9. Save the editable Premiere project in `02-premiere-project/` as `WillowHouse_15s_review_v01.prproj`.\n10. With the timeline selected, choose **File > Export > Media**. Select the **Format** and **Preset** available in the current release that match the client-approved delivery specification; confirm the settings and output location. Choose **Export**, or choose **Send to Adobe Media Encoder** if that's the required delivery route. Don't assume a universal codec or preset.\n\n## 7. Copy this edit brief\n\n```\n15-SECOND PROPERTY FILM\nPurpose: [CLIENT REVIEW / APPROVED DESTINATION]\nOrientation: horizontal review master\nOrder: [OPENING/CONTEXT] → [ENTRY OR TRANSITION] → [MAIN ROOM] → [DIFFERENTIATOR] → [CLOSING]\nTitle: [APPROVED PROPERTY NAME]\nFactual line: [VERIFIED FACT ONLY]\nRequired representation label: [NONE / EXACT APPROVED LABEL]\nSelect rule: trim every timeline clip to its stable, useful beat; reject any clip with changed fixed features, flicker, or misleading geometry.\n```\n\n**Variables:** `[CLIENT REVIEW / APPROVED DESTINATION]`, each shot role, `[APPROVED PROPERTY NAME]`, `[VERIFIED FACT ONLY]`, and `[NONE / EXACT APPROVED LABEL]` must come from approved client facts and reviewed media, not generated copy.\n\n## 8. Example: Willow House\n\n```\n15-SECOND PROPERTY FILM\nPurpose: client review\nOrientation: horizontal review master\nOrder: front elevation approach → entry detail → garden-facing living-room push-in → kitchen slide → garden-facing living room closing frame\nTitle: Willow House\nFactual line: Garden-facing living room\nRequired representation label: Conceptual virtual-staging reveal: furniture and decor shown are illustrative. [only if that reveal is used]\nSelect rule: each timeline clip ends at its last stable frame; reject any change to the brick facade, windows, fireplace, cabinetry, pale-oak floor, furniture identity, or garden view.\n```\n\n## 9. What good looks like\n\n- The edit is 15 seconds and contains four or five deliberately ordered, approved clips.\n- The selects are visible as trimmed clips in the timeline; no separate selection-note asset is needed.\n- Every shot has a purpose: context, arrival, main room, differentiator, or closing.\n- Titles and required labels are deterministic Premiere graphics, readable in playback, and clear of important detail.\n- No clip implies a continuous factual walkthrough or hides visual drift with a transition.\n\n## 10. If it goes wrong\n\n- **The film feels rushed or random.** Remove the weakest timeline clip and lengthen the most informative stable beat. Don't add unreviewed filler.\n- **A wall, window, cabinet, fixture, reflection, or view changes.** Trim the clip to end before the error. If no stable useful beat remains, remove it and use an approved still or another approved clip.\n- **A staged/concept/atmospheric shot could be mistaken for current condition.** Add the exact approved representation label with the Type tool, or remove the shot until correct label copy is available.\n- **Text is unreadable or covers the property.** Select the graphic and, if available, adjust it in Properties or Essential Graphics; otherwise retype/reposition it with the Type tool in the Program Monitor. Recheck at normal playback and muted playback.\n- **The export options don't show the requested format or preset.** Stop and confirm the client/destination delivery requirement. Use only an available, approved Format/Preset combination and record the actual choice in the delivery note; don't substitute an assumed codec or preset.\n\n## 11. Export\n\nExport the reviewed horizontal film to `03-review-export/` as `WillowHouse_15s_horizontal_review_v01.[approved-extension]`. Save the editable project in `02-premiere-project/` and preserve the approved source clips in `01-source-approved/`.\n\nRecord beside the export:\n\n```\nFILE: WillowHouse_15s_horizontal_review_v01.[approved-extension]\nUSE: client review film\nORIENTATION: horizontal\nDURATION: 00:15\nFORMAT/PRESET: [actual Premiere choices]\nREPRESENTATION: [current-condition clips; list any labelled exceptions]\n```\n\n## 12. Your turn\n\nBuild one 15-second horizontal review film from four or five approved clips. Let the trimmed timeline contain the selects; don't create a separate selects lesson, note, or spreadsheet.\n\n## 13. Pass when\n\n- [ ] A 15-second horizontal review film exists with four or five approved clips.\n- [ ] Every selected beat is visibly trimmed in the Premiere timeline and passes fixed-feature inspection.\n- [ ] The title, factual line, and any required representation label are deterministic, readable text graphics.\n- [ ] The editable project, approved sources, and exported review film are retained together.\n- [ ] The recorded export uses the actual approved Format/Preset available in Premiere, not a universal assumed setting.\n\n---", "visual": {"before": "assets/willow/re-08-exterior-source.png", "after": "assets/willow/re-01-living-staged-tested.png", "label": "Your edit uses only approved shots. This still pair represents two of the shots to select.", "status": "RESEARCH-VERIFIED"}}, {"id": "lesson-16", "number": 16, "title": "Make the one version the client needs", "body": "## 1. Status / tool panel\n\n**Primary tool:** Adobe Premiere. **Status:** RESEARCH-VERIFIED on 1 September 2026. This lesson follows the documented routes for the existing sequence timeline and `File > Export > Media`. No authenticated in-house Premiere edit or export test is claimed.\n\n## 2. What you’re making\n\nOne client-needed version of the approved 15-second film. **Default course version: a truthful 9:16 vertical cut.** Create a 30-second extension only when the client needs a longer horizontal or vertical film and you have enough additional approved, stable shots to support it. Don’t make every possible aspect ratio by default.\n\n## 3. When you’d use this\n\nUse the vertical default when the client needs a social-first version and the property still stays truthful after reframing. Use the optional 30-second extension for a longer landing-page, presentation, or social placement only when the client asks for it. If the vertical crop would remove an important room feature, label, or context, don’t force it. Deliver the horizontal master or request alternate approved media.\n\n## 4. What you need\n\n- `WillowHouse_15s_horizontal_review_v01` and its editable Premiere project from Lesson 15.\n- The client’s destination, required orientation, duration, and any approved representation/disclosure copy.\n- For the optional extension only: two to four additional approved clips or stable extended beats; no unreviewed generated filler.\n- `Willow-House/07-film/lesson-16/` with `01-lesson-15-master/`, `02-approved-extra-shots/`, `03-premiere-project/`, `04-client-version/`, and `05-rejected/`.\n\n## 5. Use this tool\n\nOpen the Lesson 15 Premiere project and use its existing sequence. Add approved media by dragging a Project-panel clip into the existing sequence on the timeline. For labels, use the same conditional documented route as Lesson 15: select the **Type tool**, click the **Program Monitor**, type approved copy, then use available **Prop
