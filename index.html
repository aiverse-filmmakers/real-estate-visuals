nce-led route available in your account.\n2. Upload the references in the exact order stated in Before you start.\n3. Choose the named model only if it is currently listed.\n4. Preserve source aspect ratio and start with the shortest practical duration.\n5. Paste the prompt, generate, then check every room, transition and fixed feature.\n\n## Copy this prompt\n```\nUse these four references in order: messy room, clean empty room, renovated room, furnished finished room. Create a clear multi-stage property transformation. Keep the camera viewpoint and architecture stable through every stage. Let each intended change happen in order. Do not invent rooms, bend walls or morph objects. Premium property-commercial realism, satisfying transformation hyperlapse, elegant controlled motion.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nStages happen in the stated order. No stage changes the viewpoint, walls, windows or room size.\n\n## Save this\nDownload the approved result as `26-full-transform.mp4`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nFull property transformation content.\n\n## Try this next\nNow create a day-to-golden-hour-to-night change.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.","visual":null,"status":"researched"},{"id":"lesson-27","number":27,"title":"Make day become golden hour, then night","module":"transform","body":"## What you can do\nCreate a time-of-day change while the exact house stays fixed.\n\n## Why this is useful\nA single exterior can produce several campaign moments and a strong social reveal.\n\n## Practice files\nDownload the practice pack and use `sources/exterior.png` then `endpoints/twilight-exterior.png`.\n\n## Before you start\nDaytime, golden-hour and twilight versions of the same exterior.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Kling 3.0**\n\n## Why this model\nKling video routes are listed in Magnific’s current model catalogue.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose an image-to-video route that accepts first and last frames.\n2. Put the original image in the first-frame input and the approved transformation image in the last-frame input.\n3. Choose the named model only if it is currently listed.\n4. Set a short duration and preserve the source aspect ratio.\n5. Paste the motion prompt, generate, then reject any clip with warped architecture or morphing objects.\n\n## Copy this prompt\n```\nUse the daytime exterior as the first frame and the twilight exterior as the last frame. Create a smooth natural passage of time through golden hour into elegant blue hour. Keep the building, roof, windows, doors, garden boundaries and camera position completely fixed. Interior lights gradually become visible. Premium architectural property commercial, realistic sky and reflections, stable geometry.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nThe house stays fixed from day to twilight. Only sky, reflections and motivated lights change.\n\n## Save this\nDownload the approved result as `27-day-to-night.mp4`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nDay-to-night property videos.\n\n## Try this next\nNow animate a floor plan into a 3D-looking view.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.","visual":null,"status":"researched"},{"id":"lesson-28","number":28,"title":"Make a 2D floor plan become a 3D dollhouse","module":"transform","body":"## What you can do\nTurn a flat plan into a clear animated 3D-looking property visual.\n\n## Why this is useful\nThis can help viewers understand a property before they visit it.\n\n## Practice files\nDownload the practice pack and use `sources/floor-plan.png` then `endpoints/floor-plan-dollhouse.png`.\n\n## Before you start\nA 2D floor plan and a matching 3D-looking reference.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Wan 3.0**\n\n## Why this model\nWan 3.0 is listed in Magnific’s current video catalogue and supports reference-led video routes.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose an image-to-video route that accepts first and last frames.\n2. Put the original image in the first-frame input and the approved transformation image in the last-frame input.\n3. Choose the named model only if it is currently listed.\n4. Set a short duration and preserve the source aspect ratio.\n5. Paste the motion prompt, generate, then reject any clip with warped architecture or morphing objects.\n\n## Copy this prompt\n```\nUse the 2D floor plan as the first frame and the 3D dollhouse image as the last frame. Transform the flat plan progressively into the three-dimensional visual. Let walls rise naturally from the plan, floors gain depth and furniture appear in final locations. Maintain the overall layout. Smooth controlled virtual camera, premium architectural visualisation, realistic materials.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nWalls rise from the same plan and end at the supplied dollhouse. Room order and openings remain.\n\n## Save this\nDownload the approved result as `28-plan-to-dollhouse.mp4`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nFloor-plan animation.\n\n## Try this next\nNow experiment with a floor-plan fly-in.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.\n\n> **Note:** Mark this experimental until the exact route is run and checked.\n","visual":null,"status":"researched"},{"id":"lesson-29","number":29,"title":"Fly from the floor plan into the property","module":"transform","body":"## What you can do\nCreate an advanced transition from a 3D property view into a full-size room.\n\n## Why this is useful\nThis is a powerful concept for developers, but it asks the model to invent more space.\n\n## Practice files\nDownload the practice pack and use `endpoints/floor-plan-dollhouse.png` then `endpoints/staged-living.png`.\n\n## Before you start\nA 3D-looking dollhouse and a matching destination-room reference.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Wan 3.0**\n\n## Why this model\nThe current Magnific video catalogue lists Wan 3.0 and other reference-led video models.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose the multi-reference or reference-led route available in your account.\n2. Upload the references in the exact order stated in Before you start.\n3. Choose the named model only if it is currently listed.\n4. Preserve source aspect ratio and start with the shortest practical duration.\n5. Paste the prompt, generate, then check every room, transition and fixed feature.\n\n## Copy this prompt\n```\nBegin with the supplied 3D dollhouse view. Move the camera smoothly toward the living room shown in the dollhouse. Continue toward that room until the view transitions into the supplied full-size living-room reference. Keep the movement controlled. Do not spin the camera. Do not create impossible walls or rooms. High-end architectural visualisation transitioning into premium property photography.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nThe destination room matches the supplied reference. Reject invented corridors, spins or impossible walls.\n\n## Save this\nDownload the approved result as `29-floor-plan-fly-in.mp4`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nExperimental floor-plan fly-in concepts.\n\n## Try this next\nNow make a virtual walkthrough from several property photos.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.\n\n> **Note:** If this hallucinates, stop and make separate strong shots. Do not force one impossible clip.\n","visual":null,"status":"researched"},{"id":"lesson-30","number":30,"title":"Create a virtual walkthrough, then combine your clips","module":"final","body":"## What you can do\nTurn several property photos into a short connected walkthrough concept, then optionally place the approved clips together.\n\n## Why this is useful\nThis is the final service idea: images become a complete AI property campaign.\n\n## Practice files\nDownload the practice pack and use the five Lesson 21 files plus `sources/bathroom.png`.\n\n## Before you start\nExterior, hallway, living room, kitchen, bedroom and garden references.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Gemini Omni**\n\n## Why this model\nMagnific’s current video generator lists Gemini Omni for generating, animating and editing from references.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose the multi-reference or reference-led route available in your account.\n2. Upload the references in the exact order stated in Before you start.\n3. Choose the named model only if it is currently listed.\n4. Preserve source aspect ratio and start with the shortest practical duration.\n5. Paste the prompt, generate, then check every room, transition and fixed feature.\n\n## Copy this prompt\n```\nCreate an elegant luxury-property walkthrough from the supplied property images. Move naturally through the spaces while keeping the design and architecture consistent with the references. Keep movement slow, smooth and physically plausible. Do not invent dramatic architecture. Prioritise the spaces shown. If one continuous walkthrough becomes unstable, create separate strong shots instead. Premium property commercial, realistic wide-lens character, beautiful natural light.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nEvery clip matches one supplied room. The final sequence contains the promised image set, six approved clips and clear concept disclosure.\n\n## Save this\nDownload the approved result as `30-property-campaign.zip`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## Build the final campaign\n1. Deliver six corrected listing images: exterior, living room, kitchen, bedroom, bathroom and garden.\n2. Deliver six approved AI clips made from those exact images.\n3. Keep each clip separate so the client can review it.\n4. Add a one-page note that says which visuals are AI staging, renovation concepts or atmospheric versions.\n5. Put the final images, clips and note into one folder named `30-property-campaign`.\n\n## Client revision boundary\nInclude one correction round for factual problems such as changed windows, doors, layout or furniture identity. A new style direction or a different property is a new version, not a correction.\n\n## What you can sell\nAn AI property campaign containing six listing images, six short clips, one optional reel and a clear concept-disclosure note.\n\n## Try this next\nOptional: open CapCut, start a new project, add the six approved clips in property order, trim away failed frames, keep each shot short and export one 1080p MP4. The separate approved clips remain the main deliverables.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.\n\n> **Note:** This is the only optional editing step in the course. The main skill is AI image and AI video generation.\n","visual":null,"status":"researched"}]}</script><script>
const DATA=JSON.parse(document.querySelector('#course-data').textContent),lessons=DATA.lessons,byId=Object.fromEntries(lessons.map(x=>[x.id,x])),byNum=Object.fromEntries(lessons.map(x=>[x.number,x])),app=document.querySelector('#app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function md(src){let out=[],list=null,inCode=false,code=[];function close(){if(list){out.push('</'+list+'>');list=null}}function flushCode(){if(code.length){let raw=code.join('\n');out.push('<div class="promptbox"><button class="copy" data-copy="'+encodeURIComponent(raw)+'">Copy prompt</button><pre>'+esc(raw)+'</pre></div>');code=[]}}for(const raw of src.split('\n')){let l=raw.trim();if(l.startsWith('```')){if(inCode){inCode=false;flushCode()}else{close();inCode=true;code=[]}continue}if(inCode){code.push(raw);continue}if(!l){close();continue}if(/^##\s+/.test(l)){close();out.push('<h2>'+inline(l.slice(3))+'</h2>');continue}if(/^>\s+/.test(l)){close();out.push('<blockquote>'+inline(l.slice(2))+'</blockquote>');continue}if(/^\d+\.\s+/.test(l)){if(list!=='ol'){close();list='ol';out.push('<ol>')}out.push('<li>'+inline(l.replace(/^\d+\.\s+/,''))+'</li>');continue}if(l.startsWith('- ')){if(list!=='ul'){close();list='ul';out.push('<ul>')}out.push('<li>'+inline(l.slice(2))+'</li>');continue}close();out.push('<p>'+inline(l)+'</p>')}close();if(inCode)flushCode();return out.join('')}
function nav(){let el=document.querySelector('#nav');el.innerHTML='<a class="nav-start" href="#tools"><b>START</b><span>Tools first</span></a>'+DATA.modules.map(m=>'<details class="nav-group" data-module="'+m.id+'"><summary><span class="nav-module-copy"><b>'+m.number+' · '+esc(m.title)+'</b><span>'+m.lessons.length+' lesson'+(m.lessons.length===1?'':'s')+'</span></span></summary><div class="nav-lessons"><a class="nav-overview" href="#module/'+m.id+'">Module overview</a>'+m.lessons.map(n=>{let l=byNum[n];return '<a class="nav-lesson" data-lesson="'+l.id+'" href="#lesson/'+l.id+'"><span class="nav-lesson-no">'+String(l.number).padStart(2,'0')+'</span><span class="nav-lesson-title">'+esc(l.title)+'</span></a>'}).join('')+'</div></details>').join('');el.querySelectorAll('.nav-group').forEach(d=>d.querySelector('summary').addEventListener('click',()=>{if(!d.open)el.querySelectorAll('.nav-group').forEach(other=>{if(other!==d)other.open=false})}));let rail=document.querySelector('.rail'),toggle=document.querySelector('#mobile-nav-toggle');toggle.onclick=()=>{let open=rail.classList.toggle('menu-open');toggle.setAttribute('aria-expanded',open)};el.addEventListener('click',e=>{if(e.target.closest('a')&&innerWidth<=850){rail.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false')}})}
function syncNav(h){let el=document.querySelector('#nav'),rail=document.querySelector('.rail'),current=document.querySelector('#mobile-nav-current'),active=[...el.querySelectorAll('a')].find(a=>a.getAttribute('href')==='#'+h),groupId=null,label='Choose a section';el.querySelectorAll('a').forEach(a=>{a.classList.remove('active');a.removeAttribute('aria-current')});el.querySelectorAll('.nav-group summary').forEach(s=>s.classList.remove('current'));if(h==='home')label='Course home';else if(h==='tools')label='Start · Tools';else if(h==='curriculum')label='All lessons';else if(h.startsWith('module/')){groupId=h.split('/')[1];let m=DATA.modules.find(x=>x.id===groupId);if(m)label=m.number+' · '+m.title}else if(h.startsWith('lesson/')){let l=byId[h.split('/')[1]];if(l){groupId=l.module;label=String(l.number).padStart(2,'0')+' · '+l.title}}if(active){active.classList.add('active');active.setAttribute('aria-current','page')}el.querySelectorAll('.nav-group').forEach(d=>{d.open=groupId?d.dataset.module===groupId:false;if(d.dataset.module===groupId)d.querySelector('summary').classList.add('current')});current.textContent=label;if(innerWidth>850&&active)setTimeout(()=>{let ar=active.getBoundingClientRect(),rr=rail.getBoundingClientRect();if(ar.top<rr.top+12||ar.bottom>rr.bottom-12)rail.scrollTop+=ar.top-rr.top-rr.height/3},0)}
function doneSet(){return new Set(JSON.parse(localStorage.getItem('ai-re-done-v2')||'[]'))}function pct(){return Math.round(doneSet().size/30*100)}
function home(){app.innerHTML='<div class="wrap hero"><div class="eyebrow">AI IMAGE + AI VIDEO FOR REAL ESTATE</div><h1>Look what you can make from an ordinary property photo.</h1><p>Start with a dark, messy, empty or outdated image. Learn how to clean it, restyle it, renovate it, turn it into video and build useful property services from the same two skills.</p><div class="actions"><a class="button primary" href="#tools">Start with the tools</a><a class="button" href="#lesson/lesson-01">Go straight to Lesson 1</a></div><div class="proof"><figure><img src="assets/willow/re-01-editorial-staging.png" alt="Premium editorial AI-staged living room example"><figcaption>Course demonstration. Synthetic image, not a real listing.</figcaption></figure><div class="stat"><strong>30</strong><b>practical AI image and video lessons</b><p>Upload a photo. Choose a model. Paste a prompt. Generate a few. Keep the accurate one.</p></div></div><section class="intro-band"><div class="eyebrow">The whole idea</div><h2>AI image + AI video can become many services.</h2><p>Clean a listing photo. Remove furniture. Stage an empty room. Show a renovation. Make a floor-plan visual. Animate the result. Create a property reel.</p><div class="actions"><a class="button" href="assets/practice-pack.zip" download>Download all practice files</a><a class="button" href="#curriculum">See the full course</a></div></section></div>'}

change. A lesson is marked TESTED only when its exact course route and output were run and checked.</p><div class="actions"><a class="button primary" href="#lesson/lesson-01">Begin Lesson 1</a><a class="button" href="assets/practice-pack.zip" download>Download practice files</a></div></section></div>'}
function card(l){let first=l.body.split('\n').find(x=>x.startsWith('Turn ')||x.startsWith('Make ')||x.startsWith('Create ')||x.startsWith('Remove ')||x.startsWith('Show ')||x.startsWith('Use '))||'Open the practical workflow.';return '<a class="lesson-card" href="#lesson/'+l.id+'"><span class="lesson-no">LESSON '+String(l.number).padStart(2,'0')+'</span><h2>'+esc(l.title)+'</h2><p>'+esc(first)+'</p><span class="button">Open lesson →</span></a>'}
function curriculum(){app.innerHTML='<div class="wrap"><div class="module-head"><div class="eyebrow">30 lessons</div><h1>From ordinary property photo to AI property campaign.</h1><p>Every lesson shows what to make, where to go, what to upload, what to paste, what good looks like and what to do when the result fails.</p></div>'+DATA.modules.map(m=>'<section class="start-card"><div class="eyebrow">'+m.number+' · '+esc(m.title)+'</div><h2>'+esc(m.promise)+'</h2><div class="lesson-grid">'+m.lessons.map(n=>card(byNum[n])).join('')+'</div></section>').join('')+'</div>'}
function modulePage(id){let m=DATA.modules.find(x=>x.id===id);if(!m)return home();app.innerHTML='<div class="wrap"><div class="module-head"><a class="crumb" href="#curriculum">← Full curriculum</a><div class="eyebrow">Module '+m.number+'</div><h1>'+esc(m.title)+'</h1><p>'+esc(m.promise)+'</p></div><div class="lesson-grid">'+m.lessons.map(n=>card(byNum[n])).join('')+'</div></div>'}
function lesson(id){let l=byId[id];if(!l)return home();let i=lessons.indexOf(l),prev=lessons[i-1],next=lessons[i+1],done=doneSet(),v=l.visual,m=DATA.modules.find(x=>x.lessons.includes(l.number));app.innerHTML='<div class="wrap"><a class="crumb" href="#module/'+m.id+'">← '+esc(m.title)+'</a><div class="lesson-top"><span class="lesson-number">'+String(l.number).padStart(2,'0')+'</span><h1>'+esc(l.title)+'</h1></div><div class="lesson-meta"><span class="badge '+(l.status==='tested'?'tested':'research')+'">'+(l.status==='tested'?'TESTED · COURSE ROUTE':'RESEARCHED · NOT YET TESTED')+'</span><span class="badge">'+(l.number<19?'AI image':'AI video')+'</span><span class="badge">'+esc(m.title)+'</span></div><div class="lesson-layout"><article class="reader">'+(v?'<div class="visual-pair"><figure class="visual"><img src="'+v.before+'" alt="Before example for '+esc(l.title)+'"><figcaption>Before / source</figcaption></figure><figure class="visual"><img src="'+v.after+'" alt="After example for '+esc(l.title)+'"><figcaption>After / verified course example</figcaption></figure></div><p class="visual-caption">'+esc(v.label)+(l.status==='tested'?' Tested course execution.':' Synthetic course demonstration.')+'</p>':'')+'<div class="md">'+md(l.body)+'</div><div class="next">'+(prev?'<a href="#lesson/'+prev.id+'">← '+esc(prev.title)+'</a>':'<span></span>')+(next?'<a href="#lesson/'+next.id+'">'+esc(next.title)+' →</a>':'<a href="#home">Finish →</a>')+'</div></article><aside class="side"><div class="side-card"><b>Where you are</b>Lesson '+l.number+' of 30<div class="progress"><i style="width:'+pct()+'%"></i></div>'+pct()+'% complete</div><div class="side-card"><b>Keep the original true</b>Do not quietly change the building, windows, doors, room size, outside view or fixed features. Label staging, concepts and atmospheric changes honestly.</div><a class="button practice-link" href="assets/practice-pack.zip" download>Download practice files</a><button class="button '+(done.has(l.id)?'primary':'')+'" id="complete">'+(done.has(l.id)?'Completed':'Mark complete and open next')+'</button></aside></div></div>';document.querySelector('#complete').onclick=()=>{done.add(l.id);localStorage.setItem('ai-re-done-v2',JSON.stringify([...done]));let target=next?'#lesson/'+next.id:'#home';location.hash=target;route()}}
function route(){let h=location.hash.slice(1)||'home';syncNav(h);if(h==='home')home();else if(h==='tools')tools();else if(h==='curriculum')curriculum();else if(h.startsWith('module/'))modulePage(h.split('/')[1]);else if(h.startsWith('lesson/'))lesson(h.split('/')[1]);else home();scrollTo(0,0)}
function copyText(t){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(t).catch(()=>legacy(t));return Promise.resolve(legacy(t))}function legacy(t){let x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.append(x);x.select();document.execCommand('copy');x.remove()}document.addEventListener('click',e=>{let b=e.target.closest('[data-copy]');if(b){copyText(decodeURIComponent(b.dataset.copy));b.textContent='Copied';setTimeout(()=>b.textContent='Copy prompt',1400)}});let theme=document.querySelector('#theme');function setTheme(v){document.documentElement.dataset.theme=v;theme.setAttribute('aria-checked',v==='dark');theme.textContent=v==='dark'?'☾':'☀';theme.setAttribute('aria-label',v==='dark'?'Switch to light mode':'Switch to dark mode');document.querySelector('meta[name="theme-color"]').content=v==='dark'?'#000':'#fff';localStorage.setItem('ai-re-theme-v2',v)}theme.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(localStorage.getItem('ai-re-theme-v2')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));nav();addEventListener('hashchange',route);route();
</script></body></html>
