ey span{color:var(--muted);font-size:14px}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.section-head h2{font-size:clamp(30px,5vw,58px);line-height:1;letter-spacing:-.045em;margin:8px 0 0}.section-head p{max-width:480px;color:var(--muted);margin:0}.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.category-card{border:1px solid var(--line);background:var(--surface-2);border-radius:18px;padding:24px;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s}.category-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}.category-card h3{margin:12px 0 8px;font-size:24px;letter-spacing:-.025em}.category-card p{margin:0;color:var(--muted)}.category-meta{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:13px;color:var(--muted)}.progress-line{height:4px;background:var(--surface);border-radius:3px;overflow:hidden;margin-top:14px}.progress-line span{display:block;height:100%;background:var(--accent);width:0}.mobile-nav{display:none}.reader{max-width:800px}.reader h1{font-size:clamp(40px,7vw,78px);line-height:1;letter-spacing:-.06em;margin:12px 0 18px}.reader-lede{font-size:21px;line-height:1.4;color:var(--muted);max-width:720px}.lesson-meta{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 42px}.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}.reader-section{padding:28px 0;border-top:1px solid var(--line)}.reader-section h2{font-size:23px;margin:0 0 10px;letter-spacing:-.02em}.reader-section p{margin:0;color:var(--muted);font-size:17px}.asset{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text)}.asset strong{display:block;margin-bottom:8px}.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:50px;padding-top:22px;border-top:1px solid var(--line)}.lesson-nav button{text-align:left;max-width:48%;border:0;background:transparent;color:var(--text);cursor:pointer;padding:8px 0}.lesson-nav small{display:block;color:var(--muted);margin-bottom:5px}.lesson-nav button:hover{color:var(--accent)}.complete-row{display:flex;align-items:center;gap:12px;margin-top:30px}.complete-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;min-height:44px;padding:0 15px;cursor:pointer}.complete-btn.done{background:var(--success);border-color:var(--success);color:#fff}.search-wrap{display:flex;gap:10px;margin:24px 0}.search-wrap input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);padding:13px 14px;outline:none}.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}.result-list{display:grid;gap:10px}.result{padding:17px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);cursor:pointer}.result:hover{border-color:var(--accent)}.result strong{display:block}.result span{font-size:13px;color:var(--muted)}.empty{padding:30px 0;color:var(--muted)}.footer{padding:28px 24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:800px){.layout{display:block}.sidebar{display:none}.mobile-nav{display:block}.mobile-nav summary{list-style:none;cursor:pointer;padding:14px 22px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.mobile-nav summary::-webkit-details-marker{display:none}.mobile-categories{padding:8px 14px 14px;background:var(--surface);display:grid;gap:3px}.header-sub{display:block}.journey{grid-template-columns:1fr}.category-grid{grid-template-columns:1fr}.view{padding-top:34px}.hero{padding-bottom:52px}.site-header{padding:0 16px;gap:10px}.brand{font-size:11px}.theme-switch{margin-left:4px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}.category-card:hover{transform:none}}@media(prefers-contrast:more){.category-card,.result,.asset{border-width:2px}.site-header{border-bottom-width:2px}}
</style></head>

<script>
const curriculum=[{"id": "foundations", "title": "Foundations", "description": "Start with the production system, the project and the standard.", "pages": [{"id": "what-youll-build", "title": "What You’ll Build", "purpose": "Build one property into a complete visual campaign.", "teaches": "The system starts with the property itself, then moves through stills, staging, motion, film, campaign assets and a digital presentation.", "deliverable": "Your deliverable is a coherent property package, not a pile of disconnected generations."}, {"id": "who-this-is-for", "title": "Who This Is For", "purpose": "Know where this workflow fits.", "teaches": "This is for filmmakers, photographers, editors, AI creators and real-estate media providers who care about visual credibility and repeatable delivery.", "deliverable": "Choose one real or supplied property and work through the system as a production project."}, {"id": "the-one-property-project", "title": "The One Property Project", "purpose": "Use one property as the spine of the whole module.", "teaches": "One property gives every lesson a shared subject, making continuity, comparison and quality control visible.", "deliverable": "Create a project folder, collect source media and define the final campaign before generating anything."}, {"id": "tools-and-working-files", "title": "Tools and Working Files", "purpose": "Build the tools and working files part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for tools and working files and record the quality checks that make the result usable."}, {"id": "ai-verse-quality-standard", "title": "The AI-Verse Quality Standard", "purpose": "Build the the ai-verse quality standard part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for the ai-verse quality standard and record the quality checks that make the result usable."}]}, {"id": "property-truth", "title": "Property Truth", "description": "Protect the truth of the property before improving its presentation.", "pages": [{"id": "property-truth-sheet", "title": "Property Truth Sheet", "purpose": "Record what is true before you create a visual concept.", "teaches": "Capture rooms, dimensions, materials, fixed architecture, windows, views, fixtures and anything that must remain unchanged.", "deliverable": "Produce a one-page truth sheet that every later image and video decision can reference."}, {"id": "source-image-audit", "title": "Source Image Audit", "purpose": "Choose source frames that can survive enhancement or motion.", "teaches": "Inspect composition, lens distortion, exposure, geometry, reflections and missing information before using an image as a generation input.", "deliverable": "Score and select the source frames for the first property sequence."}, {"id": "real-changes-vs-visual-concepts", "title": "Real Changes vs Visual Concepts", "purpose": "Build the real changes vs visual concepts part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for real changes vs visual concepts and record the quality checks that make the result usable."}, {"id": "media-intake-and-organisation", "title": "Media Intake and Organisation", "purpose": "Build the media intake and organisation part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for media intake and organisation and record the quality checks that make the result usable."}, {"id": "property-visual-bible", "title": "Property Visual Bible", "purpose": "Keep the property visually coherent across deliverables.", "teaches": "Define the grade, material language, camera logic, staging direction and non-negotiable architectural details.", "deliverable": "Create a visual bible that can travel with the project."}]}, {"id": "ai-property-images", "title": "AI Property Images", "description": "Improve the visual material without losing the room, structure or story.", "pages": [{"id": "cleanup-and-declutter", "title": "Cleanup and Declutter", "purpose": "Build the cleanup and declutter part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for cleanup and declutter and record the quality checks that make the result usable."}, {"id": "depersonalisation-and-privacy-cleanup", "title": "Depersonalisation and Privacy Cleanup", "purpose": "Build the depersonalisation and privacy cleanup part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for depersonalisation and privacy cleanup and record the quality checks that make the result usable."}, {"id": "lighting-and-exposure-enhancement", "title": "Lighting and Exposure Enhancement", "purpose": "Build the lighting and exposure enhancement part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for lighting and exposure enhancement and record the quality checks that make the result usable."}, {"id": "exterior-and-twilight-variants", "title": "Exterior and Twilight Variants", "purpose": "Build the exterior and twilight variants part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for exterior and twilight variants and record the quality checks that make the result usable."}, {"id": "image-qc-and-export", "title": "Image QC and Export", "purpose": "Build the image qc and export part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for image qc and export and record the quality checks that make the result usable."}]}, {"id": "virtual-staging", "title": "Virtual Staging", "description": "Turn empty rooms into believable, context-aware visual concepts.", "pages": [{"id": "empty-room-to-staged-room", "title": "Empty Room to Staged Room", "purpose": "Create a believable staged concept from an empty room.", "teaches": "Use the source image as the architectural authority. Add furniture for scale, function and buyer context while protecting perspective, openings, floor lines and light direction.", "deliverable": "Produce one staged frame with a clearly stated conceptual status."}, {"id": "perspective-and-depth-locking", "title": "Perspective and Depth Locking", "purpose": "Build the perspective and depth locking part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for perspective and depth locking and record the quality checks that make the result usable."}, {"id": "style-packs-and-buyer-context", "title": "Style Packs and Buyer Context", "purpose": "Choose a staging direction that belongs to the property and its audience.", "teaches": "Build style packs around room function, architecture, light and likely buyer context instead of random furniture aesthetics.", "deliverable": "Create three controlled style directions for one room and select one."}, {"id": "full-property-consistency", "title": "Full-Property Consistency", "purpose": "Make staged rooms feel like the same property.", "teaches": "Carry materials, palette, furniture language, camera height and light logic across the sequence.", "deliverable": "Deliver a five-room consistency board with notes on what stays fixed."}, {"id": "staging-presentation", "title": "Staging Presentation", "purpose": "Present staged concepts clearly and honestly.", "teaches": "Separate existing property information from proposed visualisation. Show the result as a design concept, not as evidence that the furniture is physically present.", "deliverable": "Create a presentation page or export set with a consistent disclosure treatment."}]}, {"id": "image-to-video", "title": "Image to Video", "description": "Create controlled movement from property stills and staged frames.", "pages": [{"id": "choosing-the-right-source-frame", "title": "Choosing the Right Source Frame", "purpose": "Select a still that gives motion a strong starting point.", "teaches": "Look for readable geometry, clean edges, a clear subject and enough visual information for the intended camera move.", "deliverable": "Choose and annotate the source frame for one clip."}, {"id": "camera-movement-for-property-images", "title": "Camera Movement for Property Images", "purpose": "Direct movement like a cinematographer, not a random zoom.", "teaches": "Match the move to the room: a measured push, lateral reveal, rise, orbit or transition should reveal information and preserve architecture.", "deliverable": "Write a shot instruction for six property clips with one clear movement per clip."}, {"id": "start-frame-and-end-frame-transitions", "title": "Start-Frame and End-Frame Transitions", "purpose": "Build the start-frame and end-frame transitions part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for start-frame and end-frame transitions and record the quality checks that make the result usable."}, {"id": "room-by-room-video-sequence", "title": "Room-by-Room Video Sequence", "purpose": "Build a sequence that feels like one property film.", "teaches": "Order rooms by discovery, scale, light and emotional progression. Let each clip earn its place and hand off naturally to the next.", "deliverable": "Assemble a room-by-room sequence map with source frame, movement and purpose."}, {"id": "image-to-video-qc", "title": "Image-to-Video QC", "purpose": "Reject motion that damages the property.", "teaches": "Check architectural drift, warped lines, invented windows, changing furniture, texture crawl, unstable reflections and distracting camera behaviour.", "deliverable": "Run a repeatable QC pass on the generated clips and record fixes."}]}, {"id": "cinematic-property-films", "title": "Cinematic Property Films", "description": "Shape individual shots into a film with rhythm, intention and restraint.", "pages": [{"id": "property-film-story-structure", "title": "Property Film Story Structure", "purpose": "Give the property film a beginning, middle and finish.", "teaches": "Use arrival, orientation, discovery, detail and resolution to create a viewing experience rather than a random slideshow.", "deliverable": "Write a short film structure for the chosen property."}, {"id": "property-film-shot-matrix", "title": "Property Film Shot Matrix", "purpose": "Plan the film before generating shots.", "teaches": "Define lens, camera height, distance, crop, foreground, subject, action and transition for each shot.", "deliverable": "Deliver a complete shot matrix for the main property film."}, {"id": "music-voice-and-sound-design", "title": "Music, Voice and Sound Design", "purpose": "Build the music, voice and sound design part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for music, voice and sound design and record the quality checks that make the result usable."}, {"id": "editing-the-main-property-film", "title": "Editing the Main Property Film", "purpose": "Cut the property film around information and feeling.", "teaches": "Build rhythm from shot duration, movement direction, room scale, music and moments of visual rest.", "deliverable": "Edit a first assembly and identify the three cuts that most improve the story."}, {"id": "platform-versions", "title": "Platform Versions", "purpose": "Build the platform versions part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for platform versions and record the quality checks that make the result usable."}]}, {"id": "property-campaigns", "title": "Property Campaigns", "description": "Turn one property into a useful, coherent set of visual deliverables.", "pages": [{"id": "one-property-many-deliverables", "title": "One Property, Many Deliverables", "purpose": "Multiply one property project into useful campaign assets.", "teaches": "A finished visual system can produce a hero image, carousel, vertical cuts, teasers, thumbnails, copy, a landing page and a delivery folder.", "deliverable": "Map one property to its final deliverable set before production begins."}, {"id": "hero-still-and-carousel", "title": "Hero Still and Carousel", "purpose": "Build the hero still and carousel part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for hero still and carousel and record the quality checks that make the result usable."}, {"id": "reels-teasers-and-thumbnails", "title": "Reels, Teasers and Thumbnails", "purpose": "Build the reels, teasers and thumbnails part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for reels, teasers and thumbnails and record the quality checks that make the result usable."}, {"id": "campaign-caption-package", "title": "Campaign Caption Package", "purpose": "Deliver copy that supports the visual work.", "teaches": "Write concise, property-specific captions and descriptions that match the supplied facts and the visual treatment.", "deliverable": "Create a caption package for the selected campaign assets."}, {"id": "client-delivery-folder", "title": "Client Delivery Folder", "purpose": "Make the final handoff easy to use.", "teaches": "Organise masters, platform versions, thumbnails, copy, source notes and approvals so the client can find the right asset without asking.", "deliverable": "Build a reusable delivery-folder template."}]}, {"id": "websites-and-artifacts", "title": "Websites and Artifacts", "description": "Give the property a digital experience, not just a list of files.", "pages": [{"id": "property-landing-page", "title": "Property Landing Page", "purpose": "Turn the campaign into a focused property experience.", "teaches": "Lead with the strongest visual, give the viewer a clear path through the property and make the next action obvious without crowding the page.", "deliverable": "Create a responsive landing-page structure for one property."}, {"id": "interactive-property-gallery", "title": "Interactive Property Gallery", "purpose": "Let viewers explore the visual story at their own pace.", "teaches": "Use a gallery to give context to rooms, details, staged concepts and film clips without losing the narrative order.", "deliverable": "Design a gallery map with media, captions and interactions."}, {"id": "before-and-after-visualisation-page", "title": "Before-and-After Visualisation Page", "purpose": "Build the before-and-after visualisation page part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for before-and-after visualisation page and record the quality checks that make the result usable."}, {"id": "scroll-through-property-tour", "title": "Scroll-Through Property Tour", "purpose": "Use scroll as a guided camera path through the property.", "teaches": "Sequence images, motion and text so the page reveals the property with controlled pacing and clear spatial relationships.", "deliverable": "Create a scroll-tour storyboard that can become a static artifact."}, {"id": "agent-and-studio-portfolio-page", "title": "Agent and Studio Portfolio Page", "purpose": "Build the agent and studio portfolio page part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for agent and studio portfolio page and record the quality checks that make the result usable."}]}, {"id": "skills-and-productisation", "title": "Skills and Productisation", "description": "Turn the workflow into reusable tools, packages and a repeatable service.", "pages": [{"id": "property-image-prompt-builder", "title": "Property Image Prompt Builder", "purpose": "Turn visual direction into a reusable image prompt tool.", "teaches": "Separate user input from fixed production DNA so the tool can adapt to different properties without losing its quality standard.", "deliverable": "Build a prompt template with explicit subject binding and QC language."}, {"id": "image-to-video-prompt-builder", "title": "Image-to-Video Prompt Builder", "purpose": "Generate usable movement directions from a source frame and shot goal.", "teaches": "Keep camera movement, subject preservation, environment behaviour and output constraints clear and separate.", "deliverable": "Create a reusable image-to-video prompt form."}, {"id": "property-campaign-generator", "title": "Property Campaign Generator", "purpose": "Generate a campaign plan from one property brief.", "teaches": "The generator should return deliverables, formats, shot needs, copy needs and delivery notes rather than vague content ideas.", "deliverable": "Build a campaign generator around the one-property workflow."}, {"id": "media-qc-tool", "title": "Media QC Tool", "purpose": "Build the media qc tool part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for media qc tool and record the quality checks that make the result usable."}, {"id": "package-and-price-the-service", "title": "Package and Price the Service", "purpose": "Build the package and price the service part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for package and price the service and record the quality checks that make the result usable."}, {"id": "capstone-delivery", "title": "Capstone Delivery", "purpose": "Build the capstone delivery part of the property workflow.", "teaches": "This lesson turns one production decision into a repeatable method for real-estate visual work. It will connect the property brief, the chosen visual treatment and the final deliverable.", "deliverable": "Create a working example for capstone delivery and record the quality checks that make the result usable."}]}];
const allLessons=curriculum.flatMap(c=>c.pages.map(p=>({...p,categoryId:c.id,categoryTitle:c.title})));
const app=document.querySelector('#app');const categoriesEl=document.querySelector('#categories');const mobileEl=document.querySelector('#mobileCategories');
const completed=new Set(JSON.parse(localStorage.getItem('ai-real-estate-progress-v1')||'[]').filter(id=>allLessons.some(p=>p.id===id)));
function save(){localStorage.setItem('ai-real-estate-progress-v1',JSON.stringify([...completed]));}
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('#themeSwitch').setAttribute('aria-checked',dark?'true':'false');document.querySelector('#themeSwitch').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');document.querySelector('meta[name=theme-color]').content=dark?'#000000':'#ffffff';localStorage.setItem('ai-real-estate-theme',dark?'dark':'light')}
setTheme(localStorage.getItem('ai-real-estate-theme')==='dark'||(!localStorage.getItem('ai-real-estate-theme')&&matchMedia('(prefers-color-scheme: dark)').matches));
document.querySelector('#themeSwitch').addEventListener('pointerdown',()=>setTheme(document.documentElement.dataset.theme!=='dark'));
document.querySelector('#searchBtn').addEventListener('pointerdown',()=>location.hash='#search');
function categoryNav(){const html=curriculum.map(c=>`<button class="category-link" data-category="${c.id}"><span>${esc(c.title)}</span><span class="count">${c.pages.length}</span></button>`).join('');categoriesEl.innerHTML=html;mobileEl.innerHTML=html;document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('pointerdown',()=>goCategory(b.dataset.category)))}
function progress(c){return Math.round(c.pages.filter(p=>completed.has(p.id)).length/c.pages.length*100)}
function home(){app.innerHTML=`<section class="view"><div class="hero"><div class="eyebrow">AI Real Estate Visuals</div><h1>Make the property feel real.</h1><p>A filmmaker’s AI system for creating real-estate images, property films and complete visual campaigns.</p><div class="actions"><a class="primary" href="#curriculum">Explore the curriculum</a><a class="secondary" href="#category/foundations">Start with Foundations</a></div></div><div class="journey"><article><strong>Protect the truth.</strong><span>Start with the property, its source media and the details that must survive.</span></article><article><strong>Shape the feeling.</strong><span>Build images, staging, movement and films with production intent.</span></article><article><strong>Deliver the system.</strong><span>Turn one property into a complete campaign and reusable tools.</span></article></div><div style="height:80px"></div><div class="section-head"><div><div class="eyebrow">The path</div><h2>One property. Many outcomes.</h2></div><p>The curriculum follows a real production journey, from source media to final delivery.</p></div><div class="category-grid">${curriculum.slice(0,6).map(card).join('')}</div></section>`;bindCards()}
function card(c){return `<article class="category-card" data-category="${c.id}"><div class="eyebrow">${String(c.pages.length).padStart(2,'0')} pages</div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="category-meta"><span>${progress(c)}% complete</span><span>Open category →</span></div><div class="progress-line"><span style="width:${progress(c)}%"></span></div></article>`}
function curriculumView(){app.innerHTML=`<section class="view"><div class="section-head"><div><div class="eyebrow">Curriculum</div><h2>The complete production path.</h2></div><p>Every category contains its own ordered pages. Start at Foundations or jump directly to the part of the workflow you need.</p></div><div class="category-grid">${curriculum.map(card).join('')}</div></section>`;bindCards()}
function bindCards(){document.querySelectorAll('[data-category]').forEach(el=>el.addEventListener('pointerdown',()=>goCategory(el.dataset.category)))}
function goCategory(id){location.hash='#category/'+id}
function categoryView(id){const c=curriculum.find(x=>x.id===id);if(!c)return notFound();const list=c.pages.map((p,i)=>`<article class="result" data-lesson="${p.id}"><span>Page ${i+1} · ${completed.has(p.id)?'Complete':'Ready to read'}</span><strong>${esc(p.title)}</strong><span>${esc(p.purpose)}</span></article>`).join('');app.innerHTML=`<section class="view"><div class="section-head"><div><div class="eyebrow">Category ${String(curriculum.indexOf(c)+1).padStart(2,'0')}</div><h2>${esc(c.title)}</h2></div><p>${esc(c.description)}</p></div><div class="result-list">${list}</div></section>`;document.querySelectorAll('[data-lesson]').forEach(el=>el.addEventListener('pointerdown',()=>location.hash='#lesson/'+el.dataset.lesson));highlight(id)}
function lessonView(id){const i=allLessons.findIndex(p=>p.id===id);const p=allLessons[i];if(!p)return notFound();const c=curriculum.find(x=>x.id===p.categoryId);const prev=allLessons[i-1],next=allLessons[i+1];app.innerHTML=`<section class="view"><article class="reader"><div class="eyebrow">${esc(c.title)} · Page ${c.pages.findIndex(x=>x.id===id)+1} of ${c.pages.length}</div><h1>${esc(p.title)}</h1><p class="reader-lede">${esc(p.purpose)}</p><div class="lesson-meta"><span class="tag">Production lesson</span><span class="tag">${completed.has(id)?'Completed':'In progress'}</span></div><section class="reader-section"><h2>What this page teaches</h2><p>${esc(p.teaches)}</p></section><section class="reader-section"><h2>Workflow</h2><p>Start with the supplied property material. Make one clear decision at a time. Keep the source truth visible, direct the visual result with intent, then inspect the output before moving forward.</p><div class="asset"><strong>Working note</strong>Keep this page attached to the same property project as the rest of the curriculum. Your job is to produce one usable result, not to collect random experiments.</div></section><section class="reader-section"><h2>Member deliverable</h2><p>${esc(p.deliverable)}</p></section><section class="reader-section"><h2>Quality control</h2><p>Reject anything that invents important property information, breaks visual continuity or looks impressive but cannot be used in a real production delivery. Record what changed and why.</p></section><div class="complete-row"><button class="complete-btn ${completed.has(id)?'done':''}" id="complete">${completed.has(id)?'Completed ✓':'Mark lesson complete'}</button><span id="feedback" class="count"></span></div><nav class="lesson-nav"><button ${prev?'':'disabled'} id="prev"><small>Previous</small>${prev?esc(prev.title):'Beginning of curriculum'}</button><button ${next?'':'disabled'} id="next"><small>Next</small>${next?esc(next.title):'End of curriculum'}</button></nav></article></section>`;document.querySelector('#complete').addEventListener('pointerdown',()=>{if(completed.has(id))completed.delete(id);else completed.add(id);save();lessonView(id)});if(prev)document.querySelector('#prev').addEventListener('pointerdown',()=>location.hash='#lesson/'+prev.id);if(next)document.querySelector('#next').addEventListener('pointerdown',()=>location.hash='#lesson/'+next.id);highlight(c.id)}
function searchView(){app.innerHTML=`<section class="view"><div class="section-head"><div><div class="eyebrow">Search</div><h2>Find a lesson.</h2></div><p>Search category names, page titles and the practical language of the workflow.</p></div><div class="search-wrap"><label class="sr-only" for="q">Search lessons</label><input id="q" placeholder="Try staging, film, source frame or campaign" autocomplete="off"></div><div class="result-list" id="results"></div></section>`;const q=document.querySelector('#q');const render=()=>{const term=q.value.trim().toLowerCase();const matches=term?allLessons.filter(p=>[p.title,p.purpose,p.teaches,p.deliverable,p.categoryTitle].join(' ').toLowerCase().includes(term)):allLessons.slice(0,8);document.querySelector('#results').innerHTML=matches.length?matches.map(p=>`<article class="result" data-lesson="${p.id}"><span>${esc(p.categoryTitle)}</span><strong>${esc(p.title)}</strong><span>${esc(p.purpose)}</span></article>`).join(''):'<div class="empty">No lesson matches that search yet.</div>';document.querySelectorAll('[data-lesson]').forEach(el=>el.addEventListener('pointerdown',()=>location.hash='#lesson/'+el.dataset.lesson))};q.addEventListener('input',render);render();setTimeout(()=>q.focus(),0)}
function progressView(){const total=allLessons.length;app.innerHTML=`<section class="view"><div class="section-head"><div><div class="eyebrow">Your progress</div><h2>${completed.size} of ${total} lessons.</h2></div><p>Progress is saved in this browser. Use it as a working marker, not a score.</p></div><div class="category-grid">${curriculum.map(card).join('')}</div><div class="actions"><button class="secondary" id="reset">Reset progress</button></div></section>`;bindCards();document.querySelector('#reset').addEventListener('pointerdown',()=>{completed.clear();save();progressView()})}
function notFound(){app.innerHTML='<section class="view"><div class="hero"><div class="eyebrow">Not found</div><h1>This page moved.</h1><p>Return to the curriculum and choose a category or lesson.</p><div class="actions"><a class="primary" href="#curriculum">Open curriculum</a></div></div></section>'}
function highlight(id){document.querySelectorAll('.category-link').forEach(b=>b.classList.toggle('active',b.dataset.category===id))}
function render(){categoryNav();const h=location.hash.slice(1)||'home';if(h==='home')home();else if(h==='curriculum')curriculumView();else if(h==='search')searchView();else if(h==='progress')progressView();else if(h.startsWith('category/'))categoryView(h.split('/')[1]);else if(h.startsWith('lesson/'))lessonView(h.split('/')[1]);else notFound();window.scrollTo(0,0)}
window.addEventListener('hashchange',render);document.querySelectorAll('[data-nav]').forEach(e=>e.addEventListener('pointerdown',()=>location.hash='#home'));render();
</script></body></html>
