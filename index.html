*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}.bar{height:70px;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,60px);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px)}.brand{color:var(--ink);text-decoration:none;font-weight:760;letter-spacing:-.035em;font-size:17px}.brand small{display:block;font-size:9px;line-height:1.2;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.top-actions{display:flex;gap:8px}.button,.theme{min-height:43px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);padding:0 16px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-weight:680}.button.primary{background:var(--accent);color:white;border-color:var(--accent)}.theme{width:48px;padding:0}.shell{max-width:1540px;margin:auto;display:grid;grid-template-columns:264px minmax(0,1fr);min-height:calc(100vh - 70px)}.rail{border-right:1px solid var(--line);padding:25px 16px;position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.rail-label,.eyebrow{font-size:10px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}.nav{margin-top:12px}.nav a{display:block;padding:10px 11px;border-radius:12px;text-decoration:none;color:var(--muted);margin:3px 0;line-height:1.18}.nav a:hover,.nav a.active{color:var(--ink);background:var(--surface)}.nav b{display:block;font-size:13px}.nav span{font-size:11px}.main{min-width:0}.wrap{max-width:1120px;padding:clamp(34px,6vw,84px) clamp(18px,5vw,72px);margin:auto}.hero{min-height:calc(100vh - 70px);display:grid;align-content:center;gap:25px}.hero h1{font-size:clamp(44px,7vw,94px);line-height:.98;letter-spacing:-.07em;max-width:960px;margin:0}.hero p{font-size:clamp(18px,2vw,23px);color:var(--muted);max-width:680px;margin:0}.hero .actions{display:flex;flex-wrap:wrap;gap:11px}.proof{margin-top:40px;display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.proof figure,.visual{margin:0;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}.proof img,.visual img{display:block;width:100%;height:100%;object-fit:cover}.proof figcaption{padding:13px 15px;font-size:13px;color:var(--muted)}.stat{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:grid;align-content:center;gap:7px}.stat strong{font-size:44px;letter-spacing:-.06em}.stat p{font-size:14px}.start-card{margin-top:70px;padding:28px;border:1px solid var(--line);background:var(--surface);border-radius:22px}.start-card h2{margin:8px 0;font-size:28px;letter-spacing:-.04em}.module-head{display:grid;gap:13px;margin-bottom:34px}.module-head h1{font-size:clamp(38px,5vw,64px);line-height:1;letter-spacing:-.06em;margin:0}.module-head p{font-size:19px;color:var(--muted);max-width:680px;margin:0}.lesson-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.lesson-card{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;color:var(--ink);background:var(--bg);min-height:190px}.lesson-card:hover{background:var(--surface);border-color:var(--accent)}.lesson-no{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent)}.lesson-card h2{margin:0;font-size:22px;line-height:1.12;letter-spacing:-.045em}.lesson-card p{margin:0;color:var(--muted);font-size:14px}.lesson-top{display:flex;gap:16px;align-items:flex-start}.lesson-top h1{margin:3px 0 0;font-size:clamp(32px,4.2vw,55px);line-height:1;letter-spacing:-.06em}.lesson-number{font-size:14px;font-weight:800;color:var(--accent);padding-top:8px}.crumb{font-size:13px;color:var(--muted);text-decoration:none}.crumb:hover{color:var(--accent)}.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.badge{font-size:11px;letter-spacing:.08em;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted)}.badge.tested{background:var(--accent-soft);border-color:transparent;color:var(--accent)}.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px}.reader{min-width:0}.side{display:grid;align-content:start;gap:12px}.side-card{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-size:13px}.side-card b{display:block;margin-bottom:5px}.visual-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:26px 0 8px}.visual img{aspect-ratio:3/2}.visual figcaption{padding:10px 12px;font-size:12px;color:var(--muted)}.visual-caption{font-size:13px;color:var(--muted);margin:0 0 30px}.md h2{margin:40px 0 12px;font-size:25px;line-height:1.1;letter-spacing:-.04em}.md h3{margin:26px 0 9px;font-size:17px;line-height:1.2;letter-spacing:-.02em}.md p{margin:10px 0}.md ul,.md ol{padding-left:23px;margin:10px 0}.md li{margin:5px 0}.md code{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 5px;border-radius:5px;background:var(--surface2);overflow-wrap:anywhere}.promptbox{position:relative;margin:16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}.promptbox pre{margin:0;padding:48px 17px 18px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}.copy{position:absolute;right:10px;top:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700}.md table{width:100%;border-collapse:collapse;margin:15px 0;font-size:14px}.md th,.md td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.md th{background:var(--surface)}.next{display:flex;justify-content:space-between;gap:1 -top:8px!important;max-height:min(58vh,420px);overflow-y:auto;overflow-x:hidden;padding:0 2px 4px!important}.rail.menu-open .nav{display:block!important}.nav a{max-width:none}.nav-start{display:block!important}.nav-group summary{padding:9px}.nav-lessons{padding-left:8px}.nav .nav-lesson{grid-template-columns:27px minmax(0,1fr);padding:8px 10px;font-size:12px}.nav-lesson-title{font-size:12px!important}}
</style></head><body><header class="bar"><a class="brand" href="#home">AI Real Estate Visuals</a><button class="theme" id="theme" aria-checked="false" aria-label="Switch theme">☀</button></header><div class="shell"><aside class="rail"><div class="rail-label">Course</div><button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-expanded="false" aria-controls="nav"><span>Course menu</span><b id="mobile-nav-current">Choose a section</b></button><nav class="nav" id="nav"></nav></aside><main class="main" id="app"></main></div><script id="course-data" type="application/json">{"title":"AI Image + AI Video for Real Estate","checked":"03 September 2026","modules":[{"id":"start","number":"01","title":"See what AI can do","promise":"Start with one ordinary property photo and make something useful.","lessons":[1]},{"id":"fix","number":"02","title":"Fix property photos","promise":"Clean, brighten and remove things without changing the property.","lessons":[2,3,4]},{"id":"stage","number":"03","title":"Furnish and restyle rooms","promise":"Show what an empty or dated room could become.","lessons":[5,6,7,8,9]},{"id":"concept","number":"04","title":"Renovate with AI","promise":"Create clear future concepts for rooms, kitchens, bathrooms and gardens.","lessons":[10,11,12,13]},{"id":"look","number":"05","title":"Make images feel premium","promise":"Give ordinary property images a polished editorial point of view.","lessons":[14,15,16]},{"id":"floor","number":"06","title":"Make floor-plan visuals","promise":"Turn flat plans into visuals people can understand.","lessons":[17,18]},{"id":"video","number":"07","title":"Animate property photos","promise":"Turn still images into calm, believable AI video shots.","lessons":[19,20,21,22]},{"id":"transform","number":"08","title":"Make transformation videos","promise":"Create cleaning, furnishing, renovation and day-to-night reveals.","lessons":[23,24,25,26,27,28,29]},{"id":"final","number":"09","title":"Build property campaigns","promise":"Turn the skills into walkthroughs, reels and useful services.","lessons":[30]}],"lessons":[{"id":"lesson-01","number":1,"title":"Clean a messy room","module":"start","body":"## What you can do\nTurn an ordinary messy homeowner photo into the same room, cleaned and ready for a listing.\n\n## Why this is useful\nA cleaner image can make a property easier to understand and easier to market.\n\n## Practice files\nDownload the practice pack and use `sources/cluttered-living.png`.\n\n## Before you start\nOne property photograph. Keep the untouched original.\n\n## Use this platform\n**Google Flow**\n\n## Use this model\n**Nano Banana 2**\n\n## Why this model\nGoogle says Nano Banana 2 supports local edits, stronger instruction following and uploaded-image editing.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Flow and start an image creation.\n2. Add the untouched source photograph as the image input.\n3. Use the available Nano Banana image route shown in your account.\n4. Paste the prompt below and generate 2 to 4 versions.\n5. Keep only a result that preserves the property.\n\n## Copy this prompt\n```\nClean this exact room for a professional property listing. Remove rubbish, loose cables, packaging, laundry, dishes, bottles, random small objects and temporary clutter. Keep the walls, windows, doors, floor, ceiling, built-in parts, room size, outside view and camera position exactly the same. Do not redesign the room. The result should look like the same room after a careful clean. High-end editorial real-estate photography, realistic materials, beautiful natural daylight, photographed rather than computer-generated.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nLoose clutter is gone. Sofa, windows, doors, room size, viewpoint and fixed objects remain.\n\n## Save this\nDownload the approved result as `01-clean-room.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf the room geometry, windows, doors or fixed features change, discard the result and regenerate from the untouched original. Ask for fewer removals at once if the model keeps rebuilding the room.\n\n## What you can sell\nAI property photo cleanup.\n\n## Try this next\nNow make the same room look like beautiful daytime.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":{"before":"assets/willow/re-03-cluttered-living-source.png","after":"assets/willow/re-03-editorial-declutter.png","label":"Messy room / editorial cleaned result"},"status":"researched"},{"id":"lesson-02","number":2,"title":"Make a dark property photo look like beautiful daytime","module":"fix","body":"## What you can do\nTurn a dark room or dark exterior into a bright, welcoming property image without changing the property.\n\n## Why this is useful\nA homeowner may only have a badly lit phone photo. You can make a useful marketing version from that starting point.\n\n## Practice files\nDownload the practice pack and use `sources/dark-living.png`.\n\n## Before you start\nOne dark interior or exterior property photograph.\n\n## Use this platform\n**Google Flow**\n\n## Use this model\n**Nano Banana 2**\n\n## Why this model\nThe current Flow page lists Nano Banana Pro for image creation and Google documents Nano Banana 2 image editing in Gemini.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Flow and start an image creation.\n2. Add the untouched source photograph as the image input.\n3. Use the available Nano Banana image route shown in your account.\n4. Paste the prompt below and generate 2 to 4 versions.\n5. Keep only a result that preserves the property.\n\n## Copy this prompt\n```\nTransform this exact property photograph into a bright, welcoming daytime real-estate photograph. Make the room feel naturally illuminated by beautiful daylight coming through the existing windows. Keep the exact room, furniture, architecture, window positions, outside view, materials and camera position. Do not redesign anything. Do not add windows or move furniture. High-end editorial property photography, soft believable daylight, refined contrast, realistic materials, photographed rather than computer-generated.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nThe room reads as natural daytime. Windows, walls, furniture, exterior view and geometry remain.\n\n## Save this\nDownload the approved result as `02-daylight-photo.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf the room geometry, windows, doors or fixed features change, discard the result and regenerate from the untouched original. Ask for fewer removals at once if the model keeps rebuilding the room.\n\n## What you can sell\nBad property photo rescue and day-to-day marketing images.\n\n## Try this next\nNow remove one object from the room.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.\n\n> **Note:** Limits and access can change by plan, country and demand. Do not promise unlimited generations.\n","visual":{"before":"assets/willow/re-04-exposure-source.png","after":"assets/willow/re-04-editorial-exposure.png","label":"Dark room / beautiful daytime result"},"status":"researched"},{"id":"lesson-03","number":3,"title":"Remove one thing","module":"fix","body":"## What you can do\nRemove a bin, television, painting, toy, car or another temporary object while keeping the rest of the photograph stable.\n\n## Why this is useful\nSmall unwanted objects can make a listing look less clear.\n\n## Practice files\nDownload the practice pack and use `sources/cluttered-living.png`.\n\n## Before you start\nOne photograph and one object that does not cover a fixed feature.\n\n## Use this platform\n**ChatGPT.com**\n\n## Use this model\n**ChatGPT Images 2.0**\n\n## Why this model\nOpenAI describes ChatGPT image generation and editing from plain-language instructions and uploaded images.\n\n**Status: TESTED IN THE COURSE IMAGE ROUTE.** This exact source, prompt and result were run on 03 September 2026 using GPT Image 2 through the configured ChatGPT image route.\n\n## Do this\n1. Open ChatGPT and start a new chat.\n2. Attach the untouched source image. There is no course-verified model-picker step.\n3. Paste the prompt and send it with the image.\n4. Generate 2 to 4 fresh versions from the original.\n5. Compare fixed architecture and keep only an accurate result.\n\n## Copy this prompt\n```\nRemove the the large open brown cardboard box on the lower-left floor from this exact property photograph. Naturally reconstruct only the small area hidden behind it. Everything else must remain unchanged. Keep the exact architecture, furniture, materials, lighting, camera position and composition. Do not redesign the room. Premium editorial real-estate photography, realistic materials, photographed rather than computer-generated.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nOnly the lower-left box is gone. Every other object remains in its original position.\n\n## Save this\nDownload the approved result as `03-one-object-removed.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf the room geometry, windows, doors or fixed features change, discard the result and regenerate from the untouched original. Ask for fewer removals at once if the model keeps rebuilding the room.\n\n## What you can sell\nSingle-object removal for property listings.\n\n## Try this next\nNow remove all movable furniture.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":{"before":"assets/willow/re-03-cluttered-living-source.png","after":"assets/willow/re-03-one-box-removed.png","label":"Only the lower-left cardboard box was removed. Every other object remains."},"status":"tested"},{"id":"lesson-04","number":4,"title":"Remove all furniture","module":"fix","body":"## What you can do\nCreate an empty version of the same room for planning, renovation and virtual staging.\n\n## Why this is useful\nAn empty version helps a client see the room itself before you add a new design.\n\n## Practice files\nDownload the practice pack and use `sources/cluttered-living.png`.\n\n## Before you start\nOne furnished room photograph.\n\n## Use this platform\n**ChatGPT.com**\n\n## Use this model\n**ChatGPT Images 2.0**\n\n## Why this model\nOpenAI documents natural-language edits to uploaded images.\n\n**Status: TESTED IN THE COURSE IMAGE ROUTE.** This exact source, prompt and empty-room result were run on 02 September 2026 using GPT Image 2 through the configured ChatGPT image route.\n\n## Do this\n1. Open ChatGPT and start a new chat.\n2. Attach the untouched source image. There is no course-verified model-picker step.\n3. Paste the prompt and send it with the image.\n4. Generate 2 to 4 fresh versions from the original.\n5. Compare fixed architecture and keep only an accurate result.\n\n## Copy this prompt\n```\nRemove all movable furniture, decorations and personal belongings from this exact room. Create a completely empty version of the same room. Keep the walls, windows, doors, floor, ceiling, fireplace, radiators, built-in cabinets, lights and every permanent architectural element exactly where they are. Do not redesign the room. Do not change the camera position. Naturally reconstruct areas hidden behind furniture. Premium editorial property photography, realistic room proportions.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nEvery movable item is gone. The empty room keeps the same windows, doors, floor, walls and viewpoint.\n\n## Save this\nDownload the approved result as `04-empty-room.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf the room geometry, windows, doors or fixed features change, discard the result and regenerate from the untouched original. Ask for fewer removals at once if the model keeps rebuilding the room.\n\n## What you can sell\nFurniture removal and empty-room planning visuals.\n\n## Try this next\nNow furnish the empty room in a strong style.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":{"before":"assets/willow/re-03-cluttered-living-source.png","after":"assets/willow/re-04-all-furniture-removed.png","label":"Furnished and cluttered room / same room completely empty"},"status":"tested"},{"id":"lesson-05","number":5,"title":"Furnish an empty room","module":"stage","body":"## What you can do\nTurn an empty room into a finished interior with furniture that fits the real space.\n\n## Why this is useful\nEmpty rooms are hard for many buyers to imagine. A believable furnished version gives the room a future.\n\n## Practice files\nDownload the practice pack and use `sources/empty-living.png`.\n\n## Before you start\nOne empty living-room photograph.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Seedream 5.0 Pro**\n\n## Why this model\nMagnific’s current catalogue lists Seedream 5.0 Pro and its image generator supports reference-image workflows.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Image Generator or the image-editing route available in your account.\n2. Choose the named model only if it is currently listed.\n3. Upload the untouched source image in the image/reference input.\n4. Paste the prompt and generate 2 to 4 fresh versions.\n5. Download only the accurate result.\n\n## Copy this prompt\n```\nVirtually furnish this exact empty living room. Create a dramatic but believable luxury interiors editorial: a monumental cream boucle sofa, sculptural walnut coffee table, deep oxblood lounge chair, oversized hand-tufted rug, sculptural floor lamp, one large abstract artwork and restrained olive accents. Arrange everything for the real size and shape of the room. Do not change the walls, windows, doors, floor, ceiling, permanent fixtures, outside view or camera position. Realistic scale, believable walking space, premium editorial property photography.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nFurniture fits the room, leaves believable walking space and does not alter architecture.\n\n## Save this\nDownload the approved result as `05-staged-living.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf furniture scale is wrong or architecture changes, discard the result and regenerate from the untouched original. Reduce the furniture list before changing the room description.\n\n## What you can sell\nVirtual staging for agents, developers and empty properties.\n\n## Try this next\nNow style the bedroom with a different visual direction.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":{"before":"assets/willow/re-01-empty-living-source.png","after":"assets/willow/re-01-editorial-staging.png","label":"Empty room / editorial staged result"},"status":"researched"},{"id":"lesson-06","number":6,"title":"Stage a bedroom that still works","module":"stage","body":"## What you can do\nTurn an empty bedroom into a strong bedroom or home-office option without making the room feel too small.\n\n## Why this is useful\nA buyer needs to understand what the room can become.\n\n## Practice files\nDownload the practice pack and use `sources/empty-bedroom.png`.\n\n## Before you start\nOne empty bedroom photograph.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Seedream 5.0 Pro**\n\n## Why this model\nUse the current Magnific image catalogue and check the exact model option available on your plan.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Image Generator or the image-editing route available in your account.\n2. Choose the named model only if it is currently listed.\n3. Upload the untouched source image in the image/reference input.\n4. Paste the prompt and generate 2 to 4 fresh versions.\n5. Download only the accurate result.\n\n## Copy this prompt\n```\nVirtually furnish this exact empty bedroom as a high-end interiors editorial. Add a low sculptural bed in ivory linen, charcoal vertical wall treatment, burnt-orange mohair throw, black bedside tables, an oversized pleated pendant, layered natural textiles and restrained art-fashion styling. Keep the exact walls, window, doors, wardrobes, floor, room proportions and camera position unchanged. Make the furniture correctly scaled and leave believable walking space. Premium magazine-quality real-estate photography.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nThe bed, storage and walking space fit naturally. Windows, doors and room size remain.\n\n## Save this\nDownload the approved result as `06-staged-bedroom.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf furniture scale is wrong or architecture changes, discard the result and regenerate from the untouched original. Reduce the furniture list before changing the room description.\n\n## What you can sell\nBedroom staging and bedroom-versus-home-office concepts.\n\n## Try this next\nNow change only the loose furniture style.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":{"before":"assets/willow/re-05-empty-bedroom-source.png","after":"assets/willow/re-05-editorial-bedroom.png","label":"Empty bedroom / finished bedroom"},"status":"researched"},{"id":"lesson-07","number":7,"title":"Change the interior style","module":"stage","body":"## What you can do\nMake several strong design directions from the same room.\n\n## Why this is useful\nOne property can be shown as warm, classic, modern, rustic or bold without changing the building.\n\n## Practice files\nDownload the practice pack and use `sources/furnished-living.png`.\n\n## Before you start\nOne furnished room photograph.\n\n## Use this platform\n**Gemini.com**\n\n## Use this model\n**Nano Banana 2**\n\n## Why this model\nGoogle documents uploaded-image edits, multiple reference images and stronger instruction following.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Gemini and start a new prompt.\n2. Attach the untouched source image or floor plan.\n3. Paste the prompt below.\n4. Generate 2 to 4 versions from the original input.\n5. Reject any result that changes fixed property facts.\n\n## Copy this prompt\n```\nRestyle only the loose furniture, soft furnishings and decoration in this exact room into a bold luxury editorial interior. Use a cobalt velvet sofa, saffron sculptural lounge chair, black travertine coffee table, graphic black-and-cream rug, chrome floor lamp and one oversized monochrome artwork. Keep the exact windows, fireplace, shelving, doors, floor, walls, room proportions and camera position. Do not change the architecture. Photorealistic interiors magazine photography, rich believable materials, sophisticated composition.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nThe new style is obvious, but the architecture and viewpoint are still the original room.\n\n## Save this\nDownload the approved result as `07-restyled-room.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf furniture scale is wrong or architecture changes, discard the result and regenerate from the untouched original. Reduce the furniture list before changing the room description.\n\n## What you can sell\nMultiple style directions for agents, developers, landlords and interior designers.\n\n## Try this next\nNow replace one piece of furniture only.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":{"before":"assets/willow/re-02-furnished-living-source.png","after":"assets/willow/re-02-editorial-restyle.png","label":"Existing room / bold restyle"},"status":"researched"},{"id":"lesson-08","number":8,"title":"Replace one piece of furniture","module":"stage","body":"## What you can do\nReplace only one sofa, table, bed, chair, curtain, rug, lamp or artwork.\n\n## Why this is useful\nA client may want to see one buying decision, not a whole new room.\n\n## Practice files\nDownload the practice pack and use `sources/furnished-living.png`.\n\n## Before you start\nOne property photograph and the name of the item to change.\n\n## Use this platform\n**ChatGPT.com**\n\n## Use this model\n**ChatGPT Images 2.0**\n\n## Why this model\nOpenAI documents clear constraints for what should change and what should stay fixed.\n\n**Status: TESTED IN THE COURSE IMAGE ROUTE.** This exact source, prompt and result were run on 03 September 2026 using GPT Image 2 through the configured ChatGPT image route.\n\n## Do this\n1. Open ChatGPT and start a new chat.\n2. Attach the untouched source image. There is no course-verified model-picker step.\n3. Paste the prompt and send it with the image.\n4. Generate 2 to 4 fresh versions from the original.\n5. Compare fixed architecture and keep only an accurate result.\n\n## Copy this prompt\n```\nReplace only the the large cream three-seat sofa on the left in this exact property photograph with a deep forest-green tailored wool three-seat sofa. Keep every other piece of furniture, every material, every wall, every window, every door, the lighting, the architecture and the camera position unchanged. Match the new item to the existing scale, angle and light. Premium editorial real-estate photography, believable materials, photographed rather than computer-generated.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nOnly the sofa changes. All other furniture, decor and fixed property features remain.\n\n## Save this\nDownload the approved result as `08-sofa-replaced.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf furniture scale is wrong or architecture changes, discard the result and regenerate from the untouched original. Reduce the furniture list before changing the room description.\n\n## What you can sell\nFurniture replacement as a small, focused service.\n\n## Try this next\nNow keep the same furniture across another angle.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":{"before":"assets/willow/re-02-furnished-living-source.png","after":"assets/willow/re-08-green-sofa-replacement.png","label":"Only the cream sofa was replaced with a deep green sofa. The room and every other item remain fixed."},"status":"tested"},{"id":"lesson-09","number":9,"title":"Keep the same furniture across multiple angles","module":"stage","body":"## What you can do\nMake a second photo of the same room use the same virtual furniture as the first photo.\n\n## Why this is useful\nListings often show more than one angle. If the sofa changes between views, the work is not useful.\n\n## Practice files\nDownload the practice pack and use `endpoints/staged-living.png` and `sources/empty-living-second-angle.png`.\n\n## Before you start\nA first staged image and a second original angle of the same room.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Nano Banana 2**\n\n## Why this model\nMagnific’s current plan page lists Nano Banana 2 and reference-based image tools.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Image Generator or the image-editing route available in your account.\n2. Choose the named model only if it is currently listed.\n3. Upload the untouched source image in the image/reference input.\n4. Paste the prompt and generate 2 to 4 fresh versions.\n5. Download only the accurate result.\n\n## Copy this prompt\n```\nIMAGE 1 is the second photograph I want to edit. IMAGE 2 shows how this same room has already been virtually furnished. Add the same sofa, chairs, rug, tables, lamps, artwork, materials and overall furniture design from IMAGE 2 into IMAGE 1. Respect the viewpoint of IMAGE 1. Do not copy the camera angle from IMAGE 2. Do not alter the architecture of IMAGE 1. Keep believable scale and walking space. Premium editorial real-estate photography, consistent styling, realistic materials.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nThe sofa, chair, table, rug and styling read as the same set in both angles. Each angle keeps its own architecture.\n\n## Save this\nDownload the approved result as `09-second-angle-staged.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf furniture scale is wrong or architecture changes, discard the result and regenerate from the untouched original. Reduce the furniture list before changing the room description.\n\n## What you can sell\nMulti-angle consistent staging.\n\n## Try this next\nNow move from rooms into renovation concepts.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.\n\n> **Note:** Treat the result as a concept until the property owner or agent confirms the design.\n","visual":null,"status":"researched"},{"id":"lesson-10","number":10,"title":"Change walls and floors","module":"concept","body":"## What you can do\nShow a new wall colour or floor finish on the exact existing room.\n\n## Why this is useful\nA client can explore a refurbishment direction before paying for the work.\n\n## Practice files\nDownload the practice pack and use `sources/furnished-living.png`.\n\n## Before you start\nOne room photograph and one clear finish choice.\n\n## Use this platform\n**Gemini.com**\n\n## Use this model\n**Nano Banana 2**\n\n## Why this model\nGoogle documents local edits and uploaded-image editing.\n\n**Status: TESTED IN THE COURSE IMAGE ROUTE.** This exact source, prompt and result were run on 03 September 2026 using GPT Image 2 through the configured ChatGPT image route.\n\n## Do this\n1. Open Gemini and start a new prompt.\n2. Attach the untouched source image or floor plan.\n3. Paste the prompt below.\n4. Generate 2 to 4 versions from the original input.\n5. Reject any result that changes fixed property facts.\n\n## Copy this prompt\n```\nChange only the wall colour and floor finish in this exact room. Use warm off-white walls and wide-plank natural oak flooring. Keep the room, furniture, windows, doors, ceiling, permanent fixtures, outside view, lighting and camera position unchanged. The paint and flooring must follow the real surfaces and perspective. Do not enlarge or redesign the room. High-end architectural interiors editorial, realistic natural light, believable materials.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nOnly wall colour and floor finish change. Furniture, cabinetry, fireplace, windows and viewpoint remain.\n\n## Save this\nDownload the approved result as `10-walls-floor-concept.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf fixed architecture moves or materials spread onto the wrong surfaces, discard the result and regenerate from the original with one transformation only.\n\n## What you can sell\nWall and floor refurbishment concepts.\n\n## Try this next\nNow redesign a kitchen.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":{"before":"assets/willow/re-02-furnished-living-source.png","after":"assets/willow/re-10-sage-walls-herringbone-floor.png","label":"Only the wall colour and floor finish changed. Furniture and architecture remain fixed."},"status":"tested"},{"id":"lesson-11","number":11,"title":"Renovate a kitchen","module":"concept","body":"## What you can do\nTurn an ordinary kitchen into a polished renovation concept while keeping its real layout.\n\n## Why this is useful\nRenovation clients need to see what their current kitchen could become.\n\n## Practice files\nDownload the practice pack and use `sources/kitchen.png`.\n\n## Before you start\nOne kitchen photograph. Clearly label the result as a concept.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Seedream 5.0 Pro**\n\n## Why this model\nMagnific’s current catalogue lists Seedream 5.0 Pro for high-quality image creation and editing routes.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Image Generator or the image-editing route available in your account.\n2. Choose the named model only if it is currently listed.\n3. Upload the untouched source image in the image/reference input.\n4. Paste the prompt and generate 2 to 4 fresh versions.\n5. Download only the accurate result.\n\n## Copy this prompt\n```\nCreate a renovation concept for this exact kitchen. Keep the room shape, walls, windows, doors, island position, appliance positions and camera position unchanged. Replace the design with ink-black flat-panel cabinetry, honed green marble backsplash, brushed brass hardware, sculptural pendant lights and deep rust bar stools. Make every material fit the existing layout realistically. Do not enlarge the room or move openings. Luxury interiors magazine photography, cinematic natural light, premium materials, photographed rather than computer-generated.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nKitchen layout, windows, doors, appliance positions and room size remain. Only the approved renovation changes.\n\n## Save this\nDownload the approved result as `11-kitchen-concept.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf fixed architecture moves or materials spread onto the wrong surfaces, discard the result and regenerate from the original with one transformation only.\n\n## What you can sell\nKitchen redesign and refurbishment concepts.\n\n## Try this next\nNow create a bathroom concept.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.\n\n> **Note:** Label this image RENOVATION CONCEPT. It is not proof of the current property condition.\n","visual":{"before":"assets/willow/re-06-kitchen-source.png","after":"assets/willow/re-06-editorial-kitchen.png","label":"Existing kitchen / renovation concept"},"status":"researched"},{"id":"lesson-12","number":12,"title":"Renovate a bathroom","module":"concept","body":"## What you can do\nShow a complete bathroom direction inside the real bathroom footprint.\n\n## Why this is useful\nA strong concept can help a renovation company or property owner discuss a future result.\n\n## Practice files\nDownload the practice pack and use `sources/bathroom.png`.\n\n## Before you start\nOne bathroom photograph.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Seedream 5.0 Pro**\n\n## Why this model\nUse the current available image-editing route and verify the exact model before calling it tested.\n\n**Status: TESTED IN THE COURSE IMAGE ROUTE.** This synthetic source, exact edit prompt and result were run on 03 September 2026 using GPT Image 2 through the configured ChatGPT image route.\n\n## Do this\n1. Open Magnific Image Generator or the image-editing route available in your account.\n2. Choose the named model only if it is currently listed.\n3. Upload the untouched source image in the image/reference input.\n4. Paste the prompt and generate 2 to 4 fresh versions.\n5. Download only the accurate result.\n\n## Copy this prompt\n```\nCreate a renovation concept for this exact bathroom. Keep the original room dimensions, doors, windows, plumbing positions and camera viewpoint. Use warm stone, a natural timber vanity, frameless glass shower, premium fittings, subtle lighting and refined neutral materials. Everything must fit realistically within the existing space. Do not add rooms or move openings. High-end architectural interiors editorial, realistic materials, premium but believable.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nWindow, tub, toilet, vanity position, plumbing and room size remain. Only finishes and fixtures change.\n\n## Save this\nDownload the approved result as `12-bathroom-concept.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf fixed architecture moves or materials spread onto the wrong surfaces, discard the result and regenerate from the original with one transformation only.\n\n## What you can sell\nBathroom redesign concepts for renovation businesses and landlords.\n\n## Try this next\nNow transform the exterior or garden.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.\n\n> **Note:** This is a future concept, not a certified building plan or current-condition photograph.\n","visual":{"before":"assets/willow/re-12-bathroom-source.png","after":"assets/willow/re-12-bathroom-renovated.png","label":"The bathroom layout and plumbing positions remain fixed. Only finishes and fixtures changed."},"status":"tested"},{"id":"lesson-13","number":13,"title":"Transform an exterior or garden","module":"concept","body":"## What you can do\nMake the same property feel cared for with a strong garden and entrance concept.\n\n## Why this is useful\nA neglected entrance can hide the value of a property.\n\n## Practice files\nDownload the practice pack and use `sources/exterior.png`.\n\n## Before you start\nOne exterior photograph.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Seedream 5.0 Pro**\n\n## Why this model\nMagnific lists image generation and editing routes with current high-end image models.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Image Generator or the image-editing route available in your account.\n2. Choose the named model only if it is currently listed.\n3. Upload the untouched source image in the image/reference input.\n4. Paste the prompt and generate 2 to 4 fresh versions.\n5. Download only the accurate result.\n\n## Copy this prompt\n```\nTransform the garden of this exact property into a high-end editorial landscape design. Keep the house, roof, chimney, windows, doors, driveway, boundaries, building shape and camera position exactly unchanged. Add sculptural gravel, clipped grasses, dark basalt stepping stones, a long terracotta bench, architectural olive trees and warm low landscape lights. Preserve the same property and viewpoint. Premium architecture and fashion-lifestyle magazine photography, believable plants and materials.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nBuilding footprint, roof, doors, windows and boundaries remain. Only the stated exterior or garden change appears.\n\n## Save this\nDownload the approved result as `13-exterior-concept.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf fixed architecture moves or materials spread onto the wrong surfaces, discard the result and regenerate from the original with one transformation only.\n\n## What you can sell\nGarden visualisation and exterior improvement concepts.\n\n## Try this next\nNow make the same house feel like a premium listing image.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":{"before":"assets/willow/re-08-exterior-source.png","after":"assets/willow/re-08-editorial-garden.png","label":"Existing exterior / garden concept"},"status":"researched"},{"id":"lesson-14","number":14,"title":"Create a premium listing look","module":"look","body":"## What you can do\nMake an ordinary property photograph feel like a serious international property campaign.\n\n## Why this is useful\nThe value is not only correction. It is presenting the property with confidence and taste.\n\n## Practice files\nDownload the practice pack and use `sources/dark-living.png`.\n\n## Before you start\nOne existing property photograph.\n\n## Use this platform\n**ChatGPT.com**\n\n## Use this model\n**ChatGPT Images 2.0**\n\n## Why this model\nOpenAI recommends clear image purpose, subject, style and fixed constraints.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open ChatGPT and start a new chat.\n2. Attach the untouched source image. There is no course-verified model-picker step.\n3. Paste the prompt and send it with the image.\n4. Generate 2 to 4 fresh versions from the original.\n5. Compare fixed architecture and keep only an accurate result.\n\n## Copy this prompt\n```\nRecreate this exact property photograph as a premium international real-estate campaign image. Keep the exact property, furniture, architecture, room proportions, windows, outside view and camera viewpoint. Improve only the photographic feeling: beautiful natural daylight, rich realistic materials, elegant contrast, controlled highlights, refined depth and a subtle real-lens character. Do not add architecture, change furniture or invent a new view. Photographed rather than computer-generated, luxury interiors magazine quality.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nThe image looks clean and premium without changing property facts or creating fake views.\n\n## Save this\nDownload the approved result as `14-premium-listing.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf fixed architecture moves or materials spread onto the wrong surfaces, discard the result and regenerate from the original with one transformation only.\n\n## What you can sell\nPremium listing-image upgrades.\n\n## Try this next\nNow give the same image a different visual character.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":null,"status":"researched"},{"id":"lesson-15","number":15,"title":"Give property photos character","module":"look","body":"## What you can do\nApply a reusable visual direction such as warm editorial, vintage character, boutique hotel or twilight architecture.\n\n## Why this is useful\nA repeatable look helps a creator make a property set feel intentional.\n\n## Practice files\nDownload the practice pack and use `sources/furnished-living.png`.\n\n## Before you start\nOne property photograph and one chosen look preset.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Nano Banana 2**\n\n## Why this model\nMagnific’s current catalogue lists Nano Banana 2 and multiple image-generation routes.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Image Generator or the image-editing route available in your account.\n2. Choose the named model only if it is currently listed.\n3. Upload the untouched source image in the image/reference input.\n4. Paste the prompt and generate 2 to 4 fresh versions.\n5. Download only the accurate result.\n\n## Copy this prompt\n```\nKeep this exact property photograph, architecture, furniture, layout, outside view and camera viewpoint unchanged. Apply this visual direction: quiet boutique-hotel character: warm neutral palette, soft window light, restrained walnut and linen accents, natural material texture. Change the mood, light and photographic character only. Keep the result believable, premium and suitable for property marketing. Do not invent rooms, move windows or replace permanent features.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nThe look is consistent and restrained. Architecture, furniture identity and materials stay believable.\n\n## Save this\nDownload the approved result as `15-character-look.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf fixed architecture moves or materials spread onto the wrong surfaces, discard the result and regenerate from the original with one transformation only.\n\n## What you can sell\nPremium image look presets as an add-on service.\n\n## Try this next\nNow make a believable day-to-twilight image.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":null,"status":"researched"},{"id":"lesson-16","number":16,"title":"Make a day-to-twilight version","module":"look","body":"## What you can do\nCreate a dramatic atmospheric version of the same exterior without changing the house.\n\n## Why this is useful\nA twilight hero image can give a property campaign a second visual moment.\n\n## Practice files\nDownload the practice pack and use `sources/exterior.png`.\n\n## Before you start\nOne daytime exterior image. Label the result as an atmospheric version.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Seedream 5.0 Pro**\n\n## Why this model\nThe current Magnific catalogue lists Seedream 5.0 Pro and current image tools.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Image Generator or the image-editing route available in your account.\n2. Choose the named model only if it is currently listed.\n3. Upload the untouched source image in the image/reference input.\n4. Paste the prompt and generate 2 to 4 fresh versions.\n5. Download only the accurate result.\n\n## Copy this prompt\n```\nCreate a dramatic late-blue-hour version of this exact exterior photograph. Keep the same house, roof, chimney, windows, doors, driveway, garden boundaries, building shape and camera position. Change only the time of day: deep indigo sky, copper horizon, warm believable interior lights, cool garden shadows and subtle reflections. Premium architectural fashion magazine photography, cinematic but realistic, no new buildings.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nThe exact house, roof, windows, doors, garden and camera position remain. Only time of day changes.\n\n## Save this\nDownload the approved result as `16-twilight-exterior.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf fixed architecture moves or materials spread onto the wrong surfaces, discard the result and regenerate from the original with one transformation only.\n\n## What you can sell\nDay-to-twilight campaign images.\n\n## Try this next\nNow turn a floor plan into a 3D-looking visual.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.\n\n> **Note:** Label this as an atmospheric derivative. It is not the property’s actual lighting record.\n","visual":{"before":"assets/willow/re-08-exterior-source.png","after":"assets/willow/re-08-editorial-blue-hour.png","label":"Day exterior / blue-hour result"},"status":"researched"},{"id":"lesson-17","number":17,"title":"Turn a 2D floor plan into a 3D dollhouse view","module":"floor","body":"## What you can do\nMake a floor plan easier to understand with a polished 3D-looking visual.\n\n## Why this is useful\nMany people understand space faster when they can see depth and furniture.\n\n## Practice files\nDownload the practice pack and use `sources/floor-plan.png`.\n\n## Before you start\nDownload the practice floor plan or upload a real plan you are allowed to use.\n\n## Use this platform\n**Gemini.com**\n\n## Use this model\n**Nano Banana 2**\n\n## Why this model\nGoogle documents image generation, uploaded images and multiple references.\n\n**Status: TESTED IN THE COURSE IMAGE ROUTE.** This exact teaching plan, prompt and dollhouse result were run on 03 September 2026 using GPT Image 2 through the configured ChatGPT image route.\n\n## Do this\n1. Open Gemini and start a new prompt.\n2. Attach the untouched source image or floor plan.\n3. Paste the prompt below.\n4. Generate 2 to 4 versions from the original input.\n5. Reject any result that changes fixed property facts.\n\n## Copy this prompt\n```\nUse this floor plan as the layout reference. Transform it into a polished 3D dollhouse-style architectural visual viewed from above at an angle. Preserve the visible arrangement of rooms, walls, doorways and major spaces as closely as possible. Add tasteful modern furnishings so viewers can understand the property. Do not add unnecessary rooms or claim that this is a certified architectural plan. Premium architectural visualisation, realistic materials, soft daylight, elegant and believable.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nThe dollhouse has the same room order, walls, openings, windows, kitchen and bathroom positions as the plan.\n\n## Save this\nDownload the approved result as `17-dollhouse.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf room count, walls or door positions drift from the plan, discard the result and return to the original plan. Simplify furnishing detail before changing layout constraints.\n\n## What you can sell\n3D floor-plan visualisation for agents, developers and property owners.\n\n## Try this next\nNow prepare the first and last images for an animated transformation.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.\n\n> **Note:** This is a marketing visual interpretation, not a certified architectural drawing.\n","visual":{"before":"assets/practice/practice-floor-plan.png","after":"assets/willow/re-17-floor-plan-dollhouse.png","label":"The exact one-bedroom teaching plan was converted into a five-zone 3D dollhouse with the same room order and openings."},"status":"tested"},{"id":"lesson-18","number":18,"title":"Prepare the 3D floor-plan end frame","module":"floor","body":"## What you can do\nPrepare a clear first frame and last frame for a plan-to-3D video.\n\n## Why this is useful\nTwo matching viewpoints give an AI video model a clearer start and finish.\n\n## Practice files\nDownload the practice pack and use `sources/floor-plan.png` and `endpoints/floor-plan-dollhouse.png`.\n\n## Before you start\nOne original 2D floor plan and one 3D-looking version.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Seedream 5.0 Pro**\n\n## Why this model\nUse the current image model route available on the platform and label the work according to what was actually run.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Image Generator or the image-editing route available in your account.\n2. Choose the named model only if it is currently listed.\n3. Upload the untouched source image in the image/reference input.\n4. Paste the prompt and generate 2 to 4 fresh versions.\n5. Download only the accurate result.\n\n## Copy this prompt\n```\nCreate a polished 3D dollhouse version of this exact floor plan for use as a video end frame. Keep the room arrangement, walls, doorways and major spaces aligned with the plan. Use believable floors, walls and tasteful furniture. Keep the camera viewpoint stable and easy to compare with the supplied plan. Premium architectural editorial visualisation, realistic materials, no extra rooms.\n```\n\n## Generate a few\nAI results can vary. Generate 2 to 4 versions from the original image. Keep the strongest accurate one.\n\n## Check your result\nThe 2D plan and 3D end frame describe the same footprint and openings. Both share a matching canvas and orientation.\n\n## Save this\nDownload the approved result as `18-aligned-end-frame.png`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf room count, walls or door positions drift from the plan, discard the result and return to the original plan. Simplify furnishing detail before changing layout constraints.\n\n## What you can sell\nFloor-plan animation preparation.\n\n## Try this next\nNow animate one real property photograph.\n\n## Alternative\nUse another current AI image editor only if it accepts the same source inputs. Interface names vary. Keep the same prompt and the same accuracy check.","visual":null,"status":"researched"},{"id":"lesson-19","number":19,"title":"Make your first property video","module":"video","body":"## What you can do\nTurn one still property photograph into a calm AI video shot.\n\n## Why this is useful\nA still image can become a short social clip or part of a property film.\n\n## Practice files\nDownload the practice pack and use `endpoints/staged-living.png`.\n\n## Before you start\nOne clear property photograph. Start with a part of the room already visible.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Seedance 2.5**\n\n## Why this model\nMagnific’s current video generator lists Seedance routes and image-to-video creation from a reference image.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose image-to-video.\n2. Upload the untouched property photograph as the start frame.\n3. Choose the named model only if it is currently listed.\n4. Preserve the source aspect ratio and start with a short duration.\n5. Paste the motion prompt, generate, then reject warping, furniture motion or invented rooms.\n\n## Copy this prompt\n```\nUse the uploaded property photograph as the exact first frame. Create a slow, elegant camera movement gently moving forward into the room. Keep the architecture, windows, doors, furniture, outside view and room layout stable. Nothing in the room should move. No furniture should change shape. No new objects should appear. Premium luxury-property commercial, professional full-frame camera character, controlled 24mm architectural lens feeling, realistic natural light.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nFirst frame matches the source. Sample the start, middle and end: no warping, moving furniture or invented rooms.\n\n## Save this\nDownload the approved result as `19-first-property-shot.mp4`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nAI property photo animation.\n\n## Try this next\nNow try five safe property camera moves.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.\n\n> **Note:** Use the exact current model option shown on the platform. Video access and model names can change.\n","visual":null,"status":"researched"},{"id":"lesson-20","number":20,"title":"Five safe property camera moves","module":"video","body":"## What you can do\nUse five restrained movement prompts that respect what the source image can actually show.\n\n## Why this is useful\nSimple movement usually gives a more believable property clip than a huge dramatic move.\n\n## Practice files\nDownload the practice pack and use `endpoints/staged-living.png`.\n\n## Before you start\nOne property photograph for each move.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Wan 3.0**\n\n## Why this model\nMagnific’s current catalogue lists Wan 3.0 video routes and image-to-video creation.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose image-to-video.\n2. Upload the untouched property photograph as the start frame.\n3. Choose the named model only if it is currently listed.\n4. Preserve the source aspect ratio and start with a short duration.\n5. Paste the motion prompt, generate, then reject warping, furniture motion or invented rooms.\n\n## Copy this prompt\n```\nCreate a restrained property video from this exact image. Choose one movement: a very slow push forward. Keep the visible architecture, furniture, windows, doors and materials stable. Reveal only information that can logically be inferred from the image. Do not invent new rooms, bend walls or morph objects. Premium property-commercial realism, smooth controlled movement, realistic natural light.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nThe move is small and smooth. Sample start, middle and end: architecture and objects remain stable.\n\n## Save this\nDownload the approved result as `20-safe-camera-move.mp4`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nShort AI property shots.\n\n## Try this next\nNow turn five property photos into five clips.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.","visual":null,"status":"researched"},{"id":"lesson-21","number":21,"title":"Turn five property photos into five cinematic shots","module":"video","body":"## What you can do\nCreate one strong short clip each from the exterior, living room, kitchen, bedroom and garden.\n\n## Why this is useful\nFive believable clips are more useful than one impossible walkthrough.\n\n## Practice files\nDownload the practice pack and use `sources/exterior.png`, `endpoints/staged-living.png`, `sources/kitchen.png`, `endpoints/staged-bedroom.png`, and `endpoints/garden-concept.png`.\n\n## Before you start\nFive property photographs with clear visible subjects.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Kling 3.0**\n\n## Why this model\nMagnific’s live model catalogue and video generator pages list Kling video routes.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose image-to-video.\n2. Upload the untouched property photograph as the start frame.\n3. Choose the named model only if it is currently listed.\n4. Preserve the source aspect ratio and start with a short duration.\n5. Paste the motion prompt, generate, then reject warping, furniture motion or invented rooms.\n\n## Copy this prompt\n```\nAnimate this exact property photograph into one short cinematic property shot. Choose the most important feature already visible and make a small controlled movement toward it. Keep the architecture, furniture, windows, doors and materials stable. Avoid large unseen areas, impossible camera orbits and new rooms. Premium architectural property commercial, realistic camera movement, subtle lens character, no warping.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nEach of the five clips starts from the correct photo. No clip invents a new room or changes fixed features.\n\n## Save this\nDownload the approved result as `21-five-shot-set.zip`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nFive-shot property reels.\n\n## Try this next\nNow try a first-frame and last-frame transformation.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.","visual":null,"status":"researched"},{"id":"lesson-22","number":22,"title":"Use a first frame and last frame","module":"video","body":"## What you can do\nMove from one approved property image to another approved image, such as empty to furnished or day to twilight.\n\n## Why this is useful\nTwo matching views can make a transformation feel deliberate instead of random.\n\n## Practice files\nDownload the practice pack and use `sources/empty-living.png` as the first frame and `endpoints/staged-living.png` as the last frame.\n\n## Before you start\nTwo images of the same room or house with a similar viewpoint.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Wan 3.0**\n\n## Why this model\nMagnific’s current video pricing page lists Wan 3.0 and reference-based video generation.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose an image-to-video route that accepts first and last frames.\n2. Put the original image in the first-frame input and the approved transformation image in the last-frame input.\n3. Choose the named model only if it is currently listed.\n4. Set a short duration and preserve the source aspect ratio.\n5. Paste the motion prompt, generate, then reject any clip with warped architecture or morphing objects.\n\n## Copy this prompt\n```\nUse IMAGE 1 as the first frame and IMAGE 2 as the last frame. Create a smooth property transformation between them. Keep the camera viewpoint, room architecture and fixed features stable. Let only the intended change happen: empty room to furnished room. Do not create impossible walls, furniture morphs or new rooms. Premium property-commercial realism, smooth controlled transition.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nFirst and last frames match the supplied endpoints. The middle does not bend walls or melt furniture.\n\n## Save this\nDownload the approved result as `22-first-last-transform.mp4`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nFirst-frame and last-frame transformation videos.\n\n## Try this next\nNow create a messy-room cleaning transformation.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.","visual":null,"status":"researched"},{"id":"lesson-23","number":23,"title":"Make a messy room become a clean room","module":"transform","body":"## What you can do\nTurn a messy image into a clean image as a satisfying cleaning hyperlapse.\n\n## Why this is useful\nBefore-and-after transformations are easy for viewers to understand and useful for social content.\n\n## Practice files\nDownload the practice pack and use `sources/cluttered-living.png` then `endpoints/clean-living.png`.\n\n## Before you start\nA messy source image and a clean approved result from the same viewpoint.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Seedance 2.5**\n\n## Why this model\nMagnific lists Seedance 2.5 and image-to-video generation in the current catalogue.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose an image-to-video route that accepts first and last frames.\n2. Put the original image in the first-frame input and the approved transformation image in the last-frame input.\n3. Choose the named model only if it is currently listed.\n4. Set a short duration and preserve the source aspect ratio.\n5. Paste the motion prompt, generate, then reject any clip with warped architecture or morphing objects.\n\n## Copy this prompt\n```\nUse the messy room as the first frame and the clean room as the last frame. Transform the room naturally into the clean finished room. Rubbish and loose objects should disappear progressively as if the room is being rapidly cleaned and organised. Keep the architecture and camera viewpoint locked. The room itself must not morph. Premium property-commercial realism, satisfying cleaning hyperlapse, stable furniture and walls.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nOnly clutter disappears. Walls, windows, sofa and viewpoint remain stable through sampled frames.\n\n## Save this\nDownload the approved result as `23-cleaning-transform.mp4`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nCleaning hyperlapse videos.\n\n## Try this next\nNow transform an empty room into a furnished room.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.","visual":null,"status":"researched"},{"id":"lesson-24","number":24,"title":"Make an empty room become a furnished room","module":"transform","body":"## What you can do\nMake furniture appear and settle into an empty room without changing the room itself.\n\n## Why this is useful\nThis creates a strong social reveal and shows a client what virtual staging can do.\n\n## Practice files\nDownload the practice pack and use `sources/empty-living.png` then `endpoints/staged-living.png`.\n\n## Before you start\nAn empty room and a finished staged image from the same viewpoint.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Wan 3.0**\n\n## Why this model\nWan 3.0 is listed in Magnific’s current video catalogue for image-to-video routes.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose an image-to-video route that accepts first and last frames.\n2. Put the original image in the first-frame input and the approved transformation image in the last-frame input.\n3. Choose the named model only if it is currently listed.\n4. Set a short duration and preserve the source aspect ratio.\n5. Paste the motion prompt, generate, then reject any clip with warped architecture or morphing objects.\n\n## Copy this prompt\n```\nUse the empty room as the first frame and the finished staged room as the last frame. Create a visually satisfying furnishing transformation. The room itself remains unchanged while the furniture appears and assembles naturally into its final positions. Keep the camera locked. Do not change the windows, walls, doors, floor, ceiling or outside view. Premium property commercial, realistic materials, controlled transformation, no magical chaos.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nFurniture resolves into the approved final positions. The room itself never changes shape.\n\n## Save this\nDownload the approved result as `24-furnishing-transform.mp4`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nEmpty-to-furnished videos.\n\n## Try this next\nNow create an old-room-to-renovated-room transformation.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.","visual":null,"status":"researched"},{"id":"lesson-25","number":25,"title":"Make an old room become a renovated room","module":"transform","body":"## What you can do\nTurn an existing room into a renovation concept through a clean visual transformation.\n\n## Why this is useful\nRenovation companies and property owners can use this to show a possible future result.\n\n## Practice files\nDownload the practice pack and use `sources/kitchen.png` then `endpoints/renovated-kitchen.png`.\n\n## Before you start\nAn original room and a clearly labelled renovation concept from the same viewpoint.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Seedance 2.5**\n\n## Why this model\nSeedance 2.5 is listed on Magnific’s current video generator pages.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose an image-to-video route that accepts first and last frames.\n2. Put the original image in the first-frame input and the approved transformation image in the last-frame input.\n3. Choose the named model only if it is currently listed.\n4. Set a short duration and preserve the source aspect ratio.\n5. Paste the motion prompt, generate, then reject any clip with warped architecture or morphing objects.\n\n## Copy this prompt\n```\nUse the original room as the first frame and the completed renovation concept as the last frame. Create a rapid renovation transformation. Keep the exact room structure and camera position stable. Let finishes, surfaces and interior elements transform progressively toward the final reference. Nothing should distort or melt. Premium renovation hyperlapse, believable materials, stable architecture, controlled movement.\n```\n\n## Make test clips\nGenerate one short test first. Check the first, middle and last frame. Make more versions only after the route and inputs work.\n\n## Check your result\nThe transition reaches the approved renovation. Openings, cabinetry layout and room geometry remain stable.\n\n## Save this\nDownload the approved result as `25-renovation-transform.mp4`. Keep the untouched source beside it.\n\n## If AI gets it wrong\nIf walls warp, furniture moves, the camera reveals invented rooms or the transition melts, discard the clip. Return to the original frame or approved endpoints, shorten the duration and reduce the camera movement.\n\n## What you can sell\nRenovation transformation videos.\n\n## Try this next\nNow make a full property transformation.\n\n## Alternative\nNo alternative route is claimed as tested here. If the named model is unavailable, use a current image-to-video tool that accepts the same required inputs, then apply the same frame checks.","visual":null,"status":"researched"},{"id":"lesson-26","number":26,"title":"Create a full property transformation","module":"transform","body":"## What you can do\nBuild a sequence from messy, to empty, to renovated, to furnished.\n\n## Why this is useful\nOne property can become a complete transformation story.\n\n## Practice files\nDownload the practice pack and use `sources/cluttered-living.png`, `endpoints/empty-living.png`, `endpoints/renovated-living.png`, and `endpoints/staged-living.png` in that order.\n\n## Before you start\nFour approved images with similar viewpoints.\n\n## Use this platform\n**Magnific**\n\n## Use this model\n**Wan 3.0**\n\n## Why this model\nWan 3.0 is listed for reference-heavy image-to-video routes on Magnific’s current platform pages.\n\n**Status: RESEARCHED, NOT YET TESTED.** The platform and model availability were checked, but this exact workflow must be run before it can be called tested.\n\n## Do this\n1. Open Magnific Video Generator and choose the multi-reference or refere
