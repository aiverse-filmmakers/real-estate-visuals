<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>AI Real Estate Visuals</title><style>
:root{--bg:#fff;--surface:#f5f5f7;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--accent:#0071e3;--soft:#e8f2ff;--good:#18864b;color-scheme:light}html[data-theme=dark]{--bg:#000;--surface:#111;--text:#f5f5f7;--muted:#a1a1a6;--line:#333;--accent:#2997ff;--soft:#10243a;--good:#50d890;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}button,input{font:inherit}a{color:inherit}.header{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:16px;min-height:64px;padding:0 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font-size:12px;letter-spacing:.12em;font-weight:800;text-decoration:none;white-space:nowrap}.sub{color:var(--muted);font-size:14px}.tools{margin-left:auto;display:flex;gap:8px;align-items:center}.icon{border:0;background:transparent;color:var(--text);width:44px;height:44px;border-radius:10px;cursor:pointer}.icon:hover{background:var(--surface)}.switch{width:68px;height:36px;border:1px solid var(--line);border-radius:20px;background:var(--surface);position:relative;cursor:pointer}.switch i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:var(--text);transition:transform .25s}html[data-theme=dark] .switch i{transform:translateX(32px)}.switch b,.switch em{position:absolute;top:6px;font-style:normal;font-size:14px}.switch b{left:8px}.switch em{right:8px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 64px)}.side{position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;padding:26px 16px;background:var(--surface);border-right:1px solid var(--line)}.side-label,.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.side-label{padding:0 10px 10px}.cat{width:100%;border:0;background:transparent;color:var(--text);padding:11px 10px;border-radius:10px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.cat:hover,.cat.active{background:var(--bg)}.count{color:var(--muted);font-size:12px}.main{min-width:0}.view{max-width:1120px;margin:auto;padding:clamp(34px,6vw,86px) clamp(22px,5vw,72px) 100px}.hero{max-width:900px;padding:20px 0 72px}h1{font-size:clamp(46px,8vw,108px);line-height:.94;letter-spacing:-.07em;margin:14px 0 28px}h2{font-size:clamp(32px,5vw,62px);line-height:1;letter-spacing:-.05em;margin:8px 0 16px}h3{font-size:23px;line-height:1.15;margin:12px 0 8px}.lede{font-size:clamp(19px,2.2vw,25px);line-height:1.4;color:var(--muted);max-width:720px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.primary,.secondary{min-height:48px;padding:0 18px;border-radius:11px;display:inline-flex;align-items:center;text-decoration:none;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:white;border:1px solid var(--accent)}.secondary{background:var(--surface);border:1px solid var(--line)}.journey,.grid{display:grid;gap:16px}.journey{grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:17px;overflow:hidden}.journey article{background:var(--bg);padding:24px}.journey strong{display:block;margin-bottom:6px;font-size:18px}.journey span{color:var(--muted);font-size:14px}.grid{grid-template-columns:repeat(2,1fr)}.card,.lesson{border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:22px;cursor:pointer}.card:hover,.lesson:hover{border-color:var(--accent);box-shadow:0 15px 42px rgba(0,0,0,.08)}.card p,.lesson p,.muted{color:var(--muted)}.card-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.section-head>p{max-width:460px}.reader{max-width:820px}.reader h1{max-width:800px}.mission{font-size:21px;line-height:1.4;color:var(--muted);max-width:750px;margin:0 0 34px}.block{border-top:1px solid var(--line);padding:28px 0}.block h2{font-size:25px;letter-spacing:-.025em;margin:0 0 13px}.steps{counter-reset:step;display:grid;gap:13px;margin:0;padding:0;list-style:none}.steps li{counter-increment:step;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}.steps li:before{content:counter(step);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:13px;font-weight:800}.prompt{padding:20px;border:1px solid var(--line);border-radius:13px;background:var(--surface);white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}.copy{margin-top:12px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px;cursor:pointer}.outcome{padding:18px 20px;background:var(--soft);border-radius:13px;color:var(--text)}.qc{display:grid;gap:9px;margin:0;padding:0;list-style:none}.qc li:before{content:'✓';color:var(--good);font-weight:800;margin-right:9px}.lesson-nav{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:24px;margin-top:38px}.lesson-nav button{border:0;background:transparent;text-align:left;cursor:pointer;max-width:48%;color:var(--text)}.lesson-nav button:last-child{text-align:right}.lesson-nav small{display:block;color:var(--muted);margin-bottom:5px}.complete{margin-top:26px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.complete.done{background:var(--good);color:#fff;border-color:var(--good)}.mobile{display:none}.results{display:grid;gap:10px}.result{border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}.result:hover{border-color:var(--accent)}@media(max-width:800px){.layout{display:block}.side{display:none}.mobile{display:block}.mobile details summary{padding:13px 22px;border-bottom:1px solid var(--line);color:var(--muted);cursor:pointer}.mobile nav{padding:8px 14px;background:var(--surface)}.mobile .cat{display:flex}.journey,.grid{grid-template-columns:1fr}.section-head{display:block}.sub{display:none}.header{padding:0 16px}.view{padding-top:34px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}@media(prefers-contrast:more){.card,.lesson,.prompt,.result{border-width:2px}}
.current-tools{margin:0 0 32px;padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.current-tools h2{margin:8px 0;font-size:clamp(24px,3vw,36px);letter-spacing:-.03em}.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.tool-grid article{padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--bg)}.tool-grid strong,.tool-grid span{display:block}.tool-grid strong{margin-bottom:7px}.tool-grid span{font-size:14px;color:var(--muted);line-height:1.45}.tool-grid a{color:var(--accent);text-decoration:none}@media(max-width:800px){.tool-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.tool-grid{grid-template-columns:1fr}}.qc-gates{display:grid;gap:10px;margin:16px 0}.qc-gate{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}.qc-gate input{width:20px;height:20px;accent-color:var(--good);margin-top:2px}.qc-gate strong,.qc-gate small{display:block}.qc-gate small{color:var(--muted);margin-top:3px;line-height:1.45}.qc-gate.passed{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}.avatar-test{display:grid;gap:3px;margin-top:16px;padding:15px;border-left:3px solid var(--accent);background:var(--soft)}.avatar-test span{color:var(--muted)}.complete:disabled{opacity:.55;cursor:not-allowed}.reader{width:100%;max-width:900px;margin:0 auto}.steps li{grid-template-columns:34px minmax(0,1fr)}.step-copy{display:block;min-width:0}.step-copy strong{display:inline-block;margin-right:4px}@media(min-width:1000px){.view{width:100%;padding-left:clamp(40px,6vw,96px);padding-right:clamp(40px,6vw,96px)}}</style></head><body><header class="header"><a class="brand" href="#home">AI-VERSE FILMMAKERS</a><span class="sub">AI Real Estate Visuals</span><div class="tools"><button class="icon" id="search" aria-label="Search lessons">⌕</button><button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Switch to dark mode"><b>☀</b><em>☾</em><i></i></button></div></header><div class="mobile"><details><summary>Browse categories</summary><nav id="mobileNav"></nav></details></div><div class="layout"><aside class="side"><div class="side-label">Curriculum</div><nav id="nav"></nav></aside><main class="main" id="app"></main></div><script>const curriculum=[{"id":"foundations","title":"Foundations","description":"Start with the mission, the project and the standard.","pages":[{"id":"what-youll-build","title":"What AI Does in This Course","mission":"UNDERSTAND THE JOB BEFORE YOU OPEN A TOOL","steps":["Read this simple definition: in this course, AI is an assistant that can remove, enhance, stage, animate or organise visual material. It is not the owner of the property facts.","Choose one real property image you are allowed to work with. This is your source image. Do not start from a random text-to-image experiment.","Write one sentence describing what must stay true in that image: room shape, windows, doors, floors, fixtures and view.","Write one sentence describing the visual task you want help with: cleanup, lighting, staging or motion.","Save both sentences in a file called 01_PROJECT_BRIEF.md, then read them back and check that the task names one source image and one controlled change."],"prompt":"Explain the visual task in plain language. Start with the source image, state what must remain unchanged, then state the one controlled change you want to test.","deliverable":"Your project brief and first deliverable list.","outcome":"You understand the role of AI in this course and have one source image plus one controlled visual task.","qc":["Can a complete beginner explain what the source image is?","Does the task change one thing instead of inventing a new property?","Is the brief saved beside the project files?","Would Alex know what to do next without asking for hidden context?","Did you write a pass or fail decision for the first task?"]},{"id":"who-this-is-for","title":"What You’ll Build","mission":"SEE THE FINISHED RESULT BEFORE YOU START","steps":["Open the project brief from the previous page.","Choose the smallest useful first result: one cleaned room image, one enhanced room image or one restrained moving clip.","Write the input, process and output: source image → controlled AI treatment → approved master.","List the later outputs only as a route: staged rooms, property film, campaign assets and a simple web presentation.","Save the route as 02_OUTPUT_MAP.md. Do not generate the whole campaign on day one."],"prompt":"My first useful result is [asset]. It starts from [source]. The AI may change [controlled treatment]. It must preserve [property facts]. The finished file will be checked at full size and phone size.","deliverable":"A one-paragraph role and project brief.","outcome":"You can see the destination and you have chosen one achievable first result.","qc":["Is the first result small enough to finish today?","Is the source and final file clearly defined?","Are later outputs separated from today’s task?","Would Alex understand what finished means?"]},{"id":"the-one-property-project","title":"The One Property Project","mission":"LOCK THE PROPERTY PROJECT","steps":["Choose one property with enough source material to work from.","Create folders: 01_SOURCE, 02_TRUTH, 03_WORKING, 04_APPROVED, 05_DELIVERY.","Copy the source media into 01_SOURCE. Never overwrite the originals.","Write the final campaign outcome in one sentence.","Save the finished working file, write down what changed and use it as the starting point for the next page."],"prompt":"Property project: [name]. Location: [location]. Primary story: [what makes this property worth seeing]. Final campaign: [deliverables].","deliverable":"An organised project folder and one-sentence campaign goal.","outcome":"When you finish this page, you should have an organised project folder and one-sentence campaign goal..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"tools-and-working-files","title":"Your Tools and Working Files","mission":"CHOOSE THE RIGHT TOOL FOR ONE CLEAR JOB","steps":["Start with the job, not the brand name: edit pixels, generate a variation, create motion, finish a timeline or inspect a file.","Use a current image editor for controlled cleanup and masks, a current generator for visual drafts, an NLE for editing and a media inspector for technical checks.","Create files named project brief, truth sheet, visual bible, prompt, draft log and QC checklist.","Open the current tool documentation before following an interface instruction. Tool names, model names and controls can change.","Record the tool, model or version and date used in your draft log, then save the log beside the project brief."],"prompt":"Tool decision: job=[one job]. Input=[file]. Required control=[what must stay fixed]. Output=[file type and ratio]. Current tool checked=[name and official documentation date]. Fallback=[manual or tool-agnostic method].","deliverable":"A complete working-file starter pack.","outcome":"You know what each tool is for and have working files that protect your decisions from tool changes.","qc":["Does every tool have one defined job?","Is there a tool-agnostic fallback?","Is the current version or documentation date recorded?","Would Alex know what to open and why?","Is the draft log saved with the tool and date used?"]},{"id":"ai-verse-quality-standard","title":"Your First Quality Check","mission":"LEARN TO REJECT A BEAUTIFUL WRONG RESULT","steps":["Open the source image and the draft beside each other.","Check the property facts first: architecture, room dimensions, windows, doors, fixtures, floors, views and reflections.","Check the visual treatment second: light, colour, materials, furniture, motion and continuity.","Check the file third: dimensions, ratio, codec or format, naming and location.","Write one pass or fail decision. If it fails, name the exact defect before regenerating."],"prompt":"QC this property visual as a production asset. Compare it against the source truth. List any changed property facts, visual artefacts, continuity problems and technical export failures. End with PASS or FAIL and the reason.","deliverable":"A pass or fail checklist for your first property asset.","outcome":"You can make a defensible pass or fail decision instead of accepting the first impressive result.","qc":["Did you compare against the source?","Did you inspect the result at full size and phone size?","Did you identify a specific failure instead of saying it feels wrong?","Would Alex know what to fix next?"]}]},{"id":"property-truth","title":"Property Truth","description":"Lock what is real before you improve how it looks.","pages":[{"id":"property-truth-sheet","title":"Property Truth Sheet","mission":"WRITE THE PROPERTY TRUTH SHEET","steps":["List every room and its purpose.","Record fixed features: walls, windows, doors, floors, ceilings, fixtures, views and built-in furniture.","Mark what may change, what may be enhanced and what must never change.","Attach the source image filename for every important observation.","Save the completed record beside the source media and use it as the authority for every later decision."],"prompt":"Property truth sheet for [property]. Preserve: [fixed features]. Allowed concepts: [staging, lighting, cleanup]. Do not invent: [restricted details].","deliverable":"A completed property truth sheet.","outcome":"When you finish this page, you should have a completed property truth sheet..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"source-image-audit","title":"Source Image Audit","mission":"AUDIT YOUR SOURCE IMAGES BEFORE AI","steps":["Create a contact sheet of the supplied images.","For each frame, score geometry, exposure, lens distortion, reflections and usable composition from 1 to 5.","Mark the strongest frame for each room.","Reject frames with missing information before you use them as generation inputs.","Save the completed record beside the source media and use it as the authority for every later decision."],"prompt":"Audit this source frame for real-estate production. Identify usable geometry, lens distortion, exposure problems, missing detail, reflections and the safest camera movement.","deliverable":"A selected source-frame list with reasons.","outcome":"When you finish this page, you should have a selected source-frame list with reasons..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"real-changes-vs-visual-concepts","title":"Real Changes Vs Visual Concepts","mission":"SEPARATE FACT FROM VISUAL CONCEPT","steps":["Copy the truth sheet into two columns: existing fact and proposed visual concept.","Put cleanup, colour correction and privacy removal in the treatment column only when they don’t change the property.","Put furniture, renovation, landscaping or architectural changes in the concept column.","Label every concept before it reaches a public deliverable.","Save the completed record beside the source media and use it as the authority for every later decision."],"prompt":"Classify each proposed change to [property] as EXISTING, ENHANCED, CONCEPTUAL or UNKNOWN. Explain the evidence for each classification.","deliverable":"A classified change list.","outcome":"When you finish this page, you should have a classified change list..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"media-intake-and-organisation","title":"Media Intake and Organisation","mission":"BUILD A CLEAN MEDIA INTAKE","steps":["Duplicate the supplied media into the source folder without renaming the originals.","Create a source log with filename, room, orientation and notes.","Create working proxies only when needed.","Move approved outputs into a separate approved folder.","Save the completed record beside the source media and use it as the authority for every later decision."],"prompt":"Organise this property media into source, working, approved and delivery groups. Never treat a generated file as the original.","deliverable":"A source log and folder structure.","outcome":"When you finish this page, you should have a source log and folder structure..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"property-visual-bible","title":"Property Visual Bible","mission":"LOCK THE PROPERTY’S VISUAL DNA","steps":["Choose the visual direction: natural listing, editorial, cinematic or another clear treatment.","Define camera height, lens feeling, contrast, colour, material treatment and staging language.","List three things that must remain consistent across every room.","Use this bible to reject attractive but incompatible outputs.","Save the completed record beside the source media and use it as the authority for every later decision."],"prompt":"Visual bible for [property]. Camera: [logic]. Light: [logic]. Materials: [language]. Grade: [grade]. Preserve: [fixed details].","deliverable":"A one-page property visual bible.","outcome":"When you finish this page, you should have a one-page property visual bible..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]}]},{"id":"ai-property-images","title":"AI Property Images","description":"Improve the image without damaging the property.","pages":[{"id":"cleanup-and-declutter","title":"Cleanup and Declutter","mission":"REMOVE DISTRACTIONS WITHOUT CHANGING THE ROOM","steps":["Duplicate the source image into the working folder and rename the copy with a version number before making any removal.","Circle only the objects you are allowed to remove: bins, loose cables, temporary clutter and distracting small items.","Remove in small selections. Review every fill at 100 percent.","Compare the cleaned image against the truth sheet.","After each removal, zoom to 100 percent and compare the repaired edges, shadows and floor lines against the original.","Write PASS or FAIL in the draft log and save the approved cleanup as CLEANUP_v01.png."],"prompt":"Remove only the selected temporary clutter from this property image. Preserve the architecture, floor, walls, windows, fixtures, light direction, perspective and materials.","deliverable":"A cleaned image plus a before-and-after review.","outcome":"When you finish this page, you should have a cleaned image plus a before-and-after review..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"depersonalisation-and-privacy-cleanup","title":"Depersonalisation and Privacy Cleanup","mission":"MAKE THE IMAGE SAFE TO SHOW","steps":["Inventory faces, mirrors, framed photos, documents, screens, plates and reflective surfaces.","Blur, replace or remove only the private information that needs treatment.","Check reflections and secondary surfaces after the first pass.","Strip metadata from the delivery copy if required by the workflow.","Export the approved image as a master and a clearly named working derivative."],"prompt":"Depersonalise this property image. Remove or obscure private faces, documents, screens, plates and personal photographs. Do not change the room, architecture, materials or lighting.","deliverable":"A privacy-reviewed delivery copy.","outcome":"When you finish this page, you should have a privacy-reviewed delivery copy..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"lighting-and-exposure-enhancement","title":"Lighting and Exposure Enhancement","mission":"IMPROVE LIGHT WITHOUT INVENTING DETAIL","steps":["Create a protected copy of the source.","Use local masks for windows, ceilings, dark corners and practical lights.","Balance exposure, highlights, shadows, temperature and tint separately.","Zoom into windows and reflective surfaces to check for hallucinated detail.","Export the approved image as a master and a clearly named working derivative."],"prompt":"Improve exposure and colour balance for this real-estate interior. Recover readable detail where possible. Do not invent views, fixtures, windows or materials. Preserve the original light direction.","deliverable":"A natural exposure-enhanced image.","outcome":"When you finish this page, you should have a natural exposure-enhanced image..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"exterior-and-twilight-variants","title":"Exterior and Twilight Variants","mission":"CREATE A CONTROLLED EXTERIOR VARIANT","steps":["Choose a truthful daylight exterior as the base.","Record the roofline, windows, landscaping, weather and practical lights.","Create a twilight treatment that changes atmosphere, not architecture.","Compare the result against the source at full size.","Export the approved image as a master and a clearly named working derivative."],"prompt":"Create a restrained twilight variant of this exact property exterior. Preserve roofline, windows, doors, landscaping, proportions and camera position. Add only plausible ambient and practical light.","deliverable":"A labelled exterior variant with source comparison.","outcome":"When you finish this page, you should have a labelled exterior variant with source comparison..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"image-qc-and-export","title":"Image Qc and Export","mission":"PREPARE A CLEAN IMAGE MASTER","steps":["Inspect the image at full size and phone size.","Check geometry, text, faces, reflections, repeating textures and colour.","Export a full-resolution master and platform derivatives from the approved image.","Open every export after writing it.","Export the approved image as a master and a clearly named working derivative."],"prompt":"Final image QC: source truth, architecture, materials, privacy, colour, crop, dimensions, filename and delivery folder.","deliverable":"An approved master plus checked derivatives.","outcome":"When you finish this page, you should have an approved master plus checked derivatives..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]}]},{"id":"virtual-staging","title":"Virtual Staging","description":"Create believable design concepts from real rooms.","pages":[{"id":"empty-room-to-staged-room","title":"Empty Room to Staged Room","mission":"STAGE ONE EMPTY ROOM","steps":["Choose one empty-room source frame.","Write the room function and intended buyer context.","Place furniture for scale, circulation and use.","Preserve floor lines, walls, doors, windows, built-ins and light direction.","Label the result as a visualisation concept."],"prompt":"Stage this exact empty room as a [room function] for [buyer context]. Preserve camera position, architecture, floor lines, windows, doors and light direction. Add only believable furniture at correct scale.","deliverable":"One staged room concept with disclosure.","outcome":"When you finish this page, you should have one staged room concept with disclosure..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"perspective-and-depth-locking","title":"Perspective and Depth Locking","mission":"STOP THE FURNITURE FLOATING","steps":["Identify the floor plane, wall planes and vanishing direction in the source.","Place the largest furniture first.","Check contact points, scale, occlusion and wall intersections.","Repeat from three camera angles before approving the style.","Save the approved staged image beside the untouched source and label the treatment clearly."],"prompt":"Stage the room while locking perspective and depth. Furniture must sit on the floor, respect the room’s vanishing lines, cast plausible contact shadows and preserve all fixed features.","deliverable":"Three-angle perspective check.","outcome":"When you finish this page, you should have three-angle perspective check..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"style-packs-and-buyer-context","title":"Style Packs and Buyer Context","mission":"CREATE THREE USEFUL STYLE DIRECTIONS","steps":["Choose three styles that fit the property, not three random interiors.","For each style define palette, furniture, materials, room function and buyer context.","Generate the same room in all three directions.","Select one based on fit, not novelty.","Save the approved staged image beside the untouched source and label the treatment clearly."],"prompt":"Create three restrained staging directions for this room: [style one], [style two], [style three]. Keep architecture, camera and lighting fixed so only the design direction changes.","deliverable":"A three-option style board.","outcome":"When you finish this page, you should have a three-option style board..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"full-property-consistency","title":"Full Property Consistency","mission":"MAKE EVERY ROOM BELONG TO ONE PROPERTY","steps":["Select the approved style pack.","Create a fixed consistency list for palette, furniture language, materials, camera height and light.","Stage one room at a time using the list.","Build a contact sheet and reject rooms that drift.","Save the approved staged image beside the untouched source and label the treatment clearly."],"prompt":"Use the approved property visual bible and staging style across these rooms. Preserve camera logic, palette, materials, furniture language and light direction.","deliverable":"A consistent multi-room staging board.","outcome":"When you finish this page, you should have a consistent multi-room staging board..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"staging-presentation","title":"Staging Presentation","mission":"PRESENT STAGING AS A CONCEPT","steps":["Create matched before and after frames.","Add a clear visualisation label.","Keep the original image available for comparison.","Do not imply that proposed furniture or renovation already exists.","Save the approved staged image beside the untouched source and label the treatment clearly."],"prompt":"Present this staged image as a visualisation concept. Keep the original property information clear and do not misrepresent proposed furniture as existing.","deliverable":"A client-ready staged presentation.","outcome":"When you finish this page, you should have a client-ready staged presentation..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]}]},{"id":"image-to-video","title":"Image to Video","description":"Direct controlled movement from approved frames.","pages":[{"id":"choosing-the-right-source-frame","title":"Choosing The Right Source Frame","mission":"CHOOSE A FRAME THAT CAN MOVE","steps":["Select one approved image from the source audit and open it at full size before deciding whether it can support motion.","Check straight lines, clean edges, readable depth and enough information around the intended move.","Mark the subject and the direction of movement.","Reject frames with obvious generation damage.","Open the image at full size and mark the intended camera move with a simple arrow or note.","Save the selected image as I2V_SOURCE_APPROVED.ext and record why it is safe to animate."],"prompt":"Use this image as the first frame. Preserve the property geometry, materials, furniture and light. The camera movement must reveal information without changing the room.","deliverable":"One annotated source frame.","outcome":"When you finish this page, you should have one annotated source frame..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"camera-movement-for-property-images","title":"Camera Movement For Property Images","mission":"DIRECT ONE CAMERA MOVE","steps":["Choose one movement: push, pull, lateral reveal, rise, pan or controlled orbit.","Write what the viewer learns during the movement.","Keep the movement slow enough for architecture to remain readable.","Do not combine multiple dramatic moves in one short clip.","Export the approved clip, record the model/settings used and keep failed generations out of the delivery folder."],"prompt":"The camera performs a slow [movement] through this property image. Preserve architecture, furniture, materials, reflections and lighting. No morphing, no invented windows, no extra objects.","deliverable":"Six movement instructions.","outcome":"When you finish this page, you should have six movement instructions..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"start-frame-and-end-frame-transitions","title":"Start Frame and End Frame Transitions","mission":"TEST A CONTROLLED TRANSITION","steps":["Prepare the start and end frames with matching composition.","Confirm the selected model accepts both keyframes.","Ask for a restrained transition rather than a scene invention.","Inspect the middle of the clip, not only the endpoints.","Export the approved clip, record the model/settings used and keep failed generations out of the delivery folder."],"prompt":"Interpolate from the supplied first frame to the supplied last frame. Preserve the property identity and architecture. Use a controlled camera and lighting transition. Do not morph walls, windows, furniture or materials.","deliverable":"One tested transition with endpoint review.","outcome":"When you finish this page, you should have one tested transition with endpoint review..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"room-by-room-video-sequence","title":"Room By Room Video Sequence","mission":"BUILD THE PROPERTY SEQUENCE","steps":["Choose the opening exterior or arrival shot.","Order rooms by discovery, scale and light.","Give every clip a purpose and transition direction.","Use the final frame of one clip only when it remains clean enough to lead into the next.","Export the approved clip, record the model/settings used and keep failed generations out of the delivery folder."],"prompt":"Create a room-by-room property sequence: [room order]. Each clip has one camera action, one purpose and one continuity rule.","deliverable":"A sequence map with clip purposes.","outcome":"When you finish this page, you should have a sequence map with clip purposes..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"image-to-video-qc","title":"Image to Video Qc","mission":"RUN A REAL MOTION QC PASS","steps":["Watch the clip once for overall impression.","Watch again for architecture, furniture, reflections, texture crawl and temporal flicker.","Pause at the first frame, middle and final frame.","Reject and regenerate when the property changes.","Export the approved clip, record the model/settings used and keep failed generations out of the delivery folder."],"prompt":"Inspect this generated property clip for geometry drift, invented details, unstable reflections, texture crawl, furniture changes, flicker and unwanted camera behaviour.","deliverable":"A pass or fail clip log.","outcome":"When you finish this page, you should have a pass or fail clip log..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]}]},{"id":"cinematic-property-films","title":"Cinematic Property Films","description":"Turn shots into a film with rhythm and intent.","pages":[{"id":"property-film-story-structure","title":"Property Film Story Structure","mission":"GIVE THE PROPERTY A STORY","steps":["Write the arrival moment as the first numbered beat and state what the viewer should understand from entering the property.","Choose the orientation shot that explains the property.","Choose the discovery sequence through the strongest spaces.","Finish on a detail, view or call to action that feels earned.","Put the four beats into a numbered document and write the viewer question answered by each beat.","Save the structure as PROPERTY_FILM_STRUCTURE_v01.md before opening the editor."],"prompt":"Structure a cinematic property film with arrival, orientation, discovery, detail and resolution. Use the real strengths of this property, not generic luxury language.","deliverable":"A short film treatment.","outcome":"When you finish this page, you should have a short film treatment..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"property-film-shot-matrix","title":"Property Film Shot Matrix","mission":"PLAN EVERY SHOT BEFORE GENERATION","steps":["List every shot in order.","For each shot write lens feeling, camera height, distance, crop, foreground, subject, action and purpose.","Add source frame and transition notes.","Remove shots that repeat information.","Save the approved sequence, source notes and revision decision before moving to the next deliverable."],"prompt":"Create a property-film shot matrix with one row per shot. Keep each row specific enough for a filmmaker or image-to-video model to execute.","deliverable":"A production-ready shot matrix.","outcome":"When you finish this page, you should have a production-ready shot matrix..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"music-voice-and-sound-design","title":"Music Voice and Sound Design","mission":"BUILD ONE SOUND WORLD","steps":["Choose whether the film uses music, voice, natural sound or a combination.","Keep a consistent music bed across the sequence.","Add room tone and motivated effects only where they help.","Use “Audio: no music” in generation prompts when the model’s native score would break continuity.","Save the approved sequence, source notes and revision decision before moving to the next deliverable."],"prompt":"Audio direction: consistent music bed, natural room tone, motivated transitions, clear voiceover and no competing generated score. Preserve a clean audio-only fallback.","deliverable":"An audio plan and prompt suffix.","outcome":"When you finish this page, you should have an audio plan and prompt suffix..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"editing-the-main-property-film","title":"Editing The Main Property Film","mission":"CUT FOR INFORMATION AND FEELING","steps":["Place the hero shot and opening beat first.","Cut on movement, light, architectural reveal or musical change.","Remove clips that don’t add new information.","Review the film muted, then with sound.","Save the approved sequence, source notes and revision decision before moving to the next deliverable."],"prompt":"Edit this property film for clear spatial understanding and emotional rhythm. Keep movement direction coherent and allow visual rest between major reveals.","deliverable":"A first assembly and three edit notes.","outcome":"When you finish this page, you should have a first assembly and three edit notes..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"platform-versions","title":"Platform Versions","mission":"MAKE THE MASTER TRAVEL","steps":["Export the main 16:9 master first.","Create a 9:16 version with a deliberate crop, not an accidental resize.","Prepare 4:5 and square derivatives only when the campaign needs them.","Check captions, safe areas, thumbnails and audio after export.","Save the approved sequence, source notes and revision decision before moving to the next deliverable."],"prompt":"Create platform versions from the approved master. Preserve the strongest property information in each crop and keep important text away from interface zones.","deliverable":"A checked platform export set.","outcome":"When you finish this page, you should have a checked platform export set..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]}]},{"id":"property-campaigns","title":"Property Campaigns","description":"Turn one property into a complete visual package.","pages":[{"id":"one-property-many-deliverables","title":"One Property Many Deliverables","mission":"MULTIPLY ONE PROPERTY PROJECT","steps":["Start with the approved truth sheet and visual bible.","List stills, film, social, web and delivery outputs.","Reuse the same approved visual system across all outputs.","Track each deliverable from source to approval.","Mark each item approved, needs revision or not required. Don’t send an unreviewed bundle."],"prompt":"Turn this one property into a complete campaign: hero image, carousel, film, vertical cut, teaser, thumbnail, copy, landing page and delivery folder.","deliverable":"A campaign production map.","outcome":"When you finish this page, you should have a campaign production map..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"hero-still-and-carousel","title":"Hero Still and Carousel","mission":"CREATE THE CAMPAIGN ENTRY POINT","steps":["Choose the strongest truthful hero proposition.","Build the carousel order: hook, context, key room, detail, proof and action.","Keep crops, type and visual language consistent.","Review the first frame at phone size.","Mark each item approved, needs revision or not required. Don’t send an unreviewed bundle."],"prompt":"Create a property hero and carousel that lead with the strongest truthful visual proposition, then sequence the viewer through context, rooms, details and action.","deliverable":"A hero still and carousel plan.","outcome":"When you finish this page, you should have a hero still and carousel plan..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"reels-teasers-and-thumbnails","title":"Reels Teasers and Thumbnails","mission":"MAKE THE FIRST SECOND WORK","steps":["Choose the opening frame before editing the whole Reel.","Put the strongest movement or reveal first.","Keep captions inside safe zones.","Select a cover that still reads in the profile grid.","Mark each item approved, needs revision or not required. Don’t send an unreviewed bundle."],"prompt":"Create a short property Reel with a clear first-second hook, controlled movement, readable captions and a cover frame that survives platform UI.","deliverable":"A Reel, teaser and thumbnail plan.","outcome":"When you finish this page, you should have a reel, teaser and thumbnail plan..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"campaign-caption-package","title":"Campaign Caption Package","mission":"WRITE COPY FROM THE PROPERTY FACTS","steps":["Use only supplied or approved facts.","Write one campaign description, one short caption, one Reel caption and one call to action.","Match the copy to the actual visual treatment.","Remove unsupported claims and invented features.","Mark each item approved, needs revision or not required. Don’t send an unreviewed bundle."],"prompt":"Write property-specific campaign copy from the approved facts. Keep it concise, accurate and matched to the visual deliverables.","deliverable":"A complete caption package.","outcome":"When you finish this page, you should have a complete caption package..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"client-delivery-folder","title":"Client Delivery Folder","mission":"MAKE THE HANDOFF OBVIOUS","steps":["Create folders for masters, platform versions, stills, video, copy, source notes and approvals.","Use consistent filenames that include the property, deliverable, format and version so a client can identify each file without opening it.","Add a readme with what each file is for.","Open the delivery folder as if you were the client.","Open every folder and click every final file once. Confirm that the filename tells you what the file is for.","Save a DELIVERY_README.txt with the final file list, formats and approval status."],"prompt":"Prepare a client delivery folder for [property]. Include masters, derivatives, copy, source notes, approvals and a clear readme.","deliverable":"A reusable delivery-folder template.","outcome":"When you finish this page, you should have a reusable delivery-folder template..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]}]},{"id":"websites-and-artifacts","title":"Websites and Artifacts","description":"Give the visual campaign a digital home.","pages":[{"id":"property-landing-page","title":"Property Landing Page","mission":"TURN THE CAMPAIGN INTO ONE PROPERTY PAGE","steps":["Choose the hero media from the approved property assets and write down why it introduces the property best.","Write a one-sentence property proposition.","Place the film, key rooms, facts and next action in a deliberate order.","Test the page on a phone before adding decoration.","Open the page at a phone width and tap the hero, film, gallery and contact action in that order.","Save a screenshot and a local preview link as the page review record."],"prompt":"Build a focused property landing page. Lead with the strongest visual, explain the property through media and give the viewer one clear next action.","deliverable":"A landing-page wireframe.","outcome":"When you finish this page, you should have a landing-page wireframe..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"interactive-property-gallery","title":"Interactive Property Gallery","mission":"LET THE VIEWER EXPLORE WITHOUT GETTING LOST","steps":["Group media by room or story beat.","Give every item a useful caption.","Keep the order understandable when controls are hidden.","Add keyboard and touch access to interactions.","Publish a local preview and test the complete experience on desktop and phone."],"prompt":"Design an interactive gallery for [property]. Include room groups, media, captions, labels and a simple path back to the main story.","deliverable":"A gallery map and interaction list.","outcome":"When you finish this page, you should have a gallery map and interaction list..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"before-and-after-visualisation-page","title":"Before and After Visualisation Page","mission":"MAKE COMPARISON USEFUL AND HONEST","steps":["Use matched framing for both images.","Label existing and proposed states.","Add a keyboard-accessible slider or side-by-side view.","Check that the comparison doesn’t imply a real renovation.","Publish a local preview and test the complete experience on desktop and phone."],"prompt":"Create an accessible before-and-after visualisation for this property. Keep framing matched, labels clear and conceptual changes disclosed.","deliverable":"A comparison-page prototype.","outcome":"When you finish this page, you should have a comparison-page prototype..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"scroll-through-property-tour","title":"Scroll Through Property tour","mission":"USE SCROLL AS A GUIDED CAMERA","steps":["Choose the scroll sequence by listing the property sections in the order the viewer should discover them.","Assign one visual beat to each section.","Use motion only when it reveals the next spatial relationship.","Provide a reduced-motion reading path.","Scroll from the first section to the last without skipping. Note where the property story changes location or purpose.","Save a short section map before adding scroll effects."],"prompt":"Create a scroll-through property tour with a clear sequence from arrival to final detail. Keep every transition tied to the property story.","deliverable":"A scroll-tour storyboard.","outcome":"When you finish this page, you should have a scroll-tour storyboard..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"agent-and-studio-portfolio-page","title":"Agent and Studio Portfolio Page","mission":"SHOW THE WORK WITHOUT OVERCLAIMING","steps":["Choose three projects with permission and clear evidence.","For each, show the brief, visual problem, deliverables and result.","Use media that loads quickly and has meaningful labels.","Remove any claim you cannot prove.","Publish a local preview and test the complete experience on desktop and phone."],"prompt":"Create a portfolio case study for this real-estate visual project. Show the brief, process, deliverables and evidence without inventing performance claims.","deliverable":"A portfolio page outline.","outcome":"When you finish this page, you should have a portfolio page outline..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]}]},{"id":"skills-and-productisation","title":"Skills and Productisation","description":"Turn the method into reusable tools and services.","pages":[{"id":"property-image-prompt-builder","title":"Property Image Prompt Builder","mission":"TURN YOUR IMAGE METHOD INTO A TOOL","steps":["Separate user input from fixed production DNA.","Add fields for property, room, source frame, visual direction and non-negotiables.","Return a prompt plus a QC checklist.","Test it on two different rooms.","Save the finished result and record the decision."],"prompt":"Build a reusable real-estate image prompt from: property [ ], room [ ], source truth [ ], visual direction [ ], allowed changes [ ], forbidden changes [ ].","deliverable":"A working prompt-builder specification.","outcome":"When you finish this page, you should have a working prompt-builder specification..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"image-to-video-prompt-builder","title":"Image to Video Prompt Builder","mission":"TURN CAMERA DIRECTION INTO A REUSABLE FORM","steps":["Add fields for source frame, movement, purpose, duration, aspect ratio and audio.","Keep preservation rules fixed in the builder so the source composition, architecture and important property features remain protected.","Return one prompt, not five vague ideas.","Test the result on a room with straight architectural lines.","Run the builder with one wide room and one narrow room. Compare whether the movement instruction stays restrained in both.","Save both test prompts and note the control that prevented geometry drift."],"prompt":"Create one controlled image-to-video prompt for [source frame]. Camera: [move]. Purpose: [reveal]. Preserve: [architecture, materials, furniture]. Audio: [direction].","deliverable":"A reusable image-to-video prompt form.","outcome":"When you finish this page, you should have a reusable image-to-video prompt form..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"property-campaign-generator","title":"Property Campaign Generator","mission":"GENERATE THE CAMPAIGN PLAN FROM THE BRIEF","steps":["Collect property facts, target audience, visual direction and available source media.","Return the required deliverables by format, including the source asset, aspect ratio, duration and intended destination.","Return the shot and asset requirements for each deliverable.","Return a delivery checklist and open questions.","Run the generator with one property brief and inspect every returned deliverable against the available source media.","Save the generated campaign map and mark missing inputs before production."],"prompt":"Generate a complete property campaign from this brief. Return deliverables, formats, source requirements, shot needs, copy needs, QC and delivery notes.","deliverable":"A tested campaign-generator output.","outcome":"When you finish this page, you should have a tested campaign-generator output..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"media-qc-tool","title":"Media Qc tool","mission":"TURN QC INTO A REPEATABLE CHECK","steps":["Define image checks and video checks separately.","Add technical checks for dimensions, codec, frame rate, audio and metadata.","Add visual checks for architecture, privacy, continuity and artefacts.","Test the checklist against one intentionally broken file.","Save the finished result and record the decision."],"prompt":"Run a property-media QC pass. Check visual truth, geometry, privacy, continuity, dimensions, aspect ratio, codec, frame rate, audio and filename.","deliverable":"A media-QC checklist or prototype.","outcome":"When you finish this page, you should have a media-qc checklist or prototype..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"package-and-price-the-service","title":"Package and Price The Service","mission":"PACKAGE THE WORK A CLIENT CAN UNDERSTAND","steps":["List the actual production stages.","Time the pilot from brief through revision and QC.","Group deliverables into clear packages.","Price from effort, revision risk and value. Use public benchmarks only as context, not as a copied price list.","Save the finished result and record the decision."],"prompt":"Create three service packages for [client type]. For each, specify deliverables, revision boundary, turnaround assumptions, exclusions and approval point.","deliverable":"A service-package draft.","outcome":"When you finish this page, you should have a service-package draft..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]},{"id":"capstone-delivery","title":"Capstone Delivery","mission":"DELIVER THE COMPLETE PROPERTY PACKAGE","steps":["Complete the truth sheet and visual bible.","Produce the approved still, staged frame, film, campaign assets and page.","Run the delivery QC against the README, filenames, media contents, formats, approvals and stated client requirements.","Ask a fresh reviewer to find ambiguity, missing assets and broken links.","Open the finished delivery as a new client would. Start with the README, then inspect the hero still, film, campaign files, web artifact and source notes.","Record the final handoff decision as PASS or REVISION REQUIRED and save it with the capstone."],"prompt":"Review this complete property package as a client delivery. Find missing assets, mismatched exports, disclosure problems, broken links and unclear filenames.","deliverable":"A complete capstone package and review log.","outcome":"When you finish this page, you should have a complete capstone package and review log..","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."]}]}];const lessons=curriculum.flatMap(c=>c.pages.map(p=>({...p,categoryId:c.id,categoryTitle:c.title})));const app=document.querySelector('#app');const nav=document.querySelector('#nav');const mobileNav=document.querySelector('#mobileNav');const done=new Set(JSON.parse(localStorage.getItem('re-v2-progress')||'[]').filter(id=>lessons.some(p=>p.id===id)));const qcState=JSON.parse(localStorage.getItem('re-v2-qc')||'{}');function saveQC(){localStorage.setItem('re-v2-qc',JSON.stringify(qcState))}function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function save(){localStorage.setItem('re-v2-progress',JSON.stringify([...done]))}function theme(d){document.documentElement.dataset.theme=d?'dark':'light';const b=document.querySelector('#theme');b.setAttribute('aria-checked',d?'true':'false');b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');document.querySelector('meta[name=theme-color]').content=d?'#000000':'#ffffff';localStorage.setItem('re-v2-theme',d?'dark':'light')}theme(localStorage.getItem('re-v2-theme')==='dark');document.querySelector('#theme').addEventListener('pointerdown',()=>theme(document.documentElement.dataset.theme!=='dark'));document.querySelector('#search').addEventListener('pointerdown',()=>location.hash='#search');function categoryNav(){const h=curriculum.map(c=>`<button class="cat" data-c="${c.id}"><span>${esc(c.title)}</span><span class="count">${c.pages.length}</span></button>`).join('');nav.innerHTML=h;mobileNav.innerHTML=h;document.querySelectorAll('[data-c]').forEach(e=>e.addEventListener('pointerdown',()=>location.hash='#category/'+e.dataset.c))}function home(){app.innerHTML=`<section class="view"><div class="hero"><div class="eyebrow">AI Real Estate Visuals</div><h1>Make the property feel real.</h1><p class="lede">A filmmaker’s AI system for creating real-estate images, property films and complete visual campaigns.</p><div class="actions"><a class="primary" href="#curriculum">Enter the curriculum</a><a class="secondary" href="#category/foundations">Start with Foundations</a></div></div><div class="journey"><article><strong>1. Lock the truth.</strong><span>Start with the source property, its details and the things you must preserve.</span></article><article><strong>2. Direct the visual.</strong><span>Create images, staging, movement and films one controlled step at a time.</span></article><article><strong>3. Deliver the system.</strong><span>Turn the same property into a campaign, a web experience and reusable tools.</span></article></div><div style="height:74px"></div><section class="current-tools"><div class="eyebrow">Tool layer · checked 01 September 2026</div><h2>Use current tools without becoming dependent on them.</h2><p class="muted">The workflow teaches the job first. Tool names are examples checked against current documentation, not permanent promises. Features, access and model names can change.</p><div class="tool-grid"><article><strong>Image work</strong><span>Photoshop and Lightroom for controlled edits, masks, removal and finishing. <a href="https://helpx.adobe.com/photoshop/desktop/create-open-import-images/create-images/edit-images-with-generative-fill.html" target="_blank" rel="noreferrer">Official Photoshop docs ↗</a></span></article><article><strong>Enhancement</strong><span>Use a current enhancement tool when the source needs recovery, lighting help or upscale. Keep the original and inspect artefacts.</span></article><article><strong>Motion drafts</strong><span>Runway, Luma Dream Machine, Google Veo and Kling are current examples to check for image-to-video and keyframe workflows. <a href="https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide" target="_blank" rel="noreferrer">Runway guide ↗</a> <a href="https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/veo/3-1-generate" target="_blank" rel="noreferrer">Veo docs ↗</a></span></article><article><strong>Finish and inspect</strong><span>Use the NLE you already work in, then inspect exports with tools such as MediaInfo or ffprobe. The QC rules survive tool changes.</span></article></div></section><div style="height:74px"></div><div class="section-head"><div><div class="eyebrow">The curriculum</div><h2>One property. One production path.</h2></div><p class="muted">Every category contains practical pages. Each page gives you a mission, numbered steps, a working prompt, an outcome and a QC pass.</p></div><div class="grid">${curriculum.map(c=>card(c)).join('')}</div></section>`;bindCards()}function card(c){const pct=Math.round(c.pages.filter(p=>done.has(p.id)).length/c.pages.length*100);return `<article class="card" data-c="${c.id}"><div class="eyebrow">${String(c.pages.length).padStart(2,'0')} pages</div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="card-meta"><span>${pct}% complete</span><span>Open →</span></div></article>`}function bindCards(){document.querySelectorAll('[data-c]').forEach(e=>e.addEventListener('pointerdown',()=>location.hash='#category/'+e.dataset.c))}function category(id){const c=curriculum.find(x=>x.id===id);if(!c)return missing();app.innerHTML=`<section class="view"><div class="section-head"><div><div class="eyebrow">Category ${curriculum.indexOf(c)+1}</div><h2>${esc(c.title)}</h2></div><p class="muted">${esc(c.description)}</p></div><div class="results">${c.pages.map((p,i)=>`<article class="result" data-l="${p.id}"><span class="eyebrow">Page ${i+1} · ${done.has(p.id)?'Complete':'Not complete'}</span><strong>${esc(p.title)}</strong><div class="muted">${esc(p.mission)}</div></article>`).join('')}</div></section>`;document.querySelectorAll('[data-l]').forEach(e=>e.addEventListener('pointerdown',()=>location.hash='#lesson/'+e.dataset.l));highlight(id)}function lesson(id){const i=lessons.findIndex(p=>p.id===id),p=lessons[i];if(!p)return missing();const c=curriculum.find(x=>x.id===p.categoryId),prev=lessons[i-1],next=lessons[i+1];const gates=[{name:'Production QC',text:'The asset matches the brief and preserves the property truth.'},{name:'Learning-flow QC',text:'The steps, instruction and outcome are clear enough to follow without guessing.'},{name:'Ideal-avatar QC',text:'Alex, our complete first-day beginner, knows what to do, what to look for and what to do next.'},{name:'Design QC',text:'The page is readable, balanced and usable on desktop and mobile.'}];const passed=gates.map((_,n)=>qcState[id+'::'+n]===true);const ready=passed.every(Boolean);app.innerHTML=`<section class="view"><article class="reader"><div class="eyebrow">${esc(c.title)} · Page ${c.pages.findIndex(x=>x.id===id)+1} of ${c.pages.length}</div><h1>${esc(p.title)}</h1><p class="mission">${esc(p.mission)}</p><section class="block"><h2>Your mission</h2><p class="muted">Do this page as a production task. Don’t jump ahead until the deliverable exists and passes all four QC gates.</p></section><section class="block"><h2>Step by step</h2><ol class="steps">${p.steps.map((step,n)=>`<li><span class="step-copy"><strong>Step ${n+1}.</strong> ${esc(step)}</span></li>`).join('')}</ol></section><section class="block"><h2>Use this instruction</h2><div class="prompt" id="prompt">${esc(p.prompt)}</div><button class="copy" id="copy">Copy instruction</button></section><section class="block"><h2>Outcome</h2><div class="outcome">${esc(p.outcome)}<br><strong>Deliverable:</strong> ${esc(p.deliverable||'Save the finished result with a clear filename.')}</div></section><section class="block"><h2>QC logic control</h2><p class="muted">Check each gate only after you’ve actually reviewed the result. These checks are saved on this device.</p><div class="qc-gates">${gates.map((g,n)=>`<label class="qc-gate ${passed[n]?'passed':''}"><input type="checkbox" data-qc="${n}" ${passed[n]?'checked':''}><span><strong>${n+1}. ${g.name}</strong><small>${g.text}</small></span></label>`).join('')}</div><ul class="qc">${p.qc.map(q=>`<li>${esc(q)}</li>`).join('')}</ul><div class="avatar-test"><strong>Avatar test</strong><span>Would Alex, who has never used AI before, know what to do, what good looks like and what happens next?</span></div></section><button class="complete ${done.has(id)?'done':''}" id="complete" ${ready||done.has(id)?'':'disabled'}>${done.has(id)?'Completed ✓':ready?(next?'Mark complete and open next lesson':'Mark page complete'):'Pass all 4 QC gates to continue'}</button><nav class="lesson-nav"><button id="prev" ${prev?'':'disabled'}><small>Previous</small>${prev?esc(prev.title):'Beginning'}</button><button id="next" ${next?'':'disabled'}><small>Next</small>${next?esc(next.title):'End'}</button></nav></article></section>`;document.querySelector('#copy').addEventListener('pointerdown',async()=>{try{await navigator.clipboard.writeText(p.prompt);document.querySelector('#copy').textContent='Copied ✓'}catch{document.querySelector('#copy').textContent='Select the instruction manually'}});document.querySelectorAll('[data-qc]').forEach(box=>box.addEventListener('change',()=>{qcState[id+'::'+box.dataset.qc]=box.checked;saveQC();lesson(id)}));document.querySelector('#complete').addEventListener('pointerdown',()=>{if(!ready||done.has(id))return;done.add(id);save();if(next)location.hash='#lesson/'+next.id;else lesson(id)});if(prev)document.querySelector('#prev').addEventListener('pointerdown',()=>location.hash='#lesson/'+prev.id);if(next)document.querySelector('#next').addEventListener('pointerdown',()=>location.hash='#lesson/'+next.id);highlight(c.id)}function search(){app.innerHTML=`<section class="view"><div class="section-head"><div><div class="eyebrow">Search</div><h2>Find a page.</h2></div><p class="muted">Search missions, prompts, outcomes and category names.</p></div><input id="q" style="width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text)" placeholder="Try staging, source frame or campaign"><div class="results" id="r" style="margin-top:18px"></div></section>`;const q=document.querySelector('#q'),r=document.querySelector('#r');function render(){const t=q.value.toLowerCase().trim(),m=t?lessons.filter(p=>[p.title,p.mission,p.prompt,p.outcome,p.categoryTitle].join(' ').toLowerCase().includes(t)):lessons.slice(0,8);r.innerHTML=m.length?m.map(p=>`<article class="result" data-l="${p.id}"><span class="eyebrow">${esc(p.categoryTitle)}</span><strong>${esc(p.title)}</strong><div class="muted">${esc(p.mission)}</div></article>`).join(''):'<p class="muted">No matching page yet.</p>';document.querySelectorAll('[data-l]').forEach(e=>e.addEventListener('pointerdown',()=>location.hash='#lesson/'+e.dataset.l))}q.addEventListener('input',render);render();q.focus()}function missing(){app.innerHTML='<section class="view"><div class="hero"><div class="eyebrow">Not found</div><h1>This page moved.</h1><p class="lede">Return to the curriculum and choose a category.</p><a class="primary" href="#curriculum">Open curriculum</a></div></section>'}function highlight(id){document.querySelectorAll('.cat').forEach(e=>e.classList.toggle('active',e.dataset.c===id))}function render(){categoryNav();const h=location.hash.slice(1)||'home';if(h==='home')home();else if(h==='curriculum'){app.innerHTML=`<section class="view"><div class="section-head"><div><div class="eyebrow">Curriculum</div><h2>The complete production path.</h2></div><p class="muted">Choose a category. Every category contains real pages with a mission, steps, prompts, outcomes and QC.</p></div><div class="grid">${curriculum.map(c=>card(c)).join('')}</div></section>`;bindCards()}else if(h==='search')search();else if(h.startsWith('category/'))category(h.split('/')[1]);else if(h.startsWith('lesson/'))lesson(h.split('/')[1]);else missing();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();</script></body></html>
