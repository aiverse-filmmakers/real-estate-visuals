s show broken icons:** check spelling and capitalization, and make sure paths are relative, such as `images/front.jpg`, not a path from your computer.","**The button does nothing:** replace the placeholder URL with a real permitted destination, or use `href=\"#viewing\"` for an on-page jump.","**Text is hard to read over the photo:** add a solid or semi-opaque background behind the text, not a gradient, and check contrast in both themes.","**Mobile layout runs off the screen:** add `img { max-width: 100%; height: auto; }` and inspect `width: 100vw` rules that may create overflow."],"checklist":["[ ] The property name, price, facts, and location are accurate.","[ ] Every image has descriptive alt text.","[ ] The main heading appears once.","[ ] The page has one obvious viewing action.","[ ] Internal links jump to the intended sections.","[ ] The page works at phone and desktop widths.","[ ] The theme switch changes the visual theme and has a visible focus state.","[ ] Temporary placeholders are removed or clearly labelled."],"sources":"## Sources\n\n[1] https://docs.github.com/en/pages/getting-started-with-github-pages/creating-a-github-pages-site  \n[2] https://docs.netlify.com/start/quickstarts/netlify-drop-quickstart/  \n[3] https://vercel.com/docs/drop  \n[4] https://help.openai.com/en/articles/9930697-using-canvas-in-chatgpt  \n[5] https://support.anthropic.com/en/articles/11649427-use-artifacts-to-visualize-and-create-ai-apps-without-ever-writing-a-line-of-code  \n[6] https://ai.google.dev/gemini-api/docs/aistudio-build-mode  \n[7] https://codepen.io/pen  \n[8] https://www.w3.org/WAI/standards-guidelines/wcag/","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":8,"pageNumber":1,"firstAction":"**Make the project folder.** Create `property-site`, then create `index.html` inside it. If you are using an AI workspace, ask it to create a single HTML file, not a multi-file framework project.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"interactive-property-gallery","title":"Turn the gallery into an interactive room viewer","mission":"Upgrade the landing page with an interactive gallery. A visitor can choose a room, see the selected image and caption, move with Previous and Next buttons, and use the keyboard without the page jumping around.","steps":["**Prepare the gallery data.** Rename images simply: `exterior.jpg`, `kitchen.jpg`, `living-room.jpg`, `bedroom.jpg`, `garden.jpg`. Write one sentence for each caption.","**Ask your AI tool:** `Add an accessible interactive gallery to my existing page. Use buttons with room names, a large image, a caption, Previous and Next controls, keyboard support, and no library. Keep the existing visual style.`","**Replace the gallery section with this exact HTML:**","**Paste this JavaScript before `</body>`.** Change only the image names, alt text, and captions:","**Add this CSS if the controls look plain or wrap badly:**","**Test the interaction.** Click each room, Previous, and Next. Then focus the gallery and press Left and Right Arrow. Confirm the image, caption, selected tab, and count change together.","**Ask for a refinement:** `Make the selected room obvious without changing the image crop. Keep all controls at least 44px tall and preserve keyboard focus.`","**Save and share a new version.** Keep Lesson 1 as a backup and use the same publishing route."],"prompt":"Create a single self-contained index.html for a premium real-estate property website.\nAudience: a buyer viewing on a phone first.\nProperty: [property name], [city/neighbourhood], [price], [bedrooms] bedrooms,\n[bathrooms] bathrooms, [area] m².\nGoal: help a visitor understand the property and request a private viewing.\nUse semantic HTML, responsive CSS, keyboard-accessible buttons, descriptive alt text,\nand no external libraries. Use a white day theme and black night theme with a real\nsun/moon switch. Keep the copy factual and use [IMAGE-1], [IMAGE-2] as image\nplaceholders until I provide licensed images. Put all CSS in <style> and all JavaScript\nin <script>. Return the complete file, not a plan.","deliverable":"A revised `index.html` with four or more interactive room views and a shareable URL.\n\n---","outcome":"A gallery that changes predictably, keeps captions matched to images, loops from first to last, and remains usable without a mouse.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Lesson 1 page, or a new `index.html` using the shared starter kit.","Four to six licensed images with short factual captions.","Basic ability to find the `<script>` section in an HTML file."],"failure_fixes":["**Every tab shows the same room:** inspect `data-index` values. They must be `0`, `1`, `2`, and `3`.","**Next causes an error:** make sure the `rooms` array has four objects and that the image element IDs match the script.","**Keyboard arrows scroll the page instead:** focus the gallery first, or add `event.preventDefault()` inside the arrow-key branches.","**The image is stretched:** keep `height: auto`; use `object-fit: cover` only when intentional cropping is acceptable.","**The selected state is invisible:** use both a colour difference and a border or underline, and check the dark theme."],"checklist":["[ ] Each button selects the correct room.","[ ] Image, alt text, and caption stay matched.","[ ] Previous and Next work at both ends.","[ ] Keyboard arrows work after focusing the gallery.","[ ] Focus is visible.","[ ] Controls remain usable on a phone.","[ ] No image is distorted."],"sources":"## Sources\n\n[1] https://docs.github.com/en/pages/getting-started-with-github-pages/creating-a-github-pages-site  \n[2] https://docs.netlify.com/start/quickstarts/netlify-drop-quickstart/  \n[3] https://vercel.com/docs/drop  \n[4] https://help.openai.com/en/articles/9930697-using-canvas-in-chatgpt  \n[5] https://support.anthropic.com/en/articles/11649427-use-artifacts-to-visualize-and-create-ai-apps-without-ever-writing-a-line-of-code  \n[6] https://ai.google.dev/gemini-api/docs/aistudio-build-mode  \n[7] https://codepen.io/pen  \n[8] https://www.w3.org/WAI/standards-guidelines/wcag/","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":8,"pageNumber":2,"firstAction":"**Prepare the gallery data.** Rename images simply: `exterior.jpg`, `kitchen.jpg`, `living-room.jpg`, `bedroom.jpg`, `garden.jpg`. Write one sentence for each caption.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"before-and-after-visualisation-page","title":"Build a before-and-after renovation page","mission":"Create a visual comparison page that shows what changed in a renovation concept while preserving trust. The page will show a source image, a proposed result, a slider, a change list, and a clear label that the result is a visual demonstration.","steps":["**Label the pair before building.** Name files `before.jpg` and `after-concept.jpg`. Write: `Source photograph` and `Renovation concept, visual demonstration`. Do not call the concept a completed renovation.","**Create the source prompt:**","**Create the controlled edit prompt:**","**Inspect both images side by side before using them.** Reject the result if the architecture, perspective, number of windows, or major objects drift unexpectedly. If it drifts, run the edit again with a shorter change list and stronger `preserve` wording.","**Ask your AI coding tool:** `Build a before-and-after comparison for these two local images. Use a draggable range slider and a button alternative for people who cannot drag. Label the result as a renovation concept. Do not imply that the work has happened.`","**Insert this exact comparison markup:**","**Add this exact JavaScript:**","**Add this CSS and test it:**","**Check the meaning, not only the movement.** Move the slider with a mouse and Arrow keys. Verify the labels remain visible, the source and concept are not swapped, and the page says exactly what is proposed and what is preserved. Save `before-after.html` as a backup."],"prompt":"Create a single self-contained index.html for a premium real-estate property website.\nAudience: a buyer viewing on a phone first.\nProperty: [property name], [city/neighbourhood], [price], [bedrooms] bedrooms,\n[bathrooms] bathrooms, [area] m².\nGoal: help a visitor understand the property and request a private viewing.\nUse semantic HTML, responsive CSS, keyboard-accessible buttons, descriptive alt text,\nand no external libraries. Use a white day theme and black night theme with a real\nsun/moon switch. Keep the copy factual and use [IMAGE-1], [IMAGE-2] as image\nplaceholders until I provide licensed images. Put all CSS in <style> and all JavaScript\nin <script>. Return the complete file, not a plan.","deliverable":"`before-after.html` or the comparison section inside `index.html`, plus `before.jpg`, `after-concept.jpg`, and a `prompts.txt` file.\n\n---","outcome":"A transparent, responsive comparison that lets a visitor explore a possible renovation without mistaking it for documentary evidence.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["One source photograph you own or have permission to edit.","One edited or AI-generated concept image made from that source.","A short list of intentional changes, such as paint colour, lighting, planting, or furniture.","An image editor or image-capable AI tool. For transparency, save the exact source prompt and edit prompt in a text file."],"failure_fixes":["**The after image appears as a narrow strip:** the nested image needs `width: 100%` of the comparison viewport and `max-width: none`; copy the CSS above.","**The slider cannot be used with a keyboard:** confirm the range input is real HTML and not replaced by a `div` gesture.","**The concept changes the building:** shorten the edit list and regenerate from the original source, not from a previous edited output.","**The labels disappear on the image:** place them below the image on a solid surface.","**The page overclaims:** replace “after” with “renovation concept” everywhere except the file variable names."],"checklist":["[ ] Source and concept files are kept together.","[ ] The source prompt and edit prompt are saved.","[ ] Intended changes are listed.","[ ] Unexpected architectural drift was rejected.","[ ] The comparison works with mouse and keyboard.","[ ] The concept is visibly labelled as a demonstration.","[ ] No invented cost, timeline, planning approval, or completed-work claim appears."],"sources":"## Sources\n\n[1] https://docs.github.com/en/pages/getting-started-with-github-pages/creating-a-github-pages-site  \n[2] https://docs.netlify.com/start/quickstarts/netlify-drop-quickstart/  \n[3] https://vercel.com/docs/drop  \n[4] https://help.openai.com/en/articles/9930697-using-canvas-in-chatgpt  \n[5] https://support.anthropic.com/en/articles/11649427-use-artifacts-to-visualize-and-create-ai-apps-without-ever-writing-a-line-of-code  \n[6] https://ai.google.dev/gemini-api/docs/aistudio-build-mode  \n[7] https://codepen.io/pen  \n[8] https://www.w3.org/WAI/standards-guidelines/wcag/","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":8,"pageNumber":3,"firstAction":"**Label the pair before building.** Name files `before.jpg` and `after-concept.jpg`. Write: `Source photograph` and `Renovation concept, visual demonstration`. Do not call the concept a completed renovation.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"scroll-through-property-tour","title":"Create a scroll-based property tour","mission":"Turn a long property story into a guided scroll tour. Each section introduces one moment, from arrival to garden, while a simple progress indicator helps visitors understand where they are.","steps":["**Write the tour beats in order:** `Arrival`, `Living spaces`, `Kitchen`, `Private rooms`, `Garden`, `Next step`. Give each one a title and two factual sentences.","**Ask the AI tool:** `Create a scroll-based property tour using semantic sections, one image per beat, a sticky progress list, and subtle reveal motion. Respect prefers-reduced-motion. Keep each section readable if JavaScript is disabled.`","**Paste this content structure:**","**Add this CSS:**","**Ask for a mobile correction:** `Keep the navigation horizontally scrollable, not squeezed. Keep images full width and preserve the readable order: image, heading, text, action.`","**Test every tour link.** Click the five links, refresh at a section, and use browser Back. Confirm each destination has a visible heading.","**Test motion preferences.** In browser accessibility settings, enable reduced motion. The content must remain visible and usable with animation removed.","**Share the tour.** Publish using GitHub Pages, Netlify Drop, Vercel Drop, or a local folder. Include the tour URL in the deliverable note."],"prompt":"Create a single self-contained index.html for a premium real-estate property website.\nAudience: a buyer viewing on a phone first.\nProperty: [property name], [city/neighbourhood], [price], [bedrooms] bedrooms,\n[bathrooms] bathrooms, [area] m².\nGoal: help a visitor understand the property and request a private viewing.\nUse semantic HTML, responsive CSS, keyboard-accessible buttons, descriptive alt text,\nand no external libraries. Use a white day theme and black night theme with a real\nsun/moon switch. Keep the copy factual and use [IMAGE-1], [IMAGE-2] as image\nplaceholders until I provide licensed images. Put all CSS in <style> and all JavaScript\nin <script>. Return the complete file, not a plan.","deliverable":"A scroll-tour page with five ordered sections, images, working navigation, and one shareable URL.\n\n---","outcome":"A paced, image-led tour with direct navigation, readable sections, phone-friendly layout, and motion that never hides essential information.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Five to seven licensed images, one per tour moment.","A short factual outline of the property journey.","The Lesson 1 page or a new static HTML file.","No animation library is required."],"failure_fixes":["**Sticky navigation covers headings:** increase `top` spacing or add `scroll-margin-top: 5rem` to `.tour-step`.","**Mobile nav is cut off:** use horizontal scrolling with `overflow-x: auto` and avoid `width: 100vw` inside padded containers.","**Sections feel repetitive:** give each beat one job and remove repeated adjectives.","**Animations do not respect preferences:** wrap motion in `@media (prefers-reduced-motion: no-preference)` and keep the base state visible.","**Back button behaves strangely:** use normal anchor links, not JavaScript history manipulation."],"checklist":["[ ] The tour has a clear beginning, middle, and next step.","[ ] Every section has one relevant image and descriptive alt text.","[ ] Navigation links reach visible headings.","[ ] The page is usable on a phone.","[ ] Reduced motion leaves all content visible.","[ ] The viewing action appears at the end."],"sources":"## Sources\n\n[1] https://docs.github.com/en/pages/getting-started-with-github-pages/creating-a-github-pages-site  \n[2] https://docs.netlify.com/start/quickstarts/netlify-drop-quickstart/  \n[3] https://vercel.com/docs/drop  \n[4] https://help.openai.com/en/articles/9930697-using-canvas-in-chatgpt  \n[5] https://support.anthropic.com/en/articles/11649427-use-artifacts-to-visualize-and-create-ai-apps-without-ever-writing-a-line-of-code  \n[6] https://ai.google.dev/gemini-api/docs/aistudio-build-mode  \n[7] https://codepen.io/pen  \n[8] https://www.w3.org/WAI/standards-guidelines/wcag/","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":8,"pageNumber":4,"firstAction":"**Write the tour beats in order:** `Arrival`, `Living spaces`, `Kitchen`, `Private rooms`, `Garden`, `Next step`. Give each one a title and two factual sentences.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"agent-and-studio-portfolio-page","title":"Assemble a portfolio page of finished property work","mission":"Create a portfolio page that presents three to six property visual projects as a coherent body of work. The visitor can filter by project type, open a project detail panel, and understand what you made without being buried in implementation details.","steps":["**Make a project inventory.** Use this table before coding:","**Ask the AI tool:** `Build a responsive portfolio page from this inventory. Add filter buttons for All, Landing pages, Renovation concepts, and Scroll tours. Add an accessible dialog or details element for project descriptions. Do not invent metrics, clients, awards, or testimonials.`","**Paste the portfolio data and cards:**","**Paste this JavaScript before `</body>`:**","**Add a simple responsive grid:**","**Check each project truthfully.** Remove any project that has no usable image, title, description, or permission to show. Mark synthetic examples with `Concept visual` or `Renovation concept`.","**Ask for one polish pass:** `Keep the three-column desktop and one-column mobile structure. Improve hierarchy and spacing only. Do not add fake proof, star ratings, counters, logos, or a contact form.`","**Test filters and detail buttons.** Filter each category, open and close every detail, then use Tab to reach all controls. Confirm the filter does not leave an empty-looking page without a clear state.","**Publish and create a handoff folder.** Include `index.html`, `images/`, and `README.txt` containing the live URL, image permissions/source notes, and the date `01 September 2026`."],"prompt":"Create a single self-contained index.html for a premium real-estate property website.\nAudience: a buyer viewing on a phone first.\nProperty: [property name], [city/neighbourhood], [price], [bedrooms] bedrooms,\n[bathrooms] bathrooms, [area] m².\nGoal: help a visitor understand the property and request a private viewing.\nUse semantic HTML, responsive CSS, keyboard-accessible buttons, descriptive alt text,\nand no external libraries. Use a white day theme and black night theme with a real\nsun/moon switch. Keep the copy factual and use [IMAGE-1], [IMAGE-2] as image\nplaceholders until I provide licensed images. Put all CSS in <style> and all JavaScript\nin <script>. Return the complete file, not a plan.","deliverable":"A responsive `index.html` portfolio page, its image folder, and a `README.txt` handoff note with the verified share URL.\n\n---","outcome":"A focused portfolio that can be scanned quickly, filtered by type, and explored project by project without unsupported claims.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Three to six completed visual projects or demonstrations.","One cover image, title, location, year, and one-sentence description for each.","A clear label for synthetic work, such as `Concept visual`.","Lesson 2 gallery code or the shared starting kit."],"failure_fixes":["**A filter hides everything:** match each button’s `data-filter` with a card’s `data-type`, and keep `all` as the special value.","**Details open but cannot close:** use the supplied button script and confirm `.project-detail` is the next element after the button.","**Cards become tiny on mobile:** switch to one column below 800px and let images use `width: 100%`.","**The portfolio feels like a generic template:** remove decorative badges and repeated labels; let the work images, titles, and short descriptions carry the page.","**A project claim is uncertain:** write a narrower description or omit the claim. Never fill gaps with awards, client names, results, or testimonials."],"checklist":["[ ] Every project is real work or clearly labelled concept work.","[ ] Titles, locations, dates, and descriptions are accurate.","[ ] Filters work for every category.","[ ] Detail buttons open and close with keyboard access.","[ ] Images have useful alt text.","[ ] The page is readable on phone and desktop.","[ ] No unsupported proof or invented claims appear.","[ ] The handoff folder contains the live URL and image notes."],"sources":"[1] https://docs.github.com/en/pages/getting-started-with-github-pages/creating-a-github-pages-site  \n[2] https://docs.netlify.com/start/quickstarts/netlify-drop-quickstart/  \n[3] https://vercel.com/docs/drop  \n[4] https://help.openai.com/en/articles/9930697-using-canvas-in-chatgpt  \n[5] https://support.anthropic.com/en/articles/11649427-use-artifacts-to-visualize-and-create-ai-apps-without-ever-writing-a-line-of-code  \n[6] https://ai.google.dev/gemini-api/docs/aistudio-build-mode  \n[7] https://codepen.io/pen  \n[8] https://www.w3.org/WAI/standards-guidelines/wcag/","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":8,"pageNumber":5,"firstAction":"**Make a project inventory.** Use this table before coding:","nextAction":"Open the next lesson when the deliverable is saved."}]},{"id":"skills-and-productisation","title":"Skills and Productisation","description":"Turn the method into reusable tools and services.","pages":[{"id":"property-image-prompt-builder","title":"Build a reusable property-prompt skill","mission":"Turn a plain property brief and a source image into a reusable prompt builder that can produce accurate image instructions for cleanup, enhancement, staging or campaign visuals without losing the property’s identity.","steps":["Create a folder named `property-prompt-skill` and copy the original image into `original` without changing it.","Write five factual observations from the image and five facts supplied by the client. Mark anything uncertain as `unknown`.","Paste the exact template below into your text model.","Replace the bracketed fields with the property facts; do not ask the model to guess missing information.","Ask for one prompt for a **truthful enhancement** and one prompt for a **clearly labelled conceptual staging** version.","Copy the enhancement prompt into your image tool and attach the original image as the reference or edit source.","Compare the result with the original at full size: check walls, windows, doors, floor lines, fixed fittings, reflections and light direction.","Record every visible change in a simple change log, then either approve the image or return to the prompt and correct one issue at a time.","Save the final prompt and change log as reusable files for the next property."],"prompt":"You are a real-estate visual prompt builder. Your job is to create precise, source-faithful instructions from verified property facts.\n\nPROPERTY FACTS\n- Property type: [e.g., two-bedroom apartment]\n- Room: [e.g., living room]\n- Fixed features that must remain: [windows, doors, floor, fireplace, radiators, cabinets, ceiling height, architectural details]\n- Materials and colours that must remain: [list]\n- Camera/viewpoint: [height, angle, lens if known]\n- Light direction and time: [verified description]\n- Items to remove: [only items approved for removal]\n- Items to add: [only items approved for addition]\n- Items that must not be invented: [views, rooms, dimensions, appliances, amenities, finishes]\n- Output purpose: [listing image / conceptual staging / social image]\n- Disclosure required: [yes/no and exact wording if supplied]\n\nSOURCE RULES\n1. Treat the attached source image and the verified facts as authority.\n2. Preserve the room geometry, perspective, windows, doors, floor, ceiling, fixed fittings and light direction.\n3. Do not invent or improve property facts.\n4. If a requested change conflicts with the source, state the conflict and offer a safer alternative.\n5. Keep the result photorealistic and suitable for a property marketing image.\n6. Return: (a) final image prompt, (b) exclusions, (c) a five-item review list, and (d) a one-line change-log entry.\n\nTASK\nCreate a [truthful enhancement / clearly labelled conceptual staging] prompt for the stated output purpose.","deliverable":"`property-prompt-skill/` containing the reusable prompt template, one source image, one approved enhancement, optional labelled staging image, and `change-log.md`.","outcome":"A one-page prompt skill that accepts a Property Truth Sheet and returns consistent, source-faithful instructions, plus one approved enhanced image, one labelled conceptual image if requested, and a short change log.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["One permission-cleared property image, preferably an interior room.","A short Property Truth Sheet: room name, fixed features, materials, windows, doors, camera position, light direction and items that must not change.","A text model such as ChatGPT, Claude or Gemini.","A generation/editing tool such as ChatGPT Images, Adobe Photoshop Generative Fill, Adobe Firefly or another approved image editor.","A folder containing `original`, `working` and `approved` subfolders."],"failure_fixes":["**The room shape changes:** add the exact fixed features and the instruction “edit only the named region; preserve all architectural planes,” then use a masked edit rather than a full regeneration.","**Furniture floats or is the wrong scale:** name the floor contact point, approximate proportions and light direction; remove the item and add it again in a smaller masked area.","**Windows, mirrors or screens become strange:** exclude reflective and emissive surfaces from the edit mask and retouch them separately.","**The output invents a view or amenity:** add it to “must not be invented,” remove the unsupported claim from the brief and regenerate.","**The prompt is too long to work well:** keep the facts, fixed-feature list, one requested change and exclusions; remove decorative prose.","**The result looks like an unmarked virtual staging image:** place the supplied disclosure in the file name, delivery note and visible presentation context."],"checklist":["[ ] The original file is preserved.","[ ] Every property fact in the prompt is verified or marked `unknown`.","[ ] Fixed features and exclusions are explicit.","[ ] The edit is limited to the requested region.","[ ] Geometry, perspective, reflections and lighting were compared with the source.","[ ] The change log names what changed.","[ ] Conceptual staging is clearly labelled.","[ ] The prompt can be reused by replacing only the fact fields."],"sources":"- **Prompt builder:** ChatGPT, Claude or Gemini with the template above; use a text-only pass before generating.\n- **Image edit:** Photoshop Generative Fill for masked, non-destructive edits; Firefly for image generation/editing; ChatGPT Images for conversational image edits.\n- **Detailed correction:** Lightroom masks for exposure, highlights, shadows, temperature and tint; Topaz Photo for remove-object, lighting and upscale work.\n- **Reusable local artifact:** a Markdown template, a Google Doc, or a small static HTML form that exports the completed prompt as text. Do not put client secrets in browser code.\n\n## Sources\n\n- OpenAI, *GPT Image Generation Models Prompting Guide*: https://developers.openai.com/cookbook/examples/multimodal/image-gen-models-prompting-guide\n- OpenAI, *Prompt engineering*: https://developers.openai.com/api/docs/guides/prompt-engineering\n- Adobe, *Generative Fill*: https://www.adobe.com/products/photoshop/generative-fill.html\n- Adobe, *Remove unwanted objects*: https://www.adobe.com/learn/photoshop/web/remove-unwanted-objects-generative-fill\n- Adobe, *Perspective Warp*: https://helpx.adobe.com/photoshop/using/perspective-warp.html\n- Adobe, *Lightroom luminance-range masks*: https://helpx.adobe.com/lightroom-cc/web/edit-photos/apply-masks/create-mask-with-luminance-range.html\n- Topaz Labs, *Remove Object*: https://docs.topazlabs.com/topaz-photo/enhancements/remove-object\n- Topaz Labs, *Adjust Lighting*: https://docs.topazlabs.com/topaz-photo/enhancements/adjust-lighting\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":9,"pageNumber":1,"firstAction":"Create a folder named `property-prompt-skill` and copy the original image into `original` without changing it.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"image-to-video-prompt-builder","title":"Build an image-to-video prompt builder","mission":"Turn an approved property still into a short, believable camera move that preserves the building instead of asking the model to redesign it.","steps":["Rename the source file with its room and version, for example `living-room-approved-v01.jpg`.","Decide what the camera should do, and write one movement only.","Decide what must remain still: walls, windows, doors, floor, furniture and exterior view.","Paste the template below into your text model and fill in the facts.","Generate one short clip using the source image as the first frame.","If the tool supports first and last frames, make the endpoint a second approved image; do not use an invented endpoint.","Watch the clip slowly and inspect the first, middle and last frames for drift, flicker, melting edges, warped furniture and impossible parallax.","Reduce motion or shorten the prompt when the model adds movement that was not requested.","Export a clean master and write a one-line note about the chosen movement and any limitations."],"prompt":"Create a [duration]-second real-estate image-to-video clip from the attached approved property image.\n\nCAMERA\n- Movement: [one movement only: slow push-in / gentle lateral slide / slow tilt / gentle reveal]\n- Direction: [left to right, right to left, forward, upward]\n- Pace: slow, smooth and physically plausible\n- Framing: preserve the original composition and room geometry\n\nSUBJECT PRESERVATION\nKeep the walls, windows, doors, floor, ceiling, fixed fittings, furniture proportions, exterior view and lighting direction unchanged. Maintain straight architectural lines and stable verticals. Use natural, subtle parallax only where the source image supports it.\n\nDO NOT\nDo not add rooms, furniture, people, pets, vehicles, text, logos, new windows, new views or new lighting. Do not make objects breathe, wobble, melt, duplicate or change material. No handheld shake, whip pan, zoom burst or unrealistic lens distortion.\n\nAUDIO\n[no audio / natural room tone only / supplied licensed track added later]\n\nOUTPUT\nEnd on a stable frame suitable for a cut. Return the cleanest stable take; if the requested movement cannot preserve the architecture, use a shorter and smaller movement rather than redesigning the room.","deliverable":"`image-to-video-prompt-builder.md`, one approved source still, one stable image-to-video master, and `motion-notes.md` describing the movement and limitations.","outcome":"One 4–8 second clip with a restrained, believable camera move, a stable first frame and a stable final frame. The prompt builder should be reusable for another room by replacing the camera and property fields.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["One approved property still from Lesson 1 or an original source image.","A 4–8 second target duration.","A chosen movement: slow push-in, lateral slide, tilt, or gentle reveal.","Runway, Google Veo, Luma Dream Machine or another approved image-to-video tool.","A way to inspect the exported clip frame by frame, such as VLC, DaVinci Resolve or a browser video player."],"failure_fixes":["**The architecture bends:** reduce camera distance and speed, change to a smaller push-in, or use a masked/edited shot rather than full-frame generation.","**Objects duplicate or melt:** remove descriptive adjectives, state “fixed and unchanged,” shorten the clip and rerun.","**The camera invents depth:** use a lateral move with minimal parallax, or use a simple motion effect in an editor.","**The last frame is unusable:** do not chain it; select an approved endpoint or cut before the failure.","**The source already has artifacts:** repair the still first. Runway warns that existing artifacts can intensify during image-to-video generation.","**The clip is too dramatic for a listing:** describe the result as “quiet, documentary, physically plausible” and use one movement only."],"checklist":["[ ] The source still is approved and unchanged.","[ ] One camera movement is named.","[ ] Fixed architecture and furniture are protected.","[ ] Duration and aspect ratio are stated.","[ ] The first and last frames are stable.","[ ] No invented objects, views, text or people appear.","[ ] The clip was watched slowly, not only at normal speed.","[ ] The clean master is saved separately from platform crops."],"sources":"- **Runway:** image-to-video and Gen-4/Gen-4.5 creation; use the attached image as the first frame and keep motion instructions simple.\n- **Google Veo 3.1:** Gemini API or Vertex AI routes; supports first/last-frame interpolation, model-dependent durations and 16:9 or 9:16 outputs.\n- **Luma Dream Machine:** uploaded start/end keyframes and image-keyframe extensions.\n- **Fallback:** create a controlled push-in, pan or parallax move in DaVinci Resolve, CapCut or After Effects when generative motion damages geometry.\n\n## Sources\n\n- Runway, *Image to Video Prompting Guide*: https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide\n- Runway, *Gen-4 Video*: https://help.runwayml.com/hc/en-us/articles/37327109429011-Creating-with-Gen-4-Video\n- Runway, *Gen-4 Video Prompting Guide*: https://help.runwayml.com/hc/en-us/articles/39789879462419-Gen-4-Video-Prompting-Guide\n- Google, *Generate videos with Veo 3.1 in Gemini API*: https://ai.google.dev/gemini-api/docs/veo\n- Google Cloud, *Veo first and last frames*: https://cloud.google.com/vertex-ai/generative-ai/docs/video/generate-videos-from-first-and-last-frames\n- Luma, *How to use keyframes*: https://lumalabs.ai/learning-hub/how-to-use-keyframes\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":9,"pageNumber":2,"firstAction":"Rename the source file with its room and version, for example `living-room-approved-v01.jpg`.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"property-campaign-generator","title":"Build a property campaign generator","mission":"Turn one approved property image set and one verified brief into a reviewable campaign kit: hero image, carousel sequence, short reel plan, cover, caption draft and delivery manifest.","steps":["Make a `campaign-inputs.md` file containing only verified facts, approved images, brand assets and the campaign objective.","Choose the audience and one action: view, enquire, attend, save or share. Avoid demographic targeting or exclusion.","Paste the generator template below into a text model.","Ask it to create a hook, sequence and platform variants without adding unsupported claims.","Build the hero and carousel in Canva or Adobe Express using the approved image set.","Create a short reel using the image-to-video clip or a controlled editor move; design it to work without sound.","Add the supplied disclosure, source note and CTA using deterministic text layers rather than AI-generated text inside images.","Export a master folder with filenames for each platform and a `delivery-manifest.md`.","Read every caption and on-screen line against the truth sheet before delivery."],"prompt":"You are a real-estate visual campaign generator. Create a reviewable campaign kit from the supplied facts and media. Never invent a property claim.\n\nVERIFIED INPUTS\n- Campaign objective: [launch / open house / rental availability / development preview / portfolio]\n- Property type and location wording approved for publication: [exact text]\n- Verified facts: [bullets]\n- Approved image filenames: [list]\n- Approved video filename: [list]\n- Brand name and exact spelling: [text]\n- Brand colours and type guidance: [text]\n- Exact disclosure wording: [text or “none supplied—flag before export”]\n- Call to action: [exact action and destination]\n- Platforms: [Instagram feed / carousel / Reel / TikTok / website / other]\n\nRULES\n1. Use only the verified facts.\n2. Never claim a view, room, finish, measurement, amenity, price, availability or neighbourhood benefit unless supplied as verified.\n3. Do not steer, exclude or imply who should or should not live there.\n4. Use a readable first frame and keep important text inside platform-safe areas.\n5. Keep disclosure and source notes visible where required.\n6. Separate image text from the AI prompt; add final typography in the design tool.\n\nRETURN\nA. One 6–12 word hook.\nB. A 6–8 frame carousel: frame number, image filename, on-screen text, purpose.\nC. A 10–20 second silent-first reel plan: timecode, visual, text, motion, audio note.\nD. One cover/thumbnail concept.\nE. One caption draft with only verified facts and the supplied CTA.\nF. Platform export list with aspect ratio and filename.\nG. A delivery manifest and a list of any missing approvals.","deliverable":"A `property-campaign-kit/` folder containing `campaign-inputs.md`, hero still, 6–8 frame carousel, 10–20 second reel, cover, caption draft, approval notes and delivery manifest.","outcome":"A coherent campaign kit that uses one property consistently across stills, carousel, reel and cover. The kit should be ready for a human client approval pass, not automatic publishing.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["A Property Truth Sheet and approved image set.","Agent or property brand name, logo and colours supplied by the client.","Campaign objective: launch, open house, rental availability, development preview or agent portfolio.","Exact property facts and approved disclosure wording.","Canva, Adobe Express, a static HTML artifact, or a text model plus an editing tool."],"failure_fixes":["**The generator invents selling points:** remove the claim from the output and add it to the missing-approval list; never “make it sound better” by guessing.","**The carousel feels repetitive:** assign each frame a job—hook, context, spatial proof, detail, lifestyle context only if approved, disclosure and action.","**Text is unreadable on a phone:** shorten it, increase contrast and move it away from platform interface areas.","**The reel only works with sound:** add concise captions or text overlays and test it muted.","**The branding changes between files:** use one brand kit and deterministic text/logo layers in Canva, Adobe Express or an editor.","**The output is mistaken for a live listing:** add the client’s status wording and a clear source/disclosure note before export."],"checklist":["[ ] Every claim traces to the input brief.","[ ] One objective and one CTA are clear.","[ ] Hero, carousel, reel and cover share the same property identity.","[ ] Text is readable on a phone and survives safe areas.","[ ] Reel works without sound.","[ ] Logos and typography were added as editable layers.","[ ] Disclosure wording is present where needed.","[ ] The manifest lists every file and intended use."],"sources":"- **Generator:** ChatGPT, Claude or Gemini using the structured template.\n- **Design/artifact:** Canva Magic Media and Brand Kit, Adobe Express, Figma, or a static HTML campaign generator.\n- **Video:** CapCut Desktop, DaVinci Resolve, Premiere Pro or a supplied image-to-video clip.\n- **Publishing route:** export for human approval; authorized platform publishing is a separate step and is not assumed by this lesson.\n- **Common formats:** prepare 4:5 or 1:1 feed/carousel variants and 9:16 Reel/TikTok variants; retain a clean master.\n\n## Sources\n\n- Canva, *Magic Media*: https://www.canva.com/help/using-magic-media/\n- Canva, *Brand Kit*: https://www.canva.com/pro/brand-kit/\n- Meta, *Instagram content publishing*: https://developers.facebook.com/documentation/instagram-platform/content-publishing\n- Meta, *Instagram placement ratios*: https://www.facebook.com/business/help/103816146375741\n- Meta, *Instagram Reels specifications*: https://www.facebook.com/business/ads-guide/update/video/instagram-reels\n- TikTok, *Video ad specifications*: https://ads.tiktok.com/help/article/video-ads-specifications\n- YouTube, *Recommended upload encoding settings*: https://support.google.com/youtube/answer/1722171?hl=en\n- W3C, *Captions*: https://www.w3.org/WAI/media/av/captions\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":9,"pageNumber":3,"firstAction":"Make a `campaign-inputs.md` file containing only verified facts, approved images, brand assets and the campaign objective.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"media-qc-tool","title":"Build a simple media-check tool","mission":"Create a small repeatable tool that catches missing files, wrong dimensions, broken playback, unexpected duration, missing audio and inconsistent naming before a property package is delivered.","steps":["Create a `media-check` folder with `incoming`, `approved` and `reports` subfolders.","Put the practice files in `incoming` and use plain filenames such as `property-room-01.jpg` and `property-reel-01.mp4`.","Install FFmpeg or MediaInfo from the official route for the operating system.","Run the commands in the template below against one image and one video.","Read the output: filename, codec, dimensions, frame rate, duration, audio stream and file size.","Compare those values with the delivery brief and platform target, not with a guessed default.","Fix one failed file in an editor and run the check again.","Mark only files that pass the agreed requirements as `approved`; retain the original failed file in `incoming`.","Save the report beside the delivery manifest so another person can reproduce the result."],"prompt":"You are a media delivery assistant. Inspect only the supplied file metadata and report facts that can be measured.\n\nFor each file, return:\n- filename and extension\n- file size\n- image width and height, or video width and height\n- video codec, pixel format, frame rate and duration\n- audio codec, sample rate, channel count and duration if present\n- orientation and aspect ratio\n- whether the file opens and can be decoded\n- comparison with these requirements: [paste requirements]\n\nDo not infer visual quality from metadata. Do not claim that a file is licensed, factually accurate or aesthetically approved. If a value is missing, say “not detected.”\n\nCommands for a local report:\nffprobe -v error -show_entries format=filename,size,duration:stream=index,codec_type,codec_name,width,height,r_frame_rate,pix_fmt,sample_rate,channels -of json [FILE]\n\nFor a human-readable alternative, open the file in MediaInfo and copy the General, Video and Audio sections into the report.","deliverable":"A `media-check/` folder with one reusable command or HTML/spreadsheet template, a sample report, an approved image and video, and one documented before/after fix.","outcome":"A repeatable report that catches technical delivery problems and distinguishes measurable file facts from visual, factual and rights decisions that still require a human review.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["A folder containing at least one image, one video and one intentionally broken or incorrectly named practice file.","A computer with FFmpeg/ffprobe installed, or MediaInfo installed.","A spreadsheet, Markdown report or simple HTML interface for the results.","Optional: Python if Alex wants a local one-command report."],"failure_fixes":["**`ffprobe` is not found:** install FFmpeg from the official download route or use MediaInfo; do not paste a made-up report.","**A file will not decode:** copy the original to `incoming`, export a new file from the editor, then check the new file.","**Dimensions are wrong:** return to the editor and export the required aspect ratio; do not stretch property architecture.","**Audio is missing:** decide whether the deliverable should be silent, include room tone or include a licensed track; document the decision.","**The filename is unclear:** rename the approved copy with property, asset type, version and intended platform.","**The tool says “pass” but the image is misleading:** metadata is not a visual or factual approval; inspect the image and source record separately."],"checklist":["[ ] Original incoming files remain untouched.","[ ] Every delivered file opens and decodes.","[ ] Dimensions and aspect ratios match the brief.","[ ] Video duration and frame rate are recorded.","[ ] Audio presence and sample rate are recorded where relevant.","[ ] Filenames identify property, asset and version.","[ ] The report separates measured facts from human decisions.","[ ] Failed files are not mixed into the approved delivery folder."],"sources":"- **Command line:** FFmpeg `ffprobe` for machine-readable metadata and decode checks.\n- **Desktop inspection:** MediaInfo for a readable metadata view.\n- **Editing/export:** DaVinci Resolve, CapCut Desktop, Premiere Pro, Photoshop or Lightroom as appropriate.\n- **Browser artifact:** a local HTML report generator may display metadata supplied by the learner, but browser code cannot safely inspect arbitrary local files without explicit file selection.\n\n## Sources\n\n- FFmpeg, *ffprobe documentation*: https://ffmpeg.org/ffprobe.html\n- MediaArea, *MediaInfo*: https://mediaarea.net/MediaInfo\n- YouTube, *Encoding settings*: https://support.google.com/youtube/answer/1722171?hl=en\n- TikTok, *Video ad specifications*: https://ads.tiktok.com/help/article/video-ads-specifications\n- Meta, *Instagram Reels specifications*: https://www.facebook.com/business/ads-guide/update/video/instagram-reels\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":9,"pageNumber":4,"firstAction":"Create a `media-check` folder with `incoming`, `approved` and `reports` subfolders.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"package-and-price-the-service","title":"Package and price a visual service","mission":"Turn production effort into a clear visual package with a defined scope, revision limit, turnaround, rights note and testable price—without pretending that one public benchmark is a universal market rate.","steps":["Choose one client objective, such as “launch one residential listing.”","List the exact outputs, file formats, number of included revisions and delivery date.","Time the work in categories: briefing, media preparation, generation, editing, review, revisions, export and delivery.","Add direct costs such as tool credits, stock media or music licences; do not hide them inside vague “AI fee” language.","Choose a target working rate or total project minimum that Alex can explain; write the assumption beside it.","Add a contingency for rework caused by source quality or client changes, rather than promising unlimited revisions.","Use the template below to produce three package levels with the same truthful scope logic.","Compare the result with public benchmarks such as BoxBrownie or a local provider; note that those are reference points, not proof of what Alex should charge.","Ask a real or practice client to choose one package and record which scope wording caused confusion."],"prompt":"You are a visual-service packaging assistant. Turn the supplied production estimate into clear packages. Do not invent market rates, client outcomes or savings.\n\nSERVICE OBJECTIVE\n- Client type: [agent / brokerage / developer / short-term rental / property manager]\n- Business objective: [launch / open house / rental availability / development preview / portfolio]\n- Property count: [number]\n- Source media supplied by client: [list and condition]\n\nTIME AND COST INPUTS\n- Brief and source preparation: [hours]\n- Image work: [hours]\n- Video work: [hours]\n- Website/artifact work: [hours]\n- Review and corrections: [hours]\n- Export and delivery: [hours]\n- Direct tool/media costs: [amount and currency]\n- Target working rate or project minimum: [amount]\n- Contingency assumption: [percentage or hours]\n\nPACKAGE RULES\n1. Each package must list exact outputs, formats, turnaround, included revisions and client inputs.\n2. Exclude CRM, lead automation, paid media management and unapproved third-party rights.\n3. State what is conceptual, AI-assisted or source-dependent.\n4. No unlimited revisions. Define a paid change process.\n5. Keep original files and approved delivery files separate.\n6. Present price as a tested proposal assumption, not a guaranteed market rate.\n\nRETURN\n- Essential package\n- Campaign package\n- Signature package\nFor each: objective, outputs, quantity, formats, turnaround, revisions, client responsibilities, exclusions, disclosure/rights note and price calculation.\nAlso return three questions to ask before quoting.","deliverable":"`visual-service-menu.pdf` or `.md`, a calculation sheet, a timed production log and one short quote using the selected package. Prices must be labelled as a tested proposal for the chosen market, not as a universal rate card.","outcome":"A one-page service menu that a beginner can explain in plain language. It should show exactly what the client receives and how the price was built from timed work, direct costs and a stated assumption.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["One completed or timed practice property package.","A list of outputs and the time spent on source preparation, generation, editing, review, revisions, export and delivery.","A target client type: agent, brokerage, developer, short-term rental or property manager.","A spreadsheet or calculator.","One or two public benchmark pages for comparison only."],"failure_fixes":["**Packages are just “basic, pro and premium”:** rename them around the client objective and list concrete files.","**The price is based on a competitor alone:** recalculate from actual timed work and use the competitor only as context.","**Revisions consume the project:** define one or two rounds, what counts as a revision and the price for new scope.","**Rights are unclear:** list who supplies music, logos, fonts, property access and permissions; identify any licence limitation.","**AI-generated staging is treated as photography:** label conceptual or staged visuals and include the original source where appropriate.","**The client cannot compare packages:** keep one shared baseline and add or remove clearly named outputs."],"checklist":["[ ] One client objective is named.","[ ] Every output has a quantity and format.","[ ] Turnaround and revision rules are visible.","[ ] Time and direct costs are recorded.","[ ] Price assumptions are stated.","[ ] Rights, permissions and disclosure responsibilities are named.","[ ] Excluded work is explicit.","[ ] A client can choose a package without a call to decode it."],"sources":"- **Calculation:** Google Sheets, Excel, Airtable or a local spreadsheet.\n- **Proposal artifact:** Google Docs, Canva, Adobe Express, Notion or a static HTML/PDF proposal.\n- **Payments/products when ready:** Stripe Products and Prices can represent defined services, but payment setup is separate from scope design.\n- **Benchmarking:** public provider pages, local competitor pages and direct client interviews; record access date and scope differences.\n\n## Sources\n\n- Stripe, *Pricing and packaging strategy*: https://stripe.com/resources/more/saas-pricing-and-packaging-strategy\n- Stripe, *Manage products and prices*: https://docs.stripe.com/products-prices/manage-prices\n- BoxBrownie, *Public pricing*: https://www.boxbrownie.com/pricing\n- AI-Verse research digest, *Tools and Productisation* (internal source): `/home/hermes/AI-Verse/real-estate-module-research/missing-page-research-digest-2026-09-01.md`\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":9,"pageNumber":5,"firstAction":"Choose one client objective, such as “launch one residential listing.”","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"capstone-delivery","title":"Capstone: deliver one complete property visual system","mission":"Deliver one truthful, polished property package from source files to client-ready folder: approved images, a short film, a vertical cut, a campaign kit, a simple property page and a clear handoff note.","steps":["Create the final folder tree shown below and copy originals into `00-source`.","Add `property-truth-sheet.md`, the source inventory, permissions and disclosure wording to `01-records`.","Put only approved enhanced or staged images in `02-images`; pair conceptual images with their labels.","Put the clean master film and vertical cut in `03-video`, with captions and music/rights notes.","Put the hero, carousel, cover, caption draft and platform exports in `04-campaign`.","Build a simple mobile-first property page in `05-site` using only supplied facts; include image alt text, source notes and a human-owned enquiry path.","Run the media-check tool, open every file, test the page on a phone-sized viewport and compare the package to the service scope.","Write `delivery-manifest.md` with filenames, purpose, status, disclosure, rights and future-edit notes.","Send a review link or zipped folder to the practice client; ask them to confirm facts, image changes, disclosure and intended uses before publication.","Archive the approved version and keep the next change request separate from the delivered package."],"prompt":"You are a real-estate visual delivery assistant. Assemble a client-ready handoff from the supplied records and approved media.\n\nSOURCE RECORDS\n- Property truth sheet: [paste or attach]\n- Client name and project name: [exact text]\n- Approved image filenames: [list]\n- Approved video filenames: [list]\n- Campaign files: [list]\n- Website facts and source fields: [list]\n- Exact disclosure wording: [text]\n- Rights and permissions: [music, logos, people, property access, stock media]\n- Delivery date and revision status: [text]\n\nRULES\n1. Preserve every source file and do not overwrite it.\n2. Include only verified property facts.\n3. Distinguish original photography, edited media, virtual staging, conceptual visualisation and generated motion.\n4. Do not publish or send messages automatically.\n5. Flag missing approval, missing rights, unsupported claims, broken files or unclear filenames.\n6. A property page must be mobile-readable, keyboard-usable, labelled and clear about the human enquiry route.\n\nRETURN\nA. Final folder tree.\nB. Delivery manifest table: filename, purpose, format, version, approval status, disclosure/rights note.\nC. Client handoff message in plain language.\nD. Publication hold list: only unresolved items that require human confirmation.\nE. Archive and future-edit instructions.","deliverable":"One zipped `property-delivery-v01/` folder plus a review URL or local site preview, `delivery-manifest.md`, a client handoff message and a list of any items awaiting confirmation.","outcome":"A complete, reviewable property visual system with a source-preserving archive, approved images, a master film, a vertical version, campaign derivatives, a simple property page, measurable media report and handoff instructions. The result is ready for client confirmation; it is not automatically published.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["A permission-cleared property and one named client or practice client.","Completed outputs from Lessons 1–5, or equivalent approved files.","A simple static-site route such as GitHub Pages, Netlify or Vercel, or a local HTML artifact for review.","A delivery folder and a human reviewer who did not build the files.","Client-approved disclosure, rights and contact wording."],"failure_fixes":["**The package contains unsupported facts:** remove them from the page, captions and video text; return the question to the client.","**The page looks good on desktop but fails on mobile:** simplify the layout, compress media, test at a phone width and ensure buttons and captions remain usable.","**A staged image is mistaken for an existing room:** add clear labelling and keep the original beside it.","**A video has no rights record:** hold delivery of the music-bearing version and replace it with room tone, a client-supplied licensed track or a properly documented licence.","**The client asks for a new room, view or amenity:** treat it as a new conceptual asset, not a correction to the truthful version.","**Files are missing or duplicated:** rebuild the manifest from the actual folder, run the media check again and archive one numbered version.","**The page has no accessible enquiry path:** add a labelled contact method owned by the client; do not invent or silently route leads."],"checklist":["[ ] Original media and records are preserved.","[ ] Truth sheet, permissions and disclosure are included.","[ ] Images, video and campaign files open and match the manifest.","[ ] Conceptual/staged/generated elements are clearly identified.","[ ] Master and platform derivatives are separated.","[ ] The property page uses verified facts and has alt text, labels and a human enquiry route.","[ ] Media metadata and rights notes are recorded.","[ ] A second person checked the package against the brief.","[ ] Client confirmation is requested before publication.","[ ] The archive has a version number and future-edit notes."],"sources":"- **Build:** static HTML/CSS/JavaScript in a local folder or GitHub repository.\n- **Deploy:** GitHub Pages, Netlify or Vercel for a simple public artifact; use private/local preview until the client approves publication.\n- **Media:** Photoshop/Lightroom/Topaz for images; Runway, Veo or Luma for tested motion; DaVinci Resolve, CapCut or Premiere for assembly.\n- **Accessibility:** W3C captions and description guidance; add alt text, captions, labels, keyboard focus and visible disclosure.\n- **Search/performance:** Google Search Central image guidance; use descriptive filenames, dimensions and sensible media loading.\n- **Data boundary:** live MLS/IDX data is not implied. A demo page uses manually supplied or authorized data only.\n\n## Sources\n\n- Vercel, *Deployments*: https://vercel.com/docs/deployments\n- GitHub, *GitHub Pages documentation*: https://docs.github.com/en/pages\n- Netlify, *Deploy overview*: https://docs.netlify.com/deploy/create-deploys/\n- W3C, *Captions*: https://www.w3.org/WAI/media/av/captions\n- W3C, *Descriptions of visual information*: https://www.w3.org/WAI/media/av/description\n- Google Search Central, *Google Images best practices*: https://developers.google.com/search/docs/appearance/google-images\n- YouTube, *Altered or synthetic content disclosure*: https://support.google.com/youtube/answer/14328491?hl=en\n- Google Veo documentation: https://ai.google.dev/gemini-api/docs/veo\n- Runway, *Image to Video Prompting Guide*: https://help.runwayml.com/hc/en-us/articles/48324313115155-Image-to-Video-Prompting-Guide\n- FFmpeg, *ffprobe*: https://ffmpeg.org/ffprobe.html\n- MediaInfo: https://mediaarea.net/MediaInfo\n\n---\n\n## Tool and source note for the 2026-09-01 cutoff\n\nTool names, model availability, prices, export limits, platform specifications and disclosure rules change. Before publishing this curriculum, open each official source linked above and verify the current route, account requirements, supported formats and jurisdiction-specific rules. The durable skill is the source-first workflow, explicit prompts, controlled edits, measurable file inspection, clear scope and human approval—not dependence on one vendor.","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":9,"pageNumber":6,"firstAction":"Create the final folder tree shown below and copy originals into `00-source`.","nextAction":"Open the next lesson when the deliverable is saved."}]}];
const PROJECT={"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."};
const lessons=CURRICULUM.flatMap(c=>c.pages.map(p=>({...p,categoryTitle:c.title,categoryId:c.id})));const app=document.querySelector('#app');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const linkify=x=>String(x||'').replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noreferrer">$1</a>');const done=new Set(JSON.parse(localStorage.getItem('re-visuals-done')||'[]'));function save(){localStorage.setItem('re-visuals-done',JSON.stringify([...done]))}function nav(){document.querySelector('#railNav').innerHTML=CURRICULUM.map((c,i)=>`<a class="nav-cat" href="#category/${c.id}"><strong>${String(i+1).padStart(2,'0')} · ${esc(c.title)}</strong><span>${c.pages.length} lessons</span></a>`).join('')}function route(){let h=location.hash.slice(1)||'home';if(h==='home')home();else if(h==='curriculum')curriculum();else if(h.startsWith('category/'))category(h.split('/')[1]);else if(h.startsWith('lesson/'))lesson(h.split('/')[1]);else search()}function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">A standalone production course</div><h1>Make the property look better without losing what’s real.</h1><p>One guided path from untouched room photo to finished image, video, campaign and property website. You’ll work from a practice project, save real deliverables and learn what to do when the result goes wrong.</p><a class="primary" href="#category/foundations">Start with the practice project →</a></section><div class="journey"><div><b>01 · Ground</b><strong>Choose the visual job</strong><span>Start with the property and its real source files.</span></div><div><b>02 · Direct</b><strong>Control the image</strong><span>Clean, enhance and stage without rebuilding the room.</span></div><div><b>03 · Move</b><strong>Build the film</strong><span>Turn approved frames into calm, controlled shots.</span></div><div><b>04 · Deliver</b><strong>Package the work</strong><span>Export a useful visual system, not random outputs.</span></div></div><section><div class="section-intro"><div><div class="eyebrow">How this works</div><h2>Learn by making one thing at a time.</h2></div><p>Every lesson tells you what to open, what to type, what should happen, how to correct it and what file to save.</p></div><div class="block"><h2>${esc(PROJECT.name)}</h2><p>${esc(PROJECT.description)}</p><p><strong>Working rule:</strong> ${esc(PROJECT.rule)}</p><a class="primary" href="#lesson/${lessons[0].id}">Open the first lesson →</a></div></section>`}function curriculum(){app.innerHTML=`<section class="hero"><div class="eyebrow">The complete path</div><h1>Choose a production stage.</h1><p>Start at Foundations if this is your first day. Each category contains ordered lessons. The lesson page is where the actual work happens.</p></section><div class="category-list">${CURRICULUM.map((c,i)=>`<a class="lesson-row" href="#category/${c.id}"><span class="lesson-no">${String(i+1).padStart(2,'0')}</span><span><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p></span><span class="row-status">${c.pages.length} lessons →</span></a>`).join('')}</div>`}function category(id){const c=CURRICULUM.find(x=>x.id===id);if(!c)return home();app.innerHTML=`<section class="hero"><div class="eyebrow">Category ${String(CURRICULUM.indexOf(c)+1).padStart(2,'0')}</div><h1>${esc(c.title)}</h1><p>${esc(c.description)}</p><a class="primary" href="#lesson/${c.pages[0].id}">Begin this category →</a></section><div class="section-intro"><div><div class="eyebrow">${c.pages.length} ordered lessons</div><h2>Make these in order.</h2></div><p>Each row is a production task. Open it to see the files, exact instruction, expected result and recovery path.</p></div><div class="category-list">${c.pages.map((p,i)=>`<a class="lesson-row" href="#lesson/${p.id}"><span class="lesson-no">${String(i+1).padStart(2,'0')}</span><span><h3>${esc(p.title)}</h3><p>${esc(p.mission)}</p></span><span class="row-status">${done.has(p.id)?'Completed ✓':'Not started'}<br>Open lesson →</span></a>`).join('')}</div>`}function checklist(items){return `<ul class="check-list">${(items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}function lesson(id){const i=lessons.findIndex(x=>x.id===id),p=lessons[i];if(!p)return home();const prev=lessons[i-1],next=lessons[i+1];const refs=p.reference?`<section class="block"><h2>See the result</h2><p class="eyebrow">${esc(p.reference.label)}</p><div class="reference-pair"><figure><img src="${esc(p.reference.before)}" alt="${esc(p.reference.beforeCaption)}"><figcaption>${esc(p.reference.beforeCaption)}</figcaption></figure><figure><img src="${esc(p.reference.after)}" alt="${esc(p.reference.afterCaption)}"><figcaption>${esc(p.reference.afterCaption)}</figcaption></figure></div><details><summary>Show the exact prompts used</summary><p><strong>Before prompt</strong></p><pre class="prompt">${esc(p.reference.promptBefore)}</pre><p><strong>After prompt</strong></p><pre class="prompt">${esc(p.reference.promptAfter)}</pre></details></section>`:'';app.innerHTML=`<div class="reader-wrap"><header class="reader-head"><div class="eyebrow">${esc(p.categoryTitle)} · Lesson ${p.pageNumber} of ${p.categoryNumber?CURRICULUM.find(c=>c.id===p.categoryId).pages.length:''}</div><h1>${esc(p.title)}</h1><p class="mission">${esc(p.mission)}</p></header><div class="reader-grid"><article class="content"><section class="block"><h2>Your mission</h2><p>${esc(p.mission)}</p><p><strong>Start here:</strong> ${esc(p.firstAction)}</p></section><section class="block"><h2>Before you start</h2>${(p.prerequisites||[]).length?`<ul class="plain-list">${p.prerequisites.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>Open the practice project and create a working copy of the source file.</p>'}</section><section class="block"><h2>Do this step by step</h2><ol class="steps">${p.steps.map((x,n)=>`<li><span class="step-main"><strong>Step ${n+1}</strong>${esc(x)}</span></li>`).join('')}</ol></section><section class="block"><h2>Copy this instruction</h2><pre class="prompt" id="prompt">${esc(p.prompt)}</pre><button class="copy" id="copy">Copy instruction</button></section><section class="block"><h2>Expected result</h2><div class="outcome">${esc(p.outcome)}<br><strong>Save:</strong> ${esc(p.deliverable||'A numbered project file.')}</div></section><section class="block"><h2>If the result goes wrong</h2>${p.failure_fixes?.length?`<ul class="plain-list">${p.failure_fixes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>Return to the untouched source, simplify one variable and make a new numbered version.</p>'}</section>${refs}<section class="block"><h2>Check your result</h2>${checklist(p.checklist||p.qc)}</section><section class="block"><h2>Finish this lesson</h2><p>Save the deliverable before continuing. Then open the next lesson so the project keeps moving.</p><button class="completion ${done.has(p.id)?'done':''}" id="complete">${done.has(p.id)?'Completed ✓':next?'Mark complete and open next lesson':'Mark lesson complete'}</button></section><nav class="lesson-nav"><button id="prev" ${prev?'':'disabled'}><small>Previous</small>${prev?esc(prev.title):'Beginning'}</button><button id="next" ${next?'':'disabled'}><small>Next</small>${next?esc(next.title):'End'}</button></nav></article><aside class="side"><div class="side-card"><h3>You are building</h3><strong>${esc(PROJECT.name)}</strong><p>${esc(PROJECT.description)}</p></div><div class="side-card"><h3>Working files</h3>${PROJECT.files.map(x=>`<span class="file">${esc(x)}</span>`).join('')}</div><div class="side-card"><h3>This lesson creates</h3><p>${esc(p.deliverable||'A saved project deliverable.')}</p></div></aside></div></div>`;document.querySelector('#copy').addEventListener('pointerdown',async()=>{try{await navigator.clipboard.writeText(p.prompt);document.querySelector('#copy').textContent='Copied ✓'}catch{document.querySelector('#copy').textContent='Select the instruction manually'}});document.querySelector('#complete').addEventListener('pointerdown',()=>{if(!done.has(p.id)){done.add(p.id);save();if(next)location.hash='#lesson/'+next.id;else route()}});if(prev)document.querySelector('#prev').addEventListener('pointerdown',()=>location.hash='#lesson/'+prev.id);if(next)document.querySelector('#next').addEventListener('pointerdown',()=>location.hash='#lesson/'+next.id)}function search(){app.innerHTML=`<section class="hero"><div class="eyebrow">Find a workflow</div><h1>Search the production path.</h1><p>Search lesson names, missions, prompts and deliverables.</p><input class="search" id="q" placeholder="Try staging, source image or campaign"><div class="results" id="results"></div></section>`;const q=document.querySelector('#q'),r=document.querySelector('#results');function render(){const t=q.value.toLowerCase();const m=t?lessons.filter(x=>[x.title,x.mission,x.prompt,x.deliverable,x.categoryTitle].join(' ').toLowerCase().includes(t)):lessons.slice(0,10);r.innerHTML=m.map(x=>`<a class="lesson-row" href="#lesson/${x.id}"><span class="lesson-no">→</span><span><h3>${esc(x.title)}</h3><p>${esc(x.categoryTitle)} · ${esc(x.mission)}</p></span><span class="row-status">Open lesson</span></a>`).join('')||'<p>No lesson found. Try “staging”, “video” or “website”.</p>'}q.addEventListener('input',render);render()}document.querySelector('#curriculumBtn').addEventListener('pointerdown',()=>location.hash='#curriculum');document.querySelector('#theme').addEventListener('pointerdown',()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';localStorage.setItem('re-theme',d.dataset.theme)});document.documentElement.dataset.theme=localStorage.getItem('re-theme')||'light';nav();addEventListener('hashchange',route);route();
</script></body></html>
