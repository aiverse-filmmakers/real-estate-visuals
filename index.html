<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5"><title>AI Real Estate Visuals</title><style>
:root{--bg:#f7f7f5;--panel:#fff;--panel2:#f0f0ed;--ink:#181817;--muted:#6c6b67;--line:#deded8;--accent:#1c6b55;--accent-soft:#e4f0ea;--danger:#9d392f;--shadow:0 16px 50px #1d2b2510;color-scheme:light}html[data-theme=dark]{--bg:#121413;--panel:#1a1d1b;--panel2:#222623;--ink:#f4f4ee;--muted:#aaaFA9;--line:#363b37;--accent:#7fd4b1;--accent-soft:#17372c;--danger:#f39b91;--shadow:0 16px 50px #0005;color-scheme:dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.topbar{height:72px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,56px);position:sticky;top:0;z-index:10}.brand{font-weight:750;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}.brand small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}.top-actions{display:flex;gap:10px;align-items:center}.icon-btn,.ghost-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;min-height:42px;padding:0 15px}.icon-btn{width:42px;padding:0}.layout{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100vh - 72px)}.rail{border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto;background:var(--bg)}.rail-label,.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;color:var(--muted)}.rail nav{margin-top:13px}.nav-cat{display:block;text-decoration:none;color:var(--muted);padding:9px 10px;border-radius:10px;margin:3px 0}.nav-cat:hover,.nav-cat.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}.nav-cat strong{display:block;color:inherit;font-size:13px}.nav-cat span{font-size:11px}.main{min-width:0;padding:clamp(26px,5vw,72px) clamp(20px,5vw,76px) 100px}.hero{max-width:900px;padding:20px 0 52px}.hero h1{font-size:clamp(42px,7vw,92px);line-height:.98;letter-spacing:-.075em;margin:17px 0 22px;max-width:800px}.hero p{font-size:19px;line-height:1.5;color:var(--muted);max-width:680px}.primary{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 19px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:750;margin-top:18px;text-decoration:none}.section-intro{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:16px}.section-intro h2{font-size:clamp(30px,4vw,54px);line-height:1;letter-spacing:-.06em;margin:8px 0}.section-intro p{color:var(--muted);max-width:420px;margin:0}.journey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:28px 0 56px}.journey div{background:var(--panel);padding:20px}.journey b{display:block;font-size:12px;color:var(--accent);margin-bottom:8px}.journey strong{display:block;line-height:1.3}.journey span{display:block;color:var(--muted);font-size:13px;margin-top:7px}.category-list{display:grid;gap:8px}.lesson-row{display:grid;grid-template-columns:48px minmax(0,1fr) 160px;gap:16px;align-items:center;padding:20px 18px;border:1px solid var(--line);background:var(--panel);border-radius:14px;text-decoration:none;color:var(--ink);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.lesson-row:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}.lesson-no{font-weight:800;color:var(--accent);font-size:13px}.lesson-row h3{margin:0;font-size:18px;letter-spacing:-.025em}.lesson-row p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.4}.row-status{text-align:right;color:var(--muted);font-size:12px}.reader-wrap{max-width:1120px}.reader-head{border-bottom:1px solid var(--line);padding-bottom:30px;margin-bottom:26px}.reader-head h1{font-size:clamp(38px,6vw,76px);line-height:1;letter-spacing:-.07em;margin:13px 0 16px;max-width:900px}.mission{font-size:20px;line-height:1.45;max-width:800px;margin:0;color:var(--muted)}.reader-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;align-items:start}.content{min-width:0}.block{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin:0 0 18px}.block h2{font-size:24px;line-height:1.1;letter-spacing:-.04em;margin:0 0 15px}.block h3{font-size:16px;margin:22px 0 8px}.block p{margin:0 0 12px}.steps{counter-reset:step;list-style:none;padding:0;margin:0}.steps li{counter-increment:step;display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;padding:17px 0;border-top:1px solid var(--line)}.steps li:first-child{border-top:0;padding-top:0}.steps li:before{content:counter(step,decimal-leading-zero);color:var(--accent);font-weight:850;font-size:13px;padding-top:2px}.step-main strong{display:block;font-size:15px;margin-bottom:3px}.plain-list,.check-list{margin:0;padding-left:21px}.plain-list li,.check-list li{margin:7px 0}.check-list{list-style:none;padding:0}.check-list li:before{content:'□';color:var(--accent);font-weight:800;margin-right:10px}.prompt{white-space:pre-wrap;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:17px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:430px}.copy{margin-top:10px;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700}.outcome{background:var(--accent-soft);border-radius:13px;padding:17px;color:var(--ink)}.reference-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.reference-pair figure{margin:0}.reference-pair img{display:block;width:100%;height:auto;border-radius:12px}.reference-pair figcaption{font-size:12px;color:var(--muted);margin-top:6px}.side{position:sticky;top:98px}.side-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}.side-card h3{font-size:14px;margin:0 0 9px}.side-card p{font-size:13px;color:var(--muted);margin:0}.side-card strong{font-size:13px}.file{font:12px ui-monospace,monospace;display:block;background:var(--panel2);border-radius:7px;padding:7px 8px;margin:6px 0;overflow-wrap:anywhere}.completion{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;margin-top:6px}.completion.done{background:var(--panel2);color:var(--accent);border:1px solid var(--line)}.lesson-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.lesson-nav button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:13px;min-height:60px}.lesson-nav button:last-child{text-align:right}.lesson-nav small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:13px 15px;color:var(--ink);margin:15px 0}.results{display:grid;gap:8px}.source-links a{color:var(--accent);display:block;overflow-wrap:anywhere;font-size:13px}.mobile-menu{display:none}@media(max-width:1000px){.layout{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;overflow:auto}.rail-label{display:none}.rail nav{display:flex;gap:6px;margin:0}.nav-cat{white-space:nowrap}.reader-grid{grid-template-columns:1fr}.side{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.side-card{margin:0}.side-card:last-child{grid-column:1/-1}}@media(max-width:650px){.topbar{height:62px}.layout{min-height:calc(100vh - 62px)}.main{padding:28px 16px 70px}.hero{padding:12px 0 36px}.hero h1{font-size:48px}.hero p{font-size:17px}.journey{grid-template-columns:1fr 1fr;margin-bottom:36px}.journey div{padding:15px}.section-intro{display:block}.section-intro p{margin-top:12px}.lesson-row{grid-template-columns:36px minmax(0,1fr);gap:10px;padding:16px 13px}.row-status{grid-column:2;text-align:left;font-size:11px}.reader-head h1{font-size:46px}.mission{font-size:18px}.block{padding:18px;border-radius:14px}.reference-pair{grid-template-columns:1fr}.side{grid-template-columns:1fr}.lesson-nav{grid-template-columns:1fr}.lesson-nav button:last-child{text-align:left}.steps li{grid-template-columns:30px minmax(0,1fr);gap:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><header class="topbar"><a class="brand" href="#home">AI Real Estate Visuals<small>production-first curriculum</small></a><div class="top-actions"><button class="ghost-btn" id="curriculumBtn">Curriculum</button><button class="icon-btn" id="theme" aria-label="Toggle theme">◐</button></div></header><div class="layout"><aside class="rail"><div class="rail-label">Curriculum</div><nav id="railNav"></nav></aside><main class="main" id="app"></main></div><script>
const CURRICULUM=[{"id":"foundations","title":"Foundations","description":"Start with the mission, the project and the standard.","pages":[{"id":"what-youll-build","title":"Choose the property visual job","mission":"Turn a vague request such as “make this listing look better” into one specific visual job with a clear output.","steps":["Create a project folder named `property-name_YYYY-MM-DD`.","Add the original image to `originals`; do not overwrite it.","Open the image and write down what the viewer should notice first.","Choose one job: clean up, brighten, stage, create a twilight concept, or prepare a hero image.","Choose one audience: listing viewer, buyer presentation, rental guest, developer or social viewer.","Choose one final format: landscape listing image, 4:5 feed image, 9:16 story/reel frame or website hero.","Write three facts visible in the source image and three things you are not allowed to invent.","Ask the client or property owner to approve the job before generation."],"prompt":"PROPERTY VISUAL BRIEF\nProperty/project: [name]\nSource file: [filename]\nVisual job: [one verb + one result]\nAudience: [who will see it]\nPrimary subject: [room/exterior/detail]\nVerified visible facts: [fact 1]; [fact 2]; [fact 3]\nDo not invent or change: [windows/doors/flooring/view/room count/etc.]\nAllowed change: [cleanup, exposure, staging concept, twilight mood, or other]\nOutput: [landscape / 4:5 / 9:16] at [delivery size]\nApprover: [name]\nDisclosure needed: [no / edited photo / virtually staged / conceptual visualisation]","deliverable":"`01_property_visual_brief.md` plus the untouched source image.","outcome":"A one-page brief that makes the next image decision obvious and prevents accidental invention.","qc":["Can a complete beginner explain what the source image is?","Does the task change one thing instead of inventing a new property?","Is the brief saved beside the project files?","Would Alex know what to do next without asking for hidden context?","Did you write a pass or fail decision for the first task?"],"prerequisites":["One property image you own or have permission to use.","The property type and the person who will approve the result.","A folder for `originals`, `working`, `exports` and `notes`."],"failure_fixes":["**The job is too broad:** reduce it to one source image and one visible result.","**You cannot verify a fact:** mark it “unknown”; do not ask the image model to fill the gap.","**The format is unclear:** keep a source-preserving landscape master, then make derivatives.","**Nobody can approve it:** pause generation and identify the owner or client approver."],"checklist":["[ ] Original is safely stored.","[ ] One visual job is selected.","[ ] Audience and output format are named.","[ ] Existing facts are separated from permitted changes.","[ ] Approval and disclosure treatment are identified."],"sources":"- **ChatGPT:** use the normal chat for planning; upload the source only when needed for visual analysis. Image creation route: **View all tools → Create image**. OpenAI says existing images can be uploaded and edited, and the Select tool can target an area. https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- **Local artifact route:** a Markdown brief in the project folder; optionally turn it into a one-page PDF after approval.\n\n### Source URLs\n- OpenAI — Creating images in ChatGPT: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- AI-Verse approved direction: `/home/hermes/AI-Verse/real-estate-module-research/AI-Verse-Real-Estate-Visuals-Approved-Direction-2026-09-01.md`\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":1,"pageNumber":1,"firstAction":"Create a project folder named `property-name_YYYY-MM-DD`.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"who-this-is-for","title":"Build a simple visual reference board","mission":"Give the image tool a small, coherent reference set instead of a pile of unrelated inspiration.","steps":["Make a `references` folder inside the project.","Add one exterior or architecture reference, one material reference and one lighting reference.","Rename each file with its purpose, for example `ref_warm_oak_floor.jpg`.","Remove references that show features absent from the real property.","Write a short sentence describing the shared visual direction.","Record the colours, materials, light quality and camera feeling you want.","Record what the references must not change in the source property.","Save the board as a contact sheet or simple PDF.","Use the board to brief one image generation or edit; do not use it to invent facts."],"prompt":"VISUAL REFERENCE BOARD\nDirection: [three to five words]\nPalette: [colours]\nMaterials: [materials]\nLight: [direction, softness, time of day]\nCamera feeling: [eye-level / wide but natural / editorial / documentary]\nUse references for: [mood, palette, furniture style, light]\nNever copy or invent: [views, windows, rooms, finishes, amenities]\nProperty locks: [list fixed elements]","deliverable":"`02_visual_reference_board.pdf` and `visual_direction.md`.","outcome":"A six-image-or-fewer reference board that makes style repeatable while leaving the property’s architecture authoritative.","qc":["Is the first result small enough to finish today?","Is the source and final file clearly defined?","Are later outputs separated from today’s task?","Would Alex understand what finished means?"],"prerequisites":["Lesson 1 brief.","One source property image.","Three to six references that show mood, materials or camera feeling—not another property to copy."],"failure_fixes":["**The board looks like a different house:** remove feature-heavy references and keep abstract material/light references.","**The tool produces mixed styles:** reduce the board to three references with one sentence of direction.","**The result becomes too editorial:** add “natural real-estate photography, believable materials, practical scale.”"],"checklist":["[ ] Every reference has a purpose.","[ ] No reference introduces an unverified property feature.","[ ] Palette, materials, light and camera feeling are written down.","[ ] Fixed property elements are listed.","[ ] Board is saved with the project."],"sources":"- **ChatGPT Images:** upload the source plus a small reference set; ask for a visual direction or image variation. OpenAI documents image generation and editing in ChatGPT. https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- **Adobe Lightroom on the web:** use albums and ratings to organise reference images; Adobe documents albums, ratings and photo organisation in the Lightroom web help centre. https://helpx.adobe.com/lightroom-cc/web/organize-photos/add-and-organize-photos.html\n- **Artifact route:** make a PDF/contact sheet in any local image or layout editor; keep source filenames in the board.\n\n### Source URLs\n- OpenAI ChatGPT image creation: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- Lightroom web help: https://helpx.adobe.com/lightroom-cc/web/organize-photos/add-and-organize-photos.html\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":1,"pageNumber":2,"firstAction":"Make a `references` folder inside the project.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"the-one-property-project","title":"Write a property-aware image prompt","mission":"Learn a reusable prompt structure that tells the model what may change and what must stay fixed.","steps":["Upload the source image to ChatGPT.","State whether you want cleanup, enhancement, staging or a concept.","Describe the room as it exists, using only visible facts.","List fixed elements before describing style.","Describe any permitted changes with material, placement and scale.","Describe light direction and exposure.","Add exclusions for people, pets, text, watermarks and geometry changes.","Generate one result, compare it with the source, then change one instruction at a time.","Save the final prompt beside the selected output."],"prompt":"Use the uploaded property photograph as the authority for composition and architecture.\n\nMODE: [truthful enhancement / cleanup / virtual staging visualisation]\nROOM OR VIEW: [what is visible]\nKEEP EXACTLY: [camera angle]; [room proportions]; [windows and doors]; [flooring]; [wall and ceiling lines]; [built-in cabinets]; [outside view]; [fixed lights and hardware]\nALLOWED CHANGE: [specific edit only]\nPLACEMENT AND SCALE: [where the change goes and how it sits on the floor]\nMATERIALS AND COLOUR: [named materials and restrained palette]\nLIGHT: Match the existing light direction and keep exposure believable.\nREAL-ESTATE PHOTOGRAPHY: natural perspective, realistic scale, clean detail, no dramatic lens distortion.\nDO NOT ADD OR CHANGE: rooms, windows, doors, views, dimensions, amenities, finishes, logos, text, people, pets or watermarks.\nCreate one restrained result that can be compared directly with the source.","deliverable":"`03_property_image_prompt.txt` and one selected test image.","outcome":"A prompt that produces a restrained, source-led edit rather than a completely new room.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Property brief and visual board.","One clear source image.","A list of structural locks: windows, doors, flooring, walls, cabinets, ceiling lines and view."],"failure_fixes":["**Architecture changes:** repeat the fixed list, use a smaller selected edit area, and work from a higher-resolution source.","**Furniture floats:** specify floor contact, scale, perspective and contact shadow.","**Too many changes:** remove adjectives and leave only the permitted change.","**Text or logos appear:** request no text/logos, then add real brand elements later in a deterministic editor."],"checklist":["[ ] Mode is named.","[ ] Source facts are visible and specific.","[ ] Structural locks are explicit.","[ ] Allowed change is limited.","[ ] Exclusions are present.","[ ] Prompt and chosen result are saved."],"sources":"- **Default route: ChatGPT Images:** normal chat → upload image → describe edit; use **Select** to target a region. OpenAI documents this exact user flow. https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- **API route for builders:** OpenAI’s image generation API documentation is the route for a developer-built prompt tool; availability and model parameters must be checked in the current API docs before implementation. https://platform.openai.com/docs/guides/images\n\n### Source URLs\n- OpenAI ChatGPT image creation/editing: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- Public real-estate prompt structure reference: https://meltflexai.com/blog/nano-banana-prompts-real-estate\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":1,"pageNumber":3,"firstAction":"Upload the source image to ChatGPT.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"tools-and-working-files","title":"Make the first image-to-video test","mission":"Turn one approved still into a short, calm camera move without asking the model to redesign the room.","steps":["Select a still with clean edges and no visible generation errors.","Decide one movement: slow push-in, gentle lateral slide or locked-off breathing motion.","Write only the motion and camera instruction first.","Upload the still as the first frame in the selected video tool.","Generate a short clip rather than a long sequence.","Watch at normal speed and inspect the first and last seconds.","Reject clips that bend walls, move windows, melt furniture or change the view.","Save the best clip with the exact prompt and model name.","If the generated clip is unusable, create a deterministic Ken Burns move in the editor and keep the still as the authority."],"prompt":"Slow, steady real-estate camera push-in through the room, eye-level height, natural perspective, subtle movement only. Keep all walls, windows, doors, flooring, cabinetry, furniture, reflections and exterior view fixed. No new objects, no object motion, no warping, no zoom burst, no text. 4 seconds.","deliverable":"`04_first_property_motion.mp4` plus `04_motion_prompt.txt`.","outcome":"One short movement clip that adds life while preserving the room.","qc":["Does every tool have one defined job?","Is there a tool-agnostic fallback?","Is the current version or documentation date recorded?","Would Alex know what to open and why?","Is the draft log saved with the tool and date used?"],"prerequisites":["One clean, approved still.","Lesson 3 prompt and source comparison.","A Runway, Luma or Google video account, or a local editor for a non-generative movement test."],"failure_fixes":["**Walls or windows bend:** simplify to “locked camera, almost imperceptible movement,” or use a 2D editor move.","**Furniture moves:** say “all objects remain completely static” and reduce motion.","**Flicker:** improve the still, remove reflections, shorten duration and regenerate.","**Camera feels too wide:** specify eye level and natural perspective; do not add a lens number the source cannot support."],"checklist":["[ ] Still was approved before animation.","[ ] One motion is selected.","[ ] Prompt focuses on motion.","[ ] Clip is short.","[ ] Architecture and fixed objects remain stable.","[ ] Prompt, model and result are saved."],"sources":"- **Runway:** image-to-video workspace; its official guide says the image supplies composition, subject, lighting and style, while the text prompt should focus on motion, camera work and timing. https://help.runwayml.com/hc/en-us/articles/48324313115155\n- **Luma Dream Machine:** use uploaded image/keyframe workflow; Luma documents start/end keyframes. https://lumalabs.ai/learning-hub/how-to-use-keyframes\n- **Google Veo:** Gemini API or Vertex AI Media Studio; current Google documentation lists image input and first/last-frame workflows. https://ai.google.dev/gemini-api/docs/veo and https://cloud.google.com/vertex-ai/generative-ai/docs/video/generate-videos-from-first-and-last-frames\n- **Deterministic fallback:** FFmpeg or an editor for a gentle pan/zoom; property-video pipeline reference: https://github.com/phawatboom/property-video-pipeline\n\n### Source URLs\n- Runway image-to-video prompting: https://help.runwayml.com/hc/en-us/articles/48324313115155\n- Luma keyframes: https://lumalabs.ai/learning-hub/how-to-use-keyframes\n- Google Veo first/last frames: https://cloud.google.com/vertex-ai/generative-ai/docs/video/generate-videos-from-first-and-last-frames\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":1,"pageNumber":4,"firstAction":"Select a still with clean edges and no visible generation errors.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"ai-verse-quality-standard","title":"Prepare a reusable project drop","mission":"Create a project structure that makes every later image, video and artifact easy to find and trace back to its source.","steps":["Create folders: `01_originals`, `02_sources`, `03_working`, `04_approved`, `05_visualisations`, `06_video`, `07_artifacts`, `08_delivery`.","Put untouched source files only in `01_originals`.","Put client-supplied facts and permissions in `02_sources`.","Put prompts, masks and working versions in `03_working`.","Put approved existing-property edits in `04_approved`.","Put staged or conceptual work in `05_visualisations`.","Rename files using `property_room_version_date`, for example `oak-house_living-clean_v01_2026-09-01.jpg`.","Create a manifest with source, output, tool, prompt, status and approver.","Open the delivery folder as a client would and remove drafts."],"prompt":"ASSET MANIFEST\nAsset ID: [ID]\nFilename: [filename]\nSource file(s): [filenames]\nType: [original / edited / visualisation / video / artifact]\nTool and route: [tool + workspace/API/editor]\nPrompt or edit note: [link or filename]\nChanges made: [short factual list]\nDisclosure: [none / edited photo / virtually staged / conceptual visualisation]\nStatus: [draft / approved / rejected]\nApproved by/date: [name/date]\nExport: [format, dimensions, colour profile if known]","deliverable":"A reusable property project drop with `asset-manifest.csv` or `asset-manifest.md`.","outcome":"A clean, repeatable project drop with originals, working material, approved outputs and visualisations separated.","qc":["Did you compare against the source?","Did you inspect the result at full size and phone size?","Did you identify a specific failure instead of saying it feels wrong?","Would Alex know what to fix next?"],"prerequisites":["Lessons 1–4.","Original image, selected edit, motion test and notes."],"failure_fixes":["**Files are mixed:** stop and sort by asset type before making more outputs.","**You cannot trace an output:** add the source filename and prompt to the manifest.","**Drafts reach delivery:** make `08_delivery` a copy containing approved files only."],"checklist":["[ ] Folder structure exists.","[ ] Originals are untouched.","[ ] Visualisations are separated.","[ ] Filenames are readable.","[ ] Manifest records source, tool, changes and approval.","[ ] Delivery folder contains no drafts."],"sources":"- **Local filesystem:** preferred for source preservation and portable delivery.\n- **Cloud storage:** use the client-approved Drive/Dropbox/Box workspace; do not upload sensitive media to an unapproved service.\n- **Media inspection:** FFmpeg `ffprobe` and MediaInfo expose machine-readable media details for image/video handoff. https://ffmpeg.org/ffprobe.html and https://mediaarea.net/MediaInfo\n\n### Source URLs\n- FFprobe: https://ffmpeg.org/ffprobe.html\n- MediaInfo: https://mediaarea.net/MediaInfo\n- OpenAI content provenance guidance: https://developers.openai.com/api/docs/guides/content-provenance\n\n---\n\n# PROPERTY TRUTH","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":1,"pageNumber":5,"firstAction":"Create folders: `01_originals`, `02_sources`, `03_working`, `04_approved`, `05_visualisations`, `06_video`, `07_artifacts`, `08_delivery`.","nextAction":"Open the next lesson when the deliverable is saved."}]},{"id":"property-truth","title":"Property Truth","description":"Lock what is real before you improve how it looks.","pages":[{"id":"property-truth-sheet","title":"Inventory the room from source media","mission":"Build a room-by-room record of what is actually visible before changing anything.","steps":["List every source image and its viewpoint.","Assign each image a room or exterior location.","Record fixed elements: windows, doors, stairs, floors, walls, cabinets, counters, fixtures and built-ins.","Record movable elements: furniture, rugs, lamps, plants and decor.","Record visible conditions: daylight direction, shadows, reflections and exposure.","Record unknowns separately; do not infer from another room.","Record visible exclusions such as faces, plates, addresses, documents or screens.","Mark each claim as `visible`, `supplied by owner` or `unknown`.","Save one row per room and link the source filenames."],"prompt":"ROOM INVENTORY\nRoom/view: [name]\nSource images: [filenames]\nFixed elements visible: [list]\nMovable elements visible: [list]\nMaterials/colours visible: [list]\nLight direction/quality: [description]\nExterior view visible: [description or none]\nPrivacy items: [faces, plates, documents, screens, reflections]\nVerified by source: [yes/no]\nOwner-supplied facts not visible: [list]\nUnknowns: [list]","deliverable":"`06_room_inventory.csv` or `06_room_inventory.md`.","outcome":"A factual inventory that lets you identify a real edit from an invented feature.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Permission-cleared source images or a supplied practice set.","A spreadsheet or Markdown table."],"failure_fixes":["**You cannot identify a room:** use a neutral label such as `view-03` until confirmed.","**Different angles conflict:** keep both observations and flag the conflict for review.","**A fact comes from a listing description only:** mark it owner-supplied, not visible in the image."],"checklist":["[ ] Every source image has an ID.","[ ] Fixed and movable elements are separate.","[ ] Light and reflections are recorded.","[ ] Privacy items are listed.","[ ] Unknowns are not filled with guesses."],"sources":"- **ChatGPT:** upload one image at a time for a written visual inventory; manually verify every observation against the source.\n- **Lightroom on the web:** albums, ratings, metadata and versions help organise the source set; Lightroom documents photo organisation, metadata and versions. https://helpx.adobe.com/lightroom-cc/web/organize-photos/add-and-organize-photos.html\n- **Artifact route:** spreadsheet or Markdown table; no live MLS connection is required.\n\n### Source URLs\n- Lightroom web organisation: https://helpx.adobe.com/lightroom-cc/web/organize-photos/add-and-organize-photos.html\n- RESO Web API overview (for later authorized data work, not required here): https://www.reso.org/reso-web-api\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":2,"pageNumber":1,"firstAction":"List every source image and its viewpoint.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"source-image-audit","title":"Lock architecture and perspective","mission":"Create a visual lock list so edits improve presentation without changing the property’s geometry.","steps":["Open the source at full size.","Identify the vertical lines of doors, windows and cabinets.","Identify the horizon or main horizontal lines.","Note the floor-wall intersection and the main vanishing direction.","Write down the camera height feeling: eye level, low or elevated.","Mark all structural features that must remain unchanged.","If using Photoshop, use architectural guides or Perspective Warp only to prepare the image—not to invent a new room.","When staging, select only the area where furniture may be added.","Compare the edit to the lock list before approving it."],"prompt":"ARCHITECTURE LOCK\nSource: [filename]\nCamera feeling: [eye-level / low / elevated]\nVertical locks: [window edge, door edge, cabinet edge]\nHorizontal locks: [horizon, countertop, ceiling, floor line]\nMust not change: [full list]\nEditable region: [floor area / wall area / object area]\nPerspective notes: [direction and depth cues]\nReject if: [warped lines, moved openings, changed floor, changed view]","deliverable":"`07_architecture_lock.md` plus an annotated working copy.","outcome":"A concise geometry reference used for every later image variation.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Room inventory.","One source image with visible floor and wall intersections."],"failure_fixes":["**Lines are already distorted:** keep the original and make a note; do not “correct” it into a different room without approval.","**The selected edit changes walls:** shrink the selection to the intended object area.","**Furniture scale is wrong:** use floor lines and a known doorway or counter as scale anchors."],"checklist":["[ ] Vertical and horizontal anchors are named.","[ ] Editable region is limited.","[ ] Camera feeling is recorded.","[ ] Rejection conditions are clear.","[ ] Source remains available for direct comparison."],"sources":"- **Adobe Photoshop:** Perspective Warp is the architectural-plane preparation route; Adobe documents defining planes and adjusting perspective. https://helpx.adobe.com/photoshop/using/perspective-warp.html\n- **ChatGPT Images:** use selected-region editing for limited changes; preserve the source as the authority. https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- **Manual fallback:** a local editor with guides and a layer-based workflow.\n\n### Source URLs\n- Photoshop Perspective Warp: https://helpx.adobe.com/photoshop/using/perspective-warp.html\n- OpenAI ChatGPT image editing: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":2,"pageNumber":2,"firstAction":"Open the source at full size.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"real-changes-vs-visual-concepts","title":"Clean clutter and protect privacy","mission":"Remove distractions and exposed personal information while keeping the room truthful.","steps":["Duplicate the source into `working`; never edit the only original.","Circle or list removable distractions: bins, cables, temporary objects or minor clutter.","List privacy items separately: faces, plates, documents, screens, house numbers, reflections and metadata.","Remove one item at a time using a small selection.","Compare the filled area with nearby texture, shadows and perspective.","Check mirrors and windows for accidental changes.","Inspect the image at 100 percent for seams, repeated textures and halos.","Save a before/after pair and a change log.","Keep any meaningful alteration labelled in the manifest."],"prompt":"Edit only the selected area of this real-estate photograph.\nRemove: [specific object].\nRebuild the existing floor/wall/background texture naturally.\nKeep the camera angle, room geometry, windows, doors, flooring, lighting direction, reflections and all other objects unchanged.\nDo not add furniture, decor, people, pets, text or new architectural features.","deliverable":"`08_clean_privacy_safe.jpg`, before/after comparison and `08_change_log.md`.","outcome":"A cleaner, privacy-safe image with the same room, viewpoint and fixed features.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Architecture lock.","Source image and a written list of removable items.","Permission to edit the image."],"failure_fixes":["**Texture repeats:** use a smaller selection and a non-generative heal/clone pass.","**Reflection changes:** do not generatively fill the mirror; crop, blur or mask only with permission.","**A face/document remains:** use a deliberate privacy mask or blur and record it.","**The room changes:** restore the source and make a smaller, item-specific edit."],"checklist":["[ ] Clutter and privacy are separate lists.","[ ] Only selected areas were edited.","[ ] Mirrors, windows and screens were inspected.","[ ] No new property feature was added.","[ ] Before/after and change log are saved."],"sources":"- **Adobe Photoshop Generative Fill/Remove:** select a limited region and remove or fill; Adobe’s current page documents Generative Fill, Remove and supported upload constraints for its web tryout. https://www.adobe.com/products/photoshop/generative-fill.html\n- **Lightroom on the web:** Remove Objects with Gen AI, Heal and Clone are available in the documented editing workflow. https://helpx.adobe.com/lightroom-cc/web/edit-photos/remove-objects/remove-objects.html\n- **ChatGPT Images:** use for a small selected edit, then compare carefully. https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n\n### Source URLs\n- Adobe Generative Fill: https://www.adobe.com/products/photoshop/generative-fill.html\n- Lightroom remove objects: https://helpx.adobe.com/lightroom-cc/web/edit-photos/remove-objects/remove-objects.html\n- FTC personal information guide: https://www.ftc.gov/business-guidance/resources/protecting-personal-information-guide\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":2,"pageNumber":3,"firstAction":"Duplicate the source into `working`; never edit the only original.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"media-intake-and-organisation","title":"Balance exposure and colour without changing the scene","mission":"Make a property image easier to read while preserving the actual light direction, materials and view.","steps":["Duplicate the cleaned image.","Correct overall exposure conservatively.","Recover bright windows without painting a new exterior view.","Lift dark shadows only until the room remains believable.","Neutralise an obvious colour cast while retaining the property’s natural mood.","Use a local mask for a wall, window or shadow instead of changing everything.","Check floors, white walls, wood and fabric for colour shifts.","Compare the adjusted image with the source at normal viewing size.","Save the settings or edit notes so the rest of the property can match."],"prompt":"LIGHTING EDIT NOTE\nSource: [filename]\nGoal: improve readability, not change the scene.\nGlobal change: [exposure/contrast/temperature]\nLocal areas: [window/shadow/wall/etc.]\nPreserve: light direction, exterior view, material colour, shadow direction and room geometry.\nDo not add: sunlight beams, new fixtures, new views, extra windows or dramatic weather.","deliverable":"`09_balanced_exposure.jpg` and `09_lighting_edit_note.md`.","outcome":"A more legible image that still looks like the same photograph taken in the same place.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Clean source image.","Architecture lock.","Basic understanding that brightening is not the same as adding a new window view."],"failure_fixes":["**Windows become fake landscapes:** restore the source view; balance exposure locally.","**The room looks grey or flat:** reduce shadow lift and add restrained contrast.","**Mixed light looks unnatural:** correct separate colour zones with masks rather than one global temperature shift.","**Materials change colour:** use a smaller adjustment and compare to another property angle."],"checklist":["[ ] Window view is unchanged.","[ ] Light direction is unchanged.","[ ] Materials still look believable.","[ ] Local masks are used where needed.","[ ] Edit notes are saved."],"sources":"- **Lightroom on the web:** use Exposure, Highlights, Shadows, Temperature and Tint; its documented Masking → Luminance Range workflow targets brightness ranges. https://helpx.adobe.com/lightroom-cc/web/edit-photos/apply-masks/create-mask-with-luminance-range.html\n- **Photoshop:** use adjustment layers and masks for controlled local changes. https://helpx.adobe.com/photoshop/using/layer-masks.html\n- **Topaz Photo:** Adjust Lighting is a current enhancement route for difficult inputs; inspect results against the original. https://docs.topazlabs.com/topaz-photo/enhancements/adjust-lighting\n\n### Source URLs\n- Lightroom Luminance Range mask: https://helpx.adobe.com/lightroom-cc/web/edit-photos/apply-masks/create-mask-with-luminance-range.html\n- Topaz Adjust Lighting: https://docs.topazlabs.com/topaz-photo/enhancements/adjust-lighting\n- Photoshop layer masks: https://helpx.adobe.com/photoshop/using/layer-masks.html\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":2,"pageNumber":4,"firstAction":"Duplicate the cleaned image.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"property-visual-bible","title":"Assemble the Property Truth Sheet","mission":"Combine the room inventory, architecture locks, permitted edits and disclosure notes into one source of truth for the project.","steps":["Create one document named `property-truth-sheet`.","Add the project identity and source-permission note.","Add verified property facts supplied by the owner or visible in source media.","Add a room-by-room image index.","Add fixed architectural features and forbidden changes.","Add allowed edits and separate visualisation ideas.","Add privacy, rights and disclosure notes.","Add the approved output list and approver.","Link every approved image to its source and change log."],"prompt":"PROPERTY TRUTH SHEET\nProject/property: [name]\nSource owner/permission: [name/status]\nIntended use: [listing / presentation / campaign / concept]\n\nVERIFIED FACTS\n- Property type: [fact/source]\n- Rooms/views shown: [fact/source]\n- Visible materials/features: [fact/source]\n- Owner-supplied facts: [fact/source]\n\nARCHITECTURAL LOCKS\n- Preserve: [windows, doors, floors, walls, cabinets, views, proportions]\n- Never invent: [rooms, dimensions, amenities, finishes, views]\n\nALLOWED EDITS\n- Existing-property edits: [list]\n- Visualisations: [list; each marked conceptual]\n\nPRIVACY AND RIGHTS\n- Remove/mask: [list]\n- People, logos, music or third-party media permissions: [status]\n\nDISCLOSURE\n- Required label or pairing: [text/status; confirm local MLS/platform rule]\n\nAPPROVAL\n- Reviewer: [name]\n- Approved assets: [IDs]\n- Date: [date]","deliverable":"`10_property_truth_sheet.md` or a shareable PDF plus linked asset manifest.","outcome":"A portable truth record that another creator can use without guessing what the property contains.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Lessons 6–9.","The approver’s name and the intended listing or campaign use."],"failure_fixes":["**Facts have no source:** move them to unknown or owner-supplied.","**Edited and staged outputs are mixed:** separate the lists and folders.","**Disclosure wording is uncertain:** write “confirm local rule” and ask the responsible broker/platform—not an image model."],"checklist":["[ ] Facts have sources.","[ ] Locks and forbidden changes are explicit.","[ ] Existing edits and visualisations are separate.","[ ] Privacy and rights are recorded.","[ ] Approved assets link back to source files."],"sources":"- **Artifact route:** Markdown, spreadsheet or PDF is the preferred portable format.\n- **ChatGPT:** use for organising supplied facts, not inventing missing facts.\n- **OpenAI content provenance:** consult when building an automated image workflow or documenting provenance. https://developers.openai.com/api/docs/guides/content-provenance\n- **Local/approved cloud folder:** keep the sheet beside the source and approved media.\n\n### Source URLs\n- OpenAI content provenance: https://developers.openai.com/api/docs/guides/content-provenance\n- CRMLS digitally altered image guidance: https://kb.crmls.org/knowledgebase/digitally-altered-image-guidance-faqs/\n- NorthstarMLS virtual staging and AI image guidance: https://northstarmls.com/insights/guidelines-for-virtual-staging-and-ai-enhanced-listing-photos\n- NAR AI policy guidance: https://www.nar.realtor/news/aexperience/crafting-an-ai-use-policy\n\n---\n\n# AI PROPERTY IMAGES","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":2,"pageNumber":5,"firstAction":"Create one document named `property-truth-sheet`.","nextAction":"Open the next lesson when the deliverable is saved."}]},{"id":"ai-property-images","title":"AI Property Images","description":"Improve the image without damaging the property.","pages":[{"id":"cleanup-and-declutter","title":"Create a truthful hero enhancement","mission":"Produce one polished hero image from a real source without changing the property’s physical story.","steps":["Select the strongest source view from the truth sheet.","Make a working copy at the required output size.","Use the image prompt from Lesson 3 in truthful-enhancement mode.","Request only the approved cleanup and light adjustments.","Generate two or three restrained variations.","Compare each variation directly against the source.","Reject changes to architecture, view, fixtures, scale or material identity.","Select one result and add brand text only in a separate layout editor if needed.","Export a clean master and a platform derivative."],"prompt":"Truthful enhancement of the uploaded real-estate photograph. Preserve the exact composition, camera viewpoint, room proportions, windows, doors, flooring, walls, cabinetry, fixtures, exterior view and natural light direction. Improve only [approved cleanup/exposure/colour change]. Keep materials and furniture recognisable. Use restrained, natural real-estate photography with believable perspective. Do not add or remove rooms, architectural features, amenities, furniture, people, pets, text, logos or watermarks. Return one source-faithful hero image.","deliverable":"`11_hero_truthful_enhancement.jpg`, source comparison and manifest entry.","outcome":"A polished hero still that remains recognisably the same property image.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"reference":{"label":"Reference pair · generated with local ChatGPT image capability","before":"assets/cleanup-before.png","after":"assets/cleanup-after.png","beforeCaption":"Before: source room with temporary box, cables, bin and delivery bag.","afterCaption":"After: only the temporary clutter removed. Architecture, furniture, light and camera preserved.","promptBefore":"Photorealistic real-estate interior source photograph for a beginner cleanup lesson. A modest contemporary apartment living room photographed straight-on from eye height with a natural 24mm full-frame lens, believable architectural geometry, pale walls, wood floor, sofa, coffee table, large window, daylight. Include realistic temporary clutter that can be removed later: a cardboard box near the wall, two loose cables beside the media console, a small recycling bin, a folded delivery bag on the floor. No people, no readable text, no logos, no watermark. Natural exposure, neutral colour, realistic camera texture, not CGI, not an architectural render, not an artificial before-and-after composite.","promptAfter":"Edit this exact source photograph for a real-estate cleanup lesson. Remove only the temporary clutter: the cardboard box, the two loose cables, the small recycling bin and the folded delivery bag. Preserve the exact room architecture, camera position, lens perspective, sofa, coffee table, media console, window, walls, floor, lighting direction, shadows and all permanent fixtures. Do not redesign, restage or enhance the room. Keep the result photorealistic and naturally imperfect. No people, no readable text, no logos, no watermark."},"prerequisites":["Approved Property Truth Sheet.","Cleaned and exposure-balanced source.","One selected hero viewpoint."],"failure_fixes":["**It looks like a new listing:** return to the original and narrow the requested edit.","**AI adds decor:** explicitly say “no new objects” and use selected-region editing.","**Brand text is wrong:** remove generated text and composite the exact text/logo in an editor.","**Image is soft:** use the highest-quality source; upscale only after the edit is approved."],"checklist":["[ ] Source and enhancement are paired.","[ ] Only approved changes were made.","[ ] Architecture and view match.","[ ] Brand elements were added outside generation.","[ ] Export dimensions and disclosure are recorded."],"sources":"- **Default image route: ChatGPT Images** via upload + edit or **View all tools → Create image**. https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- **Adobe Photoshop Generative Fill/Remove:** use for bounded cleanup and controlled expansion. https://www.adobe.com/products/photoshop/generative-fill.html\n- **Topaz Photo:** use Remove Object, Adjust Lighting or upscale only when the source needs it; inspect for artifacts. https://docs.topazlabs.com/topaz-photo/enhancements/remove-object and https://docs.topazlabs.com/topaz-photo/enhancements/adjust-lighting\n\n### Source URLs\n- OpenAI ChatGPT Images: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- Adobe Generative Fill: https://www.adobe.com/products/photoshop/generative-fill.html\n- Topaz Remove Object: https://docs.topazlabs.com/topaz-photo/enhancements/remove-object\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":3,"pageNumber":1,"firstAction":"Select the strongest source view from the truth sheet.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"depersonalisation-and-privacy-cleanup","title":"Stage one empty room as a visualisation","mission":"Add furniture to an empty room while preserving the room’s perspective, scale and fixed architecture—and clearly present the result as a visualisation.","steps":["Confirm the source is an empty room and identify the usable floor area.","Select one restrained style: for example, warm contemporary or quiet Scandinavian.","Name the furniture pieces, materials, approximate scale and placement.","Keep windows, doors, floors, walls, ceiling and fixed fixtures locked.","Use a limited selected area for furniture placement.","Generate two variations with the same style and camera angle.","Check legs, floor contact, shadows, wall intersections and clearance around doors.","Reject any variation that changes the room or implies a nonexistent feature.","Export with a visible `Virtually staged visualisation` label or a paired original."],"prompt":"Create a VIRTUALLY STAGED VISUALISATION from the uploaded empty-room photograph.\nPreserve exactly: camera angle, room proportions, ceiling, walls, windows, doors, flooring, built-in elements, fixed lights and exterior view.\nAdd only: [sofa/table/bed/chairs/rug/lamp], placed [locations], at believable real-world scale.\nStyle: [style pack]. Materials: [named materials]. Palette: [colours].\nMatch the existing perspective, light direction and exposure. Every object must sit on the floor with believable contact shadows and clear paths to doors and windows.\nDo not alter architecture, add rooms, change the view, move fixed fixtures, add people, pets, text or watermarks.\nKeep the result clearly a design possibility, not a photograph of the current unfurnished state.","deliverable":"`12_virtual_staging_visualisation.jpg`, original source and a before/after pair with label.","outcome":"A plausible, source-faithful staged concept that helps a viewer imagine use of the room without misrepresenting its current condition.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Empty-room source and architecture lock.","A selected style pack and furniture list.","Approval to create a virtually staged concept."],"failure_fixes":["**Furniture floats:** specify floor contact and shadow; reduce furniture count.","**Furniture is too large:** use doors, counters and floorboards as scale references.","**Window or door moves:** reduce the mask and restate structural locks.","**Room looks crowded:** remove one or two pieces and preserve circulation.","**Label is missing:** add it in the layout editor and keep the original beside it."],"checklist":["[ ] Output is called a visualisation.","[ ] Architecture is unchanged.","[ ] Furniture has believable scale and floor contact.","[ ] Doors and windows remain usable.","[ ] Original and staged versions are paired."],"sources":"- **ChatGPT Images:** default route for uploaded-image editing; use selected-region edits where possible. https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- **Photoshop:** Generative Fill for bounded furniture placement; keep original layer and add label in a normal text layer. https://www.adobe.com/products/photoshop/generative-fill.html\n- **Lightroom:** organise and compare original/visualisation versions; do not rely on a generative staging result to preserve geometry automatically. https://helpx.adobe.com/lightroom-cc/web/edit-photos/create-versions.html\n\n### Source URLs\n- OpenAI image editing: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- Photoshop Generative Fill: https://www.adobe.com/products/photoshop/generative-fill.html\n- Public staging brief structure: https://raw.githubusercontent.com/Anil-matcha/ai-creator-academy/main/tracks/09-ai-real-estate-staging/templates/virtual-staging-brief.md\n- NorthstarMLS guidance: https://northstarmls.com/insights/guidelines-for-virtual-staging-and-ai-enhanced-listing-photos\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":3,"pageNumber":2,"firstAction":"Confirm the source is an empty room and identify the usable floor area.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"lighting-and-exposure-enhancement","title":"Build two consistent room variations","mission":"Create two room images that share one property’s materials, style and visual language instead of looking like unrelated homes.","steps":["Choose two rooms with clear, permission-cleared source images.","Extract the shared palette and materials from the truth sheet.","Select one style and one lighting direction for both images.","Write a “must repeat” list: floor tone, wall colour, hardware, wood, fabric and camera feeling.","Write a “room-specific” list so each room still fits its real geometry.","Use the same style block in both prompts.","Generate one room at a time; do not ask for a whole house in one prompt.","Compare the pair side by side for palette, exposure, furniture scale and realism.","Save the shared style block as a reusable property visual bible entry."],"prompt":"PROPERTY STYLE LOCK\nUse the same restrained visual language across this property: [palette], [wood/stone/metal materials], [light quality and direction], natural real-estate camera feeling, believable scale, clean but lived-in presentation. Do not introduce a different flooring tone, wall colour, hardware finish, weather, lens distortion or furniture language. Preserve each room’s actual architecture and viewpoint.","deliverable":"Two-image `13_consistent_room_set` plus `property_visual_bible.md`.","outcome":"Two coherent room images that belong to the same property campaign.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["One approved hero image and one additional room source.","Property Truth Sheet.","Visual reference board."],"failure_fixes":["**Colours drift:** name exact material relationships and attach the approved hero as a reference.","**Furniture language changes:** repeat the same style block and reduce decorative adjectives.","**Rooms become too similar:** keep style shared but describe each room’s actual fixed elements first.","**One image is brighter:** match exposure in Lightroom after generation, not by inventing new light."],"checklist":["[ ] Shared style block is identical.","[ ] Room-specific architecture is preserved.","[ ] Palette and materials match.","[ ] Exposure and light feel related.","[ ] Both outputs link to their source images."],"sources":"- **ChatGPT Images:** upload each source and reuse the same style lock; the local ChatGPT route is the default reference path.\n- **Lightroom:** use Copy/Paste Edits or matching local adjustments after generation for exposure and colour alignment. https://helpx.adobe.com/lightroom-cc/web/edit-photos/copy-and-paste-edits.html\n- **Photoshop:** use shared adjustment layers or a saved action for deterministic finishing. https://helpx.adobe.com/photoshop/using/actions-actions-panel.html\n\n### Source URLs\n- OpenAI image generation/editing: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- Lightroom copy/paste edits: https://helpx.adobe.com/lightroom-cc/web/edit-photos/copy-and-paste-edits.html\n- Visual IQ public listing-context library reference: https://evolveuniversity.ai/courses/visual-iq\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":3,"pageNumber":3,"firstAction":"Choose two rooms with clear, permission-cleared source images.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"exterior-and-twilight-variants","title":"Create an exterior or twilight concept","mission":"Make a controlled exterior mood variation while keeping roofline, openings, landscape, view and property identity intact.","steps":["Choose the source exterior with the cleanest roofline and facade.","Record the existing sun direction, sky, shadows and visible landscape.","Choose one concept: balanced daylight, golden hour or twilight.","State that the building geometry and openings must remain exact.","Keep landscaping changes out unless explicitly approved.","Generate a restrained variation from the source image.","Compare roofline, windows, doors, facade materials, driveway and surrounding view.","Correct colour or exposure in Lightroom rather than regenerating repeatedly.","Label the image if the sky, time of day or lighting is materially synthetic."],"prompt":"Create a restrained [golden-hour / twilight] visualisation of the uploaded property exterior.\nPreserve exactly the building footprint, roofline, windows, doors, facade materials, driveway, paths, visible landscaping, neighbouring context and camera viewpoint. Keep all openings and proportions unchanged.\nChange only the time-of-day atmosphere: [specific warm/cool light direction], believable sky brightness, subtle practical lights if approved: [yes/no].\nDo not add extensions, balconies, windows, trees, pools, cars, people, signage, text or new views. Keep the property recognisable as the same photographed building and avoid dramatic fantasy lighting.","deliverable":"`14_exterior_twilight_visualisation.jpg` with source pairing and disclosure note.","outcome":"A believable mood variant that remains clearly the same property and is not mistaken for documentary current-condition media.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Clear exterior source.","Property Truth Sheet with roofline, windows, doors, landscaping and view locks.","Permission to create a twilight or seasonal visualisation."],"failure_fixes":["**Roofline changes:** use a tighter selection or a manual sky replacement with a source-matched horizon.","**Windows multiply:** restate openings as locked and compare against the source at full size.","**Landscaping changes:** remove that instruction and use colour grading only.","**Twilight looks theatrical:** lower saturation and contrast; retain natural ambient light."],"checklist":["[ ] Roofline and openings match.","[ ] Landscape and view are not invented.","[ ] One mood change is made.","[ ] Label/pairing is included where needed.","[ ] Source and concept are both delivered."],"sources":"- **ChatGPT Images:** upload source and ask for a bounded time-of-day edit. https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- **Photoshop Generative Fill:** use a selected sky/lighting region, keeping the building on a locked layer. https://www.adobe.com/products/photoshop/generative-fill.html\n- **Lightroom:** use masks and local lighting for a non-generative mood pass. https://helpx.adobe.com/lightroom-cc/web/edit-photos/apply-masks/create-mask-with-luminance-range.html\n\n### Source URLs\n- OpenAI image editing: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- Adobe Generative Fill: https://www.adobe.com/products/photoshop/generative-fill.html\n- CRMLS digitally altered image guidance: https://kb.crmls.org/knowledgebase/digitally-altered-image-guidance-faqs/\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":3,"pageNumber":4,"firstAction":"Choose the source exterior with the cleanest roofline and facade.","nextAction":"Open the next lesson when the deliverable is saved."},{"id":"image-qc-and-export","title":"Deliver a small AI property image set","mission":"Turn one property into a coherent, source-traceable image package with originals, approved edits, visualisations and a simple presentation artifact.","steps":["Select five to eight final assets: hero, living room, kitchen, bedroom, bathroom/exterior and one visualisation where useful.","Confirm every asset appears in the Property Truth Sheet.","Pair every edited image with its original source.","Put virtual staging and twilight concepts in a clearly separate section.","Add the exact disclosure label or original pairing required by the responsible platform/client policy.","Build a simple contact sheet or HTML gallery with filenames and room labels.","Add captions that describe only verified visible features.","Test the gallery on a phone-sized viewport and check image loading.","Export the delivery folder with the manifest, source links, prompts and approval note.","Ask a fresh reviewer to identify any image that could mislead a viewer, then revise before delivery.","[filename] — [room/view] — source: [filename] — change: [brief]","[filename] — [concept] — label: Virtually staged visualisation","approved images","original/source references","property truth sheet","asset manifest","prompts/edit notes","disclosure notes"],"prompt":"AI PROPERTY IMAGE SET\nProperty: [name]\nPurpose: [listing / presentation / campaign]\n\nDOCUMENTARY / EDITED IMAGES\n1. [filename] — [room/view] — source: [filename] — change: [brief]\n\nVISUALISATIONS\n1. [filename] — [concept] — label: Virtually staged visualisation\n\nFOR EACH ASSET\nVerified visible facts: [short list]\nChanges: [short list]\nSource: [filename]\nDisclosure/pairing: [text/status]\nApproval: [name/date]\n\nDELIVERY CONTENTS\n- approved images\n- original/source references\n- property truth sheet\n- asset manifest\n- prompts/edit notes\n- disclosure notes","deliverable":"`15_ai_property_image_set/` containing the approved image set, original pairings, truth sheet, prompt/edit notes, manifest and a simple gallery/contact sheet.","outcome":"A client-ready, small image package that is easy to review, publish or hand to a video editor without confusing a visualisation for current property media.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"prerequisites":["Lessons 1–14.","One approved property and approver.","A destination folder or shareable project page."],"failure_fixes":["**The set feels inconsistent:** return to Lesson 13 and match palette/exposure with non-generative edits.","**A viewer cannot tell what changed:** add a paired original, label or caption.","**Gallery is slow:** resize derivatives, preserve high-resolution masters separately and use modern web image formats when the destination supports them.","**Captions overclaim:** rewrite from the truth sheet only.","**No one approves it:** deliver as draft and name the missing approver; do not publish."],"checklist":["[ ] Five to eight useful assets are selected.","[ ] Every asset traces to a source.","[ ] Edited media and visualisations are separated.","[ ] Captions use verified facts only.","[ ] Disclosure treatment is visible.","[ ] Gallery/contact sheet works on a phone.","[ ] Approval is recorded."],"sources":"- **ChatGPT Images:** default generation/editing reference route. https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- **Lightroom on the web:** organise, compare versions, add metadata/captions and download/export images. https://helpx.adobe.com/lightroom-cc/web/review-and-download-photos/create-versions.html\n- **Photoshop/Adobe:** final retouching, labels and deterministic brand composition. https://www.adobe.com/products/photoshop/generative-fill.html\n- **Static gallery artifact:** local HTML or approved GitHub Pages/Netlify deployment; Google’s image guidance covers crawlable, performant image presentation. https://developers.google.com/search/docs/appearance/google-images\n- **Optional later spatial handoff:** Matterport for 3D property capture/intelligence and CubiCasa for floor plans; these are separate measured/spatial products, not substitutes for truthful image edits. https://matterport.com/features/property-intelligence and https://www.cubi.casa/floor-plans/\n\n### Source URLs\n- OpenAI ChatGPT Images: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- Lightroom versions/download: https://helpx.adobe.com/lightroom-cc/web/review-and-download-photos/create-versions.html\n- Google Images guidance: https://developers.google.com/search/docs/appearance/google-images\n- NAR Profile of Home Staging: https://www.nar.realtor/research-and-statistics/research-reports/profile-of-home-staging\n- NorthstarMLS AI image guidance: https://northstarmls.com/insights/guidelines-for-virtual-staging-and-ai-enhanced-listing-photos\n- YouTube synthetic-content disclosure guidance (for later video derivatives): https://support.google.com/youtube/answer/14328491?hl=en\n\n---\n\n# First-party route index used in this batch\n\n- OpenAI ChatGPT image generation and editing: https://help.openai.com/en/articles/8932459-dall-e-in-chatgpt\n- OpenAI image API guide: https://platform.openai.com/docs/guides/images\n- OpenAI content provenance: https://developers.openai.com/api/docs/guides/content-provenance\n- Adobe Photoshop Generative Fill: https://www.adobe.com/products/photoshop/generative-fill.html\n- Adobe Photoshop Perspective Warp: https://helpx.adobe.com/photoshop/using/perspective-warp.html\n- Adobe Lightroom luminance masks: https://helpx.adobe.com/lightroom-cc/web/edit-photos/apply-masks/create-mask-with-luminance-range.html\n- Adobe Lightroom remove objects: https://helpx.adobe.com/lightroom-cc/web/edit-photos/remove-objects/remove-objects.html\n- Runway image-to-video prompting: https://help.runwayml.com/hc/en-us/articles/48324313115155\n- Luma keyframes: https://lumalabs.ai/learning-hub/how-to-use-keyframes\n- Google Veo API: https://ai.google.dev/gemini-api/docs/veo\n- Google Veo first/last frames: https://cloud.google.com/vertex-ai/generative-ai/docs/video/generate-videos-from-first-and-last-frames\n- Topaz Photo Remove Object: https://docs.topazlabs.com/topaz-photo/enhancements/remove-object\n- Topaz Photo Adjust Lighting: https://docs.topazlabs.com/topaz-photo/enhancements/adjust-lighting\n- FFprobe: https://ffmpeg.org/ffprobe.html\n- MediaInfo: https://mediaarea.net/MediaInfo\n- Google image SEO/performance: https://developers.google.com/search/docs/appearance/google-images\n- NAR staging research: https://www.nar.realtor/research-and-statistics/research-reports/profile-of-home-staging\n- NorthstarMLS AI image guidance: https://northstarmls.com/insights/guidelines-for-virtual-staging-and-ai-enhanced-listing-photos\n- CRMLS digitally altered image guidance: https://kb.crmls.org/knowledgebase/digitally-altered-image-guidance-faqs/\n\n## Editorial boundary\n\nThe learner copy uses plain “review,” “source comparison,” “approval” and “change log” language. It does not expose internal review labels or internal research/QC terminology. Tool-specific capabilities are described only where a current first-party route was located; model quality, pricing, availability and local listing rules remain variable and require confirmation before publication.","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-room.jpg","02_NOTES/property-brief.md","03_WORKING/","04_EXPORTS/"],"rule":"Keep the original image untouched. Every edited, staged or generated result gets a new version name."},"categoryNumber":3,"pageNumber":5,"firstAction":"Select five to eight final assets: hero, living room, kitchen, bedroom, bathroom/exterior and one visualisation where useful.","nextAction":"Open the next lesson when the deliverable is saved."}]},{"id":"virtual-staging","title":"Virtual Staging","description":"Create believable design concepts from real rooms.","pages":[{"id":"empty-room-to-staged-room","title":"Empty Room to Staged Room","mission":"Turn one ordinary room photograph into a simple, truthful room brief. Learn to separate what is fixed from what can be changed.","steps":["Save the untouched photo as `01_original_room.jpg`.","Look at the photo without generating anything.","Write the room type, approximate camera position, and visible light direction.","List fixed elements: walls, ceiling, windows, doors, floor, radiators, sockets, built-ins, and major architectural lines.","List movable elements: loose furniture, lamps, artwork, rugs, plants, and clutter.","Mark anything uncertain with “unknown” instead of guessing.","Upload the photo to ChatGPT and ask it to identify visible geometry without proposing improvements.","Compare its description with your notes and correct any invented detail.","Copy the final facts into a reusable room brief."],"prompt":"You are helping me document a real property photograph.\nDescribe only what is visibly present in this image. Do not redesign it and do not infer hidden rooms or measurements.\nReturn these headings:\n- Room type (or “uncertain”)\n- Camera position and viewpoint\n- Fixed architecture\n- Windows and doors\n- Floor, wall, and ceiling finishes\n- Furniture and movable objects\n- Light direction and apparent time of day\n- Details that are unclear\nUse cautious language for anything you cannot verify.","deliverable":"`room-brief.md` plus the untouched source image.","outcome":"A one-page room brief that preserves the source photograph’s geometry and clearly labels uncertainty.","qc":["Compare the result against the source truth.","Open the result at full size and phone size.","Reject anything that changes important property information.","Record the version you approved before moving on."],"reference":{"label":"Synthetic demonstration pair · generated with local ChatGPT image capability","before":"assets/staging-before.png","after":"assets/staging-after.png","beforeCaption":"Before: the original empty room used as the source frame.","afterCaption":"After: furniture added while the room geometry and camera are preserved.","promptBefore":"Photorealistic real-estate interior source photograph for a virtual staging lesson. Empty contemporary apartment living room, straight-on eye-level camera, natural 24mm full-frame perspective, pale warm walls, light oak floor, one large window with daylight, white baseboards, a single ceiling light, clean empty room with believable corners and straight verticals. No furniture, no people, no text, no logos, no watermark. Natural exposure, neutral colour, realistic camera texture, not CGI, not an architectural render.","promptAfter":"Edit this exact source photograph for a virtual staging demonstration. Add only a restrained contemporary living-room furniture set that fits the existing room: a medium-sized neutral fabric sofa placed against the left wall, one low oak coffee table centered on a soft neutral rug, one small side table and a single floor lamp. Keep the exact camera position, lens perspective, room dimensions, walls, window, floor, ceiling light, baseboards, daylight direction and all architectural lines. Furniture must sit naturally on the floor with correct scale, contact shadows and perspective. Do not change the room, window view or lighting. No people, no text, no logos, no watermark. Photorealistic, restrained, not a luxury redesign, not CGI."},"prerequisites":["One permission-cleared room photo, preferably landscape and reasonably sharp.","A notes document.","ChatGPT with image upload enabled (or a paper alternative)."],"failure_fixes":["If ChatGPT invents a window or door, write “not visible in source” and remove the invention.","If the room type is ambiguous, keep two possibilities and do not force a label.","If perspective is confusing, note “camera viewpoint unclear” and use the photo itself as the authority."],"checklist":["[ ] Original file is preserved.","[ ] Fixed and movable elements are separate.","[ ] Unknowns are marked, not guessed.","[ ] Light direction is recorded.","[ ] The brief matches the photograph."],"sources":"[OpenAI Images in ChatGPT](https://help.openai.com/en/articles/11084440-images-in-chatgpt)\n\n---","project":{"name":"The Willow House practice project","description":"A fictional property used for practice. You will turn a small set of room images into a truthful visual package.","files":["01_SOURCE/original-
